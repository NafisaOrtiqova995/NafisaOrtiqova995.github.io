'Will' egadan oldin kelgan, to'g'ri shakli 'where they will put' bo'ladi.","D":"Bilvosita savolda so'z tartibi darak gapdagidek: 'whether the hall has been booked'."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The teacher asked us to ____ the main points of the article.","opts":["sum out","sum over","sum in","sum up"],"ans":"D","why":{"A":"'Sum out' ingliz tilida bunday ibora emas.","B":"'Sum over' ham mavjud ibora emas.","C":"'Sum in' birikmasi ingliz tilida ishlatilmaydi.","D":"'Sum up' asosiy fikrlarni qisqacha bayon qilish ma'nosini beradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["pull a conclusion","push a conclusion softly and wide","draw a conclusion","build a conclusion"],"ans":"C","why":{"A":"'Pull' bu ot bilan birikmaydi.","B":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","C":"Ingliz tilida xulosa chiqarish 'draw a conclusion' deyiladi.","D":"'Build' bino va inshootlar haqida aytiladi, xulosa haqida emas."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The first draft of the letter was unusually ~formal~.","opts":["polite","casual","detailed","typed"],"ans":"B","why":{"A":"'Polite' odoblilikni bildiradi, uslubni emas.","B":"'Formal' rasmiy degani, uning teskarisi 'casual' ya'ni erkin uslub.","C":"'Detailed' batafsillikni bildiradi va teskari ma'no bermaydi.","D":"'Typed' yozilish usulini bildiradi, uslubni emas."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a journey?","text":"","opts":["lengthy","uneventful","washable","scenic"],"ans":"C","why":{"A":"'Lengthy' uzoq davom etgan degani va safarni tasvirlaydi.","B":"'Uneventful' voqeasiz, tinch o'tgan degani, bu ham safarga tegishli.","C":"'Washable' yuvsa bo'ladigan degani bo'lib, faqat mato va buyum haqida ishlatiladi.","D":"'Scenic' chiroyli manzarali degani va yo'l haqida aytiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The new assistant proved remarkably ~diligent~ in her first month.","opts":["hard-working","cheerful","experienced","patient"],"ans":"A","why":{"A":"'Diligent' tirishqoq degani, 'hard-working' esa shu ma'noni beradi.","B":"'Cheerful' kayfiyatni tasvirlaydi, mehnatsevarlikni emas.","C":"'Experienced' tajribani bildiradi, harakatni emas.","D":"'Patient' sabrni bildiradi, mehnatsevarlikni emas."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The village is well known for the ____ of its people.","opts":["generous","generously","generosities","generosity"],"ans":"D","why":{"A":"'Generous' sifat bo'lib, 'the' dan keyin ot talab qilinadi.","B":"'Generously' ravish bo'lib, fe'lni izohlaydi.","C":"'Generosities' ko'plik shakli bo'lib, bu ma'noda ishlatilmaydi.","D":"'The' dan keyin ot kerak, 'generosity' esa sanalmaydigan ot shaklidir."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The result depends ____ the number of people who reply.","opts":["from","of","on","to"],"ans":"C","why":{"A":"'Depend' fe'li 'from' predlogi bilan ishlatilmaydi.","B":"'Of' bu fe'ldan keyin kelmaydi.","C":"'Depend on' barqaror birikma bo'lib, nimaga bog'liqligini ko'rsatadi.","D":"'To' yo'nalishni bildiradi va bu yerga mos emas."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The old recipe book was in a ~fragile~ condition when it arrived.","opts":["written in a foreign language","easily broken or damaged","missing several of its pages","kept in a locked cupboard"],"ans":"B","why":{"A":"Til haqidagi ta'rif bu so'zga aloqador emas.","B":"'Fragile' mo'rt, osongina sinadigan degani.","C":"Sahifalarning yo'qligi 'incomplete' so'ziga tegishli.","D":"Saqlash joyi bu so'zning ma'nosini bermaydi."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"An apprentice is:","opts":["a person learning a trade from a skilled worker","a person who inspects finished work","a person who sells tools to builders","a person who manages a small factory"],"ans":"A","why":{"A":"'Apprentice' shogird, ya'ni usta yonida hunar o'rganuvchi degani.","B":"Ishni tekshiruvchi 'inspector' deyiladi.","C":"Asbob sotuvchi 'supplier' deb ataladi.","D":"Zavodni boshqaruvchi 'manager' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["thrifty","careful","stingy","economical"],"ans":"C","why":{"A":"'Thrifty' tejamkor degani va ijobiy baho beradi.","B":"'Careful' ehtiyotkor degani, bu ham ijobiy so'z.","C":"'Stingy' ziqna degani bo'lib, salbiy ma'noga ega.","D":"'Economical' tejamli degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To say that the winter camp is full","To ask pupils to bring warm clothes to school","To thank the helpers from last year","To give the details of the winter camp"],"ans":"D","why":{"A":"Joylar tugagani haqida e'londa hech narsa aytilmagan.","B":"Maktabga kiyim olib kelish haqida gap yo'q.","C":"Minnatdorchilik haqida e'londa so'z yuritilmagan.","D":"E'londa sana, joy, narx, olib kelinadigan narsalar va muddat berilgan."},"block":["Read the text and answer questions 21-22.","WINTER CAMP: INFORMATION FOR PUPILS","The camp runs from 3 to 7 January at the mountain centre. The cost covers travel, meals and all equipment except boots. Bring a warm sleeping bag, a torch and gloves. Mobile phones may be used only in the evening. Places are limited to thirty, and the list closes on 15 December. Pupils who have not attended a camp before will be given priority."]},{"no":22,"pts":"2.6","head":"Who will be given priority for a place?","text":"","opts":["Pupils who sign up first","Pupils who have never been to a camp","Pupils who have their own boots","Pupils in the older classes"],"ans":"B","why":{"A":"Ro'yxatga birinchi yozilish ustunlik bermaydi, e'londa bunday shart yo'q.","B":"E'londa ilgari lagerda bo'lmagan o'quvchilarga ustunlik berilishi aytilgan.","C":"Etik haqida e'londa faqat o'zi olib kelishi kerakligi aytilgan.","D":"Sinf yoshi haqida e'londa hech narsa yozilmagan."}},{"no":23,"pts":"2.6","head":"You hear a teacher say: \"Someone needs to break the ice at the start.\" What does this mean?","text":"","opts":["Someone should make people feel at ease","Someone should arrive before the others","Someone should clear the path outside","Someone should explain the rules first"],"ans":"A","why":{"A":"'Break the ice' iborasi boshlang'ich noqulaylikni yo'qotib, odamlarni erkin his qildirishni bildiradi.","B":"Erta kelish haqida ibora hech narsa demaydi.","C":"Ibora muz yoki ob-havo bilan bog'liq emas, u ko'chma ma'noda ishlatiladi.","D":"Qoidalarni tushuntirish bu iboraning ma'nosi emas."}},{"no":24,"pts":"2.6","head":"You see this notice by a lift: \"Out of order. Please use the stairs at the end of the corridor.\" What is the main message?","text":"","opts":["The lift is being cleaned this morning","The lift may be used by staff only","The stairs are closed for repairs","The lift does not work, so take the stairs"],"ans":"D","why":{"A":"Tozalash haqida e'londa hech narsa yozilmagan.","B":"Xodimlar uchun ruxsat haqida e'londa gap yo'q.","C":"E'lon aksincha, zinapoyaga yo'naltirmoqda.","D":"E'londa lift ishlamayotgani va zinapoyadan foydalanish kerakligi aytilgan."}},{"no":25,"pts":"2.6","head":"What does the text say about the shade from street trees?","text":"","opts":["It is strongest in the early morning","It can lower the temperature of the pavement","It makes the street darker than is safe","It depends on the colour of the leaves"],"ans":"B","why":{"A":"Kunning vaqti haqida matnda hech narsa yozilmagan.","B":"Birinchi xatboshida daraxt soyasi yo'lka haroratini pasaytirishi aytilgan.","C":"Xavfsizlik haqida matnda gap yo'q.","D":"Barg rangi haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 25-27.","A street with trees is measurably cooler than one without. The shade can lower the temperature of the pavement by several degrees, and the leaves release water that cools the air around them. In a hot summer the difference can decide whether a street is usable at midday.","Planting is the easy part. A young tree in a city pavement has very little soil, and the roots quickly reach concrete on every side. Many of the trees planted in such places die within five years, and replacing them costs more than planting them did.","Cities that succeed have changed what happens under the ground. A trench of loose soil runs beneath the pavement and joins one tree to the next. The surface looks the same to a pedestrian, but the roots have somewhere to go."]},{"no":26,"pts":"2.6","head":"Why do many young street trees die?","text":"","opts":["They are planted in the wrong season","They are damaged by passing traffic","Their roots quickly reach concrete","They receive too much water in winter"],"ans":"C","why":{"A":"Ekish fasli haqida matnda hech narsa aytilmagan.","B":"Transport zarari haqida matnda gap yo'q.","C":"Ikkinchi xatboshida ildizlar tezda betonga tiralishi aytilgan.","D":"Suv ortiqchaligi haqida matnda ma'lumot berilmagan."}},{"no":27,"pts":"2.6","head":"What have the successful cities changed?","text":"","opts":["The kind of trees they plant","The width of their pavements","The time of year they plant","What happens under the pavement"],"ans":"D","why":{"A":"Daraxt turi haqida matnda hech narsa yozilmagan.","B":"Yo'lka kengligi haqida matnda gap yo'q.","C":"Ekish vaqti haqida matnda ma'lumot berilmagan.","D":"Uchinchi xatboshida yo'lka ostidagi tuproq yo'lagi haqida gapirilgan."}},{"no":28,"pts":"2.6","head":"What does the text say about listening to podcasts in a foreign language?","text":"","opts":["It replaces the need for a grammar course","It works best when the subject is already familiar","It is only useful for advanced learners","It should be done for at least an hour a day"],"ans":"B","why":{"A":"Grammatika kursini almashtirish haqida matnda gap yo'q.","B":"Birinchi xatboshida tanish mavzudagi suhbat eng foydali ekani aytilgan.","C":"Faqat yuqori daraja uchun ekani matnda aytilmagan.","D":"Kunlik davomiylik haqida matnda hech narsa yozilmagan."},"block":["Read the text and answer questions 28-30.","Podcasts have become a common way to practise listening. The most useful ones are about a subject the learner already knows well, because the familiar content fills the gaps that the language leaves. A cooking programme is easier than a news bulletin for exactly this reason.","Speed is the usual complaint. Many learners slow the recording down, and for a first listening that helps. Teachers warn, however, that a learner who always listens at reduced speed is not preparing for a real conversation, where nobody slows down.","The method that works is unglamorous. Listen once for the general meaning, once with the transcript, and once again without it. Few learners enjoy the third listening, but that is the one where the sounds and the written words finally join together."]},{"no":29,"pts":"2.6","head":"What do teachers warn about slowing the recording down?","text":"","opts":["It makes the words harder to hear clearly","It takes far more time than it is worth","It does not prepare the learner for real speech","It only works with news programmes"],"ans":"C","why":{"A":"Tovush sifati haqida matnda hech narsa yozilmagan.","B":"Vaqt sarfi haqida matnda gap yo'q.","C":"Ikkinchi xatboshida doim sekinlatib tinglash haqiqiy suhbatga tayyorlamasligi aytilgan.","D":"Dasturlar turi haqida bunday cheklov qo'yilmagan."}},{"no":30,"pts":"2.6","head":"Which listening does the text call the most valuable?","text":"","opts":["The third one, without the transcript","The first one, for general meaning","The second one, with the transcript","The one at reduced speed"],"ans":"A","why":{"A":"Uchinchi xatboshida aynan uchinchi tinglash tovush va yozuvni bog'laydigan bosqich ekani aytilgan.","B":"Birinchi tinglash umumiy ma'no uchun, lekin eng qimmatlisi deb atalmagan.","C":"Ikkinchi tinglash matn bilan, ammo hal qiluvchi bosqich sifatida ko'rsatilmagan.","D":"Sekinlatilgan tinglash faqat birinchi marta uchun foydali deb aytilgan."}}]},{"variant":4,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Only when the lights went out ____ the audience ____ how full the hall was.","opts":["did / noticed","did / notice","had / noticing","were / notice"],"ans":"B","why":{"A":"'Did' dan keyin o'tgan zamon shakli 'noticed' ishlatilmaydi.","B":"'Only when' bilan boshlangan gapdan keyin 'did' egadan oldinga chiqadi va fe'l birinchi shaklda qoladi.","C":"'Had' bilan 'noticing' ravishdoshi mos kelmaydi.","D":"'Were' bilan birinchi shakl birikmaydi va bu qurilishga to'g'ri kelmaydi."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The letters ____ in a drawer for decades before anyone ____ them.","opts":["had lain / read","lay / read","have lain / read","were lying / had read"],"ans":"A","why":{"A":"Avvalgi uzoq holat past perfect 'had lain', keyingi ish past simple 'read' bo'ladi.","B":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.","C":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","D":"Bu yerda zamonlar teskari qo'yilgan va voqealar tartibi buziladi."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ several warnings, the driver continued to park on the pavement.","opts":["Despite","Although","Because of","Therefore"],"ans":"A","why":{"A":"'Despite' dan keyin ot birikmasi keladi va qarama-qarshilikni bildiradi.","B":"'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.","C":"'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.","D":"'Therefore' natijani bildiruvchi kirish so'z bo'lib, gapni bunday bog'lamaydi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was her patience ____ impressed the interviewers most of all.","opts":["that","what","who","when"],"ans":"A","why":{"A":"Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi.","B":"'What' ta'kidlovchi gapni boshlay olmaydi.","C":"'Who' odamga ishora qiladi, bu yerda esa sifat ta'kidlanmoqda.","D":"'When' vaqtga ishora qiladi, sababga emas."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the application ____ on time, she ____ a place on the course now.","opts":["was sent / would have","had been sent / would have","had been sent / would have had","is sent / will have"],"ans":"B","why":{"A":"'Was sent' bilan 'would have' o'tmishdagi amalga oshmagan ishni ko'rsatmaydi.","B":"O'tmishdagi ish va hozirgi natija aralash shart gap 'had been sent / would have' bilan beriladi.","C":"'Would have had' natijani o'tmishga olib ketadi, gapda esa 'now' aytilgan.","D":"Bu birinchi shart gap bo'lib, amalga oshmagan vaziyatni bildirmaydi."}},{"no":6,"pts":"0.9","head":"Which option means that something was possible but did not happen?","text":"","opts":["She could have taken the earlier train.","She had to take the earlier train.","She must have taken the earlier train.","She needn't have taken the earlier train."],"ans":"A","why":{"A":"'Could have taken' amalga oshmagan imkoniyatni bildiradi.","B":"'Had to' bajarilgan majburiyatni bildiradi.","C":"'Must have taken' ishonchli xulosani bildiradi, ya'ni ish bajarilgan.","D":"'Needn't have taken' ish bajarilgan, lekin kerak emas edi degani."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is essential that the samples ____ in a cool place until Monday.","opts":["are stored","were stored","be stored","storing"],"ans":"C","why":{"A":"'Are stored' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi.","B":"'Were stored' oddiy o'tgan zamon bo'lib, hozirgi talabga mos emas.","C":"'It is essential that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be stored' bo'ladi.","D":"'Storing' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The upper path is ____ steeper than the one along the river.","opts":["very","considerably","so","too"],"ans":"B","why":{"A":"'Very' qiyosiy daraja oldidan kelmaydi.","B":"Qiyosiy daraja 'considerably', 'much' yoki 'far' bilan kuchaytiriladi.","C":"'So' ham qiyosiy darajani kuchaytira olmaydi.","D":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The member's suggestions was collected in a single file.","The members suggestions' were collected in a single file.","The members's suggestions were collected in a single file.","The members' suggestions were collected in a single file."],"ans":"D","why":{"A":"Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak.","B":"Apostrof noto'g'ri so'zga qo'yilgan.","C":"Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q.","D":"Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: members'."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["I wonder whether the library opens on Sundays.","I wonder does the library open on Sundays?","Could you tell me what time does the gate close?","Do you know why has the route been changed?"],"ans":"A","why":{"A":"Bilvosita savolda so'z tartibi darak gapdagidek va gap nuqta bilan tugaydi.","B":"'Does' yordamchi fe'li bilan savol tartibi saqlangan, bu esa bilvosita savolga mos emas.","C":"'Does' bilvosita savolda tushib qolishi kerak.","D":"'Has' egadan oldin turibdi, to'g'ri shakli 'why the route has been changed' bo'ladi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The factory had to ____ production when the orders stopped coming.","opts":["cut back","cut off","cut in","cut across"],"ans":"A","why":{"A":"'Cut back' ishlab chiqarishni qisqartirish ma'nosini beradi.","B":"'Cut off' aloqani yoki ta'minotni uzishni bildiradi.","C":"'Cut in' suhbatga aralashishni bildiradi.","D":"'Cut across' qisqa yo'ldan kesib o'tishni bildiradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["catch a deadline","reach a deadline sharply and green","meet a deadline","hit a deadline hard"],"ans":"C","why":{"A":"'Catch' bu ot bilan birikmaydi.","B":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","C":"Ingliz tilida muddatga ulgurish 'meet a deadline' deyiladi.","D":"Bu variantga ham ortiqcha so'z qo'shilib, ibora buzilgan."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The second speaker gave a notably ~concise~ summary of the project.","opts":["clear","formal","written","lengthy"],"ans":"D","why":{"A":"'Clear' tushunarlilikni bildiradi, uzunlikni emas.","B":"'Formal' uslubni bildiradi va teskari ma'no bermaydi.","C":"'Written' shaklni bildiradi, uzunlikni emas.","D":"'Concise' qisqa va lo'nda degani, uning teskarisi 'lengthy' ya'ni cho'zilgan."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a crowd?","text":"","opts":["restless","portable","sizeable","good-natured"],"ans":"B","why":{"A":"'Restless' notinch degani va olomonni tasvirlaydi.","B":"'Portable' ko'tarib yursa bo'ladigan degani bo'lib, faqat buyum haqida ishlatiladi.","C":"'Sizeable' ancha katta degani, bu ham olomonga tegishli.","D":"'Good-natured' xushmuomala degani va olomon haqida aytiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The new rule turned out to be ~beneficial~ for the smaller teams.","opts":["helpful","confusing","temporary","expensive"],"ans":"A","why":{"A":"'Beneficial' foydali degani, 'helpful' esa shu ma'noni beradi.","B":"'Confusing' chalkash degani va teskari taassurot beradi.","C":"'Temporary' vaqtinchalikni bildiradi, foydani emas.","D":"'Expensive' qimmatlikni bildiradi va bu yerga mos kelmaydi."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The committee was criticised for the ____ of its final report.","opts":["weakness","weak","weakly","weaken"],"ans":"A","why":{"A":"'The' dan keyin ot kerak, 'weakness' esa ot shaklidir.","B":"'Weak' sifat bo'lib, 'the' dan keyin ot talab qilinadi.","C":"'Weakly' ravish bo'lib, fe'lni izohlaydi.","D":"'Weaken' fe'l bo'lib, bu o'rinda kelmaydi."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The results of the survey differ ____ those published last year.","opts":["of","with","from","for"],"ans":"C","why":{"A":"'Differ' fe'li 'of' predlogi bilan ishlatilmaydi.","B":"'With' 'agree with' kabi birikmalarda uchraydi, bu yerda emas.","C":"'Differ from' barqaror birikma bo'lib, taqqoslanayotgan narsani ko'rsatadi.","D":"'For' maqsad yoki sababni bildiradi va bu fe'lga mos emas."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The witness gave an account that the court found ~credible~.","opts":["given in very great detail","repeated word for word","written down beforehand","possible to believe"],"ans":"D","why":{"A":"Batafsillik 'detailed' so'zining ma'nosi.","B":"So'zma-so'z takrorlash bu so'zning ma'nosi emas.","C":"Oldindan yozilgani haqidagi ta'rif mos kelmaydi.","D":"'Credible' ishonsa bo'ladigan degani."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A curator is:","opts":["a person who restores damaged paintings","a person who looks after a museum collection","a person who sells works of art","a person who guides visitors round a city"],"ans":"B","why":{"A":"Rasm tiklovchi 'restorer' deyiladi.","B":"'Curator' muzey to'plamiga mas'ul xodim degani.","C":"San'at asari sotuvchi 'art dealer' deb ataladi.","D":"Shahar bo'ylab kuzatuvchi 'tour guide' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["persistent","determined","patient","obstinate"],"ans":"D","why":{"A":"'Persistent' qat'iyatli degani va ijobiy baho beradi.","B":"'Determined' maqsadga intiluvchan degani, bu ham ijobiy so'z.","C":"'Patient' sabrli degani va maqtov ma'nosini beradi.","D":"'Obstinate' o'jar degani bo'lib, salbiy ma'noga ega."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To announce which pupils have been chosen","To ask host families to register","To explain how to apply for the exchange programme","To describe last year's exchange visit"],"ans":"C","why":{"A":"Tanlangan o'quvchilar ro'yxati haqida e'londa hech narsa aytilmagan.","B":"Mezbon oilalar haqida e'londa gap yo'q.","C":"E'londa shartlar, hujjat, muddat va suhbat tartibi tushuntirilgan.","D":"O'tgan yilgi safar haqida e'londa so'z yuritilmagan."},"block":["Read the text and answer questions 21-22.","EXCHANGE PROGRAMME: HOW TO APPLY","The programme is open to pupils in the ninth and tenth classes. Applicants write a short letter in English explaining why they wish to take part and what they can show a visitor about their own town. The letter must reach the office by 1 February. Everyone who applies will be invited to a short interview, and the interview is held in English. Families must be willing to host a visitor for two weeks in return."]},{"no":22,"pts":"2.6","head":"What must every applicant do after sending the letter?","text":"","opts":["Pay a registration fee","Find a host family themselves","Take a written grammar test","Attend an interview held in English"],"ans":"D","why":{"A":"To'lov haqida e'londa hech narsa yozilmagan.","B":"Mezbon oilani o'zi topish talab qilinmagan, oila mehmon qabul qilishi aytilgan.","C":"Yozma test haqida e'londa gap yo'q.","D":"E'londa har bir ariza beruvchi ingliz tilidagi suhbatga taklif qilinishi aytilgan."}},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"He is still sitting on the fence about the offer.\" What does this mean?","text":"","opts":["He has refused the offer politely","He has not decided yet","He is waiting outside the building","He has accepted but regrets it"],"ans":"B","why":{"A":"Rad etish bu iboraning ma'nosi emas.","B":"'Sit on the fence' iborasi hali qaror qabul qilmaganni bildiradi.","C":"Ibora joy haqida emas, u ko'chma ma'noda ishlatiladi.","D":"Ibora rozilik berilganini bildirmaydi."}},{"no":24,"pts":"2.6","head":"You see this notice at a market stall: \"Cash only. The nearest machine is by the car park.\" What is the main message?","text":"","opts":["Cards are accepted at the car park stall","The stall is closed until the machine is repaired","You cannot pay by card here, but there is a machine nearby","Only large notes can be accepted here"],"ans":"C","why":{"A":"Boshqa rastada karta qabul qilinishi haqida e'londa hech narsa yozilmagan.","B":"Rastaning yopilishi haqida gap yo'q.","C":"E'londa faqat naqd pul qabul qilinishi va yaqin atrofda bankomat borligi aytilgan.","D":"Pul birligi haqida e'londa shart qo'yilmagan."}},{"no":25,"pts":"2.6","head":"What does the text say about the first repair cafes?","text":"","opts":["They were opened by electrical shops","They were started by volunteers in borrowed rooms","They charged a small fee for every repair","They were supported by the government"],"ans":"B","why":{"A":"Do'konlar haqida matnda hech narsa yozilmagan.","B":"Birinchi xatboshida ularni ko'ngillilar vaqtincha olingan xonalarda boshlagani aytilgan.","C":"Aksincha, ta'mir bepul ekani aytilgan.","D":"Davlat yordami haqida matnda gap yo'q."},"block":["Read the text and answer questions 25-27.","The first repair cafes were started by volunteers in borrowed rooms. Anyone could bring a broken lamp, a kettle or a coat and sit with somebody who knew how to mend it. Nothing was charged, and the visitor was expected to hold the screwdriver.","Roughly two thirds of the items brought in are repaired on the day. The rest usually need a part that is no longer made, and that is the point the organisers want people to notice. A product designed to be opened can be saved, and a sealed one cannot.","The movement has grown without becoming an industry. Most cafes still meet once a month in a hall or a library. Manufacturers were uneasy at first, but several now publish repair guides, having worked out that a customer who mends a kettle buys the next one from the same company."]},{"no":26,"pts":"2.6","head":"Why can some items not be repaired on the day?","text":"","opts":["The volunteers lack the right tools","The owners cannot wait long enough","They need a part that is no longer made","They are too heavy to bring to the hall"],"ans":"C","why":{"A":"Asbob yetishmasligi haqida matnda hech narsa aytilmagan.","B":"Egalarining vaqti haqida matnda gap yo'q.","C":"Ikkinchi xatboshida endi ishlab chiqarilmaydigan ehtiyot qism kerakligi aytilgan.","D":"Og'irlik haqida matnda ma'lumot berilmagan."}},{"no":27,"pts":"2.6","head":"Why do some manufacturers now publish repair guides?","text":"","opts":["The law obliges them to do so","It is cheaper than running a service centre","The cafes asked them to do it","A customer who mends one buys the next from them"],"ans":"D","why":{"A":"Qonun haqida matnda hech narsa yozilmagan.","B":"Xizmat markazi xarajati haqida matnda gap yo'q.","C":"Kafelarning iltimosi haqida matnda ma'lumot berilmagan.","D":"Uchinchi xatboshida ta'mirlagan xaridor keyingi mahsulotni ham o'sha firmadan olishi aytilgan."}},{"no":28,"pts":"2.6","head":"What does the text say about the light from a screen in the evening?","text":"","opts":["It damages the eyes of younger readers","It has no measurable effect on most people","It is brighter than ordinary room lighting","It delays the signal that the body uses to fall asleep"],"ans":"D","why":{"A":"Ko'z zarari haqida matnda hech narsa yozilmagan.","B":"Aksincha, ta'siri borligi tasvirlangan.","C":"Xona yorug'ligi bilan taqqoslash matnda berilmagan.","D":"Birinchi xatboshida ekran yorug'ligi uyquga tayyorlanish signalini kechiktirishi aytilgan."},"block":["Read the text and answer questions 28-30.","Light from a screen in the late evening delays the signal that the body uses to prepare for sleep. The effect is real but modest, and it is smaller than most newspaper headlines suggest.","What a person does with the screen matters more than the screen itself. A quiet programme watched to the end leaves the viewer ready for bed. A message that invites a reply, or a game designed never to finish, keeps the mind working long after the device is put down.","Advice that simply says no screens after eight tends to fail. The schools that have had some success ask pupils to charge the phone outside the bedroom instead. The rule is easier to keep, and it removes the thing that wakes a sleeper at two in the morning."]},{"no":29,"pts":"2.6","head":"What matters more than the screen itself?","text":"","opts":["How far away the screen is held","How long the device has been owned","What the person is doing on it","The size of the screen"],"ans":"C","why":{"A":"Masofa haqida matnda hech narsa yozilmagan.","B":"Qurilmaning eskiligi haqida matnda gap yo'q.","C":"Ikkinchi xatboshida ekranning o'zidan ko'ra undagi mashg'ulot muhimroq ekani aytilgan.","D":"Ekran o'lchami haqida matnda ma'lumot berilmagan."}},{"no":30,"pts":"2.6","head":"What rule has worked better in some schools?","text":"","opts":["Banning all screens after eight o'clock","Charging the phone outside the bedroom","Collecting the phones at the school gate","Allowing phones only at the weekend"],"ans":"B","why":{"A":"Matnda aynan shu taqiq samarasiz ekani aytilgan.","B":"Uchinchi xatboshida telefonni yotoqxonadan tashqarida quvvatlash qoidasi muvaffaqiyatli bo'lgani aytilgan.","C":"Maktab darvozasi haqida matnda gap yo'q.","D":"Dam olish kunlari haqida matnda ma'lumot berilmagan."}}]},{"variant":5,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Never before ____ the club ____ so many applications in a single week.","opts":["has / receiving","did / received","had / received","had / receive"],"ans":"C","why":{"A":"'Has' dan keyin uchinchi shakl kerak, '-ing' shakli emas.","B":"'Did' dan keyin fe'lning birinchi shakli keladi, 'received' emas.","C":"'Never before' gap boshida kelsa yordamchi fe'l egadan oldinga chiqadi va past perfect 'had received' bo'ladi.","D":"'Had' dan keyin uchinchi shakl kerak, 'receive' esa birinchi shakl."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The orchestra ____ the piece many times before the composer ____ it.","opts":["had performed / heard","performed / heard","has performed / heard","was performing / had heard"],"ans":"A","why":{"A":"Avvalgi takroriy ish past perfect 'had performed', keyingisi past simple 'heard' bo'ladi.","B":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, qaysi ish avval bo'lgani ko'rinmaydi.","C":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","D":"Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the long queue outside, the shop served everybody before closing.","opts":["Although","Because of","Nevertheless","In spite of"],"ans":"D","why":{"A":"'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.","B":"'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.","C":"'Nevertheless' kirish so'z bo'lib, gapni bunday bog'lay olmaydi.","D":"'In spite of' dan keyin ot birikmasi keladi va qarama-qarshilikni bildiradi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the lack of parking ____ persuaded the owners to move the shop.","opts":["what","that","which it","where"],"ans":"B","why":{"A":"'What' ta'kidlovchi gapni boshlay olmaydi.","B":"Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi.","C":"'Which it' ortiqcha olmosh qo'shadi va gapni buzadi.","D":"'Where' joyga ishora qiladi, sababga emas."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the recording ____ clearer, we ____ able to use it in the broadcast.","opts":["was / will be","is / would be","had been / will be","were / would be"],"ans":"D","why":{"A":"'Was' bilan 'will be' real shartni bildiradi, hozirgi noreal vaziyatni emas.","B":"'Is' bilan 'would be' zamonlar jihatidan mos kelmaydi.","C":"'Had been' bilan 'will be' bir shart gapda ishlatilmaydi.","D":"Hozirgi noreal vaziyat ikkinchi shart gap 'were / would be' bilan beriladi."}},{"no":6,"pts":"0.9","head":"Which option means that something was not necessary and was not done?","text":"","opts":["They didn't need to book the hall.","They needn't have booked the hall.","They mustn't book the hall.","They shouldn't have booked the hall."],"ans":"A","why":{"A":"'Didn't need to book' zarurat bo'lmagani va odatda ish ham bajarilmaganini bildiradi.","B":"'Needn't have booked' ish bajarilgan, lekin kerak emas edi degani.","C":"'Mustn't' taqiqni bildiradi.","D":"'Shouldn't have booked' bajarilgan ish uchun tanbeh bildiradi."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The regulations require that each entry ____ by two members of staff.","opts":["is signed","be signed","was signed","signing"],"ans":"B","why":{"A":"'Is signed' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi.","B":"'Require that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be signed' bo'ladi.","C":"'Was signed' oddiy o'tgan zamon bo'lib, talab ma'nosini bermaydi.","D":"'Signing' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The southern route is ____ quicker than the one through the hills.","opts":["a great deal","very","too","so"],"ans":"A","why":{"A":"Qiyosiy daraja 'a great deal', 'much' yoki 'far' bilan kuchaytiriladi.","B":"'Very' qiyosiy daraja oldidan kelmaydi.","C":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.","D":"'So' ham qiyosiy darajani kuchaytira olmaydi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The neighbours' complaints were discussed at the meeting.","The neighbour's complaints was discussed at the meeting.","The neighbours complaints' were discussed at the meeting.","The neighbours's complaints were discussed at the meeting."],"ans":"A","why":{"A":"Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: neighbours'.","B":"Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak.","C":"Apostrof noto'g'ri so'zga qo'yilgan.","D":"Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know how does the new system work?","Do you know how the new system works?","Can you tell me where is the meeting held?","I wonder when will the results be ready?"],"ans":"B","why":{"A":"'Does' yordamchi fe'li bilvosita savolda tushib qolishi kerak.","B":"Bilvosita savolda so'z tartibi darak gapdagidek: 'how the new system works'.","C":"'Is' egadan oldin turibdi, bu to'g'ridan-to'g'ri savol tartibi.","D":"'Will' egadan oldin kelgan, to'g'ri shakli 'when the results will be ready' bo'ladi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two companies decided to ____ their research departments.","opts":["mergeenter","merge away","merge out","merge"],"ans":"D","why":{"A":"Bunday so'z ingliz tilida mavjud emas.","B":"'Merge away' birikmasi ingliz tilida ishlatilmaydi.","C":"'Merge out' ham mavjud ibora emas.","D":"'Merge' birlashtirish ma'nosini beradi va qo'shimcha so'zsiz ishlatiladi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["lift an objection","raise an objection","grow an objection firmly and blue","climb an objection"],"ans":"B","why":{"A":"'Lift' bu ot bilan birikmaydi.","B":"Ingliz tilida e'tiroz bildirish 'raise an objection' deyiladi.","C":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","D":"'Climb' bu ot bilan umuman ishlatilmaydi."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The chairman's opening remarks were surprisingly ~brief~.","opts":["polite","unclear","formal","lengthy"],"ans":"D","why":{"A":"'Polite' odoblilikni bildiradi, uzunlikni emas.","B":"'Unclear' tushunarsizlikni bildiradi va teskari ma'no bermaydi.","C":"'Formal' uslubni bildiradi, uzunlikni emas.","D":"'Brief' qisqa degani, uning teskarisi 'lengthy' ya'ni cho'zilgan."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a building?","text":"","opts":["derelict","imposing","fluent","draughty"],"ans":"C","why":{"A":"'Derelict' tashlandiq degani va binoni tasvirlaydi.","B":"'Imposing' salobatli degani, bu ham binoga tegishli.","C":"'Fluent' ravon nutq haqida ishlatiladi, bino haqida emas.","D":"'Draughty' shamol kiradigan degani va bino haqida aytiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The manager was ~reluctant~ to change the arrangements at such short notice.","opts":["unable","afraid","unwilling","slow"],"ans":"C","why":{"A":"'Unable' imkoniyat yo'qligini bildiradi, xohishni emas.","B":"'Afraid' qo'rquvni bildiradi, bu esa boshqa tuyg'u.","C":"'Reluctant' istamaydigan degani, 'unwilling' esa shu ma'noni beradi.","D":"'Slow' sekinlikni bildiradi va bu yerga mos kelmaydi."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme was abandoned because of its ____ to local businesses.","opts":["unfair","unfairly","unfairness","unfairest"],"ans":"C","why":{"A":"'Unfair' sifat bo'lib, 'its' dan keyin ot talab qilinadi.","B":"'Unfairly' ravish bo'lib, fe'lni izohlaydi.","C":"'Its' dan keyin ot kerak, 'unfairness' esa ot shaklidir.","D":"'Unfairest' orttirma daraja bo'lib, bu gapda o'rinsiz."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The museum is responsible ____ the care of several private collections.","opts":["of","for","to","with"],"ans":"B","why":{"A":"'Responsible' sifati 'of' predlogi bilan ishlatilmaydi.","B":"'Responsible for' barqaror birikma bo'lib, mas'uliyat sohasini ko'rsatadi.","C":"'Responsible to' kimga hisobot berishini bildiradi, nimaga mas'ulligini emas.","D":"'With' bu sifat bilan birikmaydi."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The instructions warned that the surface was ~slippery~ when wet.","opts":["unusually cold to the touch","likely to make somebody slide and fall","easily marked by dirty shoes","covered with a thin layer of paint"],"ans":"B","why":{"A":"Harorat haqidagi ta'rif bu so'zga aloqador emas.","B":"'Slippery' sirpanchiq degani, ya'ni odam toyib ketishi mumkin.","C":"Iz qolishi 'easily marked' so'ziga tegishli.","D":"Bo'yoq haqidagi ta'rif mos kelmaydi."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A tutor is:","opts":["a person who writes school textbooks","a person who teaches one student or a small group","a person who inspects schools for the state","a person who looks after a school building"],"ans":"B","why":{"A":"Darslik yozuvchi 'author' deyiladi.","B":"'Tutor' bir o'quvchi yoki kichik guruh bilan shug'ullanuvchi o'qituvchi degani.","C":"Maktablarni tekshiruvchi 'inspector' deb ataladi.","D":"Bino qarovchisi 'caretaker' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["blunt","frank","sincere","open"],"ans":"A","why":{"A":"'Blunt' shunchalik ochiq gapiradiki, odamning ko'ngliga tegadi degani, salbiy ma'noga ega.","B":"'Frank' ochiq gapiradigan degani va ijobiy baho beradi.","C":"'Sincere' samimiy degani, bu ham ijobiy so'z.","D":"'Open' ochiq degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To display the winning photographs","To ask pupils to lend their cameras","To explain the rules of the photo competition","To announce that the competition is cancelled"],"ans":"C","why":{"A":"G'olib suratlar haqida e'londa hech narsa aytilmagan.","B":"Fotoapparat so'rash haqida gap yo'q.","C":"E'londa mavzu, sanalar, topshirish tartibi va shartlar berilgan.","D":"E'lon aksincha, tanlov o'tkazilishini bildiradi."},"block":["Read the text and answer questions 21-22.","PHOTO COMPETITION: RULES","This year's subject is 'My street in one picture'. Each pupil may send two photographs, and they must have been taken within the last six months. Send the files to the art room computer, not by message. Photographs that have been edited beyond simple cropping will not be accepted. The closing date is 20 April, and the winning pictures will be printed for the corridor display."]},{"no":22,"pts":"2.6","head":"Which photographs will not be accepted?","text":"","opts":["Those taken outside the school","Those sent by more than one pupil","Those printed rather than sent as files","Those that have been heavily edited"],"ans":"D","why":{"A":"Suratning qayerda olingani haqida e'londa cheklov yo'q, aksincha ko'cha mavzu qilib belgilangan.","B":"Bir nechta o'quvchi haqida e'londa shart qo'yilmagan.","C":"Chop etilgan surat haqida e'londa gap yo'q, faqat fayl yuborish usuli ko'rsatilgan.","D":"E'londa oddiy qirqishdan tashqari tahrir qilingan suratlar qabul qilinmasligi aytilgan."}},{"no":23,"pts":"2.6","head":"You hear a friend say: \"Losing that job was a blessing in disguise.\" What does this mean?","text":"","opts":["Something that seemed bad turned out well","He was glad to leave the job at once","He has not told his family about it","He expects to get the job back soon"],"ans":"A","why":{"A":"'A blessing in disguise' iborasi dastlab yomon tuyulgan narsa keyinchalik foydali chiqqanini bildiradi.","B":"Ibora darhol xursand bo'lganini bildirmaydi.","C":"Sir saqlash haqida ibora hech narsa demaydi.","D":"Ishga qaytish haqida ibora gapirmaydi."}},{"no":24,"pts":"2.6","head":"You see this notice on a train: \"Quiet carriage. Please take phone calls in the corridor.\" What is the main message?","text":"","opts":["Phones must be switched off in this carriage","Speak on the phone outside this carriage, not in it","This carriage is reserved for staff","Phone calls are not allowed anywhere on the train"],"ans":"B","why":{"A":"E'lon telefonni butunlay o'chirishni talab qilmaydi.","B":"E'londa qo'ng'iroqlarni yo'lak qismida qabul qilish so'ralmoqda.","C":"Xodimlar uchun ajratilgani haqida e'londa gap yo'q.","D":"E'lon butun poyezdga emas, faqat shu vagonga tegishli."}},{"no":25,"pts":"2.6","head":"What does the text say about the first solar panels on school roofs?","text":"","opts":["They were paid for by the schools themselves","They were larger than the ones used now","They produced more power than expected","They were installed as a teaching project"],"ans":"D","why":{"A":"Maktablarning o'z mablag'i haqida matnda hech narsa yozilmagan.","B":"O'lcham haqida matnda gap yo'q.","C":"Quvvat kutilganidan ko'p bo'lgani haqida matnda ma'lumot berilmagan.","D":"Birinchi xatboshida dastlabki panellar o'quv loyihasi sifatida o'rnatilgani aytilgan."},"block":["Read the text and answer questions 25-27.","The first solar panels on school roofs were installed as teaching projects. They were small, and the electricity they produced mattered less than the lesson. Pupils watched a meter and learned where the power in a building comes from.","The arithmetic has changed since then. Panels cost a fraction of what they did, and a school uses most of its electricity in the middle of the day, which is exactly when the roof produces most. Many schools now cover a large part of their own daytime demand.","The holidays remain the awkward part. A school is empty in July, when the sun is strongest, and the power it generates then is worth far less when sold back to the grid. Some schools have solved this by sharing the building with summer courses and clubs."]},{"no":26,"pts":"2.6","head":"Why does a school roof suit solar panels well?","text":"","opts":["School roofs are flatter than most roofs","Schools can store the electricity they make","Schools use most power when the sun is strongest","School buildings are taller than houses"],"ans":"C","why":{"A":"Tomning shakli haqida matnda hech narsa yozilmagan.","B":"Quvvat saqlash haqida matnda gap yo'q.","C":"Ikkinchi xatboshida maktab elektr quvvatini aynan kunning o'rtasida ko'p ishlatishi aytilgan.","D":"Bino balandligi haqida matnda ma'lumot berilmagan."}},{"no":27,"pts":"2.6","head":"Why are the holidays described as awkward?","text":"","opts":["The panels need cleaning during the summer","There is nobody to read the meter","The building is empty when the sun is strongest","The grid does not accept power in July"],"ans":"C","why":{"A":"Tozalash haqida matnda hech narsa yozilmagan.","B":"Hisoblagich haqida matnda gap yo'q.","C":"Uchinchi xatboshida iyul oyida bino bo'sh qolishi va quyosh eng kuchli bo'lishi aytilgan.","D":"Tarmoq quvvatni qabul qiladi, lekin arzonroq to'laydi."}},{"no":28,"pts":"2.6","head":"What does the text say about the people buying board games now?","text":"","opts":["Most of them are adults","Most of them are young children","Most of them buy online only","Most of them are new to the hobby"],"ans":"A","why":{"A":"Birinchi xatboshida xaridorlarning ko'pchiligi kattalar ekani aytilgan.","B":"Bolalar haqida matnda bunday ma'lumot berilmagan.","C":"Onlayn xarid haqida matnda gap yo'q.","D":"Yangi havaskorlar haqida matnda hech narsa yozilmagan."},"block":["Read the text and answer questions 28-30.","Board games are selling better than at any time in the last fifty years, and most of the buyers are adults. The games themselves have changed. The modern ones rarely eliminate a player early, so nobody spends an hour watching the others finish.","Cafes built around the hobby have appeared in many cities. A visitor pays for the table rather than the game and can try something from a shelf of several hundred boxes. Staff explain the rules, which removes the main obstacle for a newcomer.","Designers say the appeal is the shape of the evening rather than the game. Four people sit facing each other for two hours with nothing else demanding their attention. That is rarer than it was, and it is the part that no screen has managed to copy."]},{"no":29,"pts":"2.6","head":"What makes modern board games different?","text":"","opts":["A player is rarely knocked out early","They take much less time to play","They need fewer players than before","They are printed on better materials"],"ans":"A","why":{"A":"Birinchi xatboshida zamonaviy o'yinlarda o'yinchi erta chetlatilmasligi aytilgan.","B":"O'yin davomiyligi qisqargani haqida matnda gap yo'q.","C":"O'yinchilar soni haqida matnda ma'lumot berilmagan.","D":"Material sifati haqida matnda hech narsa yozilmagan."}},{"no":30,"pts":"2.6","head":"What do the designers say the real appeal is?","text":"","opts":["The difficulty of the newest games","The low price compared with other hobbies","The chance to play against strangers","The shape of the evening spent together"],"ans":"D","why":{"A":"O'yin murakkabligi haqida matnda gap yo'q.","B":"Narx haqida matnda hech narsa yozilmagan.","C":"Notanish odamlar bilan o'ynash haqida matnda ma'lumot berilmagan.","D":"Uchinchi xatboshida jozibasi o'yin emas, birga o'tkazilgan kechaning shakli ekani aytilgan."}}]}];

const mark = s => esc(s).replace(/~([^~]+)~/g, '<u>$1</u>');
const fmt = ms => { const t=Math.max(0,Math.round(ms/1000));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const ball = p => p.replace('.', ',') + ' ball';

function passages(items){
  const map = {};
  for (const q of items){
    if (!q.block) continue;
    const m = /questions (\d+)-(\d+)/.exec(q.block[0]);
    if (!m) continue;
    for (let n=+m[1]; n<=+m[2]; n++) map[n] = q.block;
  }
  return map;
}

for (const d of DATA) VAR[d.variant] = {items:d.items, pass:passages(d.items)};

function load(v,m){ try{ const r=localStorage.getItem(KEY(v,m)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clear(v,m){ try{ localStorage.removeItem(KEY(v,m)); }catch(e){} }

  <div class="block"><div class="panel">
      <p><b>${resumeFor.v}-variant</b> yarim yo&lsquo;lda qolgan &mdash;
         ${Object.keys(resumeFor.saved.a||{}).length} ta savolga javob berilgan.</p>
      <button class="btn btn-primary" id="doResume">Davom ettirish</button>
      <button class="btn" id="doRestart">Boshidan boshlash</button>
      <button class="btn" id="doCancel">Bekor qilish</button>
  </div></div>` : ''}

  <div class="block">
    <div class="eyebrow">Variantni tanlang</div>
    <div class="vgrid">
      ${vs.map(v=>{ const sv = load(v, MODE);
        return `<button class="vcard" data-v="${v}">
          ${sv?'<span class="resume"></span>':''}
          <b class="tnum">${v}</b><span>variant</span></button>`; }).join('')}
    </div>
    <p class="note">Har bir savolda to&lsquo;rt javobning ham izohi beriladi: to&lsquo;g&lsquo;risi nega
       to&lsquo;g&lsquo;ri, qolganlari nega noto&lsquo;g&lsquo;ri. Javoblar shu brauzerda saqlanadi, sahifa
       yopilsa ham o&lsquo;sha joydan davom ettirish mumkin.</p>
    <div><button class="btn" id="rnd">Tasodifiy variant</button></div>
  </div>

  <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  startEl.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; renderStart(null); });
  startEl.querySelectorAll('.vcard').forEach(b=>b.onclick=()=>pick(+b.dataset.v));
  startEl.querySelector('#rnd').onclick = ()=>pick(vs[Math.floor(Math.random()*vs.length)]);
  if (resumeFor){
    startEl.querySelector('#doResume').onclick = ()=>begin(resumeFor.v, resumeFor.saved);
    startEl.querySelector('#doRestart').onclick = ()=>{ clear(resumeFor.v, MODE); begin(resumeFor.v, null); };
    startEl.querySelector('#doCancel').onclick = ()=>renderStart(null);
  }
}
function pick(v){
  const saved = load(v, MODE);
  if (saved && Object.keys(saved.a||{}).length){ renderStart({v, saved}); window.scrollTo(0,0); }
  else begin(v, null);
}

function begin(v, saved){
  S = { v, mode:MODE, items:VAR[v].items, pass:VAR[v].pass,
        ans: saved?.a ? {...saved.a} : {}, i: saved?.i ?? 0, done:false, started: Date.now(),
        deadline: MODE==='exam' ? Date.now() + (saved?.left ?? 60*60*1000) : null };
  startEl.hidden = true; document.getElementById('result').hidden = true; examEl.hidden = false;
  examEl.innerHTML = `
    <div class="bar"><div class="bar-in">
      <img class="mini" src="${LOGO}" alt="">
      <div class="vname">${v}-variant<small>${MODE==='exam'?'Imtihon rejimi':'Mashq rejimi'}</small></div>
      <div class="prog"><i id="pbar"></i></div>
      <div class="clock tnum" id="clock">${MODE==='exam'?'60:00':'&nbsp;&mdash;&nbsp;'}</div>
      <button class="icon-btn" id="finish">Yakunlash</button>
    </div></div>
    <div class="cols">
      <div class="qcard" id="qcard"></div>
      <aside class="rail">
        <h3>Savollar</h3>
        <div class="cells" id="cells"></div>
        <div class="railfoot"><span id="cnt"></span><button class="btn" id="quit">Chiqish</button></div>
      </aside>
    </div>`;
  examEl.querySelector('#finish').onclick = finish;
  examEl.querySelector('#quit').onclick = ()=>{ save(); stopClock();
    examEl.hidden=true; startEl.hidden=false; renderStart(null); window.scrollTo(0,0); };
  if (MODE==='exam') startClock();
  draw(); window.scrollTo(0,0);
}
function startClock(){ stopClock();
  tick = setInterval(()=>{
    const left = S.deadline - Date.now();
    const c = document.getElementById('clock'); if(!c) return;
    c.textContent = fmt(left); c.classList.toggle('warn', left < 5*60*1000);
    if (left <= 0) finish();
  }, 250);
}
function stopClock(){ if (tick) clearInterval(tick); tick = null; }

function optionsHtml(q, chosen, reveal){
  return q.opts.map((o,ix)=>{
    const L = LET[ix];
    let cls = '', why = '';
    if (reveal){
      cls = L===q.ans ? ' correct' : (L===chosen ? ' wrong' : '');
      const good = L===q.ans;
      why = `<div class="why ${good?'good':'bad'}"><b>${good?"To'g'ri:":"Noto'g'ri:"}</b> ${esc(q.why[L])}</div>`;
    }
    return `<div class="optwrap"><button class="opt${cls}" data-l="${L}" ${reveal?'disabled':''}
        aria-pressed="${chosen===L}"><span class="letter">${L}</span><span>${mark(o)}</span></button>${why}</div>`;
  }).join('');
}

function draw(){
  const q = S.items[S.i], no = q.no, chosen = S.ans[no];
  const reveal = S.mode==='practice' && !!chosen;
  const p = S.pass[no];
  const card = document.getElementById('qcard');
  card.innerHTML = `
    <div class="qmeta"><span class="qno tnum">${no}</span>
      <span class="pts">${ball(q.pts)}</span><span class="sect">${SECT(no)}</span></div>
    ${p ? `<div class="passage"><div class="plead">${esc(p[0])}</div>
        ${p.slice(1).map(t=>`<p${t===t.toUpperCase()?' class="ptitle"':''}>${mark(t)}</p>`).join('')}</div>` : ''}
    <div class="qhead">${mark(q.head)}</div>
    ${q.text ? `<div class="qtext">${mark(q.text)}</div>` : ''}
    ${reveal ? `<div class="verdict ${chosen===q.ans?'good':'bad'}">${chosen===q.ans
        ? 'Barakalla, javob to’g’ri.'
        : 'Afsus, javob noto’g’ri. To’g’ri javob: '+q.ans+'.'}</div>` : ''}
    <div class="opts" style="margin-top:${reveal?'14px':'0'}">${optionsHtml(q, chosen, reveal)}</div>
    <div class="nav">
      <button class="btn" id="prev" ${S.i===0?'disabled':''}>&larr; Oldingi</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="next">${S.i===29?'Yakunlash':'Keyingi &rarr;'}</button>
    </div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  card.querySelector('#prev').onclick = ()=>go(S.i-1);
  card.querySelector('#next').onclick = ()=> S.i===29 ? finish() : go(S.i+1);
  drawRail();
}
function drawRail(){
  const cells = document.getElementById('cells');
  cells.innerHTML = S.items.map((q,ix)=>{
    const a = S.ans[q.no];
    let cls = 'cell' + (a?' done':'') + (ix===S.i?' cur':'');
    if (S.mode==='practice' && a) cls = 'cell ' + (a===q.ans?'ok':'no') + (ix===S.i?' cur':'');
    return `<button class="${cls}" data-i="${ix}">${q.no}</button>`;
  }).join('');
  cells.querySelectorAll('.cell').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const n = Object.keys(S.ans).length;
  document.getElementById('cnt').textContent = n + ' / 30 javob berildi';
  document.getElementById('pbar').style.width = (n/30*100)+'%';
}
function choose(L){
  const q = S.items[S.i];
  if (S.mode==='practice' && S.ans[q.no]) return;
  S.ans[q.no] = L; save();
  if (S.mode==='practice') draw();
  else { draw(); if (S.i < 29) setTimeout(()=>go(S.i+1), 160); }
}
function go(i){ if (i<0||i>29) return; S.i=i; save(); draw();
  document.getElementById('qcard').scrollIntoView({block:'start', behavior:'auto'}); }

document.addEventListener('keydown', e=>{
  if (!S || S.done || examEl.hidden) return;
  const k = e.key.toUpperCase();
  if (LET.includes(k)) { e.preventDefault(); choose(k); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(S.i+1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); go(S.i-1); }
});

function finish(){
  stopClock(); S.done = true; clear(S.v, S.mode);
  const used = S.mode==='exam' ? (60*60*1000 - Math.max(0, S.deadline - Date.now()))
                               : (Date.now() - S.started);
  let score=0, right=0; const bands={'0.9':0,'1.5':0,'2.6':0};
  for (const q of S.items) if (S.ans[q.no] === q.ans){ score += parseFloat(q.pts); right++; bands[q.pts]++; }
  score = Math.round(score*10)/10;
  const resEl = document.getElementById('result');
  examEl.hidden = true; resEl.hidden = false;
  resEl.innerHTML = `
    <div class="score">
      <div class="big tnum">${String(score).replace('.',',')}<small> / 50</small></div>
      <div class="meta">
        <b>${S.v}-variant &middot; ${S.mode==='exam'?'imtihon':'mashq'}</b>
        <span>${right} ta to&lsquo;g&lsquo;ri javob (30 tadan)</span>
        <span>Sarflangan vaqt: <span class="tnum">${fmt(used)}</span></span>
      </div>
      <div class="breakdown">
        <div class="bd"><div class="k">Grammar</div><div class="v tnum">${bands['0.9']}/10</div></div>
        <div class="bd"><div class="k">Vocabulary</div><div class="v tnum">${bands['1.5']}/10</div></div>
        <div class="bd"><div class="k">Reading</div><div class="v tnum">${bands['2.6']}/10</div></div>
      </div>
    </div>
    <div class="filters">
      <button class="chip" data-f="wrong" aria-pressed="true">Xatolar (${30-right})</button>
      <button class="chip" data-f="all" aria-pressed="false">Barcha savollar</button>
    </div>
    <div class="rev" id="rev"></div>
    <div class="endbar">
      <button class="btn btn-primary" id="again">Shu variantni qayta ishlash</button>
      <button class="btn" id="home">Boshqa variant tanlash</button>
    </div>
    <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  let filter = 'wrong';
  const rev = resEl.querySelector('#rev');
  function paint(){
    const list = S.items.filter(q => filter==='all' || S.ans[q.no]!==q.ans);
    rev.innerHTML = list.length ? list.map(q=>{
      const you = S.ans[q.no], ok = you===q.ans;
      return `<div class="rev-item ${ok?'hit':'miss'}">
        <div class="rev-head"><span class="n tnum">${q.no}</span>
          <span class="tag ${ok?'hit':'miss'}">${ok?"to’g’ri":'xato'}</span>
          <span class="sect">${SECT(q.no)} &middot; ${ball(q.pts)}</span></div>
        <div class="rev-q"><span class="h">${mark(q.head)}</span>${q.text?mark(q.text):''}</div>
        <div class="opts">${optionsHtml(q, you, true)}</div>
      </div>`;
    }).join('') : `<div class="rev-item hit"><b>Bu variantda bitta ham xato yo&lsquo;q. Barakalla!</b></div>`;
  }
  paint();
  resEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    filter = c.dataset.f;
    resEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.f===filter)));
    paint();
  });
  resEl.querySelector('#again').onclick = ()=>begin(S.v, null);
  resEl.querySelector('#home').onclick = ()=>{ resEl.hidden=true; startEl.hidden=false;
    renderStart(null); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

window.addEventListener('beforeunload', save);
renderStart(null);
</script>
</body>
</html>
