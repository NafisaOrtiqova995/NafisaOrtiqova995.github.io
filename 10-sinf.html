<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>10-sinf Olimpiada Trenajori</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
</head>
<body>
<style>
/* Layout: friendly exam shell - branded masthead, one question column, numbered rail.
   Palette taken from the channel logo: teal puzzle piece, orange puzzle piece. */
:root{
  --bg:#F4F8F8; --surface:#FFFFFF; --surface-2:#E9F1F2; --fg:#15262A; --muted:#577076;
  --line:#D5E3E5; --line-strong:#B6CCD0;
  --teal:#15808F; --teal-soft:#DDF0F2; --orange:#D2561A; --orange-soft:#FCEADF;
  --ok:#17795A; --ok-soft:#DFF3EC; --bad:#B23A2B; --bad-soft:#FCE7E3;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-q:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:5px}
.wrap{max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- start ---------- */
#start{padding-block:34px 56px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;
  box-shadow:0 1px 2px rgba(21,38,42,.05)}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:18px;padding:22px 18px}}
.logo{width:124px;height:124px;border-radius:16px;display:block;object-fit:cover;
  border:1px solid var(--line)}
@media (max-width:640px){.logo{width:104px;height:104px}}
.hero h1{font-family:var(--font-display);font-size:clamp(1.45rem,4.2vw,2.3rem);line-height:1.15;
  font-weight:700;letter-spacing:-.01em;color:var(--teal)}
.hero .sub{margin-top:10px;font-size:clamp(.95rem,2.2vw,1.05rem);color:var(--fg);
  border-left:3px solid var(--orange);padding-left:12px;max-width:60ch}
@media (max-width:640px){.hero .sub{border-left:0;border-top:3px solid var(--orange);
  padding-left:0;padding-top:10px;text-align:center}}
.hero .chan{margin-top:12px;font-size:.86rem;color:var(--muted)}
.hero .chan b{color:var(--fg)}
.specs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
@media (max-width:640px){.specs{justify-content:center}}
.spec{font-size:.78rem;background:var(--teal-soft);color:var(--fg);border-radius:999px;padding:4px 11px}
.spec b{color:var(--teal);font-weight:700}

.block{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
.mode{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;align-items:flex-start;transition:border-color .12s,background .12s}
.mode[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.mode .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-strong);margin-top:4px;flex:none}
.mode[aria-pressed="true"] .dot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--surface)}
.mode h3{font-size:1rem;font-weight:700}
.mode span.d{font-size:.85rem;color:var(--muted);display:block;margin-top:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
.vcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:border-color .12s,transform .12s,box-shadow .12s}
.vcard:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 4px 12px rgba(21,128,143,.14)}
.vcard b{font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1;color:var(--teal)}
.vcard span{font-size:.74rem;color:var(--muted)}
.vcard .resume{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:16px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel p{margin:0;font-size:.92rem;flex:1 1 220px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
  padding:10px 16px;font-size:.9rem;font-weight:600;transition:border-color .12s,filter .12s}
.btn:hover{border-color:var(--teal)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0C1416}}
.btn-primary:hover{filter:brightness(1.08)}

/* ---------- exam ---------- */
#exam{display:flex;flex-direction:column;min-height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:13px;padding-block:10px;max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .mini{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover}
.bar .vname{font-weight:700;font-size:.92rem;white-space:nowrap;line-height:1.2}
.bar .vname small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.clock{margin-left:auto;font-size:1.22rem;font-weight:700;padding:3px 11px;border-radius:9px;
  background:var(--surface-2)}
.clock.warn{background:var(--bad-soft);color:var(--bad)}
.prog{flex:1 1 80px;min-width:60px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .2s}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;
  font-size:.85rem;font-weight:600;flex:none}
@media (max-width:560px){
  .bar-in{gap:9px}
  .bar .mini{display:none}
  .bar .prog{display:none}
  .bar .vname{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .clock{font-size:1.05rem;padding:3px 8px}
  .icon-btn{padding:7px 10px;font-size:.8rem}
}

.cols{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;max-width:1140px;
  margin:0 auto;width:100%;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
@media (max-width:460px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1;color:var(--teal)}
.pts{font-size:.76rem;font-weight:700;color:var(--orange);background:var(--orange-soft);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.sect{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-left:auto;font-weight:700}
.passage{border:1px solid var(--line);border-left:4px solid var(--teal);background:var(--surface-2);
  border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:16px;font-family:var(--font-q);
  font-size:.98rem;line-height:1.64;max-height:46vh;overflow-y:auto}
.passage .plead{font-family:var(--font-ui);font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);font-weight:700;margin-bottom:8px}
.passage .ptitle{font-weight:600;letter-spacing:.03em}
.passage p{margin:0 0 .7em}.passage p:last-child{margin-bottom:0}
.qhead{font-weight:700;font-size:1rem;margin-bottom:6px}
.qtext{font-family:var(--font-q);font-size:1.1rem;line-height:1.6;margin-bottom:16px}
.qtext u{text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:9px}
.optwrap{display:flex;flex-direction:column}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-family:var(--font-q);font-size:1.03rem;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.opt .letter{font-family:var(--font-ui);font-size:.82rem;font-weight:700;flex:none;
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;color:var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"] .letter{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.why{font-size:.88rem;line-height:1.5;margin:5px 0 0 38px;padding-left:11px;
  border-left:2px solid var(--line-strong);color:var(--muted)}
.why.good{border-left-color:var(--ok);color:var(--fg)}
.why.bad{border-left-color:var(--bad)}
.why b{font-weight:700}
.why.good b{color:var(--ok)}.why.bad b{color:var(--bad)}
.verdict{margin-top:14px;border-radius:11px;padding:10px 14px;font-weight:700;font-size:.93rem}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.nav .btn{min-width:98px;text-align:center}
.nav .spacer{flex:1}

.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}
.rail h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  font-size:.83rem;font-weight:600;display:grid;place-items:center;padding:0}
.cell:hover{border-color:var(--teal)}
.cell.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.cell.cur{outline:2px solid var(--orange);outline-offset:1px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.railfoot{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:9px}
@media (max-width:880px){.rail{position:static;order:-1}.cells{grid-template-columns:repeat(10,1fr)}}

/* ---------- result ---------- */
#result{padding-block:34px 56px}
.score{display:flex;flex-wrap:wrap;gap:22px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:6px 6px 16px 16px;padding:22px}
.score .big{font-family:var(--font-display);font-size:clamp(2.5rem,9vw,3.5rem);font-weight:700;
  line-height:.95;color:var(--teal)}
.score .big small{font-size:.36em;color:var(--muted);font-weight:600}
.score .meta{display:flex;flex-direction:column;gap:3px}
.score .meta b{font-size:1.05rem}
.score .meta span{font-size:.87rem;color:var(--muted)}
.breakdown{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bd{border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:116px;background:var(--surface-2)}
.bd .k{font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bd .v{font-size:1.15rem;font-weight:700;margin-top:2px}
.filters{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;
  font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C1416}}
.rev{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 19px}
.rev-item.miss{border-left:4px solid var(--bad)}
.rev-item.hit{border-left:4px solid var(--ok)}
.rev-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.rev-head .n{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--teal)}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px}
.tag.hit{background:var(--ok-soft);color:var(--ok)}
.tag.miss{background:var(--bad-soft);color:var(--bad)}
.rev-q{font-family:var(--font-q);font-size:1.02rem;margin-bottom:10px}
.rev-q .h{font-family:var(--font-ui);font-weight:700;font-size:.95rem;display:block}
.endbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
footer{color:var(--muted);font-size:.82rem;padding-block:24px;border-top:1px solid var(--line);margin-top:36px}
footer b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="start" class="wrap"></div>
<div id="exam" hidden></div>
<div id="result" class="wrap" hidden></div>

<script>
const DATA = [{"variant":1,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Rarely ____ a school project ____ so much interest among parents.","opts":["has / attracting","did / attracted","had / attract","has / attracted"],"ans":"D","why":{"A":"'Has' dan keyin uchinchi shakl kerak, '-ing' shakli emas.","B":"'Did' dan keyin fe'lning birinchi shakli keladi, 'attracted' emas.","C":"'Had' dan keyin uchinchi shakl kerak, 'attract' esa birinchi shakl.","D":"'Rarely' gap boshida kelsa yordamchi fe'l egadan oldinga chiqadi va present perfect 'has attracted' bo'ladi."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The laboratory ____ twice before the school finally ____ new equipment.","opts":["had been repaired / bought","was repaired / bought","has been repaired / bought","was being repaired / had bought"],"ans":"A","why":{"A":"Avvalgi ikki ta'mir past perfect majhul 'had been repaired', keyingisi past simple 'bought' bo'ladi.","B":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, qaysi ish avval bo'lgani ko'rinmaydi.","C":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","D":"Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the shortage of volunteers, the festival was held as planned.","opts":["Despite","Although","Because of","Consequently"],"ans":"A","why":{"A":"'Despite' dan keyin ot birikmasi keladi va qarama-qarshilikni bildiradi.","B":"'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.","C":"'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.","D":"'Consequently' natijani bildiruvchi kirish so'z bo'lib, gapni bunday bog'lamaydi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the timetable ____ caused most of the complaints, not the teachers.","opts":["that","what","which it","when"],"ans":"A","why":{"A":"Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi.","B":"'What' ta'kidlovchi gapni boshlay olmaydi.","C":"'Which it' ortiqcha olmosh qo'shadi va gapni buzadi.","D":"'When' vaqtga ishora qiladi, sababga emas."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the hall ____ booked earlier, the concert ____ last month.","opts":["had been / would have taken place","was / would take place","is / will take place","had been / would take place"],"ans":"A","why":{"A":"O'tmishdagi afsus uchinchi shart gap 'had been booked / would have taken place' bilan beriladi.","B":"'Was' bilan 'would take place' o'tgan oydagi amalga oshmagan ishni bildirmaydi.","C":"Bu birinchi shart gap bo'lib, 'last month' bilan birga kelmaydi.","D":"'Would take place' natijani hozirgi paytga olib chiqadi, gapda esa o'tgan oy aytilgan."}},{"no":6,"pts":"0.9","head":"Which option means that something was unnecessary but was done?","text":"","opts":["We didn't need to print the tickets.","We needn't have printed the tickets.","We mustn't print the tickets.","We couldn't print the tickets."],"ans":"B","why":{"A":"'Didn't need to' zarurat bo'lmaganini bildiradi, lekin ish bajarilgani ko'rinmaydi.","B":"'Needn't have printed' ish bajarilgan, lekin kerak emas edi degan ma'noni beradi.","C":"'Mustn't' taqiqni bildiradi.","D":"'Couldn't' imkoniyat bo'lmaganini bildiradi."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The committee proposed that the deadline ____ by two weeks.","opts":["is extended","was extended","extending","be extended"],"ans":"D","why":{"A":"'Is extended' oddiy hozirgi zamon bo'lib, bunday taklifda ishlatilmaydi.","B":"'Was extended' oddiy o'tgan zamon bo'lib, taklif ma'nosini bermaydi.","C":"'Extending' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi.","D":"'Proposed that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be extended' bo'ladi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second version of the programme is ____ easier to use than the first.","opts":["very","too","far","so"],"ans":"C","why":{"A":"'Very' qiyosiy daraja oldidan kelmaydi.","B":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.","C":"Qiyosiy daraja 'far', 'much' yoki 'a lot' bilan kuchaytiriladi.","D":"'So' ham qiyosiy darajani kuchaytira olmaydi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The researcher's conclusions was published last spring.","The researchers' conclusions were published last spring.","The researchers conclusions' were published last spring.","The researchers's conclusions were published last spring."],"ans":"B","why":{"A":"Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak.","B":"Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: researchers'.","C":"Apostrof noto'g'ri so'zga qo'yilgan.","D":"Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me when do the results appear?","Can you explain why was the deadline changed?","Could you tell me whether the results have been announced?","I wonder how many students will take part?"],"ans":"C","why":{"A":"'Do' yordamchi fe'li bilvosita savolda tushib qolishi kerak.","B":"'Was' egadan oldin turibdi, bu to'g'ridan-to'g'ri savol tartibi.","C":"Bilvosita savolda so'z tartibi darak gapdagidek: 'whether the results have been announced'.","D":"Bu to'liq savol belgisi bilan berilgan, bilvosita savol darak gap shaklida tugaydi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The meeting was ____ until the end of the month because of the weather.","opts":["put on","put up","put off","put out"],"ans":"C","why":{"A":"'Put on' kiyimni kiyish yoki spektakl qo'yishni bildiradi.","B":"'Put up' biror narsani o'rnatish yoki osishni bildiradi.","C":"'Put off' biror tadbirni keyinga qoldirish ma'nosini beradi.","D":"'Put out' olovni o'chirish yoki tashqariga chiqarishni bildiradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["pay attention","give attention loudly and round","make attention","do attention"],"ans":"A","why":{"A":"Ingliz tilida e'tibor qaratish 'pay attention' deyiladi.","B":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","C":"'Make' bu ot bilan birikmaydi.","D":"'Do attention' birikmasi ingliz tilida mavjud emas."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The instructions for the experiment were deliberately ~vague~.","opts":["unclear","short","written","precise"],"ans":"D","why":{"A":"'Unclear' ma'no jihatidan sinonim, teskarisi emas.","B":"'Short' uzunlikni bildiradi, aniqlikni emas.","C":"'Written' shaklni bildiradi va teskari ma'no bermaydi.","D":"'Vague' noaniq degani, uning teskarisi 'precise' ya'ni aniq."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a decision?","text":"","opts":["hasty","sensible","edible","unanimous"],"ans":"C","why":{"A":"'Hasty' shoshqaloq degani va qarorni tasvirlaydi.","B":"'Sensible' oqilona degani, bu ham qarorga tegishli.","C":"'Edible' yeyish mumkin degani bo'lib, faqat ovqat haqida ishlatiladi.","D":"'Unanimous' bir ovozdan degani va qaror haqida aytiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The guide gave a ~thorough~ explanation of how the machine worked.","opts":["brief","complete","simple","official"],"ans":"B","why":{"A":"'Brief' qisqa degani va teskari tomonga tortadi.","B":"'Thorough' to'liq va puxta degani, 'complete' esa shu ma'noni beradi.","C":"'Simple' soddalikni bildiradi, to'liqlikni emas.","D":"'Official' rasmiylikni bildiradi, mazmunni emas."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The new rules were introduced to improve the ____ of the service.","opts":["efficient","efficiency","efficiently","efficiencies"],"ans":"B","why":{"A":"'Efficient' sifat bo'lib, 'the' dan keyin ot talab qilinadi.","B":"'The' dan keyin ot kerak, 'efficiency' esa sanalmaydigan ot shaklidir.","C":"'Efficiently' ravish bo'lib, fe'lni izohlaydi.","D":"'Efficiencies' ko'plik shakli bo'lib, bu ma'noda ishlatilmaydi."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The museum is famous ____ its collection of ancient coins.","opts":["for","of","with","about"],"ans":"A","why":{"A":"'Famous for' barqaror birikma bo'lib, mashhurlik sababini ko'rsatadi.","B":"'Famous' sifati 'of' predlogi bilan ishlatilmaydi.","C":"'With' bu sifat bilan birikmaydi.","D":"'About' mavzuni bildiradi, mashhurlik sababini emas."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The manager was praised for her ~prompt~ reply to the complaint.","opts":["written in a polite style","sent to several people at once","given without any delay","prepared by somebody else"],"ans":"C","why":{"A":"Odoblilik 'polite' so'zining ma'nosi.","B":"Bir necha kishiga yuborish bu so'zning ma'nosi emas.","C":"'Prompt' tez va kechiktirmasdan degani.","D":"Boshqa odam tayyorlagani haqidagi ta'rif mos emas."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"An eyewitness is:","opts":["a person who repairs glasses","a person who saw an event happen","a person who writes about court cases","a person who guards a building"],"ans":"B","why":{"A":"Ko'zoynak ustasi 'optician' deyiladi.","B":"'Eyewitness' voqeani o'z ko'zi bilan ko'rgan guvoh degani.","C":"Sud haqida yozuvchi 'court reporter' deb ataladi.","D":"Binoni qo'riqlovchi 'security guard' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["confident","arrogant","modest","polite"],"ans":"B","why":{"A":"'Confident' o'ziga ishongan degani va ijobiy baho beradi.","B":"'Arrogant' manmansirab degani bo'lib, salbiy ma'noga ega.","C":"'Modest' kamtar degani, bu ham ijobiy so'z.","D":"'Polite' odobli degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To announce the winners of the science fair","To ask teachers to judge the projects","To say that the science fair has been postponed","To explain how to take part in the science fair"],"ans":"D","why":{"A":"G'oliblar haqida e'londa hech narsa aytilmagan.","B":"O'qituvchilardan hakamlik so'ralmagan.","C":"E'lon aksincha, tadbir o'tkazilishini bildiradi.","D":"E'londa mavzu tanlash, ro'yxatdan o'tish, joy va baholash tartibi tushuntirilgan."},"block":["Read the text and answer questions 21-22.","SCIENCE FAIR: HOW TO TAKE PART","Projects may be prepared alone or in pairs. Choose a question that can be tested, not simply a topic to describe. Register with your science teacher by 10 March and give the title of your project. Each team receives a table in the main hall and a board for photographs and charts. Judges will visit every table and ask the students to explain their method rather than only their result."]},{"no":22,"pts":"2.6","head":"What will the judges mainly ask about?","text":"","opts":["The cost of the materials used","The number of students in each team","The way the students carried out their work","The books the students have read"],"ans":"C","why":{"A":"Material narxi haqida e'londa hech narsa yozilmagan.","B":"Jamoa a'zolari soni baholash mezoni sifatida ko'rsatilmagan.","C":"E'londa hakamlar natijani emas, ish usulini tushuntirishni so'rashi aytilgan.","D":"Kitoblar haqida e'londa gap yo'q."}},{"no":23,"pts":"2.6","head":"You hear a classmate say: \"I think she is getting cold feet about the competition.\" What does this mean?","text":"","opts":["She is becoming nervous and may not take part","She is unwell and cannot attend","She is training outdoors in cold weather","She has already decided to withdraw"],"ans":"A","why":{"A":"'Get cold feet' iborasi qo'rqib, fikridan qaytishga moyil bo'lishni bildiradi.","B":"Ibora sog'liq haqida emas, u ko'chma ma'noda ishlatiladi.","C":"Ibora harorat yoki mashg'ulot bilan bog'liq emas.","D":"Ibora shubhani bildiradi, qaror qabul qilinganini emas."}},{"no":24,"pts":"2.6","head":"You see this notice in a museum: \"Large bags must be left in the cloakroom. The service is free.\" What is the main message?","text":"","opts":["Bags are not allowed in the building at all","You must leave a big bag downstairs, and it costs nothing","You must pay a small sum to leave a bag","Only visitors with tickets may use the cloakroom"],"ans":"B","why":{"A":"E'lon sumkani butunlay taqiqlamaydi, uni qoldirishni so'raydi.","B":"E'londa katta sumkani kiyimxonaga qoldirish kerakligi va bu bepul ekani aytilgan.","C":"E'londa aynan 'free' deyilgan, ya'ni to'lov yo'q.","D":"Chipta sharti haqida e'londa hech narsa yozilmagan."}},{"no":25,"pts":"2.6","head":"What does the text say about the first cycle lanes in the city?","text":"","opts":["They were built along the river only","They were opened after a public vote","They replaced several bus routes","They were painted on existing roads"],"ans":"D","why":{"A":"Daryo bo'yi haqida matnda hech narsa yozilmagan.","B":"Ovoz berish haqida matnda gap yo'q.","C":"Avtobus yo'nalishlari haqida matnda ma'lumot berilmagan.","D":"Birinchi xatboshida dastlabki yo'laklar mavjud yo'llarga bo'yoq bilan chizilgani aytilgan."},"block":["Read the text and answer questions 25-27.","The first cycle lanes in the city were simply painted on existing roads. They cost very little, and they appeared quickly. Drivers, however, parked across them, and many riders said they felt no safer than before.","The second generation is different. A low kerb now separates the lane from the traffic, and the lane keeps its own space at junctions. Counts show that the number of riders doubled within a year on the streets where this was done.","The lesson, planners say, is about confidence rather than distance. People who already cycle will use almost anything. People who are thinking about it will only start when the route feels safe from beginning to end."]},{"no":26,"pts":"2.6","head":"What happened on the streets with a separating kerb?","text":"","opts":["Traffic became much slower than before","Parking was banned completely","The lanes had to be repainted","The number of riders doubled in a year"],"ans":"D","why":{"A":"Transport tezligi haqida matnda hech narsa yozilmagan.","B":"To'xtash joyi taqiqlangani haqida gap yo'q.","C":"Qayta bo'yash haqida matnda ma'lumot berilmagan.","D":"Ikkinchi xatboshida bir yil ichida velosipedchilar soni ikki baravar oshgani aytilgan."}},{"no":27,"pts":"2.6","head":"What do the planners say the real issue is?","text":"","opts":["The cost of building the lanes","Whether the route feels safe all the way","The distance people have to travel","The number of junctions on the route"],"ans":"B","why":{"A":"Narx birinchi xatboshida eslatilgan, lekin asosiy masala sifatida emas.","B":"Uchinchi xatboshida masala masofa emas, yo'lning boshidan oxirigacha xavfsiz tuyulishi ekani aytilgan.","C":"Matnda aynan masofa emasligi ta'kidlangan.","D":"Chorrahalar eslatilgan, ammo asosiy masala deb ko'rsatilmagan."}},{"no":28,"pts":"2.6","head":"Why did some schools move their start time later?","text":"","opts":["Teenagers naturally fall asleep later at night","Parents asked for more time in the morning","The school buses were often delayed","Lessons were shortened at the same time"],"ans":"A","why":{"A":"Birinchi xatboshida o'smirlarning tabiiy ravishda kechroq uxlashi aytilgan.","B":"Ota-onalarning iltimosi haqida matnda hech narsa yozilmagan.","C":"Avtobuslar haqida matnda gap yo'q.","D":"Darslarning qisqartirilishi haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 28-30.","A number of schools have moved their first lesson to a later hour. The reason is biological rather than practical. During the teenage years the body clock shifts, and a pupil who goes to bed at ten often cannot fall asleep until midnight.","The early results were encouraging. Attendance improved, and teachers reported fewer pupils asleep at their desks in the first lesson. In one district the number of late arrivals fell by almost half.","The difficulty lies outside the classroom. A later start means a later finish, which affects sports clubs, part-time jobs and younger brothers and sisters who have to be collected. Most schools that have kept the change say the planning took longer than the decision itself."]},{"no":29,"pts":"2.6","head":"What did teachers report after the change?","text":"","opts":["Pupils finished their homework earlier","More pupils joined the sports clubs","Lessons became easier to plan","Fewer pupils fell asleep in the first lesson"],"ans":"D","why":{"A":"Uy vazifasi haqida matnda hech narsa yozilmagan.","B":"To'garaklar aksincha, qiyinchilik sifatida eslatilgan.","C":"Dars rejalashtirish haqida matnda gap yo'q.","D":"Ikkinchi xatboshida birinchi darsda uxlab qolgan o'quvchilar kamaygani aytilgan."}},{"no":30,"pts":"2.6","head":"What is described as the main difficulty?","text":"","opts":["The cost of changing the timetable","Finding teachers for the later hours","Everything that happens after lessons end","Explaining the change to the pupils"],"ans":"C","why":{"A":"Narx haqida matnda hech narsa yozilmagan.","B":"O'qituvchi topish haqida matnda gap yo'q.","C":"Uchinchi xatboshida darsdan keyingi to'garak, ish va kichik ukalarni olib ketish masalalari qiyinchilik deb ko'rsatilgan.","D":"O'quvchilarga tushuntirish qiyinchilik sifatida eslatilmagan."}}]},{"variant":2,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Not until the final week ____ the organisers ____ how few tickets remained.","opts":["did / realised","had / realising","did / realise","were / realise"],"ans":"C","why":{"A":"'Did' dan keyin o'tgan zamon shakli 'realised' ishlatilmaydi.","B":"'Had' bilan 'realising' ravishdoshi mos kelmaydi.","C":"'Not until' bilan boshlangan gapdan keyin 'did' egadan oldinga chiqadi va fe'l ydi.","C":"O'tmishdagi afsus uchinchi shart gap 'had had / would have bought' bilan beriladi.","D":"'Would buy' natijani hozirgi paytga olib chiqadi, gapda esa kecha aytilgan."}},{"no":6,"pts":"0.9","head":"Which option means that something is forbidden?","text":"","opts":["You are not allowed to use the side entrance.","You don't have to use the side entrance.","You needn't use the side entrance.","You could not find the side entrance."],"ans":"A","why":{"A":"'Are not allowed to' ruxsat berilmaganini, ya'ni taqiqni bildiradi.","B":"'Don't have to' zarurat yo'qligini bildiradi, taqiqni emas.","C":"'Needn't' ham shart emasligini bildiradi.","D":"Bu topa olmaganini bildiradi va taqiq ma'nosi yo'q."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The doctor advised that the patient ____ for at least a week.","opts":["rests","rested","rest","resting"],"ans":"C","why":{"A":"'Rests' uchinchi shaxs shakli bo'lib, bu qurilishda ishlatilmaydi.","B":"'Rested' o'tgan zamon shakli bo'lib, bu yerga mos kelmaydi.","C":"'Advised that' dan keyin fe'lning o'zgarmas shakli 'rest' qo'yiladi.","D":"'Resting' ravishdosh bo'lib, kesim bo'la olmaydi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The new timetable is ____ more convenient than the old one.","opts":["very","much","too","so"],"ans":"B","why":{"A":"'Very' qiyosiy daraja oldidan kelmaydi.","B":"Qiyosiy daraja 'much', 'far' yoki 'a lot' bilan kuchaytiriladi.","C":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.","D":"'So' ham qiyosiy darajani kuchaytira olmaydi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The visitor's comments was written in a small book.","The visitors comments' were written in a small book.","The visitors's comments were written in a small book.","The visitors' comments were written in a small book."],"ans":"D","why":{"A":"Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak.","B":"Apostrof noto'g'ri so'zga qo'yilgan.","C":"Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q.","D":"Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: visitors'."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know where the forms are kept?","Do you know where are the forms kept?","Can you tell me when did the course begin?","I wonder how much does the trip cost?"],"ans":"A","why":{"A":"Bilvosita savolda so'z tartibi darak gapdagidek: 'where the forms are kept'.","B":"'Are' egadan oldin turibdi, bu to'g'ridan-to'g'ri savol tartibi.","C":"'Did' yordamchi fe'li bilvosita savolda tushib qolishi kerak.","D":"'Does' ham bilvosita savolda ishlatilmaydi, to'g'ri shakli 'the trip costs' bo'ladi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"We had to ____ the meeting because only three people came.","opts":["call on","call up","call off","call in"],"ans":"C","why":{"A":"'Call on' kimgadir murojaat qilish yoki tashrif buyurishni bildiradi.","B":"'Call up' telefon qilishni bildiradi.","C":"'Call off' tadbirni bekor qilish ma'nosini beradi.","D":"'Call in' mutaxassisni chaqirishni bildiradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["take responsibility","make responsibility","do responsibility","hold responsibility quietly and round"],"ans":"A","why":{"A":"Ingliz tilida javobgarlikni o'z zimmasiga olish 'take responsibility' deyiladi.","B":"'Make' bu ot bilan birikmaydi.","C":"'Do responsibility' birikmasi ingliz tilida mavjud emas.","D":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The hall was almost ~empty~ when the lecture began.","opts":["quiet","crowded","large","cold"],"ans":"B","why":{"A":"'Quiet' tinchlikni bildiradi, odam sonini emas.","B":"'Empty' bo'sh degani, uning teskarisi 'crowded' ya'ni odam gavjum.","C":"'Large' o'lcham haqida gapiradi va teskari ma'no bermaydi.","D":"'Cold' harorat haqida, bu yerda esa zal to'laligi haqida gap ketyapti."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a voice?","text":"","opts":["hoarse","soothing","leafy","shrill"],"ans":"C","why":{"A":"'Hoarse' bo'g'iq degani va ovozni tasvirlaydi.","B":"'Soothing' tinchlantiruvchi degani, bu ham ovozga tegishli.","C":"'Leafy' barglarga boy degani bo'lib, faqat joy yoki daraxt haqida ishlatiladi.","D":"'Shrill' chiyillagan degani va ovoz haqida aytiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"Attendance at the first meeting was ~compulsory~ for all members.","opts":["obligatory","optional","unusual","temporary"],"ans":"A","why":{"A":"'Compulsory' majburiy degani, 'obligatory' esa aynan shu ma'noni beradi.","B":"'Optional' ixtiyoriy degani va to'g'ridan-to'g'ri teskari ma'no beradi.","C":"'Unusual' kam uchraydigan degani bo'lib, majburiylikka aloqasi yo'q.","D":"'Temporary' vaqtinchalikni bildiradi, majburiylikni emas."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The report described the ____ of the old bridge in great detail.","opts":["collapsed","collapse","collapsing","collapsible"],"ans":"B","why":{"A":"'Collapsed' sifatdosh bo'lib, bu o'rinda ot vazifasini bajara olmaydi.","B":"'The' dan keyin ot kerak, 'collapse' esa ot shaklida ishlatilgan.","C":"'Collapsing' ravishdosh bo'lib, 'the ... of' qurilishiga mos kelmaydi.","D":"'Collapsible' sifat bo'lib, yig'iladigan degan ma'noni beradi."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"She apologised ____ arriving late to the rehearsal.","opts":["of","about","from","for"],"ans":"D","why":{"A":"'Apologise' fe'li 'of' predlogi bilan ishlatilmaydi.","B":"'About' bu fe'ldan keyin kelmaydi.","C":"'From' manbani bildiradi va bu yerga mos emas.","D":"'Apologise for' barqaror birikma bo'lib, uzr sababini ko'rsatadi."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The committee's decision was described in the press as ~controversial~.","opts":["taken without a proper vote","causing a lot of disagreement","announced much earlier than expected","supported by every single member"],"ans":"B","why":{"A":"Ovoz berish tartibi bu so'zning ma'nosi emas.","B":"'Controversial' ko'p bahs va kelishmovchilik tug'diradigan degani.","C":"E'lon qilish vaqti haqidagi ta'rif mos kelmaydi.","D":"Bu ta'rif aksincha, hech qanday bahs yo'qligini bildiradi."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A tenant is:","opts":["a person who owns several houses","a person who repairs old buildings","a person who sells land to builders","a person who pays rent to live in a place"],"ans":"D","why":{"A":"Uy egasi 'landlord' yoki 'owner' deyiladi.","B":"Bino ta'mirlovchi 'builder' deb ataladi.","C":"Yer sotuvchi 'land agent' deyiladi.","D":"'Tenant' ijarachi, ya'ni yashash uchun ijara to'lovchi degani."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["curious","interested","nosy","attentive"],"ans":"C","why":{"A":"'Curious' qiziquvchan degani va ijobiy baho beradi.","B":"'Interested' qiziqqan degani, bu ham neytral yoki ijobiy so'z.","C":"'Nosy' birovning ishiga burnini suqadigan degani bo'lib, salbiy ma'noga ega.","D":"'Attentive' diqqatli degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To announce that the reading hour has ended","To ask parents to donate children's books","To invite children to a storytelling competition","To find volunteers and explain the conditions"],"ans":"D","why":{"A":"Tadbirning tugashi haqida e'londa hech narsa aytilmagan.","B":"Kitob to'plash haqida e'londa gap yo'q.","C":"Musobaqa haqida e'londa so'z yuritilmagan.","D":"E'londa ko'ngillilar chaqirilgan va shartlar tushuntirilgan."},"block":["Read the text and answer questions 21-22.","VOLUNTEERS WANTED: CHILDREN'S READING HOUR","The town library is looking for volunteers to help with the children's reading hour on Saturday mornings. No experience is needed, and a short training session is held on the first Saturday of each month. Volunteers are asked to come at least twice a month so that the children see familiar faces. Anyone under sixteen must bring a signed form from a parent. Please leave your name at the front desk."]},{"no":22,"pts":"2.6","head":"Why must volunteers come at least twice a month?","text":"","opts":["So that the children see familiar faces","Because the training lasts two sessions","Because the library is short of staff","So that they can borrow extra books"],"ans":"A","why":{"A":"E'londa bolalar tanish yuzlarni ko'rishi uchun shunday talab qo'yilgani aytilgan.","B":"Mashg'ulot oyda bir marta o'tkaziladi, ikki marta emas.","C":"Xodimlar yetishmasligi haqida e'londa gap yo'q.","D":"Kitob olish imtiyozi haqida hech narsa yozilmagan."}},{"no":23,"pts":"2.6","head":"You hear a neighbour say: \"He visits us once in a blue moon.\" What does this mean?","text":"","opts":["He visits late in the evening","He visits without telling them first","He visits very rarely","He used to visit but has stopped"],"ans":"C","why":{"A":"Ibora kunning vaqti haqida hech narsa demaydi.","B":"Ogohlantirish haqida ibora gapirmaydi.","C":"'Once in a blue moon' iborasi juda kamdan-kam degani.","D":"Ibora tashriflar butunlay to'xtaganini bildirmaydi."}},{"no":24,"pts":"2.6","head":"You see this notice in a gallery: \"Photography is permitted without flash. Tripods are not allowed.\" What is the main message?","text":"","opts":["No photographs may be taken in the gallery","You may take photos, but without a flash or a tripod","Photographs are allowed only in certain rooms","You must ask the staff before taking a photo"],"ans":"B","why":{"A":"E'lon suratga olishni butunlay taqiqlamaydi.","B":"E'londa chaqnoqsiz suratga olish mumkinligi, shtativ esa taqiqlangani aytilgan.","C":"Xonalar bo'yicha ajratish haqida e'londa gap yo'q.","D":"Ruxsat so'rash talabi e'londa ko'rsatilmagan."}},{"no":25,"pts":"2.6","head":"How does a buyer get the deposit back?","text":"","opts":["By returning the empty bottle to a machine","By showing the receipt at the till","By collecting ten bottles at a time","By posting the bottles to the producer"],"ans":"A","why":{"A":"Birinchi xatboshida bo'sh shishani do'kondagi qurilmaga qaytarish orqali pul qaytarilishi aytilgan.","B":"Chek haqida matnda hech narsa yozilmagan.","C":"Shishalar soni haqida matnda shart qo'yilmagan.","D":"Pochta orqali yuborish haqida matnda gap yo'q."},"block":["Read the text and answer questions 25-27.","In several countries a small deposit is added to the price of a plastic bottle. The buyer gets the money back by returning the empty bottle to a machine in a shop. The idea is simple, and it is not new.","The effect on collection is striking. Countries with a deposit usually return more than nine bottles in ten. Those without one struggle to reach half. A bottle collected this way is also cleaner, and that matters because mixed waste is expensive to sort.","Shops were the loudest opponents at first. The machines take up space and need servicing, and the staff must deal with queues. Where the scheme has run for several years, shopkeepers now report that customers return the bottles while shopping and spend the refund in the shop."]},{"no":26,"pts":"2.6","head":"Why does it matter that the bottles are cleaner?","text":"","opts":["Clean bottles can be refilled at once","Sorting mixed waste is expensive","Shops refuse to accept dirty bottles","Clean bottles are worth a larger deposit"],"ans":"B","why":{"A":"Qayta to'ldirish haqida matnda hech narsa aytilmagan.","B":"Ikkinchi xatboshida aralash chiqindini ajratish qimmatga tushishi aytilgan.","C":"Do'konlarning rad etishi haqida matnda gap yo'q.","D":"Depozit miqdori tozalikka bog'liq emas."}},{"no":27,"pts":"2.6","head":"What do shopkeepers report after several years?","text":"","opts":["The machines break down less often","Customers spend the refund in the shop","Fewer customers come at busy hours","The scheme costs them nothing at all"],"ans":"B","why":{"A":"Qurilmalarning buzilishi haqida matnda hech narsa yozilmagan.","B":"Uchinchi xatboshida xaridorlar qaytgan pulni o'sha do'konda sarflashi aytilgan.","C":"Xaridorlar soni haqida matnda gap yo'q.","D":"Xarajat haqida bunday xulosa matnda chiqarilmagan."}},{"no":28,"pts":"2.6","head":"Why was typing notes once thought to be better?","text":"","opts":["A fuller record should help revision","Typed notes are easier to share","Typing is less tiring than writing","Students could record the lecture as well"],"ans":"A","why":{"A":"Birinchi xatboshida to'liqroq yozuv takrorlashga yordam berishi kerak deb hisoblangani aytilgan.","B":"Ulashish qulayligi haqida matnda hech narsa yozilmagan.","C":"Charchash haqida matnda gap yo'q.","D":"Ovoz yozish haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 28-30.","Students who type their notes write down more words than those who use a pen. For many years this was taken as an advantage, since a fuller record should mean better revision.","A series of studies suggested the opposite. Typing is fast enough to record a lecture almost word for word, and a student who does that stops choosing what matters. Writing by hand is slower, so the student has to summarise while listening.","The practical answer is not to ban laptops. Some lecturers now pause twice an hour and ask the students to write three sentences by hand about what they have just heard. The notes stay on the screen, but the thinking happens on paper."]},{"no":29,"pts":"2.6","head":"What does writing by hand force a student to do?","text":"","opts":["Write more quickly than usual","Ask more questions during the lecture","Revise the notes on the same day","Summarise the lecture while listening"],"ans":"D","why":{"A":"Aksincha, qo'lda yozish sekinroq ekani ta'kidlangan.","B":"Savol berish haqida matnda hech narsa yozilmagan.","C":"Takrorlash vaqti haqida matnda gap yo'q.","D":"Ikkinchi xatboshida qo'lda yozish tinglash asnosida xulosalashga majbur qilishi aytilgan."}},{"no":30,"pts":"2.6","head":"What do some lecturers now do?","text":"","opts":["They collect the laptops at the door","They pause and ask for a few handwritten sentences","They give out printed copies of the lecture","They shorten each lecture by half an hour"],"ans":"B","why":{"A":"Matnda noutbuklarni taqiqlamaslik kerakligi aytilgan.","B":"Uchinchi xatboshida o'qituvchilar to'xtab, qo'lda uchta gap yozishni so'rashi aytilgan.","C":"Chop etilgan nusxalar haqida matnda gap yo'q.","D":"Ma'ruza davomiyligi haqida matnda hech narsa yozilmagan."}}]},{"variant":3,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Seldom ____ a small museum ____ such a valuable painting.","opts":["has / acquiring","did / acquired","has / acquired","had / acquire"],"ans":"C","why":{"A":"'Has' dan keyin uchinchi shakl kerak, '-ing' shakli emas.","B":"'Did' dan keyin fe'lning birinchi shakli keladi, 'acquired' emas.","C":"'Seldom' gap boshida kelsa yordamchi fe'l egadan oldinga chiqadi va present perfect 'has acquired' bo'ladi.","D":"'Had' dan keyin uchinchi shakl kerak, 'acquire' esa birinchi shakl."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The village ____ without electricity for a week before the engineers ____ the fault.","opts":["had been / found","was / found","has been / found","was being / had found"],"ans":"A","why":{"A":"Avvalgi davomli holat past perfect 'had been', keyingi ish past simple 'found' bo'ladi.","B":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, qaysi ish avval bo'lgani ko'rinmaydi.","C":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","D":"Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the price had risen twice, the shop kept all its regular customers.","opts":["Despite","Although","Because","Nevertheless"],"ans":"B","why":{"A":"'Despite' dan keyin ot birikmasi keladi, bu yerda esa to'liq gap turibdi.","B":"'Although' to'liq gap bilan keladi va qarama-qarshilikni bildiradi.","C":"'Because' sababni bildiradi va gapning mantiqini teskari qiladi.","D":"'Nevertheless' kirish so'z bo'lib, ikki gapni bunday bog'lay olmaydi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was in the second half ____ the team finally found its rhythm.","opts":["what","which","where it","that"],"ans":"D","why":{"A":"'What' ta'kidlovchi gapni boshlay olmaydi.","B":"'Which' bunday qurilishda vaqt oldidan ishlatilmaydi.","C":"'Where it' ortiqcha olmosh qo'shadi va gapni buzadi.","D":"Vaqtni ta'kidlovchi bunday gap 'that' bilan to'ldiriladi."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the roof ____ last autumn, the ceiling ____ dry today.","opts":["was mended / would be","had been mended / would be","had been mended / would have been","is mended / will be"],"ans":"B","why":{"A":"'Was mended' bilan 'would be' o'tmishdagi amalga oshmagan ishni ko'rsatmaydi.","B":"O'tmishdagi ish va hozirgi natija aralash shart gap 'had been mended / would be' bilan beriladi.","C":"'Would have been' natijani o'tmishga olib ketadi, gapda esa 'today' aytilgan.","D":"Bu birinchi shart gap bo'lib, 'last autumn' bilan birga kelmaydi."}},{"no":6,"pts":"0.9","head":"Which option means that the speaker is almost certain about the past?","text":"","opts":["They must have missed the turning.","They may have missed the turning.","They should have missed the turning.","They might have missed the turning."],"ans":"A","why":{"A":"'Must have' so'zlovchining o'tmish haqidagi ishonchli xulosasini bildiradi.","B":"'May have' faqat ehtimolni bildiradi, ishonchli xulosani emas.","C":"'Should have' qilinmagan ish uchun tanbeh bildiradi.","D":"'Might have' ham faqa
