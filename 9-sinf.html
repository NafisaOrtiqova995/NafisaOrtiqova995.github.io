<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>9-sinf Olimpiada Trenajori</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
</head>
<body>
<style>
/* Layout: friendly exam shell - branded masthead, one question column, numbered rail.
   Palette taken from the channel logo: teal puzzle piece, orange puzzle piece. */
:root{
  --bg:#F4F8F8; --surface:#FFFFFF; --surface-2:#E9F1F2; --fg:#15262A; --muted:#577076;
  --line:#D5E3E5; --line-strong:#B6CCD0;
  --teal:#15808F; --teal-soft:#DDF0F2; --orange:#D2561A; --orange-soft:#FCEADF;
  --ok:#17795A; --ok-soft:#DFF3EC; --bad:#B23A2B; --bad-soft:#FCE7E3;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-q:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:5px}
.wrap{max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- start ---------- */
#start{padding-block:34px 56px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;
  box-shadow:0 1px 2px rgba(21,38,42,.05)}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:18px;padding:22px 18px}}
.logo{width:124px;height:124px;border-radius:16px;display:block;object-fit:cover;
  border:1px solid var(--line)}
@media (max-width:640px){.logo{width:104px;height:104px}}
.hero h1{font-family:var(--font-display);font-size:clamp(1.45rem,4.2vw,2.3rem);line-height:1.15;
  font-weight:700;letter-spacing:-.01em;color:var(--teal)}
.hero .sub{margin-top:10px;font-size:clamp(.95rem,2.2vw,1.05rem);color:var(--fg);
  border-left:3px solid var(--orange);padding-left:12px;max-width:60ch}
@media (max-width:640px){.hero .sub{border-left:0;border-top:3px solid var(--orange);
  padding-left:0;padding-top:10px;text-align:center}}
.hero .chan{margin-top:12px;font-size:.86rem;color:var(--muted)}
.hero .chan b{color:var(--fg)}
.specs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
@media (max-width:640px){.specs{justify-content:center}}
.spec{font-size:.78rem;background:var(--teal-soft);color:var(--fg);border-radius:999px;padding:4px 11px}
.spec b{color:var(--teal);font-weight:700}

.block{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
.mode{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;align-items:flex-start;transition:border-color .12s,background .12s}
.mode[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.mode .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-strong);margin-top:4px;flex:none}
.mode[aria-pressed="true"] .dot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--surface)}
.mode h3{font-size:1rem;font-weight:700}
.mode span.d{font-size:.85rem;color:var(--muted);display:block;margin-top:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
.vcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:border-color .12s,transform .12s,box-shadow .12s}
.vcard:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 4px 12px rgba(21,128,143,.14)}
.vcard b{font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1;color:var(--teal)}
.vcard span{font-size:.74rem;color:var(--muted)}
.vcard .resume{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:16px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel p{margin:0;font-size:.92rem;flex:1 1 220px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
  padding:10px 16px;font-size:.9rem;font-weight:600;transition:border-color .12s,filter .12s}
.btn:hover{border-color:var(--teal)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0C1416}}
.btn-primary:hover{filter:brightness(1.08)}

/* ---------- exam ---------- */
#exam{display:flex;flex-direction:column;min-height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:13px;padding-block:10px;max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .mini{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover}
.bar .vname{font-weight:700;font-size:.92rem;white-space:nowrap;line-height:1.2}
.bar .vname small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.clock{margin-left:auto;font-size:1.22rem;font-weight:700;padding:3px 11px;border-radius:9px;
  background:var(--surface-2)}
.clock.warn{background:var(--bad-soft);color:var(--bad)}
.prog{flex:1 1 80px;min-width:60px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .2s}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;
  font-size:.85rem;font-weight:600;flex:none}
@media (max-width:560px){
  .bar-in{gap:9px}
  .bar .mini{display:none}
  .bar .prog{display:none}
  .bar .vname{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .clock{font-size:1.05rem;padding:3px 8px}
  .icon-btn{padding:7px 10px;font-size:.8rem}
}

.cols{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;max-width:1140px;
  margin:0 auto;width:100%;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
@media (max-width:460px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1;color:var(--teal)}
.pts{font-size:.76rem;font-weight:700;color:var(--orange);background:var(--orange-soft);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.sect{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-left:auto;font-weight:700}
.passage{border:1px solid var(--line);border-left:4px solid var(--teal);background:var(--surface-2);
  border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:16px;font-family:var(--font-q);
  font-size:.98rem;line-height:1.64;max-height:46vh;overflow-y:auto}
.passage .plead{font-family:var(--font-ui);font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);font-weight:700;margin-bottom:8px}
.passage .ptitle{font-weight:600;letter-spacing:.03em}
.passage p{margin:0 0 .7em}.passage p:last-child{margin-bottom:0}
.qhead{font-weight:700;font-size:1rem;margin-bottom:6px}
.qtext{font-family:var(--font-q);font-size:1.1rem;line-height:1.6;margin-bottom:16px}
.qtext u{text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:9px}
.optwrap{display:flex;flex-direction:column}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-family:var(--font-q);font-size:1.03rem;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.opt .letter{font-family:var(--font-ui);font-size:.82rem;font-weight:700;flex:none;
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;color:var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"] .letter{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.why{font-size:.88rem;line-height:1.5;margin:5px 0 0 38px;padding-left:11px;
  border-left:2px solid var(--line-strong);color:var(--muted)}
.why.good{border-left-color:var(--ok);color:var(--fg)}
.why.bad{border-left-color:var(--bad)}
.why b{font-weight:700}
.why.good b{color:var(--ok)}.why.bad b{color:var(--bad)}
.verdict{margin-top:14px;border-radius:11px;padding:10px 14px;font-weight:700;font-size:.93rem}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.nav .btn{min-width:98px;text-align:center}
.nav .spacer{flex:1}

.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}
.rail h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  font-size:.83rem;font-weight:600;display:grid;place-items:center;padding:0}
.cell:hover{border-color:var(--teal)}
.cell.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.cell.cur{outline:2px solid var(--orange);outline-offset:1px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.railfoot{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:9px}
@media (max-width:880px){.rail{position:static;order:-1}.cells{grid-template-columns:repeat(10,1fr)}}

/* ---------- result ---------- */
#result{padding-block:34px 56px}
.score{display:flex;flex-wrap:wrap;gap:22px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:6px 6px 16px 16px;padding:22px}
.score .big{font-family:var(--font-display);font-size:clamp(2.5rem,9vw,3.5rem);font-weight:700;
  line-height:.95;color:var(--teal)}
.score .big small{font-size:.36em;color:var(--muted);font-weight:600}
.score .meta{display:flex;flex-direction:column;gap:3px}
.score .meta b{font-size:1.05rem}
.score .meta span{font-size:.87rem;color:var(--muted)}
.breakdown{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bd{border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:116px;background:var(--surface-2)}
.bd .k{font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bd .v{font-size:1.15rem;font-weight:700;margin-top:2px}
.filters{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;
  font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C1416}}
.rev{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 19px}
.rev-item.miss{border-left:4px solid var(--bad)}
.rev-item.hit{border-left:4px solid var(--ok)}
.rev-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.rev-head .n{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--teal)}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px}
.tag.hit{background:var(--ok-soft);color:var(--ok)}
.tag.miss{background:var(--bad-soft);color:var(--bad)}
.rev-q{font-family:var(--font-q);font-size:1.02rem;margin-bottom:10px}
.rev-q .h{font-family:var(--font-ui);font-weight:700;font-size:.95rem;display:block}
.endbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
footer{color:var(--muted);font-size:.82rem;padding-block:24px;border-top:1px solid var(--line);margin-top:36px}
footer b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="start" class="wrap"></div>
<div id="exam" hidden></div>
<div id="result" class="wrap" hidden></div>

<script>
const DATA = [{"variant":1,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Never ____ I ____ such a large crowd at the stadium.","opts":["have / saw","did / seen","have / seen","had / see"],"ans":"C","why":{"A":"'Have' dan keyin fe'lning uchinchi shakli kerak, 'saw' esa ikkinchi shakl.","B":"'Did' dan keyin fe'lning birinchi shakli keladi, 'seen' emas.","C":"Gap boshida 'Never' kelsa, yordamchi fe'l egadan oldinga o'tadi va present perfect 'have seen' shaklida bo'ladi.","D":"'Had' bilan birinchi shakl 'see' mos emas, uchinchi shakl 'seen' kerak."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The train ____ before we ____ the station.","opts":["left / reached","had left / reached","has left / reached","was leaving / had reached"],"ans":"B","why":{"A":"Ikkala fe'l ham oddiy o'tgan zamonda bo'lsa, qaysi ish avval bo'lgani ko'rinmay qoladi.","B":"Avvalroq bo'lgan ish past perfect 'had left', keyingisi past simple 'reached' bo'ladi.","C":"Present perfect 'has left' o'tgan zamon hikoyasida ishlatilmaydi.","D":"Bu yerda zamonlar teskari qo'yilgan: avval poyezd ketgan, keyin biz yetib kelganmiz."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the heavy rain, the football match continued.","opts":["Although","Because of","However","Despite"],"ans":"D","why":{"A":"'Although' dan keyin to'liq gap kerak, bu yerda esa ot birikmasi turibdi.","B":"'Because of' sababni bildiradi, bu esa gapning ma'nosini teskari qiladi.","C":"'However' ikki gapni bunday bog'lay olmaydi, u alohida gap boshida keladi.","D":"'Despite' dan keyin ot birikmasi keladi va qarama-qarshilikni bildiradi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was my sister ____ found the lost keys in the garden.","opts":["what","whose","which","who"],"ans":"D","why":{"A":"'What' bunday gapni boshlay olmaydi va odamga ishora qilmaydi.","B":"'Whose' egalikni bildiradi, bu yerda esa egalik ma'nosi yo'q.","C":"'Which' narsa va hayvonlarga ishora qiladi, odamga emas.","D":"Odam haqida gap ketganda bunday ta'kidlovchi gap 'who' bilan to'ldiriladi."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If I ____ more free time, I ____ you with the project.","opts":["have / will help","had / will help","have / would help","had / would help"],"ans":"D","why":{"A":"Bu birinchi shart gap bo'lib, hozir vaqt yo'qligini emas, real imkoniyatni bildiradi.","B":"'Had' bilan 'will help' aralashib ketgan, ikkalasi bir shart gapda kelmaydi.","C":"'Have' bilan 'would help' ham mos emas, zamonlar bir-biriga tushmayapti.","D":"Ikkinchi shart gapda 'if' dan keyin past simple, asosiy gapda 'would + fe'l' keladi."}},{"no":6,"pts":"0.9","head":"Which option means that something is not necessary?","text":"","opts":["You don't have to bring your own lunch.","You mustn't bring your own lunch.","You shouldn't bring your own lunch.","You can't bring your own lunch."],"ans":"A","why":{"A":"'Don't have to' majburiyat yo'qligini, ya'ni shart emasligini bildiradi.","B":"'Mustn't' taqiqni bildiradi, ya'ni olib kelish mumkin emas degani.","C":"'Shouldn't' maslahat bo'lib, olib kelmagan ma'qul degan ma'noni beradi.","D":"'Can't' imkoniyat yo'qligini yoki ruxsat berilmaganini bildiradi."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is important that every student ____ on time for the examination.","opts":["be","is","was","being"],"ans":"A","why":{"A":"'It is important that' dan keyin fe'lning o'zgarmas shakli, ya'ni 'be' qo'yiladi.","B":"'Is' oddiy hozirgi zamon bo'lib, bunday talab bildiruvchi gapda ishlatilmaydi.","C":"'Was' o'tgan zamon bo'lib, gapning hozirgi talab ma'nosiga mos kelmaydi.","D":"'Being' ravishdosh shakli bo'lib, bu o'rinda kesim bo'la olmaydi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"This exercise is ____ easier than the one we did yesterday.","opts":["very","too","much","so"],"ans":"C","why":{"A":"'Very' qiyosiy darajani kuchaytira olmaydi, u faqat oddiy sifat bilan keladi.","B":"'Too' ortiqcha darajani bildiradi va bu yerda ma'noni buzadi.","C":"Qiyosiy daraja 'much', 'far' yoki 'a lot' kabi so'zlar bilan kuchaytiriladi.","D":"'So' ham qiyosiy daraja oldidan kelmaydi, u oddiy sifat bilan ishlatiladi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The student's books was left on the desks.","The students' books were left on the desks.","The students books' were left on the desks.","The students's books were left on the desks."],"ans":"B","why":{"A":"Ega ko'plikda, kesim esa birlikda turibdi: 'was' emas, 'were' kerak.","B":"Ko'plik 's' bilan tugasa, apostrof 's' dan keyin qo'yiladi: students'.","C":"Apostrof noto'g'ri so'zga qo'yilgan, u 'students' so'ziga tegishli bo'lishi kerak.","D":"Ko'plikdan keyin yana 's' qo'shilmaydi, 'students's' shakli yo'q."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know where is the museum?","Can you tell me what time does the shop open?","Do you know where the museum is?","I wonder when will the bus arrive?"],"ans":"C","why":{"A":"Bu yerda 'is' egadan oldin turibdi, ya'ni to'g'ridan-to'g'ri savol tartibi saqlangan.","B":"'Does' yordamchi fe'li bilvosita savolda tushib qolishi kerak edi.","C":"Bilvosita savolda so'z tartibi darak gapdagidek qoladi: 'where the museum is'.","D":"'Will' egadan oldin kelgan, bilvosita savolda esa 'the bus will arrive' bo'ladi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"Could you ____ the light, please? The room is too bright.","opts":["turn off","turn on","turn up","turn into"],"ans":"A","why":{"A":"Xona juda yorug' bo'lgani uchun chiroqni o'chirish kerak: 'turn off'.","B":"'Turn on' yoqish ma'nosini beradi va gapning mantiqiga zid keladi.","C":"'Turn up' ovoz yoki haroratni kuchaytirishni bildiradi.","D":"'Turn into' boshqa narsaga aylanishni bildiradi va bu yerga mos emas."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["heavy rain","strong rain","big rain","thick rain"],"ans":"A","why":{"A":"Ingliz tilida kuchli yomg'ir 'heavy rain' deyiladi, bu barqaror birikma.","B":"'Strong' shamol bilan ishlatiladi: 'strong wind', yomg'ir bilan emas.","C":"'Big' yomg'ir bilan birikmaydi, u o'lcham haqida gapiradi.","D":"'Thick' tuman yoki suyuqlik haqida aytiladi, yomg'ir haqida emas."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The walls of the ~ancient~ castle were covered with moss.","opts":["historic","huge","empty","modern"],"ans":"D","why":{"A":"'Historic' ma'no jihatidan yaqin so'z, teskarisi emas.","B":"'Huge' o'lcham haqida gapiradi, qadimiylikka aloqasi yo'q.","C":"'Empty' bo'sh degani bo'lib, yoshni emas, ichidagini tasvirlaydi.","D":"'Ancient' juda qadimgi degani, uning teskarisi 'modern' ya'ni zamonaviy."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe the weather?","text":"","opts":["foggy","friendly","windy","cloudy"],"ans":"B","why":{"A":"'Foggy' tumanli degani va ob-havoni tasvirlaydi.","B":"'Friendly' do'stona degani bo'lib, odamni tasvirlaydi, ob-havoni emas.","C":"'Windy' shamolli degani, bu ham ob-havo so'zi.","D":"'Cloudy' bulutli degani va ob-havoga tegishli."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The concert hall was ~enormous~ and held five hundred people.","opts":["empty","huge","modern","narrow"],"ans":"B","why":{"A":"'Empty' bo'sh degani bo'lib, o'lcham haqida gapirmaydi.","B":"'Enormous' juda katta degani, shuning uchun 'huge' eng yaqin so'z.","C":"'Modern' yangi qurilganini bildiradi, kattalikni emas.","D":"'Narrow' tor degani va ma'no jihatidan teskari tomonga tortadi."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"She answered all the questions ____ and did not make a single mistake.","opts":["carefully","care","careful","careless"],"ans":"A","why":{"A":"Fe'lni izohlash uchun ravish kerak, 'carefully' ravish shaklidir.","B":"'Care' ot bo'lib, fe'lni izohlay olmaydi.","C":"'Careful' sifat bo'lib, otni izohlaydi, bu yerda esa fe'l turibdi.","D":"'Careless' sifat, qolaversa e'tiborsiz degani bo'lib, ma'noga ham zid."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"My younger brother is very interested ____ computer games.","opts":["on","at","for","in"],"ans":"D","why":{"A":"'Interested' so'zi 'on' predlogi bilan ishlatilmaydi.","B":"'At' 'good at' birikmasida uchraydi, 'interested' bilan emas.","C":"'For' 'famous for' kabi birikmalarda keladi, bu yerda mos emas.","D":"'Interested' har doim 'in' predlogi bilan keladi: interested in."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"Our guide was very ~patient~ with the younger children.","opts":["able to speak several foreign languages","able to wait calmly without getting angry","always arriving earlier than the others","happy to pay for other people"],"ans":"B","why":{"A":"Bu til bilish haqida bo'lib, 'patient' so'zining ma'nosi emas.","B":"'Patient' sabrli degani, ya'ni jahli chiqmay kuta oladigan.","C":"Vaqtida kelish 'punctual' so'zining ma'nosiga yaqin.","D":"Boshqalar uchun pul to'lash 'generous' so'ziga tegishli."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A dentist is:","opts":["a doctor who takes care of people's teeth","a person who builds houses","a person who sells medicine in a shop","a doctor who treats animals"],"ans":"A","why":{"A":"'Dentist' tish shifokori degani.","B":"Uy quruvchi 'builder' deyiladi.","C":"Dorixonada dori sotuvchi 'chemist' yoki 'pharmacist' deyiladi.","D":"Hayvonlarni davolovchi shifokor 'vet' deb ataladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["careful","lazy","hard-working","polite"],"ans":"B","why":{"A":"'Careful' ehtiyotkor degani va ijobiy baho beradi.","B":"'Lazy' dangasa degani bo'lib, salbiy baho bildiradi.","C":"'Hard-working' mehnatkash degani va maqtov ma'nosini beradi.","D":"'Polite' odobli degani, bu ham ijobiy so'z."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To say that the library will close next week","To ask students to give their old books","To tell students the rules of the library","To invite students to a reading competition"],"ans":"C","why":{"A":"E'londa kutubxona yopilishi haqida hech narsa aytilmagan.","B":"Kitob to'plash yoki sovg'a qilish haqida gap yo'q.","C":"E'londa ish vaqti, kitob olish tartibi va ichkaridagi qoidalar berilgan.","D":"Musobaqa yoki tanlov haqida e'londa so'z yuritilmagan."},"block":["Read the text and answer questions 21-22.","SCHOOL LIBRARY: RULES FOR THIS TERM","The library is open from eight in the morning until five in the afternoon. Students may borrow three books at a time, and books must be returned after two weeks. If you return a book late, you cannot borrow a new one for a week. Please do not eat or drink inside the library. The computers are free, but you must write your name in the book on the desk."]},{"no":22,"pts":"2.6","head":"What happens if a student returns a book late?","text":"","opts":["The student must pay for the book","The student must bring two new books","The student cannot borrow a book for a week","The student cannot enter the library again"],"ans":"C","why":{"A":"E'londa jarima yoki to'lov haqida hech narsa aytilmagan.","B":"Yangi kitob olib kelish talab qilinmaydi.","C":"E'londa kech qaytarilsa, bir hafta davomida yangi kitob olib bo'lmasligi yozilgan.","D":"Kutubxonaga kirish taqiqlanishi haqida gap yo'q."}},{"no":23,"pts":"2.6","head":"You hear a friend say: \"This homework is a piece of cake.\" What does she mean?","text":"","opts":["The homework is about cooking","The homework is too long","The homework is very easy","She has not started the homework yet"],"ans":"C","why":{"A":"Ibora ovqat haqida emas, u faqat ko'chma ma'noda ishlatiladi.","B":"Uzunlik haqida ibora hech narsa demaydi.","C":"'A piece of cake' iborasi juda oson degan ma'noni beradi.","D":"Ibora ishni boshlagan yoki boshlamaganini bildirmaydi."}},{"no":24,"pts":"2.6","head":"You see this sign in a park: \"Keep off the grass. Please use the paths.\" What is the main message?","text":"","opts":["The park is closed to visitors today","Children may play on the grass only","Walk on the paths and not on the grass","The paths are being repaired this week"],"ans":"C","why":{"A":"Belgida park yopilgani haqida hech narsa yozilmagan.","B":"Bolalar uchun alohida ruxsat berilmagan.","C":"Belgi maysaga chiqmaslikni va yo'lkadan yurishni so'ramoqda.","D":"Ta'mirlash ishlari haqida belgida gap yo'q."}},{"no":25,"pts":"2.6","head":"Why are bees important for our food?","text":"","opts":["They make honey for farmers to sell","They carry pollen from one flower to another","They keep other harmful insects away","They help the soil stay wet in summer"],"ans":"B","why":{"A":"Asal haqida matnda gapirilmagan, gap ovqat o'simliklari haqida.","B":"Birinchi xatboshida asalari gulma-gul uchib chang tashishi aytilgan.","C":"Boshqa hasharotlarni haydashi haqida matnda hech narsa yo'q.","D":"Tuproq namligi haqida matnda umuman so'z yuritilmagan."},"block":["Read the text and answer questions 25-27.","Bees are small, but they are very important for our food. When a bee flies from one flower to another, it carries pollen. Without this, many plants cannot make fruit or seeds. About one third of the food we eat depends on bees.","In recent years the number of bees has fallen in many countries. Farmers use chemicals to kill insects, and these chemicals kill bees too. Cities are also growing, so there are fewer wild flowers for bees to visit.","People can help in simple ways. A small garden with flowers gives bees food all summer. Some schools now keep their own beehives, and the pupils learn how a hive works. A few cities have planted flowers along the roads."]},{"no":26,"pts":"2.6","head":"What does the text say about the chemicals used by farmers?","text":"","opts":["They are more expensive than before","They are no longer allowed in cities","They make flowers grow more quickly","They kill bees as well as other insects"],"ans":"D","why":{"A":"Narx haqida matnda hech qanday ma'lumot berilmagan.","B":"Taqiqlash haqida matnda gap yo'q.","C":"Gullarni tez o'stirish emas, aksincha, zarar yetkazish haqida gapirilgan.","D":"Ikkinchi xatboshida bu kimyoviy moddalar asalarilarni ham o'ldirishi aytilgan."}},{"no":27,"pts":"2.6","head":"What do some schools do, according to the text?","text":"","opts":["They keep their own beehives","They sell honey to local shops","They plant flowers along the roads","They teach pupils to grow fruit trees"],"ans":"A","why":{"A":"Uchinchi xatboshida ba'zi maktablar o'z asalari uyasini saqlashi aytilgan.","B":"Asal sotish haqida matnda aytilmagan.","C":"Yo'l bo'ylab gul ekish maktablar emas, ba'zi shaharlar qilgan ish.","D":"Meva daraxtlari haqida matnda umuman gapirilmagan."}},{"no":28,"pts":"2.6","head":"Why do many students like watching films in English?","text":"","opts":["Hearing real speech helps them understand","Films are shorter than grammar lessons","Their teachers ask them to do it","Films are easier to find than books"],"ans":"A","why":{"A":"Birinchi xatboshida haqiqiy nutqni eshitish tushunishga yordam berishi aytilgan.","B":"Uzunlik haqida matnda taqqoslash qilinmagan.","C":"O'qituvchilar buyurgani emas, o'quvchilarning o'z tanlovi haqida gap ketyapti.","D":"Kitob topish qiyinligi haqida matnda hech narsa yo'q."},"block":["Read the text and answer questions 28-30.","Many students now watch films and series in English. They say it is easier than studying grammar from a book. Hearing real speech helps them understand how people really talk.","Teachers agree, but they add a warning. Watching alone is not enough. A student who never writes or speaks will understand a lot but say very little.","The best results come from mixing the two. Watch a short part of a film, write down five new words, and use them the next day. Many learners also put the subtitles in English and not in their own language."]},{"no":29,"pts":"2.6","head":"What warning do teachers give?","text":"","opts":["Films are often too fast for students","Students should watch only short films","Subtitles should always be turned off","Watching films alone is not enough"],"ans":"D","why":{"A":"Tezlik haqida o'qituvchilar hech narsa demagan.","B":"Qisqa film tanlash haqida ogohlantirish berilmagan.","C":"Subtitrlarni o'chirish emas, ingliz tilida qo'yish tavsiya etilgan.","D":"Ikkinchi xatboshida faqat tomosha qilishning o'zi yetarli emasligi aytilgan."}},{"no":30,"pts":"2.6","head":"What do many learners do with the subtitles?","text":"","opts":["They turn them off completely","They put them in English","They read them before the film","They write them down in a notebook"],"ans":"B","why":{"A":"Subtitrlarni butunlay o'chirish haqida matnda gap yo'q.","B":"Uchinchi xatboshida subtitrlarni ona tilida emas, ingliz tilida qo'yish aytilgan.","C":"Filmdan oldin o'qish haqida hech narsa aytilmagan.","D":"Daftarga ko'chirish emas, beshta yangi so'z yozish tavsiya qilingan."}}]},{"variant":2,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Hardly ____ we ____ the house when the storm began.","opts":["have / left","did / left","had / leave","had / left"],"ans":"D","why":{"A":"'Have' hozirgi zamonni bildiradi, gapning qolgan qismi esa o'tgan zamonda.","B":"'Did' dan keyin fe'lning birinchi shakli kerak, 'left' esa bu yerda mos emas.","C":"'Had' dan keyin uchinchi shakl kerak, 'leave' esa birinchi shakl.","D":"'Hardly' gap boshida kelganda 'had' egadan oldinga chiqadi va fe'l uchinchi shaklda bo'ladi."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"When we arrived at the hall, the concert ____ already ____.","opts":["had / started","has / started","was / starting","did / start"],"ans":"A","why":{"A":"Bizdan oldin bo'lgan ish past perfect, ya'ni 'had already started' shaklida beriladi.","B":"Present perfect o'tgan zamon hikoyasida 'already' bilan bunday ishlatilmaydi.","C":"'Was starting' davomli zamon bo'lib, ishning tugaganini ko'rsatmaydi.","D":"'Did start' ta'kid shakli bo'lib, 'already' bilan va bu ma'noda ishlatilmaydi."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ it was very cold outside, we went for a long walk.","opts":["Despite","Because of","Although","In spite of"],"ans":"C","why":{"A":"'Despite' dan keyin ot birikmasi keladi, bu yerda esa to'liq gap turibdi.","B":"'Because of' sababni bildiradi va gapning ma'nosini teskari qiladi.","C":"'Although' dan keyin to'liq gap keladi va qarama-qarshilikni bildiradi.","D":"'In spite of' ham ot birikmasini talab qiladi, gapni emas."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was in 2019 ____ my family moved to this city.","opts":["that","what","which","when it"],"ans":"A","why":{"A":"Vaqtni ta'kidlovchi bunday gap 'that' bilan to'ldiriladi.","B":"'What' bunday ta'kidlovchi gapni boshlay olmaydi.","C":"'Which' narsaga ishora qiladi, bu yerda esa vaqt ta'kidlanmoqda.","D":"'When it' ortiqcha olmosh qo'shadi va gapni buzadi."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If it ____ tomorrow, we ____ at home and watch a film.","opts":["rained / will stay","rains / will stay","rains / would stay","will rain / stay"],"ans":"B","why":{"A":"'Rained' o'tgan zamon shakli bo'lib, 'will stay' bilan bir gapda kelmaydi.","B":"Birinchi shart gapda 'if' dan keyin hozirgi zamon, asosiy gapda 'will' keladi.","C":"'Would stay' ikkinchi shart gapga tegishli, 'rains' esa birinchisiga.","D":"'If' dan keyin 'will' ishlatilmaydi, u faqat asosiy gapda keladi."}},{"no":6,"pts":"0.9","head":"Which option means that something was forbidden?","text":"","opts":["We didn't have to use the back door.","We weren't allowed to use the back door.","We didn't need to use the back door.","We couldn't find the back door."],"ans":"B","why":{"A":"'Didn't have to' majburiyat yo'qligini bildiradi, taqiqni emas.","B":"'Weren't allowed to' ruxsat berilmaganini, ya'ni taqiqni bildiradi.","C":"'Didn't need to' ham zarurat yo'qligini bildiradi, taqiq ma'nosi yo'q.","D":"'Couldn't find' topa olmaganini bildiradi, bu butunlay boshqa ma'no."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The teacher suggested that we ____ the test again next week.","opts":["take","takes","took","taking"],"ans":"A","why":{"A":"'Suggested that' dan keyin fe'lning o'zgarmas shakli, ya'ni 'take' qo'yiladi.","B":"'Takes' uchinchi shaxs shakli bo'lib, bunday gapda ishlatilmaydi.","C":"'Took' o'tgan zamon shakli bo'lib, bu qurilishga mos kelmaydi.","D":"'Taking' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second book was ____ more interesting than the first one.","opts":["far","very","so","too"],"ans":"A","why":{"A":"Qiyosiy daraja 'far', 'much' yoki 'a lot' bilan kuchaytiriladi.","B":"'Very' qiyosiy daraja oldidan kelmaydi.","C":"'So' ham qiyosiy darajani kuchaytira olmaydi.","D":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["My parents' house is near the river.","My parent's house are near the river.","My parents house's is near the river.","My parents's house is near the river."],"ans":"A","why":{"A":"Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: parents'.","B":"Ega birlikda, kesim esa ko'plikda: 'are' emas, 'is' bo'lishi kerak.","C":"Apostrof noto'g'ri so'zga qo'yilgan, u 'parents' so'ziga tegishli.","D":"Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me how much does this ticket cost?","Do you know where did he go after the lesson?","Could you tell me how much this ticket costs?","I wonder why is she always late?"],"ans":"C","why":{"A":"'Does' yordamchi fe'li bilvosita savolda tushib qolishi kerak.","B":"'Did' egadan oldin turibdi, bu to'g'ridan-to'g'ri savol tartibi.","C":"Bilvosita savolda so'z tartibi darak gapdagidek: 'how much this ticket costs'.","D":"'Is' egadan oldin kelgan, to'g'ri shakli 'why she is always late' bo'ladi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"Who will ____ the cat while you are away on holiday?","opts":["look for","look up","look out","look after"],"ans":"D","why":{"A":"'Look for' izlash degani, mushuk esa yo'qolmagan.","B":"'Look up' lug'atdan qidirishni bildiradi.","C":"'Look out' ehtiyot bo'l degan ogohlantirish.","D":"'Look after' kimnidir yoki nimanidir parvarish qilish ma'nosini beradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["do a mistake","make a mistake","take a mistake","have a mistake"],"ans":"B","why":{"A":"'Do' bu ot bilan birikmaydi.","B":"Ingliz tilida xato qilish 'make a mistake' deyiladi.","C":"'Take' ham 'mistake' so'zi bilan ishlatilmaydi.","D":"'Have a mistake' birikmasi ingliz tilida mavjud emas."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The water near the shore of the lake was quite ~shallow~.","opts":["clean","cold","calm","deep"],"ans":"D","why":{"A":"'Clean' tozalikni bildiradi, chuqurlikni emas.","B":"'Cold' harorat haqida, bu yerda esa chuqurlik haqida gap ketyapti.","C":"'Calm' suvning tinchligini bildiradi, teskari ma'no emas.","D":"'Shallow' sayoz degani, uning teskarisi 'deep' ya'ni chuqur."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a person?","text":"","opts":["generous","honest","cheerful","wooden"],"ans":"D","why":{"A":"'Generous' saxiy degani va odamni tasvirlaydi.","B":"'Honest' halol degani, bu ham odamga tegishli sifat.","C":"'Cheerful' quvnoq degani va odamni tasvirlaydi.","D":"'Wooden' yog'ochdan yasalgan degani bo'lib, buyumga tegishli."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The teacher gave us a ~difficult~ task for the weekend.","opts":["hard","short","useful","strange"],"ans":"A","why":{"A":"'Difficult' qiyin degani, 'hard' esa aynan shu ma'noni beradi.","B":"'Short' uzunlik haqida, qiyinlik haqida emas.","C":"'Useful' foydali degani bo'lib, boshqa ma'no beradi.","D":"'Strange' g'alati degani va qiyinlik bilan bog'liq emas."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The children were very ____ about the trip to the mountains.","opts":["excite","excitement","excited","exciting"],"ans":"C","why":{"A":"'Excite' fe'l bo'lib, 'were' dan keyin bu shaklda kelmaydi.","B":"'Excitement' ot bo'lib, bu o'rinda sifat kerak.","C":"Odamning holatini bildirish uchun 'excited' shakli ishlatiladi.","D":"'Exciting' narsaning o'zini tasvirlaydi, odamning his-tuyg'usini emas."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"My sister is very good ____ drawing animals and birds.","opts":["in","at","to","about"],"ans":"B","why":{"A":"'Good' sifati 'in' predlogi bilan ishlatilmaydi.","B":"'Good at' barqaror birikma bo'lib, biror ishni uddalashni bildiradi.","C":"'To' bu sifat bilan birikmaydi.","D":"'About' fikr yoki mavzuni bildiradi, mahoratni emas."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The shop was very ~crowded~ on Saturday morning.","opts":["closed for repairs","much more expensive than usual","difficult to find","full of people"],"ans":"D","why":{"A":"Ta'mirlash uchun yopilish 'closed' so'ziga tegishli.","B":"Qimmatlik 'expensive' so'zining ma'nosi.","C":"Topish qiyinligi 'crowded' so'zi bilan bog'liq emas.","D":"'Crowded' odam gavjum degani."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A librarian is:","opts":["a person who writes books","a person who works in a library","a person who sells newspapers","a person who prints books"],"ans":"B","why":{"A":"Kitob yozuvchi 'writer' yoki 'author' deyiladi.","B":"'Librarian' kutubxonachi degani.","C":"Gazeta sotuvchi 'newsagent' deb ataladi.","D":"Kitob chop etuvchi 'printer' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["brave","rude","kind","friendly"],"ans":"B","why":{"A":"'Brave' jasur degani va ijobiy baho beradi.","B":"'Rude' qo'pol degani bo'lib, salbiy ma'noga ega.","C":"'Kind' mehribon degani, bu ham ijobiy so'z.","D":"'Friendly' do'stona degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To say that the trip has been cancelled","To ask parents to drive the pupils","To give information about the school trip","To invite pupils to join the art club"],"ans":"C","why":{"A":"Sayohat bekor qilingani haqida e'londa hech narsa yo'q.","B":"Ota-onalardan mashina so'ralmagan, avtobus beriladi.","C":"E'londa sana, vaqt, narx va olib kelish kerak bo'lgan narsalar berilgan.","D":"To'garak haqida e'londa umuman so'z yuritilmagan."},"block":["Read the text and answer questions 21-22.","SCHOOL TRIP TO THE CITY MUSEUM","The trip will take place on Friday. The bus leaves from the school gate at nine o'clock and returns at four. The ticket costs five thousand so'm, and the money must be given to your class teacher before Wednesday. Bring a packed lunch, because there is no cafe inside the museum. Please do not bring a camera, as photographs are not allowed in the halls."]},{"no":22,"pts":"2.6","head":"What must the pupils bring with them?","text":"","opts":["A camera for the photographs","A letter from their parents","A notebook for the guide's talk","Food for the middle of the day"],"ans":"D","why":{"A":"E'londa fotosurat olish taqiqlangani aytilgan.","B":"Ota-ona xati haqida e'londa hech narsa yozilmagan.","C":"Daftar olib kelish talab qilinmagan.","D":"Muzeyda oshxona yo'qligi uchun o'zi bilan tushlik olib kelish kerak."}},{"no":23,"pts":"2.6","head":"You hear a friend say: \"I am all ears.\" What does she mean?","text":"","opts":["She is ready to listen carefully","She cannot hear you very well","She has a problem with her ears","She does not want to talk about it"],"ans":"A","why":{"A":"'All ears' iborasi diqqat bilan tinglashga tayyorman degani.","B":"Ibora eshitish qiyinligini bildirmaydi.","C":"Gap sog'liq haqida emas, ibora ko'chma ma'noda ishlatiladi.","D":"Ibora aksincha, suhbatga qiziqishni bildiradi."}},{"no":24,"pts":"2.6","head":"You see this notice in a theatre: \"Please switch off your mobile phones during the performance.\" What is the main message?","text":"","opts":["Phones must be left at the entrance","Phones may be used only in the interval","Phones must be turned off while the play is on","Photographs with phones are not allowed"],"ans":"C","why":{"A":"Telefonni kirish joyida qoldirish haqida hech narsa yozilmagan.","B":"Tanaffus haqida e'londa gap yo'q.","C":"E'londa spektakl davomida telefonni o'chirish so'ralmoqda.","D":"Fotosurat emas, telefonning o'zi haqida gapirilmoqda."}},{"no":25,"pts":"2.6","head":"What do parents say about the roads?","text":"","opts":["They are too narrow for school buses","They are busier and less safe than before","They are repaired too slowly by the town","They are closed every morning near schools"],"ans":"B","why":{"A":"Yo'lning torligi haqida matnda gap yo'q.","B":"Birinchi xatboshida ota-onalar yo'llar avvalgidan band va xavfliroq deyishi aytilgan.","C":"Ta'mirlash tezligi haqida hech narsa aytilmagan.","D":"Yo'lni yopish ba'zi maktablarning qarori, ota-onalarning gapi emas."},"block":["Read the text and answer questions 25-27.","In many towns, fewer children walk to school than twenty years ago. Most of them are driven by car, even when the school is close to their home. Parents say that the roads are busier and less safe than before.","This creates a circle that is hard to break. More cars near the school gate make the road even busier, and busier roads make more parents drive. Some schools now close the street outside for half an hour in the morning.","The results are easy to see. Where the street is closed, more families walk, and teachers report that the children arrive calmer and more awake. The idea costs almost nothing, but it needs the agreement of the people who live in the street."]},{"no":26,"pts":"2.6","head":"What do some schools do now?","text":"","opts":["They start lessons half an hour later","They give prizes to pupils who walk","They close the street outside in the morning","They ask parents to park further away"],"ans":"C","why":{"A":"Darsni kechroq boshlash haqida matnda gap yo'q.","B":"Sovrin berish haqida matnda hech narsa aytilmagan.","C":"Ikkinchi xatboshida ba'zi maktablar ertalab ko'chani yarim soatga yopishi aytilgan.","D":"Uzoqroqqa to'xtash haqida ham matnda ma'lumot yo'q."}},{"no":27,"pts":"2.6","head":"What do teachers report about the children?","text":"","opts":["They are often late for the first lesson","They arrive calmer and more awake","They bring fewer heavy bags to school","They prefer to come by car in winter"],"ans":"B","why":{"A":"Kechikish haqida matnda hech narsa yo'q.","B":"Uchinchi xatboshida bolalar tinchroq va tetikroq kelishi aytilgan.","C":"Sumkalar haqida matnda umuman gapirilmagan.","D":"Qish haqida matnda hech qanday ma'lumot berilmagan."}},{"no":28,"pts":"2.6","head":"Why do many customers like second-hand shops?","text":"","opts":["The clothes are always new in style","The shops are open later than others","They find something nobody else is wearing","They can order any size they want"],"ans":"C","why":{"A":"Kiyimlar yangi emas, ishlatilgan bo'ladi.","B":"Ish vaqti haqida matnda gap yo'q.","C":"Birinchi xatboshida xaridorlar boshqa hech kimda yo'q narsa topishdan zavqlanishi aytilgan.","D":"Aksincha, kerakli o'lchamni buyurtma qilib bo'lmaydi."},"block":["Read d does NOT describe food?","text":"","opts":["salty","sweet","spicy","noisy"],"ans":"D","why":{"A":"'Salty' sho'r degani va taomni tasvirlaydi.","B":"'Sweet' shirin degani, bu ham ta'm bildiradi.","C":"'Spicy' achchiq ziravorli degani va taomga tegishli.","D":"'Noisy' shovqinli degani bo'lib, taomga nisbatan ishlatilmaydi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The test was ~simple~ and everybody finished early.","opts":["easy","long","important","boring"],"ans":"A","why":{"A":"'Simple' oson degani, 'easy' esa aynan shu ma'noni beradi.","B":"'Long' uzunlik haqida, qiyinlik haqida emas.","C":"'Important' muhimlikni bildiradi.","D":"'Boring' zerikarli degani va osonlik bilan bog'liq emas."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"He is one of the most ____ students in our class.","opts":["success","successful","succeed","successfully"],"ans":"B","why":{"A":"'Success' ot bo'lib, otni izohlay olmaydi.","B":"Otni izohlash uchun sifat kerak, 'successful' sifat shaklidir.","C":"'Succeed' fe'l bo'lib, bu o'rinda kelmaydi.","D":"'Successfully' ravish bo'lib, fe'lni izohlaydi, otni emas."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"We were waiting ____ the bus near the park for twenty minutes.","opts":["for","to","at","on"],"ans":"A","why":{"A":"'Wait for' barqaror birikma bo'lib, kutilayotgan narsani ko'rsatadi.","B":"'Wait' fe'li 'to' predlogi bilan ishlatilmaydi.","C":"'At' joyni bildiradi, kutilayotgan narsani emas.","D":"'On' bu fe'l bilan birikmaydi."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The room was completely ~empty~ when we came in.","opts":["with nothing and nobody inside","very warm and comfortable","full of old furniture","painted in bright colours"],"ans":"A","why":{"A":"'Empty' bo'sh degani, ya'ni ichida hech narsa va hech kim yo'q.","B":"Issiqlik va qulaylik 'cosy' so'ziga tegishli.","C":"Bu ta'rif 'empty' so ny visitors in a single day.","opts":["has / had","has / have","did / had","had / having"],"ans":"A","why":{"A":"'Seldom' gap boshida kelsa 'has' egadan oldinga chiqadi va fe'l uchinchi shaklda bo'ladi.","B":"'Has' dan keyin uchinchi shakl kerak, 'have' esa birinchi shakl.","C":"'Did' dan keyin birinchi shakl keladi, 'had' emas.","D":"'Had' bilan 'having' ravishdoshi mos kelmaydi."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The match ____ already ____ when we turned on the television.","opts":["has / begun","had / begun","was / beginning","did / begin"],"ans":"B","why":{"A":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","B":"Bizdan oldin bo'lgan ish past perfect, ya'ni 'had already begun' bo'ladi.","C":"'Was beginning' davomli zamon bo'lib, ishning boshlanib bo'lganini ko'rsatmaydi.","D":"'Did begin' ta'kid shakli bo'lib, 'already' bilan bu ma'noda kelmaydi."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ working all night, they did not finish the project in time.","opts":["Despite","Although","Because of","So"],"ans":"A","why":{"A":"'Despite' dan keyin ot yoki -ing shakli keladi va qarama-qarshilikni bildiradi.","B":"'Although' to'liq gapni talab qiladi, bu yerda esa fe'lning -ing shakli turibdi.","C":"'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.","D":"'So' natijani bildiradi va bu yerda ma'no buziladi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the rain ____ spoiled our picnic by the river.","opts":["what","who","that","where"],"ans":"C","why":{"A":"'What' ta'kidlovchi gapni boshlay olmaydi.","B":"'Who' faqat odamga ishora qiladi, yomg'irga emas.","C":"Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi.","D":"'Where' joyga ishora qiladi, sababga emas."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If we ____ earlier, we ____ the last train.","opts":["left / would catch","leave / will catch","had left / would have caught","had left / wou ","written in two different languages","difficult to find on the box"],"ans":"B","why":{"A":"Harflarning mayda bo'lishi butunlay boshqa ma'no.","B":"'Clear' tushunarli degani.","C":"Ikki tilda yozilgani bu so'zning ma'nosi emas.","D":"Topish qiyinligi 'clear' so'zi bilan bog'liq emas."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A journalist is:","opts":["a person who takes care of a garden","a person who teaches at a university","a person who writes for newspapers","a person who keeps money safe in a bank"],"ans":"C","why":{"A":"Bog'bon 'gardener' deyiladi.","B":"Universitet o'qituvchisi 'lecturer' deb ataladi.","C":"'Journalist' jurnalist, ya'ni gazeta uchun yozuvchi degani.","D":"Bankdagi xodim 'cashier' yoki 'banker' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["cheerful","lively","calm","gloomy"],"ans":"D","why":{"A":"'Cheerful' quvnoq degani va ijobiy baho beradi.","B":"'Lively' jonli degani, bu ham ijobiy so'z.","C":"'Calm' xotirjam degani va yoqimli ma'no beradi.","D":"'Gloomy' ma'yus degani bo'lib, salbiy ma'noga ega."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To announce the results of Sports Day","To ask parents to bring food and drinks","To say that Sports Day will not take place","To give the arrangements for Sports Day"],"ans":"D","why":{"A":"Natijalar haqida e'londa hech narsa aytilmagan.","B":"Ota-onalardan ovqat so'ralmagan, ular shunchaki taklif qilingan.","C":"E'lon aksincha, kun o'tkazilishini bildiradi.","D":"E'londa sana, kiyim, ro'yxatga olish va yomg'ir holati tushuntirilgan."},"block":["Read the text and answer questions 21-22.","SPORTS DAY","Sports Day will be held on the last Friday of May on the school field. Pupils should come in sports clothes and bring a hat and a bottle of water. Each class will take part in four events, and the names must be given to the PE teacher by 15 May. Parents are welcome from ten o'clock. If sh sharoiti haqida matnda gap yo'q.","D":"Hayvonlarga berish haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 25-27.","A large amount of the food bought in cities is thrown away, and bread is at the top of the list. Families buy more than they need, and half a loaf is often left at the end of the week.","Shops play a part too. A shelf full of fresh bread sells better than an empty one, so bakers make more than they expect to sell. What is left at closing time cannot be sold the next day.","Some simple answers are working. Several bakeries now sell the last loaves cheaply in the evening, and a few apps tell customers where to find them. At home, bread that is too dry for sandwiches is still good for toast."]},{"no":26,"pts":"2.6","head":"Why do bakers make more bread than they sell?","text":"","opts":["A full shelf sells better than an empty one","Bread is cheaper to make in large amounts","They must follow the rules of the city","They sell the rest to other shops"],"ans":"A","why":{"A":"Ikkinchi xatboshida to'la javon bo'shiga qaraganda yaxshi sotilishi aytilgan.","B":"Ishlab chiqarish narxi haqida matnda gap yo'q.","C":"Shahar qoidalari haqida matnda hech narsa yozilmagan.","D":"Boshqa do'konlarga sotish haqida ma'lumot berilmagan."}},{"no":27,"pts":"2.6","head":"What do several bakeries do in the evening?","text":"","opts":["They give the bread to the staff","They freeze the bread until the morning","They close two hours earlier than before","They sell the last loaves at a low price"],"ans":"D","why":{"A":"Xodimlarga berish haqida matnda gap yo'q.","B":"Muzlatish haqida matnda hech narsa yozilmagan.","C":"Ish vaqti haqida matnda ma'lumot berilmagan.","D":"Uchinchi xatboshida kechqurun oxirgi nonlar arzon sotilishi aytilgan."}},{"no":28,"pts":"2.6","head":"What did teachers find out about their pupils?","text":"","opts":["Most of them did not want cooking lessons","Many of them could not prepare a simple meal","They preferred cooking to writing lessons","They already cooked at home every day"],"ans":"B","why":{"A":"O'quvchilarning xohishi haqida matnda gap yo'q.","B":"Birinchi xatboshida ko'p o'quvchi oddiy ovqat tayyorlay olmasligi aniqlangani aytilgan.","C":"Bu ikkinchi xatboshidagi boshqa fikr bilan aralashtirilmoqda.","D":"Uyda ovqat pishirish haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 28-30.","Cooking lessons disappeared from many schools twenty years ago, and they are now coming back. Teachers found that a surprising number of pupils could not prepare a simple meal.","The lessons are not only about food. Pupils weigh and measure, read instructions in the right order and work in a team. Several teachers say that pupils who dislike writing enjoy these lessons most.","Money is the main difficulty. A cooking room costs far more than an ordinary classroom, and the ingredients have to be bought every week. Some schools solve this by cooking one dish for a whole group rather than one for each pupil."]},{"no":29,"pts":"2.6","head":"What else do pupils learn in these lessons?","text":"","opts":["How to grow vegetables in a school garden","How to sell the food they have made","How to write about food in English","How to weigh, measure and work in a team"],"ans":"D","why":{"A":"Sabzavot yetishtirish haqida matnda gap yo'q.","B":"Sotish haqida matnda hech narsa yozilmagan.","C":"Yozish bu darslarning mazmuni emas, aksincha, yozishni yoqtirmaganlar haqida gapirilgan.","D":"Ikkinchi xatboshida tortish, o'lchash va jamoada ishlash aytilgan."}},{"no":30,"pts":"2.6","head":"How do some schools reduce the cost?","text":"","opts":["They ask pupils to bring the ingredients","They cook one dish for a whole group","They hold the lessons only twice a year","They use the school kitchen after lessons"],"ans":"B","why":{"A":"O'quvchilardan mahsulot so'rash haqida matnda gap yo'q.","B":"Uchinchi xatboshida butun guruh uchun bitta taom pishirilishi aytilgan.","C":"Darslar soni haqida matnda hech narsa yozilmagan.","D":"Maktab oshxonasidan foydalanish haqida ma'lumot berilmagan."}}]},{"variant":5,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Only after the lesson ____ I ____ my mistake.","opts":["did / noticed","did / notice","have / noticing","had / notice"],"ans":"B","why":{"A":"'Did' dan keyin o'tgan zamon shakli 'noticed' ishlatilmaydi.","B":"'Only after' bilan boshlangan gapdan keyin 'did' egadan oldinga chiqadi va fe'l birinchi shaklda qoladi.","C":"'Have' bilan 'noticing' ravishdoshi mos kelmaydi.","D":"'Had' dan keyin uchinchi shakl kerak, 'notice' esa birinchi shakl."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"They ____ in the village for ten years before they ____ to the capital.","opts":["lived / moved","had lived / moved","have lived / moved","were living / had moved"],"ans":"B","why":{"A":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.","B":"Avvalgi uzoq davom etgan ish past perfect 'had lived', keyingisi past simple 'moved' bo'ladi.","C":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","D":"Bu yerda zamonlar teskari qo'yilgan va voqealar tartibi buziladi."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ her illness, she came to school and took the examination.","opts":["Although","Because of","In spite of","Therefore"],"ans":"C","why":{"A":"'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.","B":"'Because of' sababni bildiradi va gapning ma'nosini teskari qiladi.","C":"'In spite of' dan keyin ot birikmasi keladi va qarama-qarshilikni bildiradi.","D":"'Therefore' natijani bildiruvchi kirish so'z bo'lib, gapni bunday bog'lamaydi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was in this house ____ my father was born.","opts":["that","what","which","where it"],"ans":"A","why":{"A":"Joyni ta'kidlovchi bunday gap 'that' bilan to'ldiriladi.","B":"'What' ta'kidlovchi gapni boshlay olmaydi.","C":"'Which' bunday qurilishda joy oldidan ishlatilmaydi.","D":"'Where it' ortiqcha olmosh qo'shadi va gapni buzadi."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the weather ____ better, we ____ a picnic last Sunday.","opts":["was / would have","is / will have","had been / would have","had been / would have had"],"ans":"D","why":{"A":"'Was' bilan 'would have' o'tgan yakshanba haqidagi afsusni bildirmaydi.","B":"Bu birinchi shart gap bo'lib, 'last Sunday' bilan birga kelmaydi.","C":"'Would have' dan keyin uchinchi shakl kerak, bu yerda esa u tushib qolgan.","D":"O'tmishdagi amalga oshmagan ish uchinchi shart gap 'had been / would have had' bilan beriladi."}},{"no":6,"pts":"0.9","head":"Which option means that something was not necessary but was done?","text":"","opts":["She didn't need to buy a ticket.","She mustn't buy a ticket.","She couldn't buy a ticket.","She needn't have bought a ticket."],"ans":"D","why":{"A":"'Didn't need to' shart emasligini bildiradi, lekin ish bajarilgani ko'rinmaydi.","B":"'Mustn't' taqiqni bildiradi.","C":"'Couldn't' imkoniyat bo'lmaganini bildiradi.","D":"'Needn't have bought' ish bajarilgan, lekin kerak emas edi degan ma'noni beradi."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The manager insisted that the room ____ before the guests arrived.","opts":["is cleaned","be cleaned","was cleaned","cleaning"],"ans":"B","why":{"A":"'Is cleaned' oddiy hozirgi zamon bo'lib, bu qurilishda ishlatilmaydi.","B":"'Insisted that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be cleaned' bo'ladi.","C":"'Was cleaned' oddiy o'tgan zamon bo'lib, talab ma'nosini bermaydi.","D":"'Cleaning' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"This new road is ____ safer than the old one.","opts":["very","too","far","absolutely"],"ans":"C","why":{"A":"'Very' qiyosiy daraja oldidan kelmaydi.","B":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.","C":"Qiyosiy daraja 'far', 'much' yoki 'a lot' bilan kuchaytiriladi.","D":"'Absolutely' qiyosiy daraja bilan emas, kuchli sifatlar bilan ishlatiladi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The teacher's room are at the end of the corridor.","The teachers' room is at the end of the corridor.","The teachers room's is at the end of the corridor.","The teachers's room is at the end of the corridor."],"ans":"B","why":{"A":"Ega birlikda, kesim esa ko'plikda berilgan, 'is' bo'lishi kerak.","B":"Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: teachers'.","C":"Apostrof noto'g'ri so'zga qo'yilgan.","D":"Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know why is the shop closed today?","Do you know why the shop is closed today?","Could you tell me when does the match begin?","I wonder how much will these books cost?"],"ans":"B","why":{"A":"'Is' egadan oldin turibdi, bu to'g'ridan-to'g'ri savol tartibi.","B":"Bilvosita savolda so'z tartibi darak gapdagidek: 'why the shop is closed'.","C":"'Does' yordamchi fe'li bilvosita savolda tushib qolishi kerak.","D":"'Will' egadan oldin kelgan, to'g'ri shakli 'these books will cost' bo'ladi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"Please ____ your shoes before you come into the house.","opts":["take off","take up","take in","take away"],"ans":"A","why":{"A":"Kiyim yoki poyabzalni yechish 'take off' iborasi bilan beriladi.","B":"'Take up' biror mashg'ulotni boshlashni bildiradi.","C":"'Take in' ma'lumotni qabul qilishni bildiradi.","D":"'Take away' olib ketishni bildiradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["make friends","do friends","take friends","build friends"],"ans":"A","why":{"A":"Ingliz tilida do'st orttirish 'make friends' deyiladi.","B":"'Do' bu ot bilan birikmaydi.","C":"'Take friends' birikmasi bu ma'noda ishlatilmaydi.","D":"'Build' bino va inshootlar haqida aytiladi, do'stlar haqida emas."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The box was surprisingly ~light~ for its size.","opts":["small","empty","hard","heavy"],"ans":"D","why":{"A":"'Small' o'lcham haqida gapiradi, og'irlik haqida emas.","B":"'Empty' ichidagini bildiradi, teskari ma'no bermaydi.","C":"'Hard' qattiqlikni bildiradi va og'irlikka aloqasi yo'q.","D":"'Light' yengil degani, uning teskarisi 'heavy' ya'ni og'ir."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a book?","text":"","opts":["exciting","boring","useful","salty"],"ans":"D","why":{"A":"'Exciting' qiziqarli degani va kitobni tasvirlaydi.","B":"'Boring' zerikarli degani, bu ham kitobga tegishli.","C":"'Useful' foydali degani va kitob haqida aytiladi.","D":"'Salty' sho'r degani bo'lib, faqat taom haqida ishlatiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The film was ~awful~ and we left before the end.","opts":["long","terrible","funny","popular"],"ans":"B","why":{"A":"'Long' uzunlikni bildiradi, sifatni emas.","B":"'Awful' juda yomon degani, 'terrible' esa aynan shu ma'noni beradi.","C":"'Funny' kulgili degani va teskari taassurot beradi.","D":"'Popular' mashhurlikni bildiradi, bu yerga mos emas."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The museum has a very large ____ of old coins.","opts":["collect","collection","collected","collecting"],"ans":"B","why":{"A":"'Collect' fe'l bo'lib, bu o'rinda kelmaydi.","B":"'A very large' dan keyin ot kerak, 'collection' esa ot shaklidir.","C":"'Collected' sifatdosh bo'lib, 'a large' dan keyin ot talab qilinadi.","D":"'Collecting' ravishdosh bo'lib, bu gapda o'rinsiz."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"This dictionary belongs ____ my elder sister.","opts":["to","for","with","at"],"ans":"A","why":{"A":"'Belong to' barqaror birikma bo'lib, egalikni bildiradi.","B":"'Belong' fe'li 'for' predlogi bilan ishlatilmaydi.","C":"'With' bu fe'l bilan birikmaydi.","D":"'At' joyni bildiradi, egalikni emas."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The path through the forest was very ~muddy~ after the rain.","opts":["covered with soft wet earth","blocked by fallen trees","very narrow and steep","marked with yellow signs"],"ans":"A","why":{"A":"'Muddy' loyli degani, ya'ni yumshoq ho'l tuproq bilan qoplangan.","B":"Daraxtlar bilan to'silgani butunlay boshqa ma'no.","C":"Torlik va tiklik 'steep' so'ziga tegishli.","D":"Belgilar haqidagi ta'rif bu so'zga aloqador emas."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A mechanic is:","opts":["a person who repairs machines and cars","a person who designs new buildings","a person who sells fruit and vegetables","a person who looks after sick people"],"ans":"A","why":{"A":"'Mechanic' mexanik, ya'ni mashina va asboblarni ta'mirlovchi degani.","B":"Bino loyihalovchi 'architect' deyiladi.","C":"Meva-sabzavot sotuvchi 'greengrocer' deb ataladi.","D":"Bemorlarga qarovchi 'nurse' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["careful","careless","neat","polite"],"ans":"B","why":{"A":"'Careful' ehtiyotkor degani va ijobiy baho beradi.","B":"'Careless' e'tiborsiz degani bo'lib, salbiy ma'noga ega.","C":"'Neat' ozoda degani, bu ham ijobiy so'z.","D":"'Polite' odobli degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To say that the school office has moved","To ask pupils to give clothes to charity","To warn pupils not to bring money to school","To explain what happens to things that are lost"],"ans":"D","why":{"A":"Ofisning ko'chishi haqida e'londa hech narsa aytilmagan.","B":"Kiyim topshirish so'ralmagan, faqat egasiz qolgani haqida gapirilgan.","C":"Pul olib kelmaslik haqida e'londa ogohlantirish yo'q.","D":"E'londa topilgan narsalar qayerga borishi, qancha saqlanishi va qanday olinishi yozilgan."},"block":["Read the text and answer questions 21-22.","LOST PROPERTY","Anything found in the school is taken to the office, and items are kept there for one month. To collect something, you must describe it before it is shown to you. Money and keys are kept in the safe and can only be collected by a parent. At the end of each term, clothes that nobody has claimed are given to charity."]},{"no":22,"pts":"2.6","head":"How can a pupil collect a lost item?","text":"","opts":["By showing a letter from a teacher","By paying a small sum at the office","By coming with another pupil","By describing it before it is shown"],"ans":"D","why":{"A":"O'qituvchi xati haqida e'londa gap yo'q.","B":"To'lov haqida e'londa hech narsa yozilmagan.","C":"Boshqa o'quvchi bilan kelish talab qilinmagan.","D":"E'londa narsa ko'rsatilishidan oldin uni tasvirlab berish kerakligi aytilgan."}},{"no":23,"pts":"2.6","head":"You hear a classmate say: \"I think we are on the same page.\" What does he mean?","text":"","opts":["They understand the situation in the same way","They are reading the same book","They have finished the same exercise","They will work together tomorrow"],"ans":"A","why":{"A":"'On the same page' iborasi bir xil tushunmoqdamiz degani.","B":"Ibora kitob o'qish bilan bog'liq emas, u ko'chma ma'noda ishlatiladi.","C":"Mashq haqida ibora hech narsa demaydi.","D":"Birga ishlash haqida ibora gapirmaydi."}},{"no":24,"pts":"2.6","head":"You see this notice in a cafe: \"Free water for customers. Please ask at the counter.\" What is the main message?","text":"","opts":["Water is sold more cheaply than other drinks","Only customers with food may have water","Water is free, but you must ask for it at the counter","Water is brought to every table automatically"],"ans":"C","why":{"A":"E'londa suv sotilishi emas, bepul ekani aytilgan.","B":"Ovqat haqida e'londa shart qo'yilmagan.","C":"E'londa suv bepul, lekin peshtaxtadan so'rash kerakligi yozilgan.","D":"E'lon aksincha, o'zingiz so'rashingiz kerakligini bildiradi."}},{"no":25,"pts":"2.6","head":"What do most of the collected bicycles need?","text":"","opts":["A completely new frame","A new set of lights and a bell","Only a new tyre or a chain","Several weeks of careful work"],"ans":"C","why":{"A":"Ramka haqida matnda hech narsa yozilmagan.","B":"Chiroq va qo'ng'iroq haqida matnda gap yo'q.","C":"Birinchi xatboshida ko'pchiligiga faqat yangi shina yoki zanjir kerakligi aytilgan.","D":"Matnda bir necha soat ish yetarli ekani aytilgan, haftalar emas."},"block":["Read the text and answer questions 25-27.","In several towns, bicycles that nobody wants are collected. They are not thrown away. Most of them need only a new tyre or a chain. A few hours of work bring them back to life.","The workshops are usually run by volunteers. They teach as well as repair. Anyone who brings a bicycle is shown how to mend it, so the next small problem can be fixed at home.","The repaired bicycles are sold at a low price. Some are given to people who need one to get to work. The workshops say that they almost never have enough bicycles, because the demand is far greater than the supply."]},{"no":26,"pts":"2.6","head":"What do the workshops do besides repairing bicycles?","text":"","opts":["They sell spare parts to local shops","They collect money for the town","They teach people how to mend their own","They test the bicycles on the road"],"ans":"C","why":{"A":"Ehtiyot qismlar sotish haqida matnda gap yo'q.","B":"Pul yig'ish haqida matnda hech narsa yozilmagan.","C":"Ikkinchi xatboshida ustaxonalar ta'mirlash bilan birga o'rgatishi ham aytilgan.","D":"Sinovdan o'tkazish haqida matnda ma'lumot berilmagan."}},{"no":27,"pts":"2.6","head":"What do the workshops say about the bicycles they receive?","text":"","opts":["They receive too many broken ones","They are mostly very old models","They never have enough of them","They are difficult to store in winter"],"ans":"C","why":{"A":"Aksincha, ko'pchiligiga kichik ta'mir yetarli.","B":"Modellarning yoshi haqida matnda gap yo'q.","C":"Uchinchi xatboshida talab taklifdan ancha ko'p ekani aytilgan.","D":"Saqlash haqida matnda hech narsa yozilmagan."}},{"no":28,"pts":"2.6","head":"What happens during the quiet hour?","text":"","opts":["The shop is open only for older customers","The prices are lower than at other times","The shop closes all but one of its doors","The music is turned off and the lights are softer"],"ans":"D","why":{"A":"Faqat keksalar uchun ekani haqida matnda gap yo'q.","B":"Narx haqida matnda hech narsa yozilmagan.","C":"Eshiklar haqida matnda ma'lumot berilmagan.","D":"Birinchi xatboshida musiqa o'chirilishi va yorug'lik yumshatilishi aytilgan."},"block":["Read the text and answer questions 28-30.","Some supermarkets now have a quiet hour once a week. The music is turned off, the lights are made softer, and the staff do not use the loudspeakers.","The idea came from families of children who find noise and bright light difficult. For them an ordinary shop can be so tiring that the family stops shopping together.","The shops were surprised by the result. Many other customers also prefer the quiet hour, and some older shoppers say it is the only time they can hear the person at the till. Several chains have made it longer."]},{"no":29,"pts":"2.6","head":"Where did the idea come from?","text":"","opts":["From the staff who work in the shops","From a study carried out by doctors","From families of children who find noise difficult","From customers who shop very early"],"ans":"C","why":{"A":"Xodimlar haqida matnda gap yo'q.","B":"Tadqiqot haqida matnda hech narsa yozilmagan.","C":"Ikkinchi xatboshida g'oya shovqinni qiyin qabul qiladigan bolalar oilalaridan kelgani aytilgan.","D":"Erta xarid qiluvchilar haqida matnda ma'lumot berilmagan."}},{"no":30,"pts":"2.6","head":"What surprised the shops?","text":"","opts":["Many other customers also prefer the quiet hour","The quiet hour did not reduce their sales","Few families came during the quiet hour","The staff wanted the music to return"],"ans":"A","why":{"A":"Uchinchi xatboshida boshqa ko'plab xaridorlar ham bu vaqtni afzal ko'rishi aytilgan.","B":"Savdo hajmi haqida matnda hech narsa yozilmagan.","C":"Aksincha, bu vaqt ommalashgani aytilgan.","D":"Xodimlarning istagi haqida matnda gap yo'q."}}]}];
