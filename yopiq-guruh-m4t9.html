<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  background:var(--bg,#F4F7F8);padding:24px}
#gate .box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line,#DDE5E7);
  border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 10px 30px rgba(21,128,143,.08)}
#gate img{width:92px;height:92px;border-radius:14px;object-fit:cover;margin:0 auto 14px}
#gate h2{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.25;margin:0 0 6px;color:var(--teal,#15808F)}
#gate p{margin:0 0 18px;color:#5A6B6E;font-size:14px;line-height:1.5}
#gate input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line,#DDE5E7);
  border-radius:12px;text-align:center;letter-spacing:.04em;box-sizing:border-box}
#gate input:focus{outline:none;border-color:var(--teal,#15808F)}
#gate button{width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600;color:#fff;
  background:var(--teal,#15808F);border:0;border-radius:12px;cursor:pointer}
#gate button[disabled]{opacity:.6;cursor:default}
#gate .err{color:#C2410C;font-size:14px;margin-top:12px;min-height:20px}
</style>
<title>Yopiq guruh mock testlari</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
</head>
<body>
<div id="gate">
  <div class="box">
    <img id="gateLogo" alt="">
    <h2>Yopiq guruh materiali</h2>
    <p>Davom etish uchun guruhda berilgan kirish kodini kiriting.</p>
    <form id="gateForm" autocomplete="off">
      <input id="gateCode" type="password" inputmode="text" placeholder="Kirish kodi" aria-label="Kirish kodi">
      <button type="submit" id="gateBtn">Kirish</button>
    </form>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<style>
/* Layout: friendly exam shell - branded masthead, one question column, numbered rail.
   Palette taken from the channel logo: teal puzzle piece, orange puzzle piece. */
:root{
  --bg:#F4F8F8; --surface:#FFFFFF; --surface-2:#E9F1F2; --fg:#15262A; --muted:#577076;
  --line:#D5E3E5; --line-strong:#B6CCD0;
  --teal:#15808F; --teal-soft:#DDF0F2; --orange:#D2561A; --orange-soft:#FCEADF;
  --ok:#17795A; --ok-soft:#DFF3EC; --bad:#B23A2B; --bad-soft:#FCE7E3;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-q:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:5px}
.wrap{max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- start ---------- */
#start{padding-block:34px 56px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;
  box-shadow:0 1px 2px rgba(21,38,42,.05)}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:18px;padding:22px 18px}}
.logo{width:124px;height:124px;border-radius:16px;display:block;object-fit:cover;
  border:1px solid var(--line)}
@media (max-width:640px){.logo{width:104px;height:104px}}
.hero h1{font-family:var(--font-display);font-size:clamp(1.45rem,4.2vw,2.3rem);line-height:1.15;
  font-weight:700;letter-spacing:-.01em;color:var(--teal)}
.hero .sub{margin-top:10px;font-size:clamp(.95rem,2.2vw,1.05rem);color:var(--fg);
  border-left:3px solid var(--orange);padding-left:12px;max-width:60ch}
@media (max-width:640px){.hero .sub{border-left:0;border-top:3px solid var(--orange);
  padding-left:0;padding-top:10px;text-align:center}}
.hero .chan{margin-top:12px;font-size:.86rem;color:var(--muted)}
.hero .chan b{color:var(--fg)}
.specs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
@media (max-width:640px){.specs{justify-content:center}}
.spec{font-size:.78rem;background:var(--teal-soft);color:var(--fg);border-radius:999px;padding:4px 11px}
.spec b{color:var(--teal);font-weight:700}

.block{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
.mode{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;align-items:flex-start;transition:border-color .12s,background .12s}
.mode[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.mode .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-strong);margin-top:4px;flex:none}
.mode[aria-pressed="true"] .dot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--surface)}
.mode h3{font-size:1rem;font-weight:700}
.mode span.d{font-size:.85rem;color:var(--muted);display:block;margin-top:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
.vcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:border-color .12s,transform .12s,box-shadow .12s}
.vcard:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 4px 12px rgba(21,128,143,.14)}
.vcard b{font-family:var(--font-display);font-size:1.25rem;font-weight:700;line-height:1;color:var(--teal)}
.vcard span{font-size:.74rem;color:var(--muted)}
.vcard .resume{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:16px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel p{margin:0;font-size:.92rem;flex:1 1 220px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
  padding:10px 16px;font-size:.9rem;font-weight:600;transition:border-color .12s,filter .12s}
.btn:hover{border-color:var(--teal)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0C1416}}
.btn-primary:hover{filter:brightness(1.08)}

/* ---------- exam ---------- */
#exam{display:flex;flex-direction:column;min-height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:13px;padding-block:10px;max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .mini{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover}
.bar .vname{font-weight:700;font-size:.92rem;white-space:nowrap;line-height:1.2}
.bar .vname small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.clock{margin-left:auto;font-size:1.22rem;font-weight:700;padding:3px 11px;border-radius:9px;
  background:var(--surface-2)}
.clock.warn{background:var(--bad-soft);color:var(--bad)}
.prog{flex:1 1 80px;min-width:60px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .2s}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;
  font-size:.85rem;font-weight:600;flex:none}
@media (max-width:560px){
  .bar-in{gap:9px}
  .bar .mini{display:none}
  .bar .prog{display:none}
  .bar .vname{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .clock{font-size:1.05rem;padding:3px 8px}
  .icon-btn{padding:7px 10px;font-size:.8rem}
}

.cols{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;max-width:1140px;
  margin:0 auto;width:100%;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
@media (max-width:460px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1;color:var(--teal)}
.pts{font-size:.76rem;font-weight:700;color:var(--orange);background:var(--orange-soft);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.sect{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-left:auto;font-weight:700}
.passage{border:1px solid var(--line);border-left:4px solid var(--teal);background:var(--surface-2);
  border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:16px;font-family:var(--font-q);
  font-size:.98rem;line-height:1.64;max-height:46vh;overflow-y:auto}
.passage .plead{font-family:var(--font-ui);font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);font-weight:700;margin-bottom:8px}
.passage .ptitle{font-weight:600;letter-spacing:.03em}
.passage p{margin:0 0 .7em}.passage p:last-child{margin-bottom:0}
.qhead{font-weight:700;font-size:1rem;margin-bottom:6px}
.qtext{font-family:var(--font-q);font-size:1.1rem;line-height:1.6;margin-bottom:16px}
.qtext u{text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:9px}
.optwrap{display:flex;flex-direction:column}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-family:var(--font-q);font-size:1.03rem;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.opt .letter{font-family:var(--font-ui);font-size:.82rem;font-weight:700;flex:none;
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;color:var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"] .letter{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.why{font-size:.88rem;line-height:1.5;margin:5px 0 0 38px;padding-left:11px;
  border-left:2px solid var(--line-strong);color:var(--muted)}
.why.good{border-left-color:var(--ok);color:var(--fg)}
.why.bad{border-left-color:var(--bad)}
.why b{font-weight:700}
.why.good b{color:var(--ok)}.why.bad b{color:var(--bad)}
.verdict{margin-top:14px;border-radius:11px;padding:10px 14px;font-weight:700;font-size:.93rem}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.nav .btn{min-width:98px;text-align:center}
.nav .spacer{flex:1}

.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}
.rail h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  font-size:.83rem;font-weight:600;display:grid;place-items:center;padding:0}
.cell:hover{border-color:var(--teal)}
.cell.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.cell.cur{outline:2px solid var(--orange);outline-offset:1px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.railfoot{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:9px}
@media (max-width:880px){.rail{position:static;order:-1}.cells{grid-template-columns:repeat(10,1fr)}}

/* ---------- result ---------- */
#result{padding-block:34px 56px}
.score{display:flex;flex-wrap:wrap;gap:22px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:6px 6px 16px 16px;padding:22px}
.score .big{font-family:var(--font-display);font-size:clamp(2.5rem,9vw,3.5rem);font-weight:700;
  line-height:.95;color:var(--teal)}
.score .big small{font-size:.36em;color:var(--muted);font-weight:600}
.score .meta{display:flex;flex-direction:column;gap:3px}
.score .meta b{font-size:1.05rem}
.score .meta span{font-size:.87rem;color:var(--muted)}
.breakdown{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bd{border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:116px;background:var(--surface-2)}
.bd .k{font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bd .v{font-size:1.15rem;font-weight:700;margin-top:2px}
.filters{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;
  font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C1416}}
.rev{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 19px}
.rev-item.miss{border-left:4px solid var(--bad)}
.rev-item.hit{border-left:4px solid var(--ok)}
.rev-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.rev-head .n{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--teal)}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px}
.tag.hit{background:var(--ok-soft);color:var(--ok)}
.tag.miss{background:var(--bad-soft);color:var(--bad)}
.rev-q{font-family:var(--font-q);font-size:1.02rem;margin-bottom:10px}
.rev-q .h{font-family:var(--font-ui);font-weight:700;font-size:.95rem;display:block}
.endbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
footer{color:var(--muted);font-size:.82rem;padding-block:24px;border-top:1px solid var(--line);margin-top:36px}
footer b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="start" class="wrap"></div>
<div id="exam" hidden></div>
<div id="result" class="wrap" hidden></div>

const TITLE = "Yopiq guruh: 2026 spetsifikatsiyasi bo'yicha mock testlar";
const SUBTITLE = "9, 10 va 11-sinf uchun beshtadan mock test (3-7). Har bir savol spetsifikatsiyadagi o'z bandiga biriktirilgan. Faqat yopiq guruh uchun.";
const AUTHOR = {name:'Nafisa Ortiqova', tg:'@english_worksheets_more'};
const LET = ['A','B','C','D'];
const SECT = n => n<=10 ? 'Grammar' : n<=20 ? 'Vocabulary' : 'Reading';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark = s => esc(s).replace(/~([^~]+)~/g, '<u>$1</u>');
const fmt = ms => { const t=Math.max(0,Math.round(ms/1000));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const ball = p => p.replace('.', ',') + ' ball';

function passages(items){
  const map = {};
  for (const q of items){
    if (!q.block) continue;
    const m = /questions (\d+)-(\d+)/.exec(q.block[0]);
    if (!m) continue;
    for (let n=+m[1]; n<=+m[2]; n++) map[n] = q.block;
  }
  return map;
}
const VAR = {};
function buildVAR(){ for (const d of DATA) VAR[d.variant] = {items:d.items, pass:passages(d.items), label:d.label, sub:d.sub}; }

const KEY = (v,m) => 'olimp26:'+v+':'+m;
function save(){ if(!S||S.done) return;
  try{ localStorage.setItem(KEY(S.v,S.mode), JSON.stringify(
    {a:S.ans, i:S.i, left:S.mode==='exam' ? S.deadline-Date.now() : null})); }catch(e){} }
function load(v,m){ try{ const r=localStorage.getItem(KEY(v,m)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clear(v,m){ try{ localStorage.removeItem(KEY(v,m)); }catch(e){} }

let S = null, MODE = 'exam', tick = null;
const startEl = document.getElementById('start');
const examEl = document.getElementById('exam');

function renderStart(resumeFor){
  const vs = Object.keys(VAR).map(Number).sort((a,b)=>a-b);
  startEl.innerHTML = `
  <div class="hero">
    <img class="logo" src="${LOGO}" alt="English_worksheets_more kanali logotipi">
    <div>
      <div class="eyebrow">2026-yil spetsifikatsiyasi</div>
      <h1>${TITLE}</h1>
      <p class="sub">${SUBTITLE}</p>
      <div class="specs">
        <span class="spec"><b>15</b> mock test</span>
        <span class="spec"><b>30</b> savol</span>
        <span class="spec"><b>50</b> ball</span>
        <span class="spec"><b>60</b> daqiqa</span>
        <span class="spec">1&ndash;10: <b>0,9</b></span>
        <span class="spec">11&ndash;20: <b>1,5</b></span>
        <span class="spec">21&ndash;30: <b>2,6</b></span>
      </div>
      <div class="chan">Muallif: <b>${AUTHOR.name}</b> &nbsp;&middot;&nbsp; Telegram: <b>${AUTHOR.tg}</b></div>
    </div>
  </div>

  <div class="block">
    <div class="eyebrow">Rejim</div>
    <div class="modes">
      <button class="mode" data-mode="exam" aria-pressed="${MODE==='exam'}">
        <span class="dot"></span>
        <span><h3>Imtihon</h3><span class="d">60 daqiqa sanaydi. Javoblar va izohlar test tugagach ochiladi.</span></span>
      </button>
      <button class="mode" data-mode="practice" aria-pressed="${MODE==='practice'}">
        <span class="dot"></span>
        <span><h3>Mashq</h3><span class="d">Vaqt chegarasi yo&lsquo;q. Har bir javobdan keyin izoh darhol chiqadi.</span></span>
      </button>
    </div>
  </div>

  ${resumeFor ? `
  <div class="block"><div class="panel">
      <p><b>${resumeFor.v}-variant</b> yarim yo&lsquo;lda qolgan &mdash;
         ${Object.keys(resumeFor.saved.a||{}).length} ta savolga javob berilgan.</p>
      <button class="btn btn-primary" id="doResume">Davom ettirish</button>
      <button class="btn" id="doRestart">Boshidan boshlash</button>
      <button class="btn" id="doCancel">Bekor qilish</button>
  </div></div>` : ''}

  <div class="block">
    <div class="eyebrow">Variantni tanlang</div>
    <div class="vgrid">
      ${vs.map(v=>{ const sv = load(v, MODE);
        const L = VAR[v].label, S = VAR[v].sub;
        return `<button class="vcard" data-v="${v}">
          ${sv?'<span class="resume"></span>':''}
          <b>${L}</b><span>${S}</span></button>`; }).join('')}
    </div>
    <p class="note">Har bir savolda to&lsquo;rt javobning ham izohi beriladi: to&lsquo;g&lsquo;risi nega
       to&lsquo;g&lsquo;ri, qolganlari nega noto&lsquo;g&lsquo;ri. Javoblar shu brauzerda saqlanadi, sahifa
       yopilsa ham o&lsquo;sha joydan davom ettirish mumkin.</p>
    <div><button class="btn" id="rnd">Tasodifiy variant</button></div>
  </div>

  <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  startEl.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; renderStart(null); });
  startEl.querySelectorAll('.vcard').forEach(b=>b.onclick=()=>pick(+b.dataset.v));
  startEl.querySelector('#rnd').onclick = ()=>pick(vs[Math.floor(Math.random()*vs.length)]);
  if (resumeFor){
    startEl.querySelector('#doResume').onclick = ()=>begin(resumeFor.v, resumeFor.saved);
    startEl.querySelector('#doRestart').onclick = ()=>{ clear(resumeFor.v, MODE); begin(resumeFor.v, null); };
    startEl.querySelector('#doCancel').onclick = ()=>renderStart(null);
  }
}
function pick(v){
  const saved = load(v, MODE);
  if (saved && Object.keys(saved.a||{}).length){ renderStart({v, saved}); window.scrollTo(0,0); }
  else begin(v, null);
}

function begin(v, saved){
  S = { v, mode:MODE, items:VAR[v].items, pass:VAR[v].pass,
        ans: saved?.a ? {...saved.a} : {}, i: saved?.i ?? 0, done:false, started: Date.now(),
        deadline: MODE==='exam' ? Date.now() + (saved?.left ?? 60*60*1000) : null };
  startEl.hidden = true; document.getElementById('result').hidden = true; examEl.hidden = false;
  examEl.innerHTML = `
    <div class="bar"><div class="bar-in">
      <img class="mini" src="${LOGO}" alt="">
      <div class="vname">${VAR[v].label} ${VAR[v].sub}<small>${MODE==='exam'?'Imtihon rejimi':'Mashq rejimi'}</small></div>
      <div class="prog"><i id="pbar"></i></div>
      <div class="clock tnum" id="clock">${MODE==='exam'?'60:00':'&nbsp;&mdash;&nbsp;'}</div>
      <button class="icon-btn" id="finish">Yakunlash</button>
    </div></div>
    <div class="cols">
      <div class="qcard" id="qcard"></div>
      <aside class="rail">
        <h3>Savollar</h3>
        <div class="cells" id="cells"></div>
        <div class="railfoot"><span id="cnt"></span><button class="btn" id="quit">Chiqish</button></div>
      </aside>
    </div>`;
  examEl.querySelector('#finish').onclick = finish;
  examEl.querySelector('#quit').onclick = ()=>{ save(); stopClock();
    examEl.hidden=true; startEl.hidden=false; renderStart(null); window.scrollTo(0,0); };
  if (MODE==='exam') startClock();
  draw(); window.scrollTo(0,0);
}
function startClock(){ stopClock();
  tick = setInterval(()=>{
    const left = S.deadline - Date.now();
    const c = document.getElementById('clock'); if(!c) return;
    c.textContent = fmt(left); c.classList.toggle('warn', left < 5*60*1000);
    if (left <= 0) finish();
  }, 250);
}
function stopClock(){ if (tick) clearInterval(tick); tick = null; }

function optionsHtml(q, chosen, reveal){
  return q.opts.map((o,ix)=>{
    const L = LET[ix];
    let cls = '', why = '';
    if (reveal){
      cls = L===q.ans ? ' correct' : (L===chosen ? ' wrong' : '');
      const good = L===q.ans;
      why = `<div class="why ${good?'good':'bad'}"><b>${good?"To'g'ri:":"Noto'g'ri:"}</b> ${esc(q.why[L])}</div>`;
    }
    return `<div class="optwrap"><button class="opt${cls}" data-l="${L}" ${reveal?'disabled':''}
        aria-pressed="${chosen===L}"><span class="letter">${L}</span><span>${mark(o)}</span></button>${why}</div>`;
  }).join('');
}

function draw(){
  const q = S.items[S.i], no = q.no, chosen = S.ans[no];
  const reveal = S.mode==='practice' && !!chosen;
  const p = S.pass[no];
  const card = document.getElementById('qcard');
  card.innerHTML = `
    <div class="qmeta"><span class="qno tnum">${no}</span>
      <span class="pts">${ball(q.pts)}</span><span class="sect">${SECT(no)}</span></div>
    ${p ? `<div class="passage"><div class="plead">${esc(p[0])}</div>
        ${p.slice(1).map(t=>`<p${t===t.toUpperCase()?' class="ptitle"':''}>${mark(t)}</p>`).join('')}</div>` : ''}
    <div class="qhead">${mark(q.head)}</div>
    ${q.text ? `<div class="qtext">${mark(q.text)}</div>` : ''}
    ${reveal ? `<div class="verdict ${chosen===q.ans?'good':'bad'}">${chosen===q.ans
        ? 'Barakalla, javob to’g’ri.'
        : 'Afsus, javob noto’g’ri. To’g’ri javob: '+q.ans+'.'}</div>` : ''}
    <div class="opts" style="margin-top:${reveal?'14px':'0'}">${optionsHtml(q, chosen, reveal)}</div>
    <div class="nav">
      <button class="btn" id="prev" ${S.i===0?'disabled':''}>&larr; Oldingi</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="next">${S.i===29?'Yakunlash':'Keyingi &rarr;'}</button>
    </div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  card.querySelector('#prev').onclick = ()=>go(S.i-1);
  card.querySelector('#next').onclick = ()=> S.i===29 ? finish() : go(S.i+1);
  drawRail();
}
function drawRail(){
  const cells = document.getElementById('cells');
  cells.innerHTML = S.items.map((q,ix)=>{
    const a = S.ans[q.no];
    let cls = 'cell' + (a?' done':'') + (ix===S.i?' cur':'');
    if (S.mode==='practice' && a) cls = 'cell ' + (a===q.ans?'ok':'no') + (ix===S.i?' cur':'');
    return `<button class="${cls}" data-i="${ix}">${q.no}</button>`;
  }).join('');
  cells.querySelectorAll('.cell').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const n = Object.keys(S.ans).length;
  document.getElementById('cnt').textContent = n + ' / 30 javob berildi';
  document.getElementById('pbar').style.width = (n/30*100)+'%';
}
function choose(L){
  const q = S.items[S.i];
  if (S.mode==='practice' && S.ans[q.no]) return;
  S.ans[q.no] = L; save();
  if (S.mode==='practice') draw();
  else { draw(); if (S.i < 29) setTimeout(()=>go(S.i+1), 160); }
}
function go(i){ if (i<0||i>29) return; S.i=i; save(); draw();
  document.getElementById('qcard').scrollIntoView({block:'start', behavior:'auto'}); }

document.addEventListener('keydown', e=>{
  if (!S || S.done || examEl.hidden) return;
  const k = e.key.toUpperCase();
  if (LET.includes(k)) { e.preventDefault(); choose(k); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(S.i+1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); go(S.i-1); }
});

function finish(){
  stopClock(); S.done = true; clear(S.v, S.mode);
  const used = S.mode==='exam' ? (60*60*1000 - Math.max(0, S.deadline - Date.now()))
                               : (Date.now() - S.started);
  let score=0, right=0; const bands={'0.9':0,'1.5':0,'2.6':0};
  for (const q of S.items) if (S.ans[q.no] === q.ans){ score += parseFloat(q.pts); right++; bands[q.pts]++; }
  score = Math.round(score*10)/10;
  const resEl = document.getElementById('result');
  examEl.hidden = true; resEl.hidden = false;
  resEl.innerHTML = `
    <div class="score">
      <div class="big tnum">${String(score).replace('.',',')}<small> / 50</small></div>
      <div class="meta">
        <b>${VAR[S.v].label} ${VAR[S.v].sub} &middot; ${S.mode==='exam'?'imtihon':'mashq'}</b>
        <span>${right} ta to&lsquo;g&lsquo;ri javob (30 tadan)</span>
        <span>Sarflangan vaqt: <span class="tnum">${fmt(used)}</span></span>
      </div>
      <div class="breakdown">
        <div class="bd"><div class="k">Grammar</div><div class="v tnum">${bands['0.9']}/10</div></div>
        <div class="bd"><div class="k">Vocabulary</div><div class="v tnum">${bands['1.5']}/10</div></div>
        <div class="bd"><div class="k">Reading</div><div class="v tnum">${bands['2.6']}/10</div></div>
      </div>
    </div>
    <div class="filters">
      <button class="chip" data-f="wrong" aria-pressed="true">Xatolar (${30-right})</button>
      <button class="chip" data-f="all" aria-pressed="false">Barcha savollar</button>
    </div>
    <div class="rev" id="rev"></div>
    <div class="endbar">
      <button class="btn btn-primary" id="again">Shu variantni qayta ishlash</button>
      <button class="btn" id="home">Boshqa variant tanlash</button>
    </div>
    <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  let filter = 'wrong';
  const rev = resEl.querySelector('#rev');
  function paint(){
    const list = S.items.filter(q => filter==='all' || S.ans[q.no]!==q.ans);
    rev.innerHTML = list.length ? list.map(q=>{
      const you = S.ans[q.no], ok = you===q.ans;
      return `<div class="rev-item ${ok?'hit':'miss'}">
        <div class="rev-head"><span class="n tnum">${q.no}</span>
          <span class="tag ${ok?'hit':'miss'}">${ok?"to’g’ri":'xato'}</span>
          <span class="sect">${SECT(q.no)} &middot; ${ball(q.pts)}</span></div>
        <div class="rev-q"><span class="h">${mark(q.head)}</span>${q.text?mark(q.text):''}</div>
        <div class="opts">${optionsHtml(q, you, true)}</div>
      </div>`;
    }).join('') : `<div class="rev-item hit"><b>Bu variantda bitta ham xato yo&lsquo;q. Barakalla!</b></div>`;
  }
  paint();
  resEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    filter = c.dataset.f;
    resEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.f===filter)));
    paint();
  });
  resEl.querySelector('#again').onclick = ()=>begin(S.v, null);
  resEl.querySelector('#home').onclick = ()=>{ resEl.hidden=true; startEl.hidden=false;
    renderStart(null); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

window.addEventListener('beforeunload', save);

document.getElementById('gateLogo').src = LOGO;
const gate = document.getElementById('gate'), gErr = document.getElementById('gateErr'),
      gBtn = document.getElementById('gateBtn');
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code.trim().toLowerCase()),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(ENC.s), iterations:ENC.n, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(ENC.i)}, key, b64d(ENC.c));
  DATA = JSON.parse(new TextDecoder().decode(out));
}
document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  gErr.textContent = ''; gBtn.disabled = true; gBtn.textContent = 'Tekshirilmoqda...';
  try{
    await unlock(document.getElementById('gateCode').value);
    try{ sessionStorage.setItem('olimp26:code', document.getElementById('gateCode').value); }catch(e){}
    buildVAR(); gate.remove(); renderStart(null);
  }catch(err){
    gErr.textContent = 'Kod noto\u2018g\u2018ri. Qaytadan urinib ko\u2018ring.';
    gBtn.disabled = false; gBtn.textContent = 'Kirish';
  }
});
(async ()=>{ let c=null; try{ c = sessionStorage.getItem('olimp26:code'); }catch(e){}
  if(!c) { document.getElementById('gateCode').focus(); return; }
  try{ await unlock(c); buildVAR(); gate.remove(); renderStart(null); }
  catch(e){ document.getElementById('gateCode').focus(); } })();

</script>
