re / withdrew"],"ans":"A","expl":"After a fronted 'So + adjective' the verb comes before the subject: 'So convincing was the argument'. B uses 'did' where 'be' is required, C uses an -ing form, and D does not agree with the singular 'argument'."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The cottage ____ empty for a decade before the trust ____ to restore it.","opts":["stood / agreed","has stood / agreed","had stood / agreed","was standing / had agreed"],"ans":"C","expl":"A long state before a later decision takes the past perfect 'had stood' with the past simple 'agreed'. A loses the order, B uses a present perfect in a past narrative, and D reverses the two events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the site had been inspected twice, the fault was not discovered until later.","opts":["Despite","Because","Hence","Although"],"ans":"D","expl":"'Although' introduces a contrast and takes a full clause. A needs a noun phrase, B gives a cause, and C is a linking adverb that cannot join the clauses."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the wording of the contract ____ caused the confusion, not the price.","opts":["what","that","which it","where"],"ans":"B","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, C adds an unnecessary pronoun, and D refers to place rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the plans ____ to the residents, the objections ____ raised much sooner.","opts":["been shown / would be","shown / would have been","been shown / would have been","be shown / will be"],"ans":"C","expl":"This is an inverted third conditional in the passive: 'would have been raised much sooner'. A leaves the result in the present, B is active and changes the meaning, and D uses a future form after an unreal condition."},{"no":6,"pts":"0.9","head":"Which option means that something was unnecessary but was done?","text":"","opts":["They didn't need to repaint the railings.","They mustn't repaint the railings.","They needn't have repainted the railings.","They couldn't have repainted the railings."],"ans":"C","expl":"'Needn't have repainted' means the work was done although it was unnecessary. A leaves the work undone, B forbids it, and D says it was impossible."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is imperative that the valve ____ before the pressure rises again.","opts":["be closed","is closed","was closed","closes"],"ans":"A","expl":"After 'It is imperative that' the subjunctive is used, and the passive form is 'be closed'. B and C use ordinary tenses, and D is active and makes the valve do the closing."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The new filter is ____ more effective than the one it replaced.","opts":["substantially","very","too","so"],"ans":"A","expl":"Comparatives take modifiers such as 'substantially', 'far' or 'much'. B and D cannot modify a comparative, and C would mean excessively effective."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The technician's reports was filed in the wrong order.","The technicians reports' were filed in the wrong order.","The technicians's reports were filed in the wrong order.","The technicians' reports were filed in the wrong order."],"ans":"D","expl":"A plural ending in s takes the apostrophe after the s: 'the technicians' reports'. A has a singular verb with a plural subject, B puts the apostrophe on the wrong word, and C adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know how much does the permit cost?","Can you explain when will the gates be locked?","I wonder why did the committee refuse?","Could you tell me whether the route is signposted?"],"ans":"D","expl":"An indirect question keeps statement order: 'whether the route is signposted'. A, B and C all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two reports ____ sharply on the question of cost.","opts":["defer","differ","deflect","deter"],"ans":"B","expl":"To 'differ' is to be unlike or to disagree. 'Defer' means to postpone, 'deflect' means to turn aside, and 'deter' means to discourage."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["throw brightness","cast daylight thinly and loud","pour light","shed light"],"ans":"D","expl":"English says 'shed light on something'. A and C use combinations that do not exist, and B adds words that make no sense with the phrase."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The committee's reaction to the proposal was distinctly ~lukewarm~.","opts":["cautious","enthusiastic","formal","immediate"],"ans":"B","expl":"'Lukewarm' means showing little interest, so its opposite is 'enthusiastic'. 'Cautious' is close in meaning, and 'formal' and 'immediate' describe manner and timing."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a conversation?","text":"","opts":["stilted","animated","rambling","porous"],"ans":"D","expl":"'Porous' describes a material that lets liquid through and cannot be used of a conversation. 'Stilted' means awkward and unnatural, 'animated' means lively, and 'rambling' means wandering off the point."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The decision was taken after a ~protracted~ discussion lasting several hours.","opts":["heated","lengthy","private","informal"],"ans":"B","expl":"'Protracted' means lasting longer than expected, so 'lengthy' is the closest match. 'Heated' describes temper, 'private' describes access, and 'informal' describes style."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme was abandoned because of its ____ to local landowners.","opts":["unacceptable","unacceptably","unacceptability","unaccepted"],"ans":"C","expl":"After 'its' a noun is needed, and 'unacceptability to' is the noun form. 'Unacceptable' and 'unaccepted' are adjectives, and 'unacceptably' is an adverb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The project is heavily dependent ____ funding from a single donor.","opts":["on","from","of","to"],"ans":"A","expl":"The adjective 'dependent' takes the preposition 'on'. 'From' follows 'different' in some varieties, 'of' follows 'independent', and 'to' follows 'similar'."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The agreement contains a clause that is widely regarded as ~redundant~.","opts":["written in unnecessarily complicated language","likely to be challenged in a court of law","no longer needed because it serves no purpose","repeated word for word in a later section"],"ans":"C","expl":"'Redundant' here means no longer needed. A describes style, B describes legal risk, and D describes duplication, which is a different fault."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A consensus is:","opts":["general agreement among a group of people","a formal count of the population of a country","a written objection sent to an authority","a meeting held to settle a dispute"],"ans":"A","expl":"A 'consensus' is general agreement within a group. B describes a census, C describes a complaint, and D describes mediation."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["single-minded","obsessive","focused","dedicated"],"ans":"B","expl":"'Obsessive' suggests an unhealthy degree of concentration and carries criticism. 'Single-minded', 'focused' and 'dedicated' describe the same concentration approvingly."},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To announce that the play has been cancelled","To give information about rehearsals and the dress rehearsal","To invite parents to help with the costumes","To ask pupils to audition for the remaining parts"],"ans":"B","expl":"The notice gives the rehearsal days, the attendance rule and the arrangements for the dress rehearsal. A contradicts the schedule, C and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","SCHOOL PLAY: REHEARSAL ARRANGEMENTS","Rehearsals will be held on Tuesdays and Thursdays after school until the end of term. Any cast member who misses three rehearsals without good reason will lose their part. The dress rehearsal is on 6 June. It will run from four o'clock until about eight, so cast members should bring food with them. Costumes will be issued at the dress rehearsal. They must be returned on the final night."]},{"no":22,"pts":"2.6","head":"What should cast members bring to the dress rehearsal?","text":"","opts":["Their own costumes","Something to eat","A signed form from a parent","A copy of the script"],"ans":"B","expl":"The notice says the dress rehearsal runs until about eight and that cast members should bring food. A contradicts the issuing of costumes, and C and D are never mentioned."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"Whether that counts as overtime is a bit of a grey area.\" What does this mean?","text":"","opts":["The rule on overtime has recently been changed","Overtime is never paid in that department","It is not clear whether the rule applies","The question has already been settled"],"ans":"C","expl":"A 'grey area' is a situation where the rules are not clear. A describes a change he never mentions, B states a rule he does not give, and D contradicts the uncertainty."},{"no":24,"pts":"2.6","head":"You see this notice at a station: \"Unclaimed items are held for 28 days. Proof of ownership required on collection.\" What is the main message?","text":"","opts":["Lost items are destroyed after one week","Only items of value are kept by the station","Items must be claimed on the day they are lost","You may collect a lost item within four weeks if you can prove it is yours"],"ans":"D","expl":"The notice gives a twenty-eight day period and requires proof of ownership. A shortens the period, B adds a limit the notice does not set, and C contradicts the period entirely."},{"no":25,"pts":"2.6","head":"What does the text say about the straightening of rivers?","text":"","opts":["It was carried out to create space for new housing","It happened mainly in the last twenty years","It was opposed by engineers at the time","It was done to drain land and speed the water away"],"ans":"D","expl":"The first paragraph says rivers were straightened to drain the land and move water away quickly. A and C are never mentioned, and B contradicts the long history described.","block":["Read the text and answer questions 25-27.","For two centuries engineers straightened rivers. A winding channel was deepened and walled so that the land beside it could be drained and the water carried away quickly. It worked, in the sense that fields were farmed and towns were built where marshes had been.","The cost appeared downstream. Water that leaves one stretch quickly arrives somewhere else all at once, and the places it arrives are usually towns. Floods that were once slow and shallow became sudden and deep, and the concrete walls built to contain them simply passed the problem further on.","Restoration reverses the work. Bends are cut back into the channel, gravel is returned to the bed and parts of the floodplain are allowed to flood again. The water is slowed rather than sent away, and fish and insects return within a few seasons. Farmers who lose a field are usually paid for it."]},{"no":26,"pts":"2.6","head":"Why did the straightening cause problems downstream?","text":"","opts":["The channels filled with gravel and blocked","Water arrived all at once in towns further on","Farmers refused to maintain the walls","The rivers became too shallow for boats"],"ans":"B","expl":"The second paragraph says water that leaves one stretch quickly arrives somewhere else all at once, usually in towns. A, C and D describe problems the text never mentions."},{"no":27,"pts":"2.6","head":"What does restoration involve, according to the text?","text":"","opts":["Cutting bends back in and letting parts of the floodplain flood","Building higher walls along the channel","Removing gravel from the riverbed","Moving towns away from the river"],"ans":"A","expl":"The final paragraph says bends are cut back, gravel is returned and parts of the floodplain are allowed to flood. B contradicts the approach, C reverses the treatment of gravel, and D is never suggested."},{"no":28,"pts":"2.6","head":"What does the text say about the growth of audiobook listening?","text":"","opts":["It has replaced reading for most people","It is limited to classic novels","It has grown fastest among people who already read a lot","It has fallen since streaming became common"],"ans":"C","expl":"The first paragraph says the strongest growth has been among people who already read a great deal. A overstates the change, B contradicts the range described, and D reverses the trend.","block":["Read the text and answer questions 28-30.","Audiobooks are no longer a minor part of publishing. Sales have risen every year for a decade, and the strongest growth has been among people who already read a great deal. Listening happens while something else is going on, which adds hours that were not previously available for books.","Researchers have compared listening with reading. For a straightforward story the two produce very similar understanding and recall. For a dense or technical text the reader has an advantage, because a page can be reread in a moment while an audio file must be found again.","Publishers have adjusted. Some books are now written with listening in mind, with shorter chapters and fewer footnotes. Authors increasingly record their own work, and a few titles are released as audio first. Booksellers, who once ignored the format, now display it beside the printed edition."]},{"no":29,"pts":"2.6","head":"What advantage does a reader have over a listener?","text":"","opts":["A page can be reread in a moment","Reading takes less time than listening","Printed books contain more detail","Readers remember stories for longer"],"ans":"A","expl":"The second paragraph says the reader has an advantage with a dense text because a page can be reread in a moment. B, C and D are claims the text never makes."},{"no":30,"pts":"2.6","head":"How have publishers adjusted?","text":"","opts":["By shortening chapters and using fewer footnotes","By releasing every title as audio first","By employing professional actors for all recordings","By reducing the price of printed editions"],"ans":"A","expl":"The final paragraph says some books are now written with listening in mind, with shorter chapters and fewer footnotes. B overstates 'a few titles', C contradicts authors recording their own work, and D is never mentioned."}]},{"variant":16,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Only after the second survey ____ the engineers ____ the real cause.","opts":["did / identified","did / identify","had / identifying","were / identify"],"ans":"B","expl":"After the fronted 'Only after ...' clause the main clause inverts, and after 'did' the verb stays in the base form. A adds a past form after 'did', C uses an -ing form, and D mixes 'were' with a base form."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The archive ____ several times before the fire ____ most of what remained.","opts":["was moved / destroyed","has been moved / destroyed","had been moved / destroyed","was being moved / had destroyed"],"ans":"C","expl":"Repeated earlier events before a later one take the past perfect passive 'had been moved' with the past simple 'destroyed'. A loses the order, B uses a present perfect in a past narrative, and D reverses the sequence."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the obvious risks, the crew agreed to attempt the crossing.","opts":["Despite","Although","Because of","Therefore"],"ans":"A","expl":"'Despite' is followed by a noun phrase and introduces a contrast. B and D need a clause, and C gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the second letter ____ finally persuaded the department to act.","opts":["that","what","which it","when"],"ans":"A","expl":"A cleft of this kind is completed by 'that'. B cannot introduce a cleft, C adds an unnecessary pronoun, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the records ____ properly, the family ____ its land claim today.","opts":["were kept / would prove","had been kept / would be able to prove","had been kept / would have proved","are kept / will prove"],"ans":"B","expl":"A past failure with a present consequence takes the mixed conditional 'had been kept / would be able to prove'. A puts both halves in the present, C places the result in the past although 'today' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that something was forbidden in the past?","text":"","opts":["We didn't have to use the main staircase.","We needn't have used the main staircase.","We couldn't have used the main staircase.","We weren't allowed to use the main staircase."],"ans":"D","expl":"'Weren't allowed to' states that permission was refused. A says only that it was unnecessary, B says it was done unnecessarily, and C says it was impossible."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is essential that nobody ____ the room until the count is complete.","opts":["leaves","left","leave","is leaving"],"ans":"C","expl":"After 'It is essential that' the subjunctive is used, which is the base form 'leave' for every subject. A is the ordinary present, B is past, and D is continuous."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second prototype was ____ lighter than the first.","opts":["markedly","too","very","so"],"ans":"A","expl":"Comparatives take modifiers such as 'markedly', 'far' or 'much'. B would mean excessively light, and C and D cannot modify a comparative."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The engineer's recommendations was ignored for two years.","The engineers recommendations' were ignored for two years.","The engineers' recommendations were ignored for two years.","The engineers's recommendations were ignored for two years."],"ans":"C","expl":"A plural ending in s takes the apostrophe after the s: 'the engineers' recommendations'. A has a singular verb with a plural subject, B puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know whether the hall has been booked?","Could you tell me how many tickets did they sell last month?","Can you explain where is the spare key kept?","I wonder when did the lease expire?"],"ans":"A","expl":"An indirect question keeps statement order with no added auxiliary: 'whether the hall has been booked'. B, C and D all keep the inverted order of a direct question, with 'did', 'is' and 'did' placed before their subjects."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The company was forced to ____ its forecast after the figures were published.","opts":["review","revise","revive","reverse"],"ans":"B","expl":"To 'revise' a forecast is to change it in the light of new information. 'Review' means to examine without necessarily changing, 'revive' means to bring back to life, and 'reverse' means to turn completely round."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["drive a risk","carry a risk roughly and green","push a risk","run a risk"],"ans":"D","expl":"English says 'run a risk'. A and C use verbs that do not collocate with this noun, and B adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The atmosphere at the meeting was unexpectedly ~harmonious~.","opts":["peaceful","quarrelsome","formal","crowded"],"ans":"B","expl":"'Harmonious' means free of disagreement, so its opposite is 'quarrelsome'. 'Peaceful' is a synonym, and 'formal' and 'crowded' describe style and numbers."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a reply?","text":"","opts":["curt","evasive","threadbare","measured"],"ans":"C","expl":"'Threadbare' describes worn cloth or an overused excuse and is not used of a reply itself. 'Curt' means short and rude, 'evasive' means avoiding the question, and 'measured' means careful and controlled."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The old bridge was in a ~precarious~ condition by the time it was closed.","opts":["historic","unusual","unsafe","narrow"],"ans":"C","expl":"'Precarious' means unsafe and likely to fail, so 'unsafe' is the closest match. 'Historic' refers to age, 'unusual' to rarity, and 'narrow' to width."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The decision was entirely ____ with the policy announced last year.","opts":["consist","consistent","consistency","consistently"],"ans":"B","expl":"After 'was' and the adverb 'entirely' an adjective is needed, and 'consistent with' is the fixed pattern. 'Consist' is a verb, 'consistency' is a noun, and 'consistently' is an adverb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme has been in operation ____ the beginning of the year.","opts":["for","during","since","from"],"ans":"C","expl":"'Since' is used with a point in time to mark the start of a period continuing to now. 'For' needs a length of time, 'during' refers to a whole period, and 'from' would need 'to' to complete it."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"Several members described the proposal as ~untenable~.","opts":["likely to be more expensive than stated","drafted without the proper consultation","acceptable only to a small majority","impossible to defend or maintain"],"ans":"D","expl":"'Untenable' means impossible to defend or keep going. A describes cost, B describes procedure, and C describes a narrow vote."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A safeguard is:","opts":["a payment held back until work is approved","a measure taken to prevent something going wrong","a person employed to watch a building at night","a copy of a document kept in another place"],"ans":"B","expl":"A 'safeguard' is a protective measure. A describes retention, C describes a security guard, and D describes a backup."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["imaginative","inventive","creative","fanciful"],"ans":"D","expl":"'Fanciful' suggests ideas that are unrealistic, and it is used critically. 'Imaginative', 'inventive' and 'creative' describe the same originality approvingly."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To announce that the first aid course is full","To give the details of the course and how to join","To remind staff to renew an existing certificate","To warn staff that the course has been shortened"],"ans":"B","expl":"The notice gives the dates, the content, the cost and the deadline for names. A contradicts the invitation to apply, C and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","FIRST AID COURSE","A two-day course will be held on 4 and 5 July in the staff room. It covers the treatment of burns, choking and bleeding, and ends with a short practical assessment. The course is free to staff, but the certificate costs twelve pounds and is valid for three years. Places are limited to sixteen. Names should be given to the office by 20 June, and late applications will be held on a reserve list."]},{"no":22,"pts":"2.6","head":"What does the notice say about the certificate?","text":"","opts":["It is issued free with the course","It is only given to those who pass the assessment","It must be renewed every year","It costs twelve pounds and lasts three years"],"ans":"D","expl":"The notice says the course is free but the certificate costs twelve pounds and is valid for three years. A contradicts the charge, B adds a condition the notice does not state, and C shortens the period."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"The savings will apply across the board.\" What does this mean?","text":"","opts":["The savings will affect everyone and everything","The savings will apply only to senior staff","The savings have been written on a notice board","The savings will be introduced gradually"],"ans":"A","expl":"'Across the board' means affecting everybody or everything equally. B narrows it, C takes the phrase literally, and D adds a timescale he never gives."},{"no":24,"pts":"2.6","head":"You see this notice beside an escalator: \"Hold the handrail. Dogs must be carried.\" What is the main message?","text":"","opts":["Only passengers with dogs may use the escalator","Dogs are not allowed in the building","Passengers must not carry anything on the escalator","Hold on, and pick up any dog before stepping on"],"ans":"D","expl":"The notice gives two instructions: hold the handrail and carry a dog rather than let it walk. A misreads the second instruction as a condition of entry, B bans dogs the notice allows, and C reverses the instruction about carrying."},{"no":25,"pts":"2.6","head":"What does the text say about the number of tracked objects in orbit?","text":"","opts":["Only a few hundred are large enough to follow","Tens of thousands are tracked, and far more are too small","Every object larger than a grain of sand is tracked","The number has fallen since tracking improved"],"ans":"B","expl":"The first paragraph says tens of thousands of objects are tracked and that far more are too small to follow. A and C misstate the figures, and D reverses the trend.","block":["Read the text and answer questions 25-27.","Space around the Earth is crowded. Tens of thousands of objects large enough to be tracked are in orbit, and far more are too small to follow. Most are not satellites at all. They are spent rocket stages, lost tools and fragments of machines that broke apart years ago.","Speed is what makes this dangerous. An object the size of a coin travels fast enough to destroy a working satellite, and each collision produces thousands of new fragments. Engineers worry about a chain reaction in which one break-up causes the next until a whole orbit becomes unusable.","Several removal methods are being tested. A net, a harpoon and a magnetic arm have all been flown, and each has captured a target in a controlled trial. The difficulty is agreement rather than engineering. Almost every piece of debris legally belongs to the country that launched it, and nobody may remove another nation's property."]},{"no":26,"pts":"2.6","head":"Why do engineers worry about a chain reaction?","text":"","opts":["Satellites are becoming too large to manoeuvre","Rocket stages are left in orbit deliberately","Tracking systems cannot see small objects at night","Each collision produces thousands of new fragments"],"ans":"D","expl":"The second paragraph says each collision produces thousands of new fragments and that one break-up may cause the next. A, B and C describe concerns the text never raises."},{"no":27,"pts":"2.6","head":"What is described as the main difficulty?","text":"","opts":["Obtaining agreement about removing other countries' property","Building equipment that can capture debris","Reaching the orbits where the debris sits","Paying for the launches needed"],"ans":"A","expl":"The final paragraph says the difficulty is agreement rather than engineering, because debris belongs to the launching country. B is contradicted by the successful trials, and C and D are never mentioned."},{"no":28,"pts":"2.6","head":"What does the text say about waiting lists for community gardens?","text":"","opts":["They have disappeared in most cities","They apply only to plots in the centre","They can be several years long","They are managed by national government"],"ans":"C","expl":"The first paragraph says waiting lists of several years are common. A reverses the demand, B and D add limits the text does not describe.","block":["Read the text and answer questions 28-30.","Demand for a small plot of land in a city has rarely been higher. Waiting lists of several years are common, and some councils have stopped accepting new names altogether. The plots are small, the rent is low, and the produce rarely repays the hours spent on it.","People do not join for the vegetables alone. Surveys of plot holders put company near the top of the list of reasons, alongside time outdoors and the satisfaction of growing something. Doctors in several countries now refer patients to gardening projects as a treatment for mild depression.","Land is the obstacle. A plot occupies ground that a developer would pay a great deal for, and councils under financial pressure find the argument hard to resist. Where sites have been protected, it is usually because the gardeners organised early and could show how many households used the land."]},{"no":29,"pts":"2.6","head":"Why do doctors refer patients to gardening projects?","text":"","opts":["As a treatment for mild depression","To reduce the cost of treating physical illness","To increase the supply of fresh vegetables","To give patients a source of income"],"ans":"A","expl":"The second paragraph says doctors in several countries refer patients to gardening projects as a treatment for mild depression. B, C and D describe purposes the text never gives."},{"no":30,"pts":"2.6","head":"How have some sites been protected?","text":"","opts":["Because the gardeners organised early and showed how many used the land","By national laws covering all open land","By paying developers the value of the ground","Because councils are forbidden to sell any land"],"ans":"A","expl":"The final paragraph says protected sites are usually ones where gardeners organised early and could show how many households used the land. B, C and D describe protections the text never mentions."}]},{"variant":17,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"No sooner ____ the alarm sounded than the building ____ completely.","opts":["has / emptied","did / emptied","had / emptied","had / had emptied"],"ans":"C","expl":"The pattern is 'No sooner had ... than + past simple'. A uses a present perfect, B puts a past form after 'did', and D wrongly makes both verbs past perfect."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The workshop ____ as a stable for years before the artist ____ it.","opts":["served / bought","has served / bought","was serving / had bought","had served / bought"],"ans":"D","expl":"An earlier use before a later purchase takes the past perfect 'had served' with the past simple 'bought'. A loses the order, B uses a present perfect in a past narrative, and C reverses the events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the committee's reservations, the contract was signed the same afternoon.","opts":["In spite of","Although","Because of","Furthermore"],"ans":"A","expl":"'In spite of' is followed by a noun phrase and introduces a contrast. B and D need a clause, and C gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the standard of the lighting ____ ruined an otherwise excellent production.","opts":["what","that","which it","when"],"ans":"B","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, C adds an unnecessary pronoun, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the funding ____ last year, the wing ____ open to the public by now.","opts":["been approved / would be","been approved / would have been","approved / would be","be approved / will be"],"ans":"A","expl":"This is an inverted mixed conditional: a past action with a present result, so 'would be open by now' is correct. B places the result in the past although 'by now' is stated, C is active and changes the meaning, and D uses a future form after an unreal condition."},{"no":6,"pts":"0.9","head":"Which option means that something is not necessary?","text":"","opts":["You don't need to bring your own equipment.","You mustn't bring your own equipment.","You shouldn't have brought your own equipment.","You couldn't bring your own equipment."],"ans":"A","expl":"'Don't need to' states that there is no obligation. B forbids it, C criticises something already done, and D says it was impossible."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is crucial that every entry ____ before the judging begins.","opts":["is numbered","was numbered","be numbered","numbers"],"ans":"C","expl":"After 'It is crucial that' the subjunctive is used, and the passive form is 'be numbered'. A and B use ordinary tenses, and D is active and makes the entry do the numbering."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The revised syllabus is ____ broader than the one it replaces.","opts":["very","appreciably","too","so"],"ans":"B","expl":"Comparatives take modifiers such as 'appreciably', 'far' or 'much'. A and D cannot modify a comparative, and C would mean excessively broad."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The resident's association meet on the first Monday of the month.","The residents association's meets on the first Monday of the month.","The residents's association meets on the first Monday of the month.","The residents' association meets on the first Monday of the month."],"ans":"D","expl":"A plural ending in s takes the apostrophe after the s: 'the residents' association'. A has a plural verb with a singular subject, B puts the apostrophe on the wrong word, and C adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me how long does the journey take?","Can you explain why was the invoice returned?","Do you know whether the hall is free on Friday?","I wonder where did they find the document?"],"ans":"C","expl":"An indirect question keeps statement order: 'whether the hall is free on Friday'. A, B and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two villages were asked to ____ their resources for the repair work.","opts":["club down","club together","club off","club over"],"ans":"B","expl":"To 'club together' is to combine money or effort for a shared purpose. The other combinations are not English phrases."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["greet a demand","catch a demand brightly and flat","touch a demand","meet a demand"],"ans":"D","expl":"English says 'meet a demand'. A and C use verbs that do not collocate with this noun, and B adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The evidence presented at the hearing was surprisingly ~compelling~.","opts":["unconvincing","convincing","detailed","confidential"],"ans":"A","expl":"'Compelling' means strongly convincing, so its opposite is 'unconvincing'. 'Convincing' is a synonym, and 'detailed' and 'confidential' describe length and access."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a landscape?","text":"","opts":["articulate","barren","undulating","wooded"],"ans":"A","expl":"'Articulate' describes clear speech and cannot be used of a landscape. 'Barren' means producing nothing, 'undulating' means gently rising and falling, and 'wooded' means covered with trees."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The guide gave a ~comprehensive~ account of the building's history.","opts":["amusing","official","complete","brief"],"ans":"C","expl":"'Comprehensive' means covering everything, so 'complete' is the closest match. 'Amusing' describes tone, 'official' describes source, and 'brief' is the opposite."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The results bear little ____ to those obtained by the earlier team.","opts":["resemble","resembling","resembled","resemblance"],"ans":"D","expl":"After 'bear little' a noun is needed, and 'bear a resemblance to' is the fixed pattern. 'Resemble' is a verb, and 'resembling' and 'resembled' are verb forms."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The museum was reluctant to part ____ any item from the original collection.","opts":["from","of","with","to"],"ans":"C","expl":"The phrase 'part with something' means to give it up. 'From', 'of' and 'to' are not used after 'part' in this meaning."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The council's response was condemned as ~perfunctory~.","opts":["done quickly and without real care","delivered later than the rules allow","written in language nobody could follow","prepared by somebody outside the council"],"ans":"A","expl":"'Perfunctory' means done as a formality without real care, which is why it was condemned. B describes lateness, C describes obscurity, and D describes authorship."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A subsidy is:","opts":["a smaller company owned by a larger one","money paid by a government to support an activity","a reduction offered to customers who pay early","a document proving that a tax has been paid"],"ans":"B","expl":"A 'subsidy' is money given by a government to keep a price low or support an activity. A describes a subsidiary, C describes a discount, and D describes a receipt."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["reserved","private","quiet","withdrawn"],"ans":"D","expl":"'Withdrawn' suggests somebody who has retreated from contact with others, and it carries concern. 'Reserved', 'private' and 'quiet' describe the same restraint neutrally."},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To announce that the book club has closed","To ask members to donate books to the library","To explain how the club will run this term","To warn members about overdue books"],"ans":"C","expl":"The notice gives the meeting day, the choice of title, the lending arrangement and the rule about numbers. A contradicts the arrangements, B and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","BOOK CLUB: THIS TERM","The club will meet on alternate Wednesdays in the small library. Each term the group chooses four titles by vote, and the list is posted on the door. Copies are borrowed from the public library, so members should allow a week to obtain one. Nobody is expected to finish a book before coming, and members who have read only part of a title are still welcome. If more than twenty names are received, a second group will be started."]},{"no":22,"pts":"2.6","head":"What does the notice say about members who have not finished a book?","text":"","opts":["They should wait until the following meeting","They are still welcome to attend","They must tell the organiser in advance","They may join the second group instead"],"ans":"B","expl":"The notice says nobody is expected to finish a book and that such members are still welcome. A and C add conditions the notice does not set, and D misreads the rule about numbers."},{"no":23,"pts":"2.6","head":"You hear a trainer say: \"There is a steep learning curve in the first month.\" What does this mean?","text":"","opts":["There is a great deal to learn quickly at the start","The work becomes easier after the first month","Only experienced staff are taken on","The training lasts exactly one month"],"ans":"A","expl":"A 'steep learning curve' means a lot must be learned in a short time. B draws a conclusion the speaker does not state, C describes recruitment, and D fixes a length the speaker never gives."},{"no":24,"pts":"2.6","head":"You see this notice by a library printer: \"Credit must be added before printing. Unused credit is not refunded.\" What is the main message?","text":"","opts":["Pay first, and you will not get unused money back","Printing is free for library members","The printer is out of order until credit is added","Credit can only be added at the main desk"],"ans":"A","expl":"The notice says credit must be added before printing and that unused credit is not refunded. B contradicts the charge, C invents a fault, and D adds a place the notice does not name."},{"no":25,"pts":"2.6","head":"What does the text say about how a heat pump works?","text":"","opts":["It burns fuel more efficiently than a boiler","It stores heat collected during the summer","It moves existing heat rather than creating it","It works only in mild climates"],"ans":"C","expl":"The first paragraph says a heat pump moves heat that already exists rather than making it. A contradicts 'no fuel is burned', B and D describe systems the text does not mention.","block":["Read the text and answer questions 25-27.","A heat pump does not make heat. It moves heat that already exists, taking it from the outside air or the ground and raising it to a useful temperature. No fuel is burned in the house, and for every unit of electricity used the machine typically delivers three or four units of heat.","Installation decides how well it works. A heat pump supplies water at a lower temperature than a gas boiler, so the radiators must be larger and the building reasonably well insulated. Fitted into a draughty house with small radiators, it will disappoint the owner and give the technology a poor name.","Costs are falling but remain high at the point of purchase. Several governments offer grants, and the running cost depends almost entirely on the relative price of electricity and gas. Where electricity is taxed more heavily than gas, as in several countries, the saving on the bill can disappear altogether."]},{"no":26,"pts":"2.6","head":"Why must the radiators be larger?","text":"","opts":["Because the pump produces heat more slowly in winter","Because the pump supplies water at a lower temperature","Because the house must be heated without insulation","Because the pump uses more electricity at night"],"ans":"B","expl":"The second paragraph says a heat pump supplies water at a lower temperature than a gas boiler, so radiators must be larger. A, C and D give reasons the text never offers."},{"no":27,"pts":"2.6","head":"What does the running cost depend on?","text":"","opts":["The age of the building","The relative price of electricity and gas","The size of the government grant","The number of radiators fitted"],"ans":"B","expl":"The final paragraph says the running cost depends almost entirely on the relative price of electricity and gas. A, C and D affect other things but not the running cost as the text describes it."},{"no":28,"pts":"2.6","head":"What does the text say about the passengers on night buses?","text":"","opts":["They are mainly people returning from entertainment","They travel only at weekends","They are usually tourists unfamiliar with the city","Most are shift workers rather than people going out"],"ans":"D","expl":"The second paragraph says counts show most passengers are shift workers. A is the assumption the text corrects, B contradicts the weekday services, and C is never mentioned.","block":["Read the text and answer questions 28-30.","Most cities reduce their bus services at night, and some stop them altogether. The argument is simple. Few people travel, so a service runs almost empty and costs the same to operate as a full one during the day.","The counts tell a more interesting story. Most night passengers are not people returning from an evening out. They are shift workers, and the hospitals, bakeries and cleaning companies that employ them depend on staff who have no car. Where a night service has been withdrawn, employers have reported difficulty filling the earliest shifts.","Several cities have therefore kept a reduced network rather than none at all. A single route that links the main hospital to the suburbs can carry more passengers at four in the morning than a daytime route carries at ten. The lesson, operators say, is that the night network should be planned around work rather than around leisure."]},{"no":29,"pts":"2.6","head":"What have employers reported where a night service was withdrawn?","text":"","opts":["Staff arrive late but still come to work","It became difficult to fill the earliest shifts","They had to buy vehicles for their staff","Wages for night work had to be reduced"],"ans":"B","expl":"The second paragraph says employers reported difficulty filling the earliest shifts. A, C and D describe consequences the text never records."},{"no":30,"pts":"2.6","head":"What lesson do operators draw?","text":"","opts":["All night services should be withdrawn to save money","Night buses should run only to the city centre","Daytime routes should be shortened to pay for night ones","Night services should be planned around work rather than leisure"],"ans":"D","expl":"The final sentence says the night network should be planned around work rather than around leisure. A contradicts keeping a reduced network, and B and C are never proposed."}]},{"variant":18,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Not for a moment ____ the organisers ____ that the hall would be full.","opts":["did / imagined","had / imagining","did / imagine","were / imagine"],"ans":"C","expl":"After the fronted negative 'Not for a moment' the auxiliary comes first and the verb stays in the base form. A adds a past form after 'did', B uses an -ing form, and D mixes 'were' with a base form."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The bridge ____ twice before engineers ____ that the design itself was at fault.","opts":["was repaired / concluded","has been repaired / concluded","was being repaired / had concluded","had been repaired / concluded"],"ans":"D","expl":"Two earlier repairs before a later conclusion take the past perfect passive 'had been repaired' with the past simple 'concluded'. A loses the order, B uses a present perfect in a past narrative, and C reverses the sequence."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the warnings printed on the packet, several people used the product incorrectly.","opts":["Although","Because of","Despite","Nevertheless"],"ans":"C","expl":"'Despite' is followed by a noun phrase and introduces a contrast. A and D need a clause, and B gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the width of the entrance ____ prevented the machinery from being delivered.","opts":["that","what","which it","when"],"ans":"A","expl":"A cleft of this kind is completed by 'that'. B cannot introduce a cleft, C adds an unnecessary pronoun, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the trees ____ in the 1980s, the slope ____ stable today.","opts":["were planted / would be","had been planted / would be","had been planted / would have been","are planted / will be"],"ans":"B","expl":"A past action with a present result takes the mixed conditional 'had been planted / would be'. A puts both halves in the present, C places the result in the past although 'today' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that something was certainly true in the past?","text":"","opts":["The visitor may have used the side door.","The visitor might have used the side door.","The visitor should have used the side door.","The visitor must have used the side door."],"ans":"D","expl":"'Must have used' expresses a confident conclusion about the past. A and B express possibility, and C criticises something that was not done."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The director insisted that no photographs ____ during the performance.","opts":["are taken","were taken","take","be taken"],"ans":"D","expl":"After 'insisted that' the subjunctive is used, and the passive form is 'be taken'. A and B use ordinary tenses, and C is active and makes the photographs do the taking."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The third attempt was ____ more successful than the previous two.","opts":["too","considerably","very","so"],"ans":"B","expl":"Comparatives take modifiers such as 'considerably', 'far' or 'much'. A would mean excessively successful, and C and D cannot modify a comparative."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The farmers' market is held in the square every Saturday.","The farmer's market are held in the square every Saturday.","The farmers market's is held in the square every Saturday.","The farmers's market is held in the square every Saturday."],"ans":"A","expl":"A plural ending in s takes the apostrophe after the s: 'the farmers' market'. B has a plural verb with a singular subject, C puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me whether the ferry runs on Sundays?","Do you know how much does the guide cost?","Can you explain where was the sample taken?","I wonder when will the tide turn?"],"ans":"A","expl":"An indirect question keeps statement order: 'whether the ferry runs on Sundays'. B, C and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The authorities were slow to ____ the scale of the damage.","opts":["appraise","appreciate","approve","appoint"],"ans":"B","expl":"To 'appreciate' something here means to understand its full extent. 'Appraise' means to assess formally, 'approve' means to agree to, and 'appoint' means to give somebody a post."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["fill a gap in the rules firmly and green","fill a vacancy","pour a vacancy","stuff a vacancy"],"ans":"B","expl":"English says 'fill a vacancy'. C and D use verbs that do not collocate with this noun, and A adds words that make no sense in the phrase."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The tone of the review was unexpectedly ~generous~ towards the young cast.","opts":["harsh","kind","formal","detailed"],"ans":"A","expl":"'Generous' here means willing to praise, so its opposite is 'harsh'. 'Kind' is a synonym, and 'formal' and 'detailed' describe style and length."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a signature?","text":"","opts":["illegible","perishable","forged","witnessed"],"ans":"B","expl":"'Perishable' describes food that goes bad quickly and cannot be used of a signature. 'Illegible' means impossible to read, 'forged' means falsely written, and 'witnessed' means signed in front of somebody."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The committee's findings were ~unequivocal~ on the question of responsibility.","opts":["divided","provisional","clear","confidential"],"ans":"C","expl":"'Unequivocal' means leaving no room for doubt, so 'clear' is the closest match. 'Divided' is the opposite, and 'provisional' and 'confidential' describe status and access."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The committee acted with complete ____ throughout the inquiry.","opts":["impartial","impartially","impart","impartiality"],"ans":"D","expl":"After 'complete' a noun is needed, and 'impartiality' is the noun. 'Impartial' is an adjective, 'impartially' is an adverb, and 'impart' is a verb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The design was adapted ____ the needs of smaller workshops.","opts":["for","with","from","to"],"ans":"D","expl":"The verb 'adapt' takes 'to' before the thing something is fitted to. 'For' follows 'suitable', 'with' follows 'equipped', and 'from' indicates an origin rather than a target."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The spokesman offered an explanation that most reporters found ~implausible~.","opts":["expressed in very technical language","longer than the question deserved","difficult to believe","identical to an earlier statement"],"ans":"C","expl":"'Implausible' means difficult to believe, which is why the reporters were unconvinced. A describes the use of technical jargon, B comments on the length of the answer, and D describes repetition, and none of these is a question of belief."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A quorum is:","opts":["a written record of decisions taken at a meeting","the smallest number of people needed for a valid meeting","the room in which a committee usually meets","a vote taken without any discussion"],"ans":"B","expl":"A 'quorum' is the minimum number of members who must be present for a meeting to take decisions. A describes minutes, C describes a venue, and D describes a formality."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["frugal","economical","parsimonious","prudent"],"ans":"C","expl":"'Parsimonious' describes somebody extremely unwilling to spend, and it is always critical. 'Frugal', 'economical' and 'prudent' describe the same restraint approvingly."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To set out what pupils must do before the trip","To announce that the field trip is full","To ask parents to accompany the group","To explain why the trip has been moved"],"ans":"A","expl":"The notice lists the form, the clothing, the equipment and the meeting time. B, C and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","FIELD TRIP: BEFORE YOU COME","The consent form must be returned by Friday. Pupils without a signed form cannot travel, and no exceptions will be made. Strong boots are necessary because the path is rough in places. Each pupil should bring a packed lunch, a waterproof coat and a full water bottle. The coach leaves at eight sharp from the lower gate, and anyone arriving after that time will have to be collected by a parent."]},{"no":22,"pts":"2.6","head":"What happens to a pupil who arrives after eight?","text":"","opts":["They may travel on a later coach","They will be given a place on the next trip","They must be collected by a parent","They may join the group at the site"],"ans":"C","expl":"The notice says anyone arriving after that time will have to be collected by a parent. A, B and D describe arrangements the notice never offers."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"I think we may be jumping the gun here.\" What does this mean?","text":"","opts":["He thinks they are acting too soon","He thinks they are moving too slowly","He wants the decision to be taken by vote","He believes the deadline has already passed"],"ans":"A","expl":"To 'jump the gun' is to act before the right moment. B reverses the meaning, C describes a procedure he never proposes, and D describes a deadline he does not mention."},{"no":24,"pts":"2.6","head":"You see this notice in a museum: \"Audio guides are included with entry. A deposit is required and returned with the handset.\" What is the main message?","text":"","opts":["You pay a deposit for the guide and get it back when you return it","Audio guides cost extra and must be booked","Audio guides are available only to groups","The deposit is kept by the museum as a donation"],"ans":"A","expl":"The notice says the guide is included but a deposit is taken and returned with the handset. B contradicts 'included with entry', C adds a limit the notice does not set, and D contradicts 'returned'."},{"no":25,"pts":"2.6","head":"What does the text say about the root system of a mangrove?","text":"","opts":["It grows entirely below the surface of the mud","It traps sediment and takes the force out of waves","It prevents other plants from growing nearby","It must be replanted after every storm"],"ans":"B","expl":"The first paragraph says the tangled roots hold sediment and take the force out of waves. A contradicts the description of roots above the mud, C and D are never mentioned.","block":["Read the text and answer questions 25-27.","A mangrove forest sits where the land meets the sea. The trees stand on tangled roots that rise out of the mud, and that structure does two things at once. It traps sediment, so the coast builds up rather than washes away, and it takes the force out of waves before they reach the shore behind.","The value became obvious after a series of storms. Villages behind intact mangroves suffered far less damage than villages where the trees had been cleared for shrimp ponds. Engineers began to compare the cost of a sea wall with the cost of planting, and the planting usually won.","Replanting is not simple. Seedlings pushed into the wrong level of mud die within a season, and a plantation of a single species supports little of the wildlife that a natural forest holds. The projects that succeed tend to be those that restore the water flow first and let the forest seed itself."]},{"no":26,"pts":"2.6","head":"What did the storms reveal?","text":"","opts":["Shrimp ponds survived better than forests","Sea walls protected villages better than trees","Mangroves grow back quickly after a storm","Villages behind intact mangroves suffered less damage"],"ans":"D","expl":"The second paragraph says villages behind intact mangroves suffered far less damage than those where trees had been cleared. A and B reverse the comparison, and C is never claimed."},{"no":27,"pts":"2.6","head":"Which projects tend to succeed?","text":"","opts":["Those that plant a single fast-growing species","Those that build a sea wall at the same time","Those that plant seedlings as deep as possible","Those that restore the water flow and let the forest seed itself"],"ans":"D","expl":"The final paragraph says the successful projects restore the water flow first and let the forest seed itself. A contradicts the point about single species, B is never suggested, and C contradicts the warning about the wrong level of mud."},{"no":28,"pts":"2.6","head":"What does the text say about the first co-working spaces?","text":"","opts":["They began as shared rooms for freelancers","They were set up by large companies for their own staff","They were only found in capital cities","They charged by the year rather than by the day"],"ans":"A","expl":"The first paragraph says they began as shared rooms rented by freelancers. B describes the later change, C and D add limits the text does not state.","block":["Read the text and answer questions 28-30.","The first co-working spaces were simple. A few freelancers shared a room, split the rent and found that working beside other people was better than working alone at home. The model spread quickly, and for several years the customers were almost all individuals.","Large companies then became interested. A firm that cannot predict how many staff it will need in three years would rather rent a floor by the month than sign a twenty-year lease. Many operators now earn most of their money from corporate clients, which has changed what the spaces look like.","Something has been lost in the process. The early rooms mixed a designer, a translator and a software engineer at the same table, and useful conversations happened by accident. A floor occupied by one company is simply an office with a flexible contract. Some operators now reserve a proportion of desks for individuals in order to keep the mixture."]},{"no":29,"pts":"2.6","head":"Why did large companies become interested?","text":"","opts":["They wanted to reduce the cost of their own buildings","Their staff preferred working beside freelancers","They could not predict their future staff numbers","They were offered longer leases than before"],"ans":"C","expl":"The second paragraph says a firm that cannot predict how many staff it will need would rather rent by the month. A and B are never stated, and D reverses the attraction of a short commitment."},{"no":30,"pts":"2.6","head":"Why do some operators reserve desks for individuals?","text":"","opts":["To charge individuals a higher rate","To keep the mixture of different occupations","Because companies rarely fill a whole floor","Because individuals pay in advance"],"ans":"B","expl":"The final sentence says operators reserve desks for individuals in order to keep the mixture. A, C and D give reasons the text never offers."}]},{"variant":19,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Rarely ____ a committee ____ its own recommendations so quickly.","opts":["has / reversing","did / reversed","has / reversed","had / reverse"],"ans":"C","expl":"After 'Rarely' the auxiliary comes before the subject, and the present perfect is 'has ... reversed'. A uses an -ing form after 'has', B puts a past form after 'did', and D uses a base form after 'had'."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The hall ____ for concerts since the roof ____ in 2019.","opts":["is used / was repaired","has been used / was repaired","was used / had been repaired","had been used / is repaired"],"ans":"B","expl":"'Since' links a present perfect to a past event, so 'has been used ... was repaired' is correct. A uses a simple present for a period, C loses the connection with the present, and D reverses the tenses."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the shortage of seats, nobody was asked to stand during the lecture.","opts":["Although","Despite","Because of","Consequently"],"ans":"B","expl":"'Despite' is followed by a noun phrase and introduces a contrast. A and D need a clause, and C gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the absence of a clear deadline ____ allowed the work to drift.","opts":["what","which it","that","when"],"ans":"C","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, B adds an unnecessary pronoun, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the meter ____ regularly, the fault ____ months earlier.","opts":["been read / would have been noticed","been read / would be noticed","read / would have noticed","be read / will be noticed"],"ans":"A","expl":"This is an inverted third conditional in the passive: 'would have been noticed months earlier'. B leaves the result in the present, C is active and changes the meaning, and D uses a future form after an unreal condition."},{"no":6,"pts":"0.9","head":"Which option means that something was a bad idea and was done?","text":"","opts":["They shouldn't have ignored the warning.","They needn't have ignored the warning.","They didn't need to ignore the warning.","They couldn't have ignored the warning."],"ans":"A","expl":"'Shouldn't have ignored' criticises an action that was taken. B says it was unnecessary, C says there was no obligation, and D says it was impossible."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The board directed that the findings ____ to every member before the vote.","opts":["be circulated","are circulated","were circulated","circulate"],"ans":"A","expl":"After 'directed that' the subjunctive is used, and the passive form is 'be circulated'. B and C use ordinary tenses, and D is active and makes the findings do the circulating."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The new sensors are ____ more sensitive than the ones installed last year.","opts":["very","too","so","noticeably"],"ans":"D","expl":"Comparatives take modifiers such as 'noticeably', 'far' or 'much'. A and C cannot modify a comparative, and B would mean excessively sensitive."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The cyclist's route avoid the main road altogether.","The cyclists route's avoids the main road altogether.","The cyclists' route avoids the main road altogether.","The cyclists's route avoids the main road altogether."],"ans":"C","expl":"A plural ending in s takes the apostrophe after the s: 'the cyclists' route'. A has a plural verb with a singular subject, B puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me how often does the alarm sound?","Can you explain where did the leak begin?","Do you know whether the results have been checked?","I wonder when will the road reopen?"],"ans":"C","expl":"An indirect question keeps statement order: 'whether the results have been checked'. A, B and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two sides were unable to ____ the gap between their positions.","opts":["bridge","build","bend","bind"],"ans":"A","expl":"To 'bridge a gap' is to reduce or close it. 'Build', 'bend' and 'bind' do not collocate with 'gap' in this sense."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["lodge a complaint","drop a complaint quickly and tall","place a complaint","settle a complaint down"],"ans":"A","expl":"English says 'lodge a complaint' when it is made formally. C uses a verb that does not collocate with this noun, and B and D add words that make no sense in the phrase."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The instructions supplied with the machine were remarkably ~ambiguous~.","opts":["vague","lengthy","technical","unambiguous"],"ans":"D","expl":"'Ambiguous' means open to more than one meaning, so its opposite is 'unambiguous'. 'Vague' is close in meaning, and 'lengthy' and 'technical' describe length and register."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a taste?","text":"","opts":["luminous","bitter","tangy","savoury"],"ans":"A","expl":"'Luminous' describes something that gives out light and cannot be used of a taste. 'Bitter', 'tangy' and 'savoury' are all taste words."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The witness gave a ~graphic~ description of the events in the tunnel.","opts":["brief","confused","formal","vivid"],"ans":"D","expl":"'Graphic' here means vividly detailed, so 'vivid' is the closest match. 'Brief' describes length, 'confused' describes clarity, and 'formal' describes register."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The proposal met with widespread ____ from local residents.","opts":["approve","approving","approval","approvingly"],"ans":"C","expl":"After 'widespread' a noun is needed, and 'approval' is the noun. 'Approve' is a verb, 'approving' is a participle, and 'approvingly' is an adverb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The team was congratulated ____ the quality of its final report.","opts":["on","for","about","with"],"ans":"A","expl":"The verb 'congratulate' takes the preposition 'on' before the achievement. 'For' follows 'praise', 'about' follows 'complain', and 'with' is not used after this verb."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The report criticised the department for its ~opaque~ decision-making.","opts":["taking far longer than the rules allow","carried out by too few people","changed repeatedly without explanation","difficult for outsiders to understand or examine"],"ans":"D","expl":"'Opaque' here means impossible to see into, so decisions cannot be examined. A describes delay, B describes numbers, and C describes inconsistency."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"An anomaly is:","opts":["a formal objection raised during a debate","a summary of the main points of a report","something that differs from what is normal or expected","a delay caused by a shortage of materials"],"ans":"C","expl":"An 'anomaly' is something that does not fit the usual pattern. A describes an objection, B describes a summary, and D describes a delay."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["forthright","blunt","candid","direct"],"ans":"B","expl":"'Blunt' suggests speaking so plainly that feelings are hurt, and it carries criticism. 'Forthright', 'candid' and 'direct' describe the same openness approvingly."},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To announce the cancellation of the concert","To ask pupils to bring their own music stands","To invite parents to attend the rehearsals","To give the rehearsal arrangements for the orchestra"],"ans":"D","expl":"The notice gives the times, the seating rule, the arrangement for instruments and the deadline for absences. A, B and C concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","ORCHESTRA: REHEARSAL ARRANGEMENTS","Full rehearsals are on Monday afternoons and section rehearsals on Thursday lunchtimes. Players should be seated and tuned five minutes before the start. School instruments may be taken home for practice, but must be signed out at the music office each Friday. Anyone who cannot attend a rehearsal should tell the conductor at least two days in advance. Players who miss three full rehearsals will not perform in the concert."]},{"no":22,"pts":"2.6","head":"What must a player do to take a school instrument home?","text":"","opts":["Ask the conductor on Monday afternoon","Leave a deposit at the office","Return it before the section rehearsal","Sign it out at the music office on Friday"],"ans":"D","expl":"The notice says instruments must be signed out at the music office each Friday. A, B and C describe steps the notice never requires."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"The feedback has been a bit of a mixed bag.\" What does this mean?","text":"","opts":["All the feedback has been negative","Some of the feedback is good and some is not","The feedback has not arrived yet","The feedback came from several departments"],"ans":"B","expl":"A 'mixed bag' is a collection containing both good and bad. A takes only one side, C contradicts 'has been', and D describes the source rather than the content."},{"no":24,"pts":"2.6","head":"You see this notice at a pool: \"Lockers require a returnable coin. Items left after closing will be removed.\" What is the main message?","text":"","opts":["Lockers may be used free of charge","You need a coin, and anything left overnight is taken away","Lockers are emptied every hour during the day","Coins are not returned once a locker is used"],"ans":"B","expl":"The notice says a returnable coin is needed and that items left after closing will be removed. A ignores the coin, C invents a frequency, and D contradicts 'returnable'."},{"no":25,"pts":"2.6","head":"What does the text say about the cost of the new air quality sensors?","text":"","opts":["They are cheap enough to be installed in large numbers","They cost about the same as official monitors","They are too expensive for schools to buy","Their price has risen as demand has grown"],"ans":"A","expl":"The first paragraph says the sensors cost a tiny fraction of an official monitor and can therefore be fitted in hundreds. B and C contradict that, and D reverses the trend.","block":["Read the text and answer questions 25-27.","Official air quality monitors are large, accurate and expensive, and a city may have only a handful of them. A new generation of small sensors costs a tiny fraction of the price. They are less accurate individually, but they can be fitted to lamp posts and school railings in their hundreds.","Density turns out to matter more than precision. Pollution varies enormously over a few hundred metres, and a single official monitor cannot show that. A dense network reveals which streets are worst at which hours, and that is the information a council needs in order to act.","The results have changed behaviour rather than policy alone. Where sensors were placed outside schools, parents could see the effect of engines left running at the gate. Several schools introduced a no-idling rule, and readings fell within weeks. The sensors did not clean the air, but they made the problem visible."]},{"no":26,"pts":"2.6","head":"Why does density matter more than precision?","text":"","opts":["Cheap sensors cannot be calibrated at all","Pollution varies greatly over short distances","Official monitors are often out of order","Councils prefer to publish large amounts of data"],"ans":"B","expl":"The second paragraph says pollution varies enormously over a few hundred metres and a single monitor cannot show that. A, C and D give reasons the text never offers."},{"no":27,"pts":"2.6","head":"What happened at the schools where sensors were placed?","text":"","opts":["The council closed the roads outside at peak times","Parents could see the effect of idling engines","The sensors proved too fragile to keep working","Readings rose once the rule was introduced"],"ans":"B","expl":"The final paragraph says parents could see the effect of engines left running at the gate. A and C are never mentioned, and D reverses the fall in readings."},{"no":28,"pts":"2.6","head":"What does the text say about the speed of slow travel?","text":"","opts":["It is as fast as flying over short distances","It is only practical within a single country","The journey is treated as part of the holiday","It depends on avoiding all public transport"],"ans":"C","expl":"The first paragraph says the journey is counted as part of the holiday rather than as lost time. A contradicts the comparison with flying, B and D add limits the text does not set.","block":["Read the text and answer questions 28-30.","Slow travel is less a method than an attitude. The traveller goes overland, stops in places that were not the destination, and counts the journey as part of the holiday rather than as time lost. A trip that an aircraft would cover in two hours may take two days.","The environmental argument is the one most often quoted, and for a train it is strong. A seat on a long-distance train produces a small fraction of the emissions of the equivalent flight. The argument weakens for a car carrying one person, which some enthusiasts are reluctant to admit.","There is a practical obstacle. Booking a flight across a continent takes a few minutes, while booking the same journey by train may involve four operators and four websites. Several companies have appeared to solve exactly this problem, and their success suggests that the difficulty was never the trains themselves."]},{"no":29,"pts":"2.6","head":"Where does the environmental argument weaken?","text":"","opts":["On long-distance trains","On journeys of less than two hours","Where several operators are involved","For a car carrying one person"],"ans":"D","expl":"The second paragraph says the argument weakens for a car carrying one person. A contradicts the strong case for trains, and B and C refer to other points in the text."},{"no":30,"pts":"2.6","head":"What does the success of the new booking companies suggest?","text":"","opts":["Travellers prefer to book directly with operators","The trains themselves were never the difficulty","Flights will soon become more expensive","Most travellers book several months ahead"],"ans":"B","expl":"The final sentence says their success suggests the difficulty was never the trains themselves. A, C and D are conclusions the text never draws."}]},{"variant":20,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Little ____ the organisers ____ how much interest the exhibition would attract.","opts":["did / realised","had / realising","were / realise","did / realise"],"ans":"D","expl":"After the fronted negative 'Little' the auxiliary comes first and the verb stays in the base form. A adds a past form after 'did', B uses an -ing form, and C mixes 'were' with a base form."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The hall ____ as a cinema for years before the council ____ it into a library.","opts":["was used / converted","had been used / converted","has been used / converted","was being used / had converted"],"ans":"B","expl":"An earlier long use before a later change takes the past perfect passive 'had been used' with the past simple 'converted'. A loses the order, C uses a present perfect in a past narrative, and D reverses the sequence."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the heavy rain earlier in the week, the ground was firm enough to play on.","opts":["Although","In spite of","Because of","Moreover"],"ans":"B","expl":"'In spite of' is followed by a noun phrase and introduces a contrast. A and D need a clause, and C gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the tone of the letter ____ offended the committee, not its contents.","opts":["what","which it","where","that"],"ans":"D","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, B adds an unnecessary pronoun, and C refers to place rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the drains ____ cleared in the spring, the yard ____ flooded now.","opts":["were cleared / would not be","had been cleared / would not be","had been cleared / would not have been","are cleared / will not be"],"ans":"B","expl":"A past action with a present result takes the mixed conditional 'had been cleared / would not be'. A puts both halves in the present, C places the result in the past although 'now' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that something was possible but did not happen?","text":"","opts":["The driver must have taken the bypass.","The driver had to take the bypass.","The driver shouldn't have taken the bypass.","The driver could have taken the bypass."],"ans":"D","expl":"'Could have taken' describes an unused possibility. A is a confident conclusion, B states an obligation that was met, and C criticises an action that was taken."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The inspector recommended that the stairway ____ before the building reopened.","opts":["be widened","is widened","was widened","widens"],"ans":"A","expl":"After 'recommended that' the subjunctive is used, and the passive form is 'be widened'. B and C use ordinary tenses, and D is active and makes the stairway do the widening."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second edition is ____ clearer than the first.","opts":["very","too","so","far"],"ans":"D","exp
