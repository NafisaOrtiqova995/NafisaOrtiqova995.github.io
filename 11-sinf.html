efits the text never claims."},{"no":28,"pts":"2.6","head":"What does the text say about short daily sessions on language apps?","text":"","opts":["They are the main reason users give up","They work only for European languages","They suit beginners better than long lessons","They replace the need for any speaking practice"],"ans":"C","expl":"The first paragraph says short sessions suit a beginner better than one long weekly lesson. A reverses the point, B is never stated, and D contradicts the later discussion of speaking.","block":["Read the text and answer questions 28-30.","Language apps have made a daily habit easy. A learner can complete a short session on a bus or in a queue. Research on memory supports the method, since short sessions spread across a week suit a beginner better than one long lesson. Millions of people have started a language this way.","The difficulty appears later. Apps are good at vocabulary and at simple grammar. They are much weaker at the point where a learner must hold a real conversation, manage an interruption or ask somebody to repeat. These skills need another person, and most learners who stop say they stopped there.","Teachers increasingly treat the app as a tool rather than a rival. Vocabulary can be learned alone on a telephone, which leaves the lesson free for the things that need a room and a partner. Used that way, the app saves class time instead of competing for it."]},{"no":29,"pts":"2.6","head":"What are apps described as being weaker at?","text":"","opts":["Teaching the written alphabet","Holding a real conversation and managing interruptions","Explaining the rules of simple grammar","Keeping a learner interested for a week"],"ans":"B","expl":"The second paragraph says apps are much weaker at holding a real conversation, managing an interruption or asking for repetition. A is never mentioned, C is listed among their strengths, and D contradicts the easy daily habit."},{"no":30,"pts":"2.6","head":"How do teachers now use the apps?","text":"","opts":["As a tool that frees lesson time for speaking","As a replacement for classroom lessons","As a test at the end of each term","As a way of grading learners before they enrol"],"ans":"A","expl":"The final paragraph says vocabulary can be learned alone, which leaves the lesson free for what needs a room and a partner. B contradicts 'tool rather than a rival', and C and D are uses the text never describes."}]},{"variant":10,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"So severe ____ the damage that the hall ____ closed for a year.","opts":["did / remain","had / remaining","was / remained","were / remains"],"ans":"C","expl":"After a fronted 'So + adjective' the verb comes before the subject: 'So severe was the damage'. A uses 'did' where 'be' is required, B uses an -ing form, and D does not agree with the singular 'damage'."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The paintings ____ to the gallery only after the family ____ to part with them.","opts":["had been lent / agreed","have been lent / agreed","were being lent / had agreed","were lent / agreed"],"ans":"D","expl":"Both clauses describe finished past events in their natural order, so two past simple forms are correct. A and C place the lending before the agreement, which reverses the sense of 'only after', and B uses a present perfect in a past narrative."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the equipment was second-hand, it worked perfectly for another decade.","opts":["Despite","Even though","Owing to","Consequently"],"ans":"B","expl":"'Even though' introduces a contrast and takes a full clause. A needs a noun phrase, C gives a cause, and D is a linking adverb that cannot join the clauses."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was only when the accounts were audited ____ the discrepancy came to light.","opts":["that","when","which","then"],"ans":"A","expl":"A cleft beginning 'It was only when ...' is completed by 'that'. B and D cannot introduce the second clause, and C would need a noun to refer back to."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the warning ____ in time, the crop ____ now be ready for harvest.","opts":["had come / would","came / would","had come / would have","comes / will"],"ans":"A","expl":"A past condition with a present result takes the mixed conditional 'had come / would ... be'. B puts both halves in the present, C places the result in the past although 'now' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that somebody was obliged to act?","text":"","opts":["The driver was supposed to stop at the barrier.","The driver needn't have stopped at the barrier.","The driver could have stopped at the barrier.","The driver had to stop at the barrier."],"ans":"D","expl":"'Had to stop' states a real obligation that was carried out. A suggests an expectation rather than a rule, B says the stop was unnecessary, and C describes a possibility that was not taken."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The board proposed that the vote ____ until the following meeting.","opts":["is postponed","was postponed","be postponed","postpones"],"ans":"C","expl":"After 'proposed that' the subjunctive is used, and the passive form is 'be postponed'. A and B use ordinary tenses, and D is active and makes the vote do the postponing."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second proposal was ____ more detailed than the first one.","opts":["far","very","too","quite"],"ans":"A","expl":"Comparatives take modifiers such as 'far', 'much' or 'considerably'. B and D cannot modify a comparative, and C would mean excessively detailed."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The boy's changing rooms were repainted during the holidays.","The boys' changing rooms were repainted during the holidays.","The boys changing room's were repainted during the holidays.","The boys's changing rooms were repainted during the holidays."],"ans":"B","expl":"A plural ending in s takes the apostrophe after the s: 'the boys' changing rooms'. A is singular, C puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know how long does the guarantee last?","Could you tell me when will the results appear?","Can you explain where did the fault begin?","I would like to know what the new procedure involves."],"ans":"D","expl":"An indirect question keeps statement order: 'what the new procedure involves'. A, B and C all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The council agreed to ____ the new regulations until the autumn.","opts":["differ","deflect","deduct","defer"],"ans":"D","expl":"To 'defer' something is to delay it to a later time. 'Differ' means to be unlike, 'deflect' means to turn aside, and 'deduct' means to subtract."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["carry a resemblance","bear a resemblance","hold a resemblance loudly and wide","lift a resemblance"],"ans":"B","expl":"English says 'bear a resemblance'. A and D use verbs that do not collocate with this noun, and C adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The tone of the letter was surprisingly ~conciliatory~.","opts":["hostile","friendly","formal","brief"],"ans":"A","expl":"'Conciliatory' means intended to end a disagreement, so its opposite is 'hostile'. 'Friendly' is close in meaning, and 'formal' and 'brief' describe style and length."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a meal?","text":"","opts":["hearty","bland","buoyant","lavish"],"ans":"C","expl":"'Buoyant' describes something that floats or a cheerful mood, and it is not used of a meal. 'Hearty' means large and satisfying, 'bland' means lacking flavour, and 'lavish' means very generous."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The curator described the find as ~unprecedented~ in the history of the museum.","opts":["unexpected","undamaged","unfinished","unparalleled"],"ans":"D","expl":"'Unprecedented' means never having happened before, so 'unparalleled' is the closest match. 'Unexpected' refers to surprise, 'undamaged' to condition, and 'unfinished' to completeness."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The results were entirely ____ of the method used to collect them.","opts":["independence","independent","independently","depend"],"ans":"B","expl":"After 'were' and the adverb 'entirely' an adjective is needed, and 'independent of' is the fixed pattern. 'Independence' is a noun, 'independently' is an adverb, and 'depend' is a verb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The findings are at odds ____ everything reported by the earlier team.","opts":["to","of","with","from"],"ans":"C","expl":"The fixed phrase is 'at odds with', meaning in conflict with. 'To', 'of' and 'from' are not used in this expression."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The spokesman gave an answer that was deliberately ~ambiguous~.","opts":["expressed in unusually technical language","capable of being understood in more than one way","much longer than the question required","repeated word for word from an earlier statement"],"ans":"B","expl":"'Ambiguous' means open to more than one interpretation, which is why the answer was deliberate. A describes jargon, C describes length, and D describes repetition."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A contingency is:","opts":["a group of people sent to represent an organisation","a charge added to a bill at the last moment","a possible future event that must be planned for","an agreement that cannot legally be broken"],"ans":"C","expl":"A 'contingency' is a possible event that you prepare for in case it happens. A describes a delegation, B describes a surcharge, and D describes a binding contract."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["generous","extravagant","charitable","open-handed"],"ans":"B","expl":"'Extravagant' suggests spending more than is sensible and carries criticism. 'Generous', 'charitable' and 'open-handed' describe the same giving in an approving way."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To announce that the examinations have been postponed","To set out the rules for candidates in the hall","To invite pupils to collect their timetables","To explain how results will be published"],"ans":"B","expl":"The notice lists what candidates may bring, when they may leave and what happens if they are late. A contradicts the arrangements, C and D concern matters the notice never covers.","block":["Read the text and answer questions 21-22.","EXAMINATION HALL: RULES FOR CANDIDATES","Candidates must be seated five minutes before the start. Only pens, pencils and a clear water bottle may be brought to the desk. Bags and telephones are to be left on the shelves by the door. Nobody may leave during the first thirty minutes or the last ten. A candidate who arrives late may still sit the paper, but no extra time will be given."]},{"no":22,"pts":"2.6","head":"What happens to a candidate who arrives late?","text":"","opts":["The paper is taken away immediately","They must wait until the next session","They may sit the paper but get no extra time","They are given ten extra minutes at the end"],"ans":"C","expl":"The notice says a late candidate may still sit the paper but no extra time will be given. A and B are harsher than the rule, and D contradicts it directly."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"That idea is on the back burner for now.\" What does this mean?","text":"","opts":["The idea has been rejected completely","The idea is being dealt with urgently","The idea has been passed to another department","The idea is being left aside for the time being"],"ans":"D","expl":"To put something 'on the back burner' is to leave it aside without cancelling it. A makes it permanent, B reverses the meaning, and C describes a transfer he never mentions."},{"no":24,"pts":"2.6","head":"You see this notice in a cinema: \"Latecomers will be admitted at a suitable break in the film.\" What is the main message?","text":"","opts":["Latecomers must wait for the next showing","Latecomers are let in when there is a good moment","Latecomers must sit in the back row","Latecomers will be given a free ticket"],"ans":"B","expl":"The notice says latecomers are admitted at a suitable break. A contradicts that, and C and D describe conditions the notice never sets."},{"no":25,"pts":"2.6","head":"What does the text say about the temperature difference in cities?","text":"","opts":["It can reach several degrees at night","It is greatest in the middle of the day","It disappears completely in winter","It is caused mainly by vehicle exhaust"],"ans":"A","expl":"The first paragraph says the difference is largest at night and can reach several degrees. B reverses the timing, C contradicts the year-round effect, and D names one cause the text does not single out.","block":["Read the text and answer questions 25-27.","A city is warmer than the countryside around it. Brick, concrete and asphalt absorb heat all day and release it slowly after dark. The difference is largest at night and can reach several degrees. Engineers call this the urban heat island, and it appears in every season.","The effect used to be a curiosity. It now matters because summer heatwaves are becoming more frequent, and the hottest nights are the dangerous ones. A body that cannot cool down between one hot day and the next is far more likely to suffer. Hospital admissions rise sharply after three warm nights in a row.","The remedies are well understood but slow. Trees shade the pavement and cool the air as water evaporates from their leaves. Pale roofs reflect sunlight instead of storing it. Both work, and both take years to arrange. Several cities now count their trees as infrastructure, alongside the drains and the cables."]},{"no":26,"pts":"2.6","head":"Why do the hottest nights matter most?","text":"","opts":["A body cannot cool down between hot days","Most accidents happen after dark","Air quality is worst during the night","Hospitals have fewer staff at night"],"ans":"A","expl":"The second paragraph says a body that cannot cool down between one hot day and the next is far more likely to suffer. B, C and D give reasons the text never offers."},{"no":27,"pts":"2.6","head":"How do trees help, according to the text?","text":"","opts":["They shade pavements and cool the air by evaporation","They reflect sunlight away from the roofs","They absorb heat and release it slowly at night","They reduce the number of vehicles in the centre"],"ans":"A","expl":"The final paragraph says trees shade the pavement and cool the air as water evaporates from their leaves. B describes pale roofs, C describes the building materials that cause the problem, and D is never mentioned."},{"no":28,"pts":"2.6","head":"What does the text say about the cost of starting a podcast?","text":"","opts":["It is low, which explains the number of new shows","It requires a professional studio from the beginning","It has risen sharply over the last five years","It is met by advertisers in almost every case"],"ans":"A","expl":"The first paragraph says the cost of starting is very low and links this to the number of shows. B contradicts the microphone and laptop, C reverses the trend, and D is contradicted by the point about advertising later.","block":["Read the text and answer questions 28-30.","Anyone with a microphone and a laptop can publish a podcast. The cost of starting is very low, which explains why several million shows now exist. Most of them are short-lived. A large majority stop within ten episodes, usually because the work turns out to be steadier than the maker expected.","The audience behaves differently from a radio audience. Listeners choose a programme deliberately and often stay with it for years. They also listen while doing something else, which favours conversation over complicated production. A show that would be unbearable on the radio can work perfectly in a pair of headphones.","Money arrives late if it arrives at all. Advertising pays well only above a certain audience, and most shows never reach it. Many makers now ask listeners to pay a small monthly sum instead, and a show with two thousand committed listeners can support one person reasonably well."]},{"no":29,"pts":"2.6","head":"Why do most podcasts stop within ten episodes?","text":"","opts":["The equipment proves too expensive","Listeners rarely finish a whole series","The work is steadier than the maker expected","Advertisers withdraw their support early"],"ans":"C","expl":"The first paragraph says a large majority stop within ten episodes, usually because the work turns out to be steadier than expected. A contradicts the low cost, B contradicts the loyal audience described, and D is never mentioned."},{"no":30,"pts":"2.6","head":"What does the text say about asking listeners to pay?","text":"","opts":["It works only for shows with advertising as well","Most listeners refuse to pay anything at all","It has replaced advertising on every large show","Two thousand committed listeners can support one person"],"ans":"D","expl":"The final paragraph says a show with two thousand committed listeners can support one person reasonably well. A and C overstate the relationship with advertising, and B contradicts the point being made."}]},{"variant":11,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Little ____ the organisers ____ how many people would arrive.","opts":["did / realised","had / realising","were / realise","did / realise"],"ans":"D","expl":"After the fronted negative 'Little' the auxiliary comes before the subject and the verb stays in the base form: 'did the organisers realise'. A adds a past form after 'did', B uses an -ing form, and C mixes 'were' with a base form."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The road signs ____ three times before the council ____ that the junction itself was the problem.","opts":["were changed / accepted","have been changed / accepted","were being changed / had accepted","had been changed / accepted"],"ans":"D","expl":"Repeated earlier events before a later realisation take the past perfect passive 'had been changed' with the past simple 'accepted'. A loses the order, B uses a present perfect in a past narrative, and C reverses the sequence."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the clear instructions, several forms were returned incomplete.","opts":["In spite of","Although","Because of","Nonetheless"],"ans":"A","expl":"'In spite of' is followed by a noun phrase and introduces a contrast. B and D need a clause, and C gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the absence of any written record ____ made the inquiry so difficult.","opts":["what","that","which it","where"],"ans":"B","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, C adds an unnecessary pronoun, and D refers to place rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the parts ____ on time, the line ____ running by now.","opts":["arrived / would have been","arrived / would be","been arrived / would be","arrive / will be"],"ans":"B","expl":"This is an inverted mixed conditional: the past delivery has a present result, so 'would be running by now' is correct. A places the result in the past although 'by now' is stated, C adds an unnecessary passive, and D uses a future form after an unreal condition."},{"no":6,"pts":"0.9","head":"Which option means that something is not allowed?","text":"","opts":["Candidates needn't use a dictionary.","Candidates may not use a dictionary.","Candidates don't have to use a dictionary.","Candidates shouldn't have used a dictionary."],"ans":"B","expl":"'May not' expresses a prohibition in formal instructions. A and C say only that it is unnecessary, and D criticises something already done."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is vital that the backup ____ at the end of every working day.","opts":["is run","be run","was run","runs"],"ans":"B","expl":"After 'It is vital that' the subjunctive is used, and the passive form is 'be run'. A and C use ordinary tenses, and D is active and makes the backup do the running."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The replacement pump is ____ quieter than the original one.","opts":["too","very","markedly","so"],"ans":"C","expl":"Comparatives take modifiers such as 'markedly', 'far' or 'much'. A would mean excessively quiet, and B and D cannot modify a comparative."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The two chef's knives were stored in separate cases.","The two chefs knives' were stored in separate cases.","The two chefs's knives were stored in separate cases.","The two chefs' knives were stored in separate cases."],"ans":"D","expl":"A plural ending in s takes the apostrophe after the s: 'the two chefs' knives'. A is singular after 'two', B puts the apostrophe on the wrong word, and C adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know how much does the licence cost?","Could you tell me whether the form has been received?","Can you explain when will the hearing take place?","I wonder why did the supplier withdraw?"],"ans":"B","expl":"An indirect question keeps statement order: 'whether the form has been received'. A, C and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two sides eventually managed to ____ an agreement after months of talks.","opts":["hammer in","hammer down","hammer out","hammer up"],"ans":"C","expl":"To 'hammer out' an agreement is to reach it after long and difficult discussion. The other combinations are not English phrases for reaching agreement."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["put a precedent","place a precedent sharply and green","lay a precedent","set a precedent"],"ans":"D","expl":"English says 'set a precedent'. A and C use verbs that do not collocate with this noun, and B adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The results of the first trial were decidedly ~encouraging~.","opts":["disappointing","promising","preliminary","public"],"ans":"A","expl":"'Encouraging' means giving grounds for hope, so its opposite is 'disappointing'. 'Promising' is a synonym, and 'preliminary' and 'public' describe stage and openness."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a performance?","text":"","opts":["absorbent","polished","uneven","riveting"],"ans":"A","expl":"'Absorbent' describes a material that soaks up liquid and cannot be used of a performance. 'Polished' means highly skilled, 'uneven' means inconsistent, and 'riveting' means extremely interesting."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The design was criticised for being needlessly ~ostentatious~.","opts":["costly","heavy","showy","unusual"],"ans":"C","expl":"'Ostentatious' means designed to impress by display, so 'showy' is the closest match. 'Costly' refers to price, 'heavy' to weight, and 'unusual' to rarity."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The museum relies on the ____ of several private collectors.","opts":["generous","generously","generosities","generosity"],"ans":"D","expl":"After 'the' and before 'of' a singular noun is needed, and 'generosity' is the noun. 'Generous' is an adjective, 'generously' is an adverb, and the plural form is not used in this sense."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme is open to anybody ____ of age or experience.","opts":["apart","instead","besides","regardless"],"ans":"D","expl":"'Regardless of' means without considering, which fits a scheme open to everybody. 'Apart' needs 'from', 'instead' needs 'of' but reverses the sense, and 'besides' means in addition to."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The committee was accused of being ~partisan~ in its choice of witnesses.","opts":["unwilling to reach any decision at all","unable to agree on a date for the hearing","strongly favouring one side in a dispute","choosing witnesses purely at random"],"ans":"C","expl":"'Partisan' means strongly supporting one side, which is why the accusation is serious. A describes indecision, B describes a scheduling problem, and D describes the opposite of bias."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A moratorium is:","opts":["a written record of what was said at a meeting","a tax charged on imported goods","a building used for storing public documents","an official pause in an activity for a fixed period"],"ans":"D","expl":"A 'moratorium' is an official suspension of an activity for a period. A describes minutes, B describes a tariff, and C describes an archive."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["miserly","thrifty","economical","careful"],"ans":"A","expl":"'Miserly' describes somebody who hates parting with money, and it is always critical. 'Thrifty', 'economical' and 'careful' describe the same restraint approvingly."},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To explain the new membership arrangements","To announce that the club is closing","To ask members to pay a higher subscription","To invite non-members to a free trial session"],"ans":"A","expl":"The notice sets out when membership runs, how to renew and what the card is needed for. B contradicts the continuing sessions, C says the fee is unchanged, and D is never mentioned.","block":["Read the text and answer questions 21-22.","MEMBERSHIP: WHAT CHANGES IN SEPTEMBER","From September membership will run from the first of the month rather than from the date of joining. Existing members will have their current year extended to the end of August at no extra cost. The annual fee itself is unchanged. Renewal can be completed online or at the desk, and a card will be issued within a week. Members will need the card to book a court, although not to enter the building."]},{"no":22,"pts":"2.6","head":"What is the card needed for?","text":"","opts":["Entering the building","Paying the annual fee","Booking a court","Extending the current year"],"ans":"C","expl":"The notice says the card is needed to book a court but not to enter the building. A is explicitly excluded, and B and D describe actions the card is never linked to."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"I think the dispute has run its course.\" What does this mean?","text":"","opts":["The dispute has reached its natural end","The dispute is about to become more serious","The dispute has been referred to a court","The dispute has lasted longer than expected"],"ans":"A","expl":"If something 'has run its course' it has finished naturally. B reverses the meaning, C describes a step he never mentions, and D comments on length rather than completion."},{"no":24,"pts":"2.6","head":"You see this notice in a pharmacy: \"Prescriptions submitted after 4 p.m. will be ready the following morning.\" What is the main message?","text":"","opts":["Prescriptions handed in late are collected next day","The pharmacy closes at four o'clock","Morning collection is cheaper than afternoon collection","No prescriptions are accepted after four o'clock"],"ans":"A","expl":"The notice says prescriptions submitted after four will be ready the following morning. B and D assume a closure the notice does not state, and C invents a difference in price."},{"no":25,"pts":"2.6","head":"What does the text say about wind speeds at sea?","text":"","opts":["They are lower than on land but more reliable","They are stronger and steadier than on land","They vary too much to be useful for power","They are strongest close to the shore"],"ans":"B","expl":"The first paragraph says winds at sea are stronger and steadier than on land. A reverses the strength, C contradicts 'steadier', and D is the opposite of the point about deep water.","block":["Read the text and answer questions 25-27.","Wind turbines at sea produce more power than those on land. The winds there are stronger and steadier, and there are no neighbours to object to the noise. Turbines have also grown. A single modern machine can supply several thousand homes, which was unimaginable twenty years ago.","The engineering is harder than it looks. Salt water attacks everything, maintenance requires a boat and a calm day, and a fault in a cable on the seabed is expensive to find. Costs nevertheless fell sharply through the last decade as the industry learned to build in series rather than one at a time.","The newest problem is depth. The best winds are often far from shore, where the water is too deep for a tower fixed to the seabed. Floating turbines, anchored by chains, are now being tested. They cost more at present, but they open an area of sea many times larger than the one in use today."]},{"no":26,"pts":"2.6","head":"Why did costs fall sharply through the last decade?","text":"","opts":["The industry learned to build in series","Salt water damage proved less serious than feared","Maintenance boats became much cheaper","Governments paid for the seabed cables"],"ans":"A","expl":"The second paragraph says costs fell as the industry learned to build in series rather than one at a time. B, C and D give reasons the text never offers."},{"no":27,"pts":"2.6","head":"What is the advantage of floating turbines?","text":"","opts":["They are cheaper than fixed turbines today","They open a far larger area of sea","They need no maintenance at all","They can be moved to follow the wind"],"ans":"B","expl":"The final paragraph says floating turbines open an area of sea many times larger than the one in use. A is contradicted by 'they cost more at present', and C and D are never claimed."},{"no":28,"pts":"2.6","head":"What does the text say about the second-hand clothing market?","text":"","opts":["It is shrinking as new clothes become cheaper","It is growing faster than the market for new clothes","It is limited to a few large cities","It depends entirely on charity shops"],"ans":"B","expl":"The first paragraph says the market is growing several times faster than the market for new clothes. A reverses the trend, C ignores the online platforms, and D contradicts the platforms described.","block":["Read the text and answer questions 28-30.","Buying used clothes was once a matter of necessity. It is now a market growing several times faster than the market for new clothes. Online platforms let anybody photograph a garment and sell it within minutes, and a generation that buys this way sees nothing unusual in it.","The environmental argument is strong but not simple. A garment worn twice as long halves its yearly footprint, which is a real saving. Researchers warn, however, that cheap resale can encourage people to buy more in the first place, knowing that they can pass things on afterwards.","Retailers have noticed. Several large chains now run their own resale sections, taking a share of the price and keeping the customer inside the brand. Campaigners are divided. Some welcome any extension of a garment's life, while others argue that a company selling a million new items cannot be judged by its small resale counter."]},{"no":29,"pts":"2.6","head":"What warning do researchers give?","text":"","opts":["Used clothes wear out faster than new ones","Online platforms rarely check the quality","Cheap resale may encourage people to buy more","Resale prices are falling too quickly"],"ans":"C","expl":"The second paragraph says researchers warn that cheap resale can encourage people to buy more in the first place. A, B and D are concerns the text never raises."},{"no":30,"pts":"2.6","head":"Why are campaigners divided?","text":"","opts":["Some believe used clothes are unsafe to wear","Some want resale to be limited to charities","Some think resale sections cannot offset large new sales","Some object to the photographs used online"],"ans":"C","expl":"The final paragraph says some campaigners argue that a company selling a million new items cannot be judged by its small resale counter. A, B and D are positions the text never reports."}]},{"variant":12,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"On no account ____ the door ____ unlocked overnight.","opts":["should / leave","should / be left","is / left","must / leaving"],"ans":"B","expl":"After 'On no account' the auxiliary comes before the subject, and the door is acted upon, so the passive 'should be left' is needed. A is active, C keeps statement order, and D uses an -ing form after a modal."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The manuscript ____ in a private collection for years before a scholar ____ its importance.","opts":["remained / recognised","had remained / recognised","has remained / recognised","was remaining / had recognised"],"ans":"B","expl":"A state continuing up to a later past event takes the past perfect 'had remained' with the past simple 'recognised'. A loses the time relationship, C uses a present perfect in a past narrative, and D reverses the order."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the heavy rain had continued for days, the river never came close to flooding.","opts":["Despite","Because","Even though","Thus"],"ans":"C","expl":"'Even though' introduces a contrast and takes a full clause. A needs a noun phrase, B gives a cause, and D is a linking adverb that cannot join the clauses."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the missing signature ____ delayed the whole application by a month.","opts":["what","that","which it","when"],"ans":"B","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, C adds a pronoun the sentence does not need, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the architect ____ the slope of the ground, the building ____ level today.","opts":["measured / would be","had measured / would have been","had measured / would be","measures / will be"],"ans":"C","expl":"A past action with a present result takes the mixed conditional 'had measured / would be'. A puts both halves in the present, B places the result in the past although 'today' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that something definitely did not happen?","text":"","opts":["He may not have seen the message.","He cannot have seen the message.","He might not have seen the message.","He did not need to see the message."],"ans":"B","expl":"'Cannot have seen' expresses a confident conclusion that it did not happen. A and C express uncertainty, and D states only that it was unnecessary."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The committee recommended that the post ____ before the end of the year.","opts":["is advertised","was advertised","be advertised","advertises"],"ans":"C","expl":"After 'recommended that' the subjunctive is used, and the passive form is 'be advertised'. A and B use ordinary tenses, and D is active and makes the post do the advertising."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The new timetable is ____ more generous with changeover times.","opts":["very","so","considerably","too"],"ans":"C","expl":"Comparatives take modifiers such as 'considerably', 'far' or 'much'. A and B cannot modify a comparative, and D would mean excessively generous."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The nurse's station are at the far end of the ward.","The nurses' station is at the far end of the ward.","The nurses station's is at the far end of the ward.","The nurses's station is at the far end of the ward."],"ans":"B","expl":"A plural ending in s takes the apostrophe after the s: 'the nurses' station'. A has a plural verb with a singular subject, C puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know what the deadline for applications is?","Could you tell me how often is the bin emptied?","Can you explain where has the key been put?","I wonder why did the alarm sound?"],"ans":"A","expl":"An indirect question keeps statement order: 'what the deadline for applications is'. B, C and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two departments were asked to ____ their plans before the deadline.","opts":["bring about","bring along","bring round","bring forward"],"ans":"D","expl":"To 'bring forward' a plan is to move it to an earlier date. 'Bring about' means to cause, 'bring along' means to take somebody with you, and 'bring round' means to persuade."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["catch a compromise","grasp a compromise firmly and blue","reach a compromise","seize a compromise"],"ans":"C","expl":"English says 'reach a compromise'. A and D use verbs that do not collocate with this noun, and B adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The explanation offered at the meeting was entirely ~coherent~.","opts":["muddled","logical","lengthy","technical"],"ans":"A","expl":"'Coherent' means clear and logically connected, so its opposite is 'muddled'. 'Logical' is a synonym, and 'lengthy' and 'technical' describe length and register."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a surface?","text":"","opts":["uneven","glossy","abrasive","eloquent"],"ans":"D","expl":"'Eloquent' describes persuasive speech and cannot be used of a surface. 'Uneven' means not flat, 'glossy' means shiny, and 'abrasive' means rough enough to scratch."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The report was criticised for its ~superficial~ treatment of the evidence.","opts":["hostile","lengthy","shallow","confidential"],"ans":"C","expl":"'Superficial' means dealing only with the surface, so 'shallow' is the closest match. 'Hostile' describes attitude, 'lengthy' describes size, and 'confidential' describes secrecy."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The findings have serious ____ for the way the service is funded.","opts":["implicate","implicit","implicitly","implications"],"ans":"D","expl":"After the adjective 'serious' a plural noun is needed, and 'implications for' is the fixed pattern. 'Implicate' is a verb, 'implicit' is an adjective, and 'implicitly' is an adverb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The outcome was largely independent ____ the method chosen.","opts":["from","to","of","with"],"ans":"C","expl":"The adjective 'independent' takes the preposition 'of'. 'From' follows 'different' in some varieties, 'to' follows 'similar', and 'with' follows 'consistent'."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The measures were described as a ~stopgap~ until proper funding was found.","opts":["a sum of money set aside for emergencies","something used temporarily until a better solution appears","a rule that applies only to new applicants","a meeting held at very short notice"],"ans":"B","expl":"A 'stopgap' is a temporary measure used until something better is available. A describes a reserve fund, C describes a regulation, and D describes an emergency meeting."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A grievance is:","opts":["a complaint about unfair treatment at work","a payment made to somebody who has retired","a meeting held before a formal interview","a period of leave granted after an illness"],"ans":"A","expl":"A 'grievance' is a formal complaint about unfair treatment. B describes a pension, C describes a briefing, and D describes sick leave."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["persuasive","convincing","eloquent","manipulative"],"ans":"D","expl":"'Manipulative' describes somebody who influences others unfairly for their own ends, and it is always critical. 'Persuasive', 'convincing' and 'eloquent' describe the same skill without that judgement."},{"no":21,"pts":"2.6","head":"Why has this notice been displayed?","text":"","opts":["To explain how to apply for a resident permit","To announce that parking will become free","To warn drivers that the car park is closing","To invite residents to a meeting about parking"],"ans":"A","expl":"The notice sets out who may apply for a permit, what is needed and how long it takes. B contradicts the annual charge, C and D describe events the notice never mentions.","block":["Read the text and answer questions 21-22.","RESIDENT PARKING PERMITS","Permits are available to anyone whose address falls inside the shaded area on the map at the entrance. Applicants must show a recent utility bill and the vehicle registration document. One permit is issued per household, and a second may be requested but is not guaranteed. The annual charge is payable when the permit is collected. Applications normally take five working days, but longer during August."]},{"no":22,"pts":"2.6","head":"What does the notice say about a second permit?","text":"","opts":["It may be requested but is not certain","It costs twice the annual charge","It is issued automatically to large households","It is only available during August"],"ans":"A","expl":"The notice says a second permit may be requested but is not guaranteed. B invents a price, C contradicts the one-per-household rule, and D misreads the note about processing time."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"Let us get the ball rolling on the survey this week.\" What does this mean?","text":"","opts":["He wants the survey to be started this week","He wants the survey finished this week","He wants the survey to be cancelled","He wants somebody else to take over the survey"],"ans":"A","expl":"To 'get the ball rolling' is to start something. B turns a start into a deadline, C reverses the meaning, and D describes a transfer he never mentions."},{"no":24,"pts":"2.6","head":"You see this notice at a gym: \"Induction required before first use of the weights room. Book at reception.\" What is the main message?","text":"","opts":["The weights room is closed to new members","Reception staff will train you during every visit","Only members who book in advance may enter the gym","You must complete an induction before using the weights"],"ans":"D","expl":"The notice says an induction is required before the first use of the weights room and that it is booked at reception. A is too absolute, B overstates the induction, and C widens the rule to the whole gym."},{"no":25,"pts":"2.6","head":"What does the text say about the range of delivery drones?","text":"","opts":["They can fly for several hundred kilometres","They are limited to short distances by battery weight","Their range is set by national regulations","They fly further in cold weather"],"ans":"B","expl":"The second paragraph says battery weight limits the distance and that most services work within a few kilometres. A overstates the range, C confuses regulation with physics, and D is never mentioned.","block":["Read the text and answer questions 25-27.","Delivery by drone has been promised for more than a decade. A few services now operate, mainly carrying medical supplies to places that are hard to reach by road. In one African programme, blood is flown to rural clinics within half an hour of a request. The saving in time can matter enormously.","General shopping is a different matter. Battery weight limits the distance a drone can travel with a load, and most services work within a few kilometres of their base. Noise is a further obstacle. A single machine is tolerable, but residents object strongly once several pass over the same street each hour.","Regulators move slowly, and with reason. A drone that fails above a road is dangerous in a way that a delayed parcel is not. Most countries therefore allow flights only along approved corridors and within sight of an operator, which keeps the service small and the cost per delivery high."]},{"no":26,"pts":"2.6","head":"Why do residents object to drone deliveries?","text":"","opts":["The machines block satellite signals","The deliveries are left in the wrong place","The drones fly too close to windows","Several machines an hour over one street are noisy"],"ans":"D","expl":"The second paragraph says a single machine is tolerable but residents object once several pass over the same street each hour. A, B and C are complaints the text never records."},{"no":27,"pts":"2.6","head":"Why do regulators move slowly?","text":"","opts":["Drone technology changes too quickly to assess","The industry has refused to supply information","Most countries lack the staff to inspect drones","A drone that fails above a road is dangerous"],"ans":"D","expl":"The final paragraph says a drone that fails above a road is dangerous in a way a delayed parcel is not. A, B and C give reasons the text never offers."},{"no":28,"pts":"2.6","head":"What does the text say about the origin of silent discos?","text":"","opts":["They started at festivals where noise was restricted","They began as a way of dancing after curfew hours","They were invented for people with hearing difficulties","They were first held inside recording studios"],"ans":"A","expl":"The first paragraph says the idea began at festivals where licences limited noise after a certain hour. B and D invent other origins, and C describes a use the text never mentions.","block":["Read the text and answer questions 28-30.","At a silent disco the music is sent to wireless headphones rather than to loudspeakers. The idea began at festivals, where licences limited noise after a certain hour. Organisers found that dancing could continue long past the point at which a sound system would have to be switched off.","The format turned out to have advantages nobody had planned. Several channels can run at once, so two or three disc jockeys play to the same floor and dancers choose between them by pressing a button. Conversation is also possible, because anybody who lifts a headphone can hear the room rather than the music.","Not everyone is convinced. Some organisers say the shared experience is weakened when half the floor is listening to something else. Others point out that the headphones must be cleaned, charged and counted, and that a set costs more than most small venues can justify for an occasional night."]},{"no":29,"pts":"2.6","head":"What unplanned advantage does the text describe?","text":"","opts":["The headphones are cheaper than loudspeakers","Dancers can choose between several channels","Festivals can start earlier in the day","Organisers need fewer staff than before"],"ans":"B","expl":"The second paragraph says several channels can run at once and dancers choose between them. A contradicts the cost point made later, and C and D are never mentioned."},{"no":30,"pts":"2.6","head":"What practical objection is raised in the final paragraph?","text":"","opts":["The headphones are expensive for small venues","Dancers refuse to wear the headphones","The channels interfere with one another","Licences are harder to obtain than before"],"ans":"A","expl":"The final paragraph says a set costs more than most small venues can justify for an occasional night. B, C and D are problems the text never reports."}]},{"variant":13,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Scarcely ____ the ceremony ended when the rain ____ again.","opts":["has / started","had / started","did / started","had / had started"],"ans":"B","expl":"The pattern is 'Scarcely had ... when + past simple', with the auxiliary before the subject. A uses a present perfect, C uses 'did' with a past form, and D wrongly makes both verbs past perfect."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The sculptures ____ in storage for thirty years before the trust ____ to display them.","opts":["had been kept / decided","were kept / decided","have been kept / decided","were being kept / had decided"],"ans":"A","expl":"A long period before a later decision takes the past perfect passive 'had been kept' with the past simple 'decided'. B loses the order, C uses a present perfect in a past narrative, and D reverses the events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the long delay, not a single passenger complained to the staff.","opts":["Although","Despite","Because of","However"],"ans":"B","expl":"'Despite' is followed by a noun phrase and introduces a contrast. A and D need a clause, and C gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the quality of the recording ____ persuaded the panel to award the prize.","opts":["what","which it","that","when"],"ans":"C","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, B adds an unnecessary pronoun, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the survey ____ a year earlier, the damage ____ far less serious now.","opts":["been carried out / would have been","carried out / would be","be carried out / will be","been carried out / would be"],"ans":"D","expl":"This is an inverted mixed conditional: a past action with a present result, so 'would be far less serious now' is correct. A places the result in the past although 'now' is stated, B is active and changes the meaning, and C uses a future form after an unreal condition."},{"no":6,"pts":"0.9","head":"Which option means that an action was a mistake?","text":"","opts":["You needn't have signed the form.","You didn't have to sign the form.","You couldn't have signed the form.","You shouldn't have signed the form."],"ans":"D","expl":"'Shouldn't have signed' criticises an action that was taken. A says it was unnecessary but done, B says there was no obligation, and C says it was impossible."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The regulations require that each container ____ clearly before transport.","opts":["be labelled","is labelled","was labelled","labels"],"ans":"A","expl":"After 'require that' the subjunctive is used, and the passive form is 'be labelled'. B and C use ordinary tenses, and D is active and makes the container do the labelling."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The revised route is ____ shorter than the one used last year.","opts":["too","appreciably","very","so"],"ans":"B","expl":"Comparatives take modifiers such as 'appreciably', 'far' or 'much'. A would mean excessively short, and C and D cannot modify a comparative."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The visitor's entrance are on the north side of the building.","The visitors entrance's is on the north side of the building.","The visitors's entrance is on the north side of the building.","The visitors' entrance is on the north side of the building."],"ans":"D","expl":"A plural ending in s takes the apostrophe after the s: 'the visitors' entrance'. A has a plural verb with a singular subject, B puts the apostrophe on the wrong word, and C adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know how far is it to the next village?","Can you explain why was the order delayed?","Could you tell me whether the route has been changed?","I wonder when will the hall be free?"],"ans":"C","expl":"An indirect question keeps statement order: 'whether the route has been changed'. A, B and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two teams agreed to ____ the task between them.","opts":["divide up","divide off","divide out of","divide over"],"ans":"A","expl":"To 'divide up' a task is to share it out between people. The other combinations are not English phrases for sharing work."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["take steps","make steps","do steps quietly and square","put steps"],"ans":"A","expl":"English says 'take steps' when somebody acts to deal with a problem. B and D use verbs that do not collocate with this noun, and C adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The instructions supplied with the kit were extremely ~thorough~.","opts":["detailed","superficial","technical","illustrated"],"ans":"B","expl":"'Thorough' means complete and careful, so its opposite is 'superficial'. 'Detailed' is a synonym, and 'technical' and 'illustrated' describe register and presentation."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a report?","text":"","opts":["damning","exhaustive","perishable","balanced"],"ans":"C","expl":"'Perishable' describes food that goes bad quickly and cannot be used of a report. 'Damning' means strongly critical, 'exhaustive' means very thorough, and 'balanced' means fair to both sides."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The scheme has proved remarkably ~resilient~ during the financial crisis.","opts":["popular","expensive","flexible","tough"],"ans":"D","expl":"'Resilient' means able to recover quickly from difficulty, so 'tough' is the closest match. 'Popular' describes approval, 'expensive' describes cost, and 'flexible' describes willingness to change."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The firm has a long ____ of supporting local charities.","opts":["traditional","tradition","traditionally","traditions"],"ans":"B","expl":"After the adjective 'long' a singular noun is needed, and 'a tradition of' is the fixed pattern. 'Traditional' is an adjective, 'traditionally' is an adverb, and the plural does not fit after 'a long'."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The college prides itself ____ the range of languages it offers.","opts":["for","of","with","on"],"ans":"D","expl":"The reflexive verb 'pride oneself' is always followed by 'on' before the thing somebody is proud of. 'For' follows 'famous', 'of' follows 'proud' as an adjective, and 'with' follows 'pleased', so none of them can be used after 'prides itself' here."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The company was praised for its ~transparent~ handling of the complaint.","opts":["carried out as quickly as possible","open and easy for others to examine","managed by an outside organisation","kept secret until a decision was made"],"ans":"B","expl":"'Transparent' means open and able to be examined by others, which is why it was praised. A describes speed, C describes outsourcing, and D is the opposite."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"An ultimatum is:","opts":["a final demand that must be accepted or refused","a summary placed at the end of a long document","a payment made when a contract ends","the last item on the agenda of a meeting"],"ans":"A","expl":"An 'ultimatum' is a final demand, usually with a threat if it is refused. B describes a conclusion, C describes a settlement, and D describes any other business."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["talkative","garrulous","loquacious","articulate"],"ans":"B","expl":"'Garrulous' describes somebody who talks far too much, and it carries criticism. 'Talkative', 'loquacious' and 'articulate' describe speech without that negative edge."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To thank volunteers for their work last year","To explain what the volunteering roles involve","To announce that the scheme has been suspended","To invite donations towards the scheme"],"ans":"B","expl":"The notice describes the three roles, the hours expected and the training offered. A, C and D all concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","VOLUNTEERS WANTED","Three roles are available this term. Reading partners spend one lunchtime a week with a younger pupil. Garden helpers work on Friday afternoons and should not mind rain. Library assistants shelve books before school and need to be reliable rather than quick. Training is provided for all three roles during the first week. Volunteers who complete a full term receive a certificate at the summer assembly."]},{"no":22,"pts":"2.6","head":"What quality is said to matter most for library assistants?","text":"","opts":["Reliability","Speed","Experience of libraries","A willingness to work outdoors"],"ans":"A","expl":"The notice says library assistants need to be reliable rather than quick. B is explicitly set aside, C is never mentioned, and D applies to garden helpers."},{"no":23,"pts":"2.6","head":"You hear a supervisor say: \"I think we should call it a day.\" What does this mean?","text":"","opts":["She wants to stop work for now","She wants the work to continue until evening","She wants to name the project after a date","She wants everybody to take a day off tomorrow"],"ans":"A","expl":"To 'call it a day' is to stop working for the time being. B reverses the meaning, C takes the phrase literally, and D describes an arrangement she never proposes."},{"no":24,"pts":"2.6","head":"You see this notice in a cafe: \"The wireless password changes daily and is printed on your receipt.\" What is the main message?","text":"","opts":["Your receipt tells you today's password","The network is available only to staff","You need a new password every hour","The password must be requested at the counter"],"ans":"A","expl":"The notice says the password changes daily and appears on the receipt. B contradicts the service offered, C misreads 'daily', and D describes a step the notice does not require."},{"no":25,"pts":"2.6","head":"What does the text say about the purpose of seed banks?","text":"","opts":["To sell rare seeds to collectors","To breed new varieties for commercial farms","To store seeds in case varieties are lost","To replace the work of ordinary plant nurseries"],"ans":"C","expl":"The first paragraph says the banks exist so that varieties can be recovered if they are lost. A, B and D describe activities the text never attributes to them.","block":["Read the text and answer questions 25-27.","A seed bank is a store of plant varieties kept so that they can be recovered if they are lost. The seeds are dried, sealed and frozen, and in that state many remain alive for decades. The largest collections hold hundreds of thousands of samples from every continent.","Freezing does not work for every plant. Some seeds die if they are dried, and the trees that produce them must be grown instead in living collections, which are far more expensive to maintain. Apples, cocoa and many tropical species belong to this group.","The banks have already been used. After a conflict destroyed a collection in Syria, researchers withdrew duplicates that had been deposited for safety in a vault inside the Arctic Circle and used them to rebuild the holding. That withdrawal was the first in the vault's history, and it was exactly what the vault had been built for."]},{"no":26,"pts":"2.6","head":"Why must some species be kept in living collections?","text":"","opts":["They produce too few seeds to store","Their seeds are too large for the containers","Their seeds die if they are dried","They are needed by farmers every year"],"ans":"C","expl":"The second paragraph says some seeds die if they are dried, so the trees must be grown instead. A, B and D give reasons the text never offers."},{"no":27,"pts":"2.6","head":"What does the text say about the withdrawal from the Arctic vault?","text":"","opts":["It happened several times during the conflict","It was made by mistake and later returned","It involved only tropical species","It was the first in the vault's history"],"ans":"D","expl":"The final paragraph says that withdrawal was the first in the vault's history. A contradicts 'the first', B invents an error, and C is never stated."},{"no":28,"pts":"2.6","head":"What does the text say about the running cost of electric buses?","text":"","opts":["It is higher than that of diesel buses","It depends entirely on the length of the route","It is lower, although the bus itself costs more","It has risen since the first fleets appeared"],"ans":"C","expl":"The second paragraph says an electric bus costs more to buy but less to run and maintain. A reverses the comparison, B and D describe factors the text never raises.","block":["Read the text and answer questions 28-30.","Electric buses are quiet, and that is the change passengers notice first. Conversation is possible at the back, and streets with frequent services are measurably less noisy. Cities that have converted a route often report complaints only from pedestrians, who no longer hear the bus approaching.","The economics are less obvious. An electric bus costs considerably more to buy than a diesel one, but less to run and to maintain, since there are far fewer moving parts. Over a twelve-year life the electric vehicle usually wins, provided the operator can afford the higher price at the start.","Charging shapes everything else. A depot needs a power supply large enough for a whole fleet overnight, and in some cities the cable to the depot has cost more than the buses. Operators who cannot wait for that work have fitted fast chargers at the end of a route instead, which keeps the batteries smaller and the buses lighter."]},{"no":29,"pts":"2.6","head":"What complaint do cities report after converting a route?","text":"","opts":["Passengers find the buses too slow","The buses are noisier at the back","Pedestrians cannot hear the bus coming","Drivers dislike the new controls"],"ans":"C","expl":"The first paragraph says complaints come only from pedestrians, who no longer hear the bus approaching. A, B and D are objections the text never records."},{"no":30,"pts":"2.6","head":"Why have some operators fitted chargers at the end of a route?","text":"","opts":["Because overnight charging damages the batteries","Because passengers prefer shorter journeys","Because the buses cannot reach the depot","Because the depot cable would cost too much or take too long"],"ans":"D","expl":"The final paragraph says operators who cannot wait for the depot work have fitted fast chargers at the end of a route instead. A, B and C give reasons the text never mentions."}]},{"variant":14,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Never before ____ the museum ____ so many visitors in a single weekend.","opts":["had / receiving","did / received","has / receiving","had / received"],"ans":"D","expl":"After 'Never before' the auxiliary comes before the subject, and the past perfect is 'had ... received'. A and C use an -ing form after the auxiliary, and B puts a past form after 'did'."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The hall ____ as a hospital during the war before it ____ to the school in 1951.","opts":["had been used / returned","was used / returned","has been used / returned","was being used / had returned"],"ans":"A","expl":"An earlier use before a later event takes the past perfect passive 'had been used' with the past simple 'returned'. B loses the order, C uses a present perfect in a past narrative, and D reverses the sequence."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the committee's objections, the plan was approved without amendment.","opts":["Although","Because of","Notwithstanding","Moreover"],"ans":"C","expl":"'Notwithstanding' is followed by a noun phrase and introduces a contrast. A and D need a clause, and B gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was not the storm ____ brought down the old oak but the saturated ground.","opts":["that","what","which it","when"],"ans":"A","expl":"A cleft of this kind is completed by 'that'. B cannot introduce a cleft, C adds an unnecessary pronoun, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the vaccine ____ earlier, far fewer people ____ ill last winter.","opts":["had arrived / would have been","arrived / would be","had arrived / would be","arrives / will be"],"ans":"A","expl":"'Last winter' places the whole situation in the past, so the third conditional 'had arrived / would have been' is correct. B is a second conditional, C leaves the result in the present, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that somebody was able to act but chose not to?","text":"","opts":["The warden had to close the gate.","The warden must have closed the gate.","The warden needn't have closed the gate.","The warden could have closed the gate."],"ans":"D","expl":"'Could have closed' describes a past possibility that was not taken. A states an obligation, B expresses certainty that it happened, and C says the gate was closed unnecessarily."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The inspector proposed that the machine ____ until the guard was replaced.","opts":["is not used","was not used","not be used","does not use"],"ans":"C","expl":"After 'proposed that' the subjunctive is used, and the negative passive is 'not be used'. A and B use ordinary tenses, and D is active and makes the machine do the using."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second sample was ____ purer than the first.","opts":["very","so","significantly","too"],"ans":"C","expl":"Comparatives take modifiers such as 'significantly', 'far' or 'much'. A and B cannot modify a comparative, and D would mean excessively pure."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The members' subscriptions are due at the end of March.","The member's subscriptions is due at the end of March.","The members subscription's are due at the end of March.","The members's subscriptions are due at the end of March."],"ans":"A","expl":"A plural ending in s takes the apostrophe after the s: 'the members' subscriptions'. B has a singular verb with a plural subject, C puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know what the new charge covers?","Could you tell me how long will the survey take?","Can you explain where did the complaint come from?","I wonder when will the figures be released?"],"ans":"A","expl":"An indirect question keeps statement order: 'what the new charge covers'. B, C and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The authorities were slow to ____ the seriousness of the leak.","opts":["grip","grasp","clutch","clasp"],"ans":"B","expl":"To 'grasp' something is to understand it fully. 'Grip', 'clutch' and 'clasp' all describe holding something physically and are not used of understanding."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["place a threat","hold a threat softly and round","drop a threat","pose a threat"],"ans":"D","expl":"English says 'pose a threat'. A and C use verbs that do not collocate with this noun, and B adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The report's conclusions were unexpectedly ~optimistic~.","opts":["hopeful","gloomy","detailed","provisional"],"ans":"B","expl":"'Optimistic' means expecting good outcomes, so its opposite is 'gloomy'. 'Hopeful' is a synonym, and 'detailed' and 'provisional' describe thoroughness and status."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a crowd or a queue?","text":"","opts":["buoyant","orderly","straggling","impatient"],"ans":"A","expl":"'Buoyant' describes something that floats or a cheerful market and is not used of a queue. 'Orderly' means well arranged, 'straggling' means spread out untidily, and 'impatient' means unwilling to wait."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The negotiations were conducted in a ~cordial~ atmosphere.","opts":["tense","friendly","formal","brief"],"ans":"B","expl":"'Cordial' means warm and friendly, so 'friendly' is the closest match. 'Tense' is the opposite, and 'formal' and 'brief' describe style and length."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"Her ____ on the subject has been quoted in several textbooks.","opts":["authoritative","authorise","authoritatively","authority"],"ans":"D","expl":"The possessive 'Her' needs a noun, and 'authority on a subject' is the fixed pattern. 'Authoritative' is an adjective, 'authorise' is a verb, and 'authoritatively' is an adverb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The decision was taken ____ the recommendation of the independent panel.","opts":["in place of","in time for","in line with","in turn with"],"ans":"C","expl":"'In line with' means in agreement with, which fits following a recommendation. 'In place of' means instead of, 'in time for' refers to punctuality, and the last is not an English phrase."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The council was criticised for its ~piecemeal~ approach to the repairs.","opts":["completed far more quickly than expected","done gradually and without an overall plan","carried out by several different contractors","paid for entirely from local taxes"],"ans":"B","expl":"'Piecemeal' means done in separate stages without an overall plan, which is why it was criticised. A describes speed, C describes who did the work, and D describes funding."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A prototype is:","opts":["a copy made for sale to the public","a written description of a finished product","a fault discovered during manufacture","an early model built to test a design"],"ans":"D","expl":"A 'prototype' is an early version made to test an idea before full production. A describes a commercial copy, B describes a specification, and C describes a defect."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["fickle","flexible","adaptable","versatile"],"ans":"A","expl":"'Fickle' describes somebody who changes their mind unreliably, and it is always critical. 'Flexible', 'adaptable' and 'versatile' describe the same ability to change approvingly."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To announce the winners of last year's competition","To explain the rules for entering the competition","To ask pupils to lend cameras to the school","To warn pupils that the competition has been cancelled"],"ans":"B","expl":"The notice gives the theme, the limit on entries, the format required and the closing date. A, C and D all concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","PHOTOGRAPHY COMPETITION","This year's theme is Water. Each pupil may submit no more than two photographs, and both must have been taken within the last twelve months. Entries should be sent as digital files to the art department, with the pupil's name in the file title rather than on the image itself. Printed entries cannot be accepted. The closing date is 12 May, and the judges' decision will be final."]},{"no":22,"pts":"2.6","head":"How should a pupil identify an entry?","text":"","opts":["By writing a name across the corner of the image","By putting the name in the file title","By attaching a printed label to the photograph","By sending a separate letter to the department"],"ans":"B","expl":"The notice says the name should be in the file title rather than on the image itself. A contradicts that instruction, and C and D describe methods the notice never mentions."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"There are two more projects in the pipeline.\" What does this mean?","text":"","opts":["Two projects are being prepared and will follow","Two projects have just been completed","Two projects have been abandoned","Two projects are running behind schedule"],"ans":"A","expl":"If something is 'in the pipeline' it is being prepared and will come soon. B places the projects in the past, and C and D describe outcomes he never mentions."},{"no":24,"pts":"2.6","head":"You see this notice in a museum: \"Photography permitted without flash. Tripods by prior arrangement only.\" What is the main message?","text":"","opts":["No photography of any kind is allowed","Tripods may be hired at the entrance desk","You may take photographs, but not with flash or an unbooked tripod","Flash photography is allowed in some rooms"],"ans":"C","expl":"The notice allows photography without flash and restricts tripods to those arranged in advance. A contradicts the permission, B invents a hire service, and D contradicts the ban on flash."},{"no":25,"pts":"2.6","head":"What does the text say about the discovery of antibiotic resistance?","text":"","opts":["It was first observed only in the last twenty years","It was predicted by the discoverer of penicillin","It occurs only in hospitals","It was caused by the use of antibiotics in farming"],"ans":"B","expl":"The first paragraph says the discoverer of penicillin warned about resistance in his Nobel lecture. A contradicts that timing, C and D narrow the problem in ways the text does not.","block":["Read the text and answer questions 25-27.","Resistance is not a modern surprise. The scientist who discovered penicillin warned about it in his Nobel lecture, pointing out that bacteria exposed to small doses would survive and multiply. Within a few years of the drug reaching hospitals, resistant strains had appeared exactly as he described.","The problem has grown because the incentives are wrong. A new antibiotic is held in reserve and used as little as possible, so it earns very little. A drug for a long-term condition is taken daily for years and earns a great deal. Several large companies have therefore left the field altogether.","Governments have begun to respond. One approach pays a company a fixed annual sum for making a new antibiotic available, whether or not it is prescribed. The payment rewards the discovery rather than the sales, and early schemes in Britain and Sweden are being watched closely elsewhere."]},{"no":26,"pts":"2.6","head":"Why have several large companies left the field?","text":"","opts":["New antibiotics are too difficult to discover","Governments have banned them from the market","Doctors refuse to prescribe new antibiotics","A reserved antibiotic earns very little money"],"ans":"D","expl":"The second paragraph says a new antibiotic is held in reserve and used as little as possible, so it earns very little. A, B and C give reasons the text never offers."},{"no":27,"pts":"2.6","head":"How does the new payment scheme work?","text":"","opts":["Companies are paid for each prescription written","Companies are given a longer period of exclusive sale","Companies are paid only if resistance falls","Companies receive a fixed sum for making the drug available"],"ans":"D","expl":"The final paragraph says one approach pays a fixed annual sum whether or not the drug is prescribed. A is the opposite of rewarding discovery rather than sales, and B and C describe schemes the text never mentions."},{"no":28,"pts":"2.6","head":"What does the text say about the role of the host in a board game cafe?","text":"","opts":["They sell the games to customers who enjoy them","They explain the rules so that nobody has to read them","They play in every game that is started","They decide which game each table must play"],"ans":"B","expl":"The second paragraph says a member of staff explains the rules, which removes the barrier of reading them. A, C and D describe duties the text never gives the host.","block":["Read the text and answer questions 28-30.","A board game cafe charges for time rather than for coffee. A customer pays a few pounds an hour and may play anything on the shelves, which usually hold several hundred titles. The first such cafes opened in Toronto and Berlin, and the idea has spread to most large European cities.","The format solves a particular problem. Modern board games can be excellent but their rules are long, and few people will read twenty pages before an evening begins. A member of staff explains the game instead, usually in five minutes, and that single service removes the barrier almost entirely.","Owners say the business is steadier than an ordinary cafe. Customers stay for three hours rather than twenty minutes, they return with the same friends, and weekday evenings are busy rather than empty. The main cost is not the games, which last for years, but the staff who must know several hundred of them."]},{"no":29,"pts":"2.6","head":"Why is the business steadier than an ordinary cafe?","text":"","opts":["The games are cheaper than coffee to supply","Weekday mornings are the busiest period","Customers stay for hours and return regularly","Customers pay a membership fee each year"],"ans":"C","expl":"The final paragraph says customers stay for three hours, return with the same friends, and fill weekday evenings. A misreads the cost point, B names the wrong part of the day, and D is never mentioned."},{"no":30,"pts":"2.6","head":"What does the text give as the main cost?","text":"","opts":["Replacing games that wear out quickly","The rent of a large room in a city centre","The staff who must know several hundred games","The coffee served to waiting customers"],"ans":"C","expl":"The final sentence says the main cost is the staff who must know several hundred games. A contradicts the statement that the games last for years, and B and D are never mentioned."}]},{"variant":15,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"So convincing ____ the argument that the opposition ____ its own motion.","opts":["was / withdrew","did / withdraw","had / withdrawing","we
