l":"Comparatives take modifiers such as 'far', 'much' or 'considerably'. A and C cannot modify a comparative, and B would mean excessively clear."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The volunteer's names was printed on the back of the programme.","The volunteers names' were printed on the back of the programme.","The volunteers's names were printed on the back of the programme.","The volunteers' names were printed on the back of the programme."],"ans":"D","expl":"A plural ending in s takes the apostrophe after the s: 'the volunteers' names'. A has a singular verb with a plural subject, B puts the apostrophe on the wrong word, and C adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know how far is the nearest station?","Can you explain why was the order cancelled?","Could you tell me whether the gate is locked at night?","I wonder how long will the repairs take?"],"ans":"C","expl":"An indirect question keeps statement order: 'whether the gate is locked at night'. A, B and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The shortage of parts began to ____ production at the main plant.","opts":["hinder up","hamper","harm over","halt down"],"ans":"B","expl":"To 'hamper' something is to make it more difficult, and it takes a direct object with no particle. A, C and D add particles that do not belong to these verbs, so none of them is a real English combination."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["strike a balance","hit a balance","knock a balance softly and wide","press a balance"],"ans":"A","expl":"English says 'strike a balance'. B and D use verbs that do not collocate with this noun, and C adds words that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The instructions given to the new staff were unusually ~concise~.","opts":["brief","practical","written","long-winded"],"ans":"D","expl":"'Concise' means short and clear, so its opposite is 'long-winded'. 'Brief' is a synonym, and 'practical' and 'written' describe content and form."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a road?","text":"","opts":["fluent","winding","congested","unlit"],"ans":"A","expl":"'Fluent' describes smooth speech and is not used of a road. 'Winding' means full of bends, 'congested' means blocked with traffic, and 'unlit' means without street lighting."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The guide gave a ~meticulous~ account of every stage of the restoration.","opts":["careful","lively","short","official"],"ans":"A","expl":"'Meticulous' means showing great attention to detail, so 'careful' is the closest match. 'Lively' describes manner, 'short' describes length, and 'official' describes source."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The council was criticised for its ____ in dealing with the complaint.","opts":["negligent","negligently","negligence","neglected"],"ans":"C","expl":"After 'its' a noun is needed, and 'negligence' is the noun. 'Negligent' and 'neglected' are adjectives, and 'negligently' is an adverb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The new rules were drawn up in response ____ pressure from parents.","opts":["to","of","for","on"],"ans":"A","expl":"The noun 'response' takes 'to' in the phrase 'in response to'. 'Of', 'for' and 'on' are not used after 'response' in this pattern."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The minister dismissed the figures as ~spurious~.","opts":["false although appearing genuine","far smaller than had been expected","collected before the new rules applied","published without the proper permission"],"ans":"A","expl":"'Spurious' means false while seeming genuine. B describes size, C describes timing, and D describes procedure."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A deterrent is:","opts":["a payment made before work begins","a delay caused by bad weather","something that discourages people from acting","a decision taken without a vote"],"ans":"C","expl":"A 'deterrent' is something that puts people off doing something. A describes a deposit, B describes a delay, and D describes a formality."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["persistent","determined","stubborn","steady"],"ans":"C","expl":"'Stubborn' suggests refusing to change when change is sensible, and it carries criticism. 'Persistent', 'determined' and 'steady' describe the same persistence approvingly."},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To announce that the charity run has been cancelled","To explain how to enter the run and what to expect","To ask runners to collect money from neighbours","To thank the runners who took part last year"],"ans":"B","expl":"The notice gives the date, the route, the entry fee and the arrangements on the day. A contradicts the arrangements, C and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","CHARITY RUN: ENTRY DETAILS","The run takes place on Saturday 12 September and follows the river path for five kilometres. Entry costs four pounds, and all of it goes to the hospital fund. Numbers must be collected from the sports hall between eight and nine on the morning of the run, not before. There is no changing room, so runners should arrive dressed to run. Water will be provided at the halfway point and at the finish."]},{"no":22,"pts":"2.6","head":"What must runners do on the morning of the run?","text":"","opts":["Pay the entry fee at the sports hall","Leave their clothes in the changing room","Collect their number between eight and nine","Bring their own water for the halfway point"],"ans":"C","expl":"The notice says numbers must be collected from the sports hall between eight and nine on the morning. A and B contradict the notice, and D ignores the water provided."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"Just keep me in the loop about the delivery.\" What does this mean?","text":"","opts":["He wants to take over the arrangements","He thinks the delivery will be late","He would rather not be involved at all","He wants to be kept informed"],"ans":"D","expl":"To 'keep somebody in the loop' is to keep them informed. A and B go beyond what he says, and C reverses his request."},{"no":24,"pts":"2.6","head":"You see this notice in a theatre: \"Latecomers will be admitted at the interval only. Tickets are not refundable.\" What is the main message?","text":"","opts":["Arrive on time, or you will wait until the interval and lose nothing back","You may enter at any time once the play has begun","Late tickets are sold at a reduced price","The interval is the only time tickets may be bought"],"ans":"A","expl":"The notice says latecomers wait for the interval and that tickets are not refundable. B contradicts the first sentence, and C and D describe sales the notice never mentions."},{"no":25,"pts":"2.6","head":"What does the text say about the weight of a green roof?","text":"","opts":["It is too heavy for any existing building","It becomes lighter as the plants grow","The structure below must be able to carry it","It is the same as that of an ordinary roof"],"ans":"C","expl":"The first paragraph says the main question is whether the structure can carry the weight. A overstates the problem, B and D contradict the description of saturated soil.","block":["Read the text and answer questions 25-27.","A green roof is a layer of soil and low plants laid over a waterproof membrane. The main question before fitting one is weight, because the structure below must be able to carry wet soil. Saturated soil is far heavier than dry soil, and the calculation has to assume the worst.","The benefits are easiest to see in a city. The soil holds rain that would otherwise rush into the drains within minutes, and it releases the water slowly over the following hours. The plants also cool the air above the roof, and rooms immediately beneath a green roof stay several degrees cooler in summer.","Maintenance is modest but not nothing. Weeds that would shade out the planting have to be pulled, and the drainage outlets must be kept clear. A roof left entirely alone for several years usually ends up as rough grass, which still holds water but loses much of the variety that was planted."]},{"no":26,"pts":"2.6","head":"What happens to rain that falls on a green roof?","text":"","opts":["It evaporates before it reaches the soil","It is held in the soil and released slowly","It is piped into a tank for later use","It runs into the drains faster than before"],"ans":"B","expl":"The second paragraph says the soil holds rain and releases it slowly over the following hours. A and C describe processes the text never mentions, and D reverses the effect."},{"no":27,"pts":"2.6","head":"What happens to a green roof that is left alone for several years?","text":"","opts":["The waterproof membrane fails","It usually becomes rough grass","The plants spread to neighbouring roofs","It dries out and the soil blows away"],"ans":"B","expl":"The final paragraph says such a roof usually ends up as rough grass. A, C and D describe outcomes the text never predicts."},{"no":28,"pts":"2.6","head":"What does the text say about how zines are produced?","text":"","opts":["They are made cheaply by their own authors","They are printed by specialist publishing houses","They are sold mainly through large bookshops","They are written by teams of professional editors"],"ans":"A","expl":"The first paragraph says a zine is made by its own author on a photocopier for very little money. B, C and D describe arrangements the text rules out.","block":["Read the text and answer questions 28-30.","A zine is a small magazine made by the person who writes it. The pages are folded, stapled and copied, and a run of fifty costs very little. Nobody involved expects to make money, and that is precisely what gives the form its freedom.","The subjects are narrower than any publisher would accept. A zine may cover one bus route, one allotment or one year of somebody's life, and it is read by people who care about exactly that. Where a magazine needs thousands of readers to survive, a zine needs none.","Libraries have begun to collect them. The difficulty is cataloguing, because a zine often has no date, no publisher and sometimes no title. Librarians have had to invent their own records, and several collections are now the only surviving account of groups that left no other written trace."]},{"no":29,"pts":"2.6","head":"Why are the subjects of zines so narrow?","text":"","opts":["Because publishers decide what may be printed","Because the authors have little time to write","Because a zine does not need thousands of readers","Because libraries ask for local material"],"ans":"C","expl":"The second paragraph says a magazine needs thousands of readers to survive while a zine needs none. A, B and D give reasons the text never offers."},{"no":30,"pts":"2.6","head":"Why is cataloguing zines difficult?","text":"","opts":["They are often damaged by folding and stapling","They often have no date, publisher or title","Too many are published each year to record","Their authors refuse to give permission"],"ans":"B","expl":"The final paragraph says a zine often has no date, no publisher and sometimes no title. A, C and D describe obstacles the text never mentions."}]}];
const AUTHOR = {name:'Nafisa Ortiqova', tg:'@english_worksheets_more'};
const LET = ['A','B','C','D'];
const SECT = n => n<=10 ? 'Grammar' : n<=20 ? 'Vocabulary' : 'Reading';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark = s => esc(s).replace(/~([^~]+)~/g, '<u>$1</u>');
const fmt = ms => { const t=Math.max(0,Math.round(ms/1000));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const ball = p => p.replace('.', ',') + ' ball';

/* passages keyed by question number */
function passages(items){
  const map = {};
  for (const q of items){
    if (!q.block) continue;
    const m = /questions (\d+)-(\d+)/.exec(q.block[0]);
    if (!m) continue;
    for (let n=+m[1]; n<=+m[2]; n++) map[n] = q.block;
  }
  return map;
}
const VAR = {};
for (const d of DATA) VAR[d.variant] = {items:d.items, pass:passages(d.items)};

/* ---------- storage (per viewer, best effort) ---------- */
const KEY = (v,m) => 'olimp11:'+v+':'+m;
function save(){ if(!S||S.done) return;
  try{ localStorage.setItem(KEY(S.v,S.mode), JSON.stringify(
    {a:S.ans, i:S.i, left:S.mode==='exam' ? S.deadline-Date.now() : null, t:Date.now()})); }catch(e){} }
function load(v,m){ try{ const r=localStorage.getItem(KEY(v,m)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clear(v,m){ try{ localStorage.removeItem(KEY(v,m)); }catch(e){} }

let S = null, MODE = 'exam', tick = null;

/* ---------- start screen ---------- */
const startEl = document.getElementById('start');
function renderStart(resumeFor){
  const vs = Object.keys(VAR).map(Number).sort((a,b)=>a-b);
  startEl.innerHTML = `
  <div class="masthead">

    <h1>Ingliz tili olimpiadasi &mdash; kompyuterda mashq</h1>

      <span class="spec"><b>50</b> ball</span>
      <span class="spec"><b>60</b> daqiqa</span>

    </div>

  </div>

  <div class="block">
    <div class="eyebrow">Rejim</div>
    <div class="modes">
      <button class="mode" data-mode="exam" aria-pressed="${MODE==='exam'}">
        <span class="dot"></span>
        <span><h3>Imtihon</h3><span>60 daqiqa sanaydi. Javoblar va izohlar test tugagach ko&lsquo;rinadi.</span></span>
      </button>
      <button class="mode" data-mode="practice" aria-pressed="${MODE==='practice'}">
        <span class="dot"></span>
        <span><h3>Mashq</h3><span>Vaqt chegarasi yo&lsquo;q. Har bir javobdan keyin izoh darhol chiqadi.</span></span>
      </button>
    </div>
  </div>

  ${resumeFor ? `
  <div class="block">

         ${Object.keys(resumeFor.saved.a||{}).length} ta savolga javob berilgan.</p>
      <button class="btn btn-primary" id="doResume">Davom ettirish</button>
      <button class="btn" id="doRestart">Boshidan boshlash</button>

  <div class="block">
    <div class="eyebrow">Variantni tanlang</div>
    <div class="vgrid">
      ${vs.map(v=>{
        const sv = load(v, MODE);
        return `<button class="vcard" data-v="${v}">
          ${sv?'<span class="resume" title="Yarim yo‘lda qolgan"></span>':''}
          <b class="tnum">${v}</b><span>variant</span></button>`;
      }).join('')}
    </div>
    <p class="note">Tasodifiy variant kerak bo&lsquo;lsa &mdash; pastdagi tugma. Javoblar faqat shu
       brauzerda saqlanadi, test yarmida sahifa yopilsa ham o&lsquo;sha joydan davom ettirish mumkin.</p>
    <div><button class="btn" id="rnd">Tasodifiy variant</button></div>

  <footer class="wrap" style="padding-left:0;padding-right:0">

  startEl.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; renderStart(null); });
  startEl.querySelectorAll('.vcard').forEach(b=>b.onclick=()=>pick(+b.dataset.v));
  const r = startEl.querySelector('#rnd');
  if (r) r.onclick = ()=>pick(vs[Math.floor(Math.random()*vs.length)]);
  if (resumeFor){

function pick(v){
  const saved = load(v, MODE);
  if (saved && Object.keys(saved.a||{}).length){ renderStart({v, saved}); window.scrollTo(0,0); }
  else begin(v, null);
}

/* ---------- exam ---------- */
const examEl = document.getElementById('exam');
function begin(v, saved){
  S = { v, mode:MODE, items:VAR[v].items, pass:VAR[v].pass,
        ans: saved?.a ? {...saved.a} : {}, i: saved?.i ?? 0, done:false,
        started: Date.now(),
        deadline: MODE==='exam' ? Date.now() + (saved?.left ?? 60*60*1000) : null };
  startEl.hidden = true; document.getElementById('result').hidden = true; examEl.hidden = false;
  examEl.innerHTML = `
    <div class="bar"><div class="bar-in">
      <div class="vname">${v}-variant<small>${MODE==='exam'?'Imtihon rejimi':'Mashq rejimi'}</small></div>
      <div class="prog"><i id="pbar"></i></div>
      <div class="clock tnum" id="clock">${MODE==='exam'?'60:00':'&nbsp;&mdash;&nbsp;'}</div>
      <button class="icon-btn" id="finish">Yakunlash</button>
    </div></div>
    <div class="cols">
      <div class="qcard" id="qcard"></div>
      <aside class="rail">
        <h3>Savollar</h3>
        <div class="cells" id="cells"></div>
        <div class="railfoot">
          <span id="cnt"></span>
          <button class="btn" id="quit">Chiqish</button>
        </div>
      </aside>
    </div>`;
  examEl.querySelector('#finish').onclick = finish;
  examEl.querySelector('#quit').onclick = ()=>{ save(); stopClock(); examEl.hidden=true; startEl.hidden=false; renderStart(null); window.scrollTo(0,0); };
  if (MODE==='exam') startClock();
  draw(); window.scrollTo(0,0);
}
function startClock(){
  stopClock();
  tick = setInterval(()=>{
    const left = S.deadline - Date.now();
    const c = document.getElementById('clock'); if(!c) return;
    c.textContent = fmt(left);
    c.classList.toggle('warn', left < 5*60*1000);
    if (left <= 0) { finish(); }
  }, 250);
}
function stopClock(){ if (tick) clearInterval(tick); tick = null; }

function draw(){
  const q = S.items[S.i], no = q.no, chosen = S.ans[no];
  const shown = S.mode==='practice' && chosen;
  const p = S.pass[no];
  const card = document.getElementById('qcard');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qno tnum">${no}</span>
      <span class="pts">${ball(q.pts)}</span>
      <span class="sect">${SECT(no)}</span>
    </div>
    ${p ? `<div class="passage">
        <div class="plead">${esc(p[0])}</div>
        ${p.slice(1).map((t,ix)=>`<p${ix===0&&p.length>2&&t===t.toUpperCase()?' class="ptitle"':''}>${mark(t)}</p>`).join('')}
      </div>` : ''}
    <div class="qhead">${mark(q.head)}</div>
    ${q.text ? `<div class="qtext">${mark(q.text)}</div>` : ''}
    <div class="opts">
      ${q.opts.map((o,ix)=>{
        const L = LET[ix];
        let cls = '';
        if (shown) cls = L===q.ans ? ' correct' : (L===chosen ? ' wrong' : '');
        return `<button class="opt${cls}" data-l="${L}" ${shown?'disabled':''}
            aria-pressed="${chosen===L}"><span class="letter">${L}</span><span>${mark(o)}</span></button>`;
      }).join('')}
    </div>
    ${shown ? `<div class="expl"><b>${chosen===q.ans?'To‘g‘ri.':'Noto‘g‘ri — to‘g‘ri javob '+q.ans+'.'}</b> ${esc(q.expl)}</div>` : ''}
    <div class="nav">
      <button class="btn" id="prev" ${S.i===0?'disabled':''}>&larr; Oldingi</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="next">${S.i===29?'Yakunlash':'Keyingi &rarr;'}</button>
    </div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  card.querySelector('#prev').onclick = ()=>go(S.i-1);
  card.querySelector('#next').onclick = ()=> S.i===29 ? finish() : go(S.i+1);
  drawRail();
}
function drawRail(){
  const cells = document.getElementById('cells');
  cells.innerHTML = S.items.map((q,ix)=>{
    const a = S.ans[q.no];
    let cls = 'cell' + (a?' done':'') + (ix===S.i?' cur':'');
    if (S.mode==='practice' && a) cls = 'cell ' + (a===q.ans?'ok':'no') + (ix===S.i?' cur':'');
    return `<button class="${cls}" data-i="${ix}">${q.no}</button>`;
  }).join('');
  cells.querySelectorAll('.cell').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const n = Object.keys(S.ans).length;
  document.getElementById('cnt').textContent = n + ' / 30 javob berildi';
  document.getElementById('pbar').style.width = (n/30*100)+'%';
}
function choose(L){
  const q = S.items[S.i];
  if (S.mode==='practice' && S.ans[q.no]) return;
  S.ans[q.no] = L; save();
  if (S.mode==='practice') draw();
  else { draw(); if (S.i < 29) setTimeout(()=>go(S.i+1), 160); }
}
function go(i){ if (i<0||i>29) return; S.i=i; save(); draw();
  document.getElementById('qcard').scrollIntoView({block:'start', behavior:'auto'}); }

document.addEventListener('keydown', e=>{
  if (!S || S.done || examEl.hidden) return;
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toUpperCase();
  if (LET.includes(k)) { e.preventDefault(); choose(k); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(S.i+1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); go(S.i-1); }
});

/* ---------- result ---------- */
function finish(){
  stopClock(); S.done = true; clear(S.v, S.mode);
  const used = S.mode==='exam' ? (60*60*1000 - Math.max(0, S.deadline - Date.now())) : (Date.now()-S.started);
  let score=0, right=0; const bands={'0.9':[0,0],'1.5':[0,0],'2.6':[0,0]};
  for (const q of S.items){
    const ok = S.ans[q.no] === q.ans;
    bands[q.pts][1]++;
    if (ok){ score += parseFloat(q.pts); right++; bands[q.pts][0]++; }
  }
  score = Math.round(score*10)/10;
  const resEl = document.getElementById('result');
  examEl.hidden = true; resEl.hidden = false;
  resEl.innerHTML = `
    <div style="padding-block:30px 0"></div>
    <div class="score">
      <div class="big tnum">${String(score).replace('.',',')}<small> / 50</small></div>
      <div class="meta">
        <b>${S.v}-variant &middot; ${S.mode==='exam'?'imtihon':'mashq'}</b>
        <span>${right} ta to&lsquo;g&lsquo;ri javob (30 tadan)</span>
        <span>Sarflangan vaqt: <span class="tnum">${fmt(used)}</span></span>
      </div>
      <div class="breakdown">
        <div class="bd"><div class="k">Grammar</div><div class="v tnum">${bands['0.9'][0]}/10</div></div>
        <div class="bd"><div class="k">Vocabulary</div><div class="v tnum">${bands['1.5'][0]}/10</div></div>
        <div class="bd"><div class="k">Reading</div><div class="v tnum">${bands['2.6'][0]}/10</div></div>
      </div>
    </div>

    <div class="filters">
      <button class="chip" data-f="wrong" aria-pressed="true">Xatolar (${30-right})</button>
      <button class="chip" data-f="all" aria-pressed="false">Barcha savollar</button>
    </div>
    <div class="rev" id="rev"></div>

    <div class="endbar">
      <button class="btn btn-primary" id="again">Shu variantni qayta ishlash</button>
      <button class="btn" id="home">Boshqa variant tanlash</button>
    </div>
    <footer>${AUTHOR.name} &middot; ${AUTHOR.tg}</footer>`;

  let filter = 'wrong';
  const rev = resEl.querySelector('#rev');
  function paint(){
    const list = S.items.filter(q => filter==='all' || S.ans[q.no]!==q.ans);
    rev.innerHTML = list.length ? list.map(q=>{
      const you = S.ans[q.no], ok = you===q.ans;
      const li = L => L ? L + ') ' + q.opts[LET.indexOf(L)] : 'javob berilmagan';
      return `<div class="rev-item ${ok?'hit':'miss'}">
        <div class="rev-head">
          <span class="n tnum">${q.no}</span>
          <span class="tag ${ok?'hit':'miss'}">${ok?'to‘g‘ri':'xato'}</span>
          <span class="sect">${SECT(q.no)} &middot; ${ball(q.pts)}</span>
        </div>
        <div class="rev-q"><b>${mark(q.head)}</b>${q.text?'<br>'+mark(q.text):''}</div>
        <div class="rev-ans">
          ${ok ? '' : `<span class="ln you"><b>Sizning javobingiz:</b> ${esc(li(you))}</span>`}
          <span class="ln key"><b>To&lsquo;g&lsquo;ri javob:</b> ${esc(li(q.ans))}</span>
        </div>
        <div class="rev-expl">${esc(q.expl)}</div>
      </div>`;
    }).join('') : `<div class="rev-item hit"><b>Bu variantda xato yo&lsquo;q.</b></div>`;
  }
  paint();
  resEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    filter = c.dataset.f;
    resEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.f===filter)));
    paint();
  });
  resEl.querySelector('#again').onclick = ()=>begin(S.v, null);
  resEl.querySelector('#home').onclick = ()=>{ resEl.hidden=true; startEl.hidden=false; renderStart(null); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

window.addEventListener('beforeunload', save);
renderStart(null);
</script>
</body>
</html>
