e licence remains valid'."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The results of the two trials ____ one another almost exactly.","opts":["mirror","mirage","mire","mirrored up"],"ans":"A","why":{"A":"'Mirror' bir narsaning boshqasini aynan takrorlashini bildiradi.","B":"'Mirage' ot bo'lib, sarob degani.","C":"'Mire' botqoq yoki qiyin ahvolni bildiradi.","D":"'Mirrored up' degan ibora ingliz tilida mavjud emas."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["carry the brunt loudly and flat","take the brunt down","hold the brunt","bear the brunt"],"ans":"D","why":{"A":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","B":"Bu variantga ortiqcha so'z qo'shilib, ibora ma'nosi o'zgargan.","C":"'Hold' bu ot bilan ishlatilmaydi.","D":"Ingliz tilida asosiy zarbani ko'tarish 'bear the brunt' deyiladi."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The committee's assessment of the proposal was distinctly ~favourable~.","opts":["positive","damning","cautious","detailed"],"ans":"B","why":{"A":"'Positive' ma'no jihatidan sinonim, teskarisi emas.","B":"'Favourable' ijobiy degani, uning kuchli teskarisi 'damning' ya'ni qattiq tanqidiy.","C":"'Cautious' ehtiyotkorlikni bildiradi, to'liq teskari ma'no emas.","D":"'Detailed' batafsillikni bildiradi, bahoni emas."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a recording?","text":"","opts":["muffled","distorted","unedited","perennial"],"ans":"D","why":{"A":"'Muffled' bo'g'iq degani va yozuvni tasvirlaydi.","B":"'Distorted' buzilgan degani, bu ham yozuvga tegishli.","C":"'Unedited' tahrir qilinmagan degani va yozuv haqida aytiladi.","D":"'Perennial' yildan yilga takrorlanadigan degani bo'lib, o'simlik yoki muammo haqida ishlatiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The musician described the terms of the contract as ~derisory~.","opts":["insultingly small","unusually generous","difficult to understand","open to negotiation"],"ans":"A","why":{"A":"'Derisory' shunchalik kichikki, haqorat darajasida degani.","B":"Saxiylik bu so'zning aynan teskarisi.","C":"Tushunish qiyinligi bu so'zning ma'nosi emas.","D":"Muzokara haqidagi ta'rif mos kelmaydi."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme was defended on the grounds of its ____ to new artists.","opts":["accessible","accessibly","accessibility","more accessible"],"ans":"C","why":{"A":"'Accessible' sifat bo'lib, 'its' dan keyin ot talab qilinadi.","B":"'Accessibly' ravish bo'lib, fe'lni izohlaydi.","C":"'Its ... to' qurilishida ot kerak, 'accessibility' esa ot shaklidir.","D":"'More accessible' qiyosiy daraja bo'lib, bu gapda o'rinsiz."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The payment bears no relation ____ the number of times the track is played.","opts":["on","at","by","to"],"ans":"D","why":{"A":"'Relation' bu birikmada 'on' predlogini olmaydi.","B":"'At' joyni bildiradi va bu iboraga mos emas.","C":"'By' vosita yoki bajaruvchini bildiradi, bu yerga to'g'ri kelmaydi.","D":"'Bear no relation to' barqaror birikma bo'lib, taqqoslanayotgan narsani ko'rsatadi."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The agreement was criticised for being ~opaque~ about how the money is divided.","opts":["written in more than one language","not open to examination","shorter than the usual contract","signed without legal advice"],"ans":"B","why":{"A":"Til haqidagi ta'rif bu so'zga aloqador emas.","B":"'Opaque' tushunarsiz, ichini ko'rib bo'lmaydigan degani.","C":"Uzunlik bu so'zning ma'nosi emas.","D":"Yuridik maslahat haqidagi ta'rif mos kelmaydi."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A royalty is:","opts":["a licence granted for a fixed period","a fee charged for entering a competition","a payment made each time a work is used","a sum returned if a product fails"],"ans":"C","why":{"A":"Muddatli ruxsatnoma 'licence' deb ataladi.","B":"Ishtirok haqi 'entry fee' deyiladi.","C":"'Royalty' asar har safar ishlatilganda to'lanadigan haq degani.","D":"Qaytariladigan summa 'refund' deb ataladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["blunt","candid","sincere","direct"],"ans":"A","why":{"A":"'Blunt' shunchalik to'g'ri gapiradiki, ko'ngilga tegadi degani, salbiy ma'noga ega.","B":"'Candid' ochiq va samimiy degani va ijobiy baho beradi.","C":"'Sincere' chin dildan degani, bu ham ijobiy so'z.","D":"'Direct' to'g'ri gapiradigan degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To report an accident that occurred in the laboratory","To announce that the laboratory will be refurbished","To invite students to apply for a laboratory post","To set out what must be done before laboratory work begins"],"ans":"D","why":{"A":"Baxtsiz hodisa haqida e'londa hech narsa aytilmagan.","B":"Ta'mir haqida e'londa gap yo'q.","C":"Ish o'rni haqida e'londa ma'lumot berilmagan.","D":"E'londa induksiya, kiyim, ro'yxatga olish va yakka ishlash qoidasi tushuntirilgan."},"block":["Read the text and answer questions 21-22.","LABORATORY INDUCTION: BEFORE YOU BEGIN","No one may work in the laboratory before completing the induction. It is held on the first Tuesday of each month and takes about ninety minutes. Lab coats and eye protection are issued at the store and must be returned at the end of each session. Every entry and exit is recorded at the door. Working alone is not permitted at any hour; if your partner leaves, you stop as well."]},{"no":22,"pts":"2.6","head":"What does the notice say about working alone?","text":"","opts":["It is not permitted at any time","It is allowed outside peak hours","It requires written permission","It is allowed once the induction is complete"],"ans":"A","why":{"A":"E'londa yolg'iz ishlash hech qanday vaqtda ruxsat etilmasligi aytilgan.","B":"Vaqtga bog'liq ruxsat haqida e'londa hech narsa aytilmagan.","C":"Yozma ruxsat haqida e'londa gap yo'q.","D":"Induksiya yolg'iz ishlashga huquq bermaydi."}},{"no":23,"pts":"2.6","head":"You hear a producer say: \"We have put that project on the back burner.\" What does this mean?","text":"","opts":["It has been cancelled permanently","It has been given lower priority for now","It has been handed to another team","It has been completed ahead of schedule"],"ans":"B","why":{"A":"Butunlay bekor qilish bu iboraning ma'nosi emas.","B":"'Put something on the back burner' iborasi hozircha ikkinchi darajaga surib qo'yishni bildiradi.","C":"Boshqa jamoaga topshirish haqida ibora hech narsa demaydi.","D":"Tugatish iboraning ma'nosiga zid."}},{"no":24,"pts":"2.6","head":"You see this notice at an airport: \"Liquids over 100 ml must be placed in checked baggage.\" What is the main message?","text":"","opts":["No liquids may be carried through the airport","Liquids must be declared at the security desk","Large containers of liquid cannot go in hand luggage","Containers under 100 ml must also be checked in"],"ans":"C","why":{"A":"E'lon suyuqlikni butunlay taqiqlamaydi.","B":"Deklaratsiya haqida e'londa hech narsa yozilmagan.","C":"E'londa 100 ml dan ortiq suyuqlik yuk sifatida topshirilishi kerakligi aytilgan.","D":"E'lon kichik idishlarga tegishli emas."}},{"no":25,"pts":"2.6","head":"What does the text say about the first antibiotics?","text":"","opts":["They were used only in hospitals for many years","Resistance appeared sooner than the public expected","They were effective against every kind of infection","They were withdrawn once resistance was discovered"],"ans":"B","why":{"A":"Faqat shifoxonalarda ishlatilgani haqida matnda gap yo'q.","B":"Birinchi xatboshida qarshilik jamoatchilik kutganidan ancha erta paydo bo'lgani aytilgan.","C":"Hamma infeksiyaga ta'sir qilgani aytilmagan.","D":"Bozordan olib qo'yish haqida matnda hech narsa yozilmagan."},"block":["Read the text and answer questions 25-27.","Resistance to the first antibiotics appeared far sooner than the public expected. In some cases it appeared within a few years of a drug coming into use. The mechanism is not mysterious: a population of bacteria contains variation, and a treatment that kills most of them leaves the survivors to multiply.","Agriculture complicated the picture. For decades low doses were added to animal feed because they produced slightly faster growth, which is precisely the condition under which resistant strains spread. Several countries have now ended the practice, and resistance in farm animals has fallen where they have.","Developing replacements is where the economics fail. A new antibiotic is held in reserve rather than sold widely, so it earns little. A drug taken daily for years earns a great deal. Governments have begun to pay for new antibiotics in advance, which separates the reward from the number of doses sold."]},{"no":26,"pts":"2.6","head":"Why did low doses in animal feed matter?","text":"","opts":["They created the conditions in which resistance spreads","They made the animals grow far more slowly","They entered the human food supply directly","They were stronger than the doses given to patients"],"ans":"A","why":{"A":"Ikkinchi xatboshida past dozalar aynan qarshilik tarqaladigan sharoit yaratishi aytilgan.","B":"Matnda aksincha, o'sish biroz tezlashgani aytilgan.","C":"Oziq-ovqatga o'tishi haqida matnda gap yo'q.","D":"Doza kuchi taqqoslanmagan."}},{"no":27,"pts":"2.6","head":"Why do governments now pay for new antibiotics in advance?","text":"","opts":["To reduce the price paid by patients","To speed up the testing of new drugs","To stop companies selling them abroad","To separate the reward from the number of doses sold"],"ans":"D","why":{"A":"Bemor to'lovi haqida matnda hech narsa yozilmagan.","B":"Sinov tezligi haqida matnda gap yo'q.","C":"Eksport haqida matnda ma'lumot berilmagan.","D":"Uchinchi xatboshida bu usul mukofotni sotilgan doza sonidan ajratishi aytilgan."}},{"no":28,"pts":"2.6","head":"What does the text say about streaming income for most musicians?","text":"","opts":["It has risen sharply over the last five years","It is paid directly by the listeners themselves","It is higher than income from live performance","It is too small to live on without other work"],"ans":"D","why":{"A":"Keskin o'sish haqida matnda hech narsa yozilmagan.","B":"To'lov tinglovchidan to'g'ridan-to'g'ri kelmaydi.","C":"Konsert daromadi bilan taqqoslash boshqacha berilgan.","D":"Birinchi xatboshida ko'pchilik uchun bu daromad boshqa ish bo'lmasa yashashga yetmasligi aytilgan."},"block":["Read the text and answer questions 28-30.","For most musicians the income from streaming is too small to live on without other work. The sum paid for a single play is a fraction of a penny. It is divided further between the label, the publisher and the performer before anything reaches the artist.","The shape of the payout explains more than the rate does. Revenue is pooled and shared according to total plays across the whole service. A subscriber whose entire listening goes to one obscure band still sends most of their fee to whoever is popular that month.","An alternative has been tested in several countries. Each subscription is divided only among the artists that subscriber actually played. The sums involved remain small, but the money follows the listening, and musicians with devoted rather than numerous audiences do noticeably better."]},{"no":29,"pts":"2.6","head":"What does the second paragraph say about the pooled system?","text":"","opts":["A subscriber's fee largely goes to whoever is popular","It pays more per play than the alternative","It was introduced at the request of the labels","It applies only to listeners on free accounts"],"ans":"A","why":{"A":"Ikkinchi xatboshida obunachining to'lovi asosan o'sha oyda mashhur bo'lganlarga ketishi aytilgan.","B":"Har bir eshitish uchun to'lov taqqoslanmagan.","C":"Kim joriy qilgani haqida matnda gap yo'q.","D":"Bepul akkauntlar haqida matnda hech narsa yozilmagan."}},{"no":30,"pts":"2.6","head":"Who benefits most from the alternative system?","text":"","opts":["Musicians signed to the largest labels","Listeners who pay for several services","Musicians with devoted rather than numerous audiences","Musicians whose work is played on the radio"],"ans":"C","why":{"A":"Yirik leyballar haqida matnda gap yo'q.","B":"Tinglovchilarning foydasi haqida matnda hech narsa yozilmagan.","C":"Uchinchi xatboshida sodiq, lekin ko'p bo'lmagan tinglovchisi bor musiqachilar yutishi aytilgan.","D":"Radio haqida matnda ma'lumot berilmagan."}}]}];

const TITLE = "Ingliz tili fanidan II-tur tuman olimpiadasiga tayyorgarlik testi";
const SUBTITLE = "Mazkur trenajor testlar 2025-yilda tushgan olimpiada formatida tuzib chiqilgan.";
const AUTHOR = {name:'Nafisa Ortiqova', tg:'@english_worksheets_more'};
const LET = ['A','B','C','D'];
const SECT = n => n<=10 ? 'Grammar' : n<=20 ? 'Vocabulary' : 'Reading';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark = s => esc(s).replace(/~([^~]+)~/g, '<u>$1</u>');
const fmt = ms => { const t=Math.max(0,Math.round(ms/1000));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const ball = p => p.replace('.', ',') + ' ball';

function passages(items){
  const map = {};
  for (const q of items){
    if (!q.block) continue;
    const m = /questions (\d+)-(\d+)/.exec(q.block[0]);
    if (!m) continue;
    for (let n=+m[1]; n<=+m[2]; n++) map[n] = q.block;
  }
  return map;
}
const VAR = {};
for (const d of DATA) VAR[d.variant] = {items:d.items, pass:passages(d.items)};

const KEY = (v,m) => 'olimp11:'+v+':'+m;
function save(){ if(!S||S.done) return;
  try{ localStorage.setItem(KEY(S.v,S.mode), JSON.stringify(
    {a:S.ans, i:S.i, left:S.mode==='exam' ? S.deadline-Date.now() : null})); }catch(e){} }
function load(v,m){ try{ const r=localStorage.getItem(KEY(v,m)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clear(v,m){ try{ localStorage.removeItem(KEY(v,m)); }catch(e){} }

let S = null, MODE = 'exam', tick = null;
const startEl = document.getElementById('start');
const examEl = document.getElementById('exam');

function renderStart(resumeFor){
  const vs = Object.keys(VAR).map(Number).sort((a,b)=>a-b);
  startEl.innerHTML = `
  <div class="hero">
    <img class="logo" src="${LOGO}" alt="English_worksheets_more kanali logotipi">
    <div>
      <div class="eyebrow">11-sinf &middot; 2025-yil formati</div>
      <h1>${TITLE}</h1>
      <p class="sub">${SUBTITLE}</p>
      <div class="specs">
        <span class="spec"><b>5</b> variant</span>
        <span class="spec"><b>30</b> savol</span>
        <span class="spec"><b>50</b> ball</span>
        <span class="spec"><b>60</b> daqiqa</span>
        <span class="spec">1&ndash;10: <b>0,9</b></span>
        <span class="spec">11&ndash;20: <b>1,5</b></span>
        <span class="spec">21&ndash;30: <b>2,6</b></span>
      </div>
      <div class="chan">Muallif: <b>${AUTHOR.name}</b> &nbsp;&middot;&nbsp; Telegram: <b>${AUTHOR.tg}</b></div>
    </div>
  </div>

  <div class="block">
    <div class="eyebrow">Rejim</div>
    <div class="modes">
      <button class="mode" data-mode="exam" aria-pressed="${MODE==='exam'}">
        <span class="dot"></span>
        <span><h3>Imtihon</h3><span class="d">60 daqiqa sanaydi. Javoblar va izohlar test tugagach ochiladi.</span></span>
      </button>
      <button class="mode" data-mode="practice" aria-pressed="${MODE==='practice'}">
        <span class="dot"></span>
        <span><h3>Mashq</h3><span class="d">Vaqt chegarasi yo&lsquo;q. Har bir javobdan keyin izoh darhol chiqadi.</span></span>
      </button>
    </div>
  </div>

  ${resumeFor ? `
  <div class="block"><div class="panel">
      <p><b>${resumeFor.v}-variant</b> yarim yo&lsquo;lda qolgan &mdash;
         ${Object.keys(resumeFor.saved.a||{}).length} ta savolga javob berilgan.</p>
      <button class="btn btn-primary" id="doResume">Davom ettirish</button>
      <button class="btn" id="doRestart">Boshidan boshlash</button>
      <button class="btn" id="doCancel">Bekor qilish</button>
  </div></div>` : ''}

  <div class="block">
    <div class="eyebrow">Variantni tanlang</div>
    <div class="vgrid">
      ${vs.map(v=>{ const sv = load(v, MODE);
        return `<button class="vcard" data-v="${v}">
          ${sv?'<span class="resume"></span>':''}
          <b class="tnum">${v}</b><span>variant</span></button>`; }).join('')}
    </div>
    <p class="note">Har bir savolda to&lsquo;rt javobning ham izohi beriladi: to&lsquo;g&lsquo;risi nega
       to&lsquo;g&lsquo;ri, qolganlari nega noto&lsquo;g&lsquo;ri. Javoblar shu brauzerda saqlanadi, sahifa
       yopilsa ham o&lsquo;sha joydan davom ettirish mumkin.</p>
    <div><button class="btn" id="rnd">Tasodifiy variant</button></div>
  </div>

  <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  startEl.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; renderStart(null); });
  startEl.querySelectorAll('.vcard').forEach(b=>b.onclick=()=>pick(+b.dataset.v));
  startEl.querySelector('#rnd').onclick = ()=>pick(vs[Math.floor(Math.random()*vs.length)]);
  if (resumeFor){
    startEl.querySelector('#doResume').onclick = ()=>begin(resumeFor.v, resumeFor.saved);
    startEl.querySelector('#doRestart').onclick = ()=>{ clear(resumeFor.v, MODE); begin(resumeFor.v, null); };
    startEl.querySelector('#doCancel').onclick = ()=>renderStart(null);
  }
}
function pick(v){
  const saved = load(v, MODE);
  if (saved && Object.keys(saved.a||{}).length){ renderStart({v, saved}); window.scrollTo(0,0); }
  else begin(v, null);
}

function begin(v, saved){
  S = { v, mode:MODE, items:VAR[v].items, pass:VAR[v].pass,
        ans: saved?.a ? {...saved.a} : {}, i: saved?.i ?? 0, done:false, started: Date.now(),
        deadline: MODE==='exam' ? Date.now() + (saved?.left ?? 60*60*1000) : null };
  startEl.hidden = true; document.getElementById('result').hidden = true; examEl.hidden = false;
  examEl.innerHTML = `
    <div class="bar"><div class="bar-in">
      <img class="mini" src="${LOGO}" alt="">
      <div class="vname">${v}-variant<small>${MODE==='exam'?'Imtihon rejimi':'Mashq rejimi'}</small></div>
      <div class="prog"><i id="pbar"></i></div>
      <div class="clock tnum" id="clock">${MODE==='exam'?'60:00':'&nbsp;&mdash;&nbsp;'}</div>
      <button class="icon-btn" id="finish">Yakunlash</button>
    </div></div>
    <div class="cols">
      <div class="qcard" id="qcard"></div>
      <aside class="rail">
        <h3>Savollar</h3>
        <div class="cells" id="cells"></div>
        <div class="railfoot"><span id="cnt"></span><button class="btn" id="quit">Chiqish</button></div>
      </aside>
    </div>`;
  examEl.querySelector('#finish').onclick = finish;
  examEl.querySelector('#quit').onclick = ()=>{ save(); stopClock();
    examEl.hidden=true; startEl.hidden=false; renderStart(null); window.scrollTo(0,0); };
  if (MODE==='exam') startClock();
  draw(); window.scrollTo(0,0);
}
function startClock(){ stopClock();
  tick = setInterval(()=>{
    const left = S.deadline - Date.now();
    const c = document.getElementById('clock'); if(!c) return;
    c.textContent = fmt(left); c.classList.toggle('warn', left < 5*60*1000);
    if (left <= 0) finish();
  }, 250);
}
function stopClock(){ if (tick) clearInterval(tick); tick = null; }

function optionsHtml(q, chosen, reveal){
  return q.opts.map((o,ix)=>{
    const L = LET[ix];
    let cls = '', why = '';
    if (reveal){
      cls = L===q.ans ? ' correct' : (L===chosen ? ' wrong' : '');
      const good = L===q.ans;
      why = `<div class="why ${good?'good':'bad'}"><b>${good?"To'g'ri:":"Noto'g'ri:"}</b> ${esc(q.why[L])}</div>`;
    }
    return `<div class="optwrap"><button class="opt${cls}" data-l="${L}" ${reveal?'disabled':''}
        aria-pressed="${chosen===L}"><span class="letter">${L}</span><span>${mark(o)}</span></button>${why}</div>`;
  }).join('');
}

function draw(){
  const q = S.items[S.i], no = q.no, chosen = S.ans[no];
  const reveal = S.mode==='practice' && !!chosen;
  const p = S.pass[no];
  const card = document.getElementById('qcard');
  card.innerHTML = `
    <div class="qmeta"><span class="qno tnum">${no}</span>
      <span class="pts">${ball(q.pts)}</span><span class="sect">${SECT(no)}</span></div>
    ${p ? `<div class="passage"><div class="plead">${esc(p[0])}</div>
        ${p.slice(1).map(t=>`<p${t===t.toUpperCase()?' class="ptitle"':''}>${mark(t)}</p>`).join('')}</div>` : ''}
    <div class="qhead">${mark(q.head)}</div>
    ${q.text ? `<div class="qtext">${mark(q.text)}</div>` : ''}
    ${reveal ? `<div class="verdict ${chosen===q.ans?'good':'bad'}">${chosen===q.ans
        ? 'Barakalla, javob to’g’ri.'
        : 'Afsus, javob noto’g’ri. To’g’ri javob: '+q.ans+'.'}</div>` : ''}
    <div class="opts" style="margin-top:${reveal?'14px':'0'}">${optionsHtml(q, chosen, reveal)}</div>
    <div class="nav">
      <button class="btn" id="prev" ${S.i===0?'disabled':''}>&larr; Oldingi</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="next">${S.i===29?'Yakunlash':'Keyingi &rarr;'}</button>
    </div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  card.querySelector('#prev').onclick = ()=>go(S.i-1);
  card.querySelector('#next').onclick = ()=> S.i===29 ? finish() : go(S.i+1);
  drawRail();
}
function drawRail(){
  const cells = document.getElementById('cells');
  cells.innerHTML = S.items.map((q,ix)=>{
    const a = S.ans[q.no];
    let cls = 'cell' + (a?' done':'') + (ix===S.i?' cur':'');
    if (S.mode==='practice' && a) cls = 'cell ' + (a===q.ans?'ok':'no') + (ix===S.i?' cur':'');
    return `<button class="${cls}" data-i="${ix}">${q.no}</button>`;
  }).join('');
  cells.querySelectorAll('.cell').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const n = Object.keys(S.ans).length;
  document.getElementById('cnt').textContent = n + ' / 30 javob berildi';
  document.getElementById('pbar').style.width = (n/30*100)+'%';
}
function choose(L){
  const q = S.items[S.i];
  if (S.mode==='practice' && S.ans[q.no]) return;
  S.ans[q.no] = L; save();
  if (S.mode==='practice') draw();
  else { draw(); if (S.i < 29) setTimeout(()=>go(S.i+1), 160); }
}
function go(i){ if (i<0||i>29) return; S.i=i; save(); draw();
  document.getElementById('qcard').scrollIntoView({block:'start', behavior:'auto'}); }

document.addEventListener('keydown', e=>{
  if (!S || S.done || examEl.hidden) return;
  const k = e.key.toUpperCase();
  if (LET.includes(k)) { e.preventDefault(); choose(k); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(S.i+1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); go(S.i-1); }
});

function finish(){
  stopClock(); S.done = true; clear(S.v, S.mode);
  const used = S.mode==='exam' ? (60*60*1000 - Math.max(0, S.deadline - Date.now()))
                               : (Date.now() - S.started);
  let score=0, right=0; const bands={'0.9':0,'1.5':0,'2.6':0};
  for (const q of S.items) if (S.ans[q.no] === q.ans){ score += parseFloat(q.pts); right++; bands[q.pts]++; }
  score = Math.round(score*10)/10;
  const resEl = document.getElementById('result');
  examEl.hidden = true; resEl.hidden = false;
  resEl.innerHTML = `
    <div class="score">
      <div class="big tnum">${String(score).replace('.',',')}<small> / 50</small></div>
      <div class="meta">
        <b>${S.v}-variant &middot; ${S.mode==='exam'?'imtihon':'mashq'}</b>
        <span>${right} ta to&lsquo;g&lsquo;ri javob (30 tadan)</span>
        <span>Sarflangan vaqt: <span class="tnum">${fmt(used)}</span></span>
      </div>
      <div class="breakdown">
        <div class="bd"><div class="k">Grammar</div><div class="v tnum">${bands['0.9']}/10</div></div>
        <div class="bd"><div class="k">Vocabulary</div><div class="v tnum">${bands['1.5']}/10</div></div>
        <div class="bd"><div class="k">Reading</div><div class="v tnum">${bands['2.6']}/10</div></div>
      </div>
    </div>
    <div class="filters">
      <button class="chip" data-f="wrong" aria-pressed="true">Xatolar (${30-right})</button>
      <button class="chip" data-f="all" aria-pressed="false">Barcha savollar</button>
    </div>
    <div class="rev" id="rev"></div>
    <div class="endbar">
      <button class="btn btn-primary" id="again">Shu variantni qayta ishlash</button>
      <button class="btn" id="home">Boshqa variant tanlash</button>
    </div>
    <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  let filter = 'wrong';
  const rev = resEl.querySelector('#rev');
  function paint(){
    const list = S.items.filter(q => filter==='all' || S.ans[q.no]!==q.ans);
    rev.innerHTML = list.length ? list.map(q=>{
      const you = S.ans[q.no], ok = you===q.ans;
      return `<div class="rev-item ${ok?'hit':'miss'}">
        <div class="rev-head"><span class="n tnum">${q.no}</span>
          <span class="tag ${ok?'hit':'miss'}">${ok?"to’g’ri":'xato'}</span>
          <span class="sect">${SECT(q.no)} &middot; ${ball(q.pts)}</span></div>
        <div class="rev-q"><span class="h">${mark(q.head)}</span>${q.text?mark(q.text):''}</div>
        <div class="opts">${optionsHtml(q, you, true)}</div>
      </div>`;
    }).join('') : `<div class="rev-item hit"><b>Bu variantda bitta ham xato yo&lsquo;q. Barakalla!</b></div>`;
  }
  paint();
  resEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    filter = c.dataset.f;
    resEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.f===filter)));
    paint();
  });
  resEl.querySelector('#again').onclick = ()=>begin(S.v, null);
  resEl.querySelector('#home').onclick = ()=>{ resEl.hidden=true; startEl.hidden=false;
    renderStart(null); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

window.addEventListener('beforeunload', save);
renderStart(null);
</script>
</body>
</html>
