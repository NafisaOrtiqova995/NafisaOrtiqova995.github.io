and D is the opposite of becoming a destination for naturalists."},{"no":27,"pts":"2.6","head":"How do supporters answer the criticism about winter feeding?","text":"","opts":["They argue that no European landscape is truly wild","They deny that any animals were ever fed","They say the feeding was stopped after one winter","They claim the critics misunderstood the figures"],"ans":"A","expl":"Supporters reply that no European landscape is truly wild and that honest management is better than pretending otherwise. B contradicts the stated practice, and C and D describe answers they never give."},{"no":28,"pts":"2.6","head":"What does the text say about the size of competitive gaming audiences?","text":"","opts":["They are smaller than they were ten years ago","Most viewers watch only recorded highlights","Major finals can draw tens of millions of viewers","Audiences are limited to a few Asian countries"],"ans":"C","expl":"The first paragraph says a major final can attract tens of millions of viewers. A reverses the growth described, B contradicts the point about live streams, and D ignores the worldwide reach.","block":["Read the text and answer questions 28-30.","Competitive gaming has grown from small gatherings in internet cafes into an industry with stadiums and sponsors. A major final can attract tens of millions of viewers, most of them watching live streams rather than television. Prize funds for the largest tournaments now exceed those of several traditional sports.","The players themselves face unusual pressures. Reaction times matter enormously, and most professionals retire in their mid-twenties. Teams employ coaches, analysts and physiotherapists, and the better organisations now limit daily practice, having learned that twelve-hour sessions produce injuries rather than results.","Whether this counts as sport is still debated. Olympic officials have discussed the question repeatedly without reaching a conclusion. Supporters point to the training, the teamwork and the audiences. Opponents argue that the games themselves are commercial products owned by companies, which can be altered or withdrawn at any time."]},{"no":29,"pts":"2.6","head":"Why do the better organisations limit daily practice?","text":"","opts":["Because long sessions cause injuries rather than better results","Because sponsors insist on shorter working hours","Because players must also attend school","Because coaches are only available part of the day"],"ans":"A","expl":"The second paragraph says organisations learned that twelve-hour sessions produce injuries rather than results. B, C and D give reasons the text never offers."},{"no":30,"pts":"2.6","head":"What argument do opponents make?","text":"","opts":["The audiences are too small to matter","There is no real teamwork involved","The games are commercial products that companies can change","The players train for too few hours each week"],"ans":"C","expl":"Opponents argue that the games are commercial products owned by companies and can be altered or withdrawn. A and B contradict the points supporters make, and D reverses the concern about long practice."}]},{"variant":5,"items":[{"no":1,"pts":"0.9","head":"Choose the correct answer.","text":"Hardly ____ the ceremony begun when the power supply ____.","opts":["has / failed","did / fail","had / failed","had / had failed"],"ans":"C","expl":"The pattern is 'Hardly had ... when + past simple', with the auxiliary before the subject. A uses a present perfect, B uses 'did' with a past participle in the first gap, and D wrongly makes both verbs past perfect."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The archive ____ to the public for years before the council ____ to open it again.","opts":["was closed / decided","had been closed / decided","has been closed / decided","closed / had decided"],"ans":"B","expl":"A state lasting up to a later past event takes the past perfect passive 'had been closed', with the past simple 'decided'. A loses the earlier time, C uses a present perfect in a past narrative, and D reverses the order of events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the committee had met twice, no decision had yet been reached.","opts":["Despite","Even though","Owing to","Therefore"],"ans":"B","expl":"'Even though' introduces a contrast and takes a full clause. A must be followed by a noun phrase, C gives a cause, and D is a linking adverb that cannot join the clauses."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It is the shortage of rainfall ____ explains the poor harvest in the region.","opts":["that","which it","what","where"],"ans":"A","expl":"A cleft of this kind is completed by 'that'. B adds a pronoun the sentence does not need, C cannot introduce a cleft, and D refers to place rather than the subject."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the forecast ____ earlier, the organisers ____ the event indoors.","opts":["arrived / would move","been arrived / moved","arrived / would have moved","arrive / will move"],"ans":"C","expl":"This is an inverted third conditional, so the main clause takes 'would have moved'. A leaves the result in the present, B adds an unnecessary passive, and D uses present and future forms."},{"no":6,"pts":"0.9","head":"Which option means that the speaker is certain something happened?","text":"","opts":["They may have left the gate open.","They must have left the gate open.","They might have left the gate open.","They should have left the gate open."],"ans":"B","expl":"'Must have left' expresses a confident conclusion about the past. A and C express possibility rather than certainty, and D criticises something that was not done."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The surgeon requested that the instruments ____ before every operation.","opts":["be checked","are checked","were checked","check"],"ans":"A","expl":"After 'requested that' the subjunctive is used, and in the passive this is 'be checked'. B and C use ordinary tenses, and D is active and makes the instruments do the checking."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second route proved ____ shorter than the one marked on the old map.","opts":["too","very","so","appreciably"],"ans":"D","expl":"Comparatives take modifiers such as 'appreciably', 'far' or 'much'. A would mean excessively short, and B and C cannot modify a comparative form."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["My sister in law's car was parked outside the office.","My sister's-in-law car was parked outside the office.","My sister-in-laws' car was parked outside the office.","My sister-in-law's car was parked outside the office."],"ans":"D","expl":"A compound noun takes the possessive at the end of the whole phrase: 'my sister-in-law's car'. A drops the hyphens, B puts the apostrophe on the first word, and C makes the phrase plural without reason."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know when does the ferry leave?","Could you explain why was the order cancelled?","I wonder where has the file been stored?","Can you tell me how much the repair will cost?"],"ans":"D","expl":"An indirect question uses statement order: 'how much the repair will cost'. A, B and C all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The publisher agreed to ____ the launch until the illustrations were finished.","opts":["hold up","hold off","hold on","hold out"],"ans":"B","expl":"To 'hold off' something is to delay it until conditions are right. 'Hold up' means to delay by causing a problem, 'hold on' means to wait and takes no object, and 'hold out' means to resist."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["lift a question","rise a question steeply and wet","grow a question","raise a question"],"ans":"D","expl":"English says 'raise a question'. A and C use verbs that do not collocate with 'question', and B uses the intransitive 'rise' and adds words that make no sense."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The atmosphere in the waiting room was decidedly ~tense~.","opts":["crowded","relaxed","quiet","formal"],"ans":"B","expl":"'Tense' means full of nervous pressure, so its opposite is 'relaxed'. 'Crowded' refers to numbers, and 'quiet' and 'formal' describe noise and style rather than nervousness."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a crowd?","text":"","opts":["restless","sizeable","threadbare","good-natured"],"ans":"C","expl":"'Threadbare' describes worn cloth and cannot be used of a crowd. 'Restless' means uneasy, 'sizeable' means large, and 'good-natured' means friendly."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The negotiator was praised for her ~tenacity~ during the long dispute.","opts":["politeness","experience","patience","determination"],"ans":"D","expl":"'Tenacity' is the quality of refusing to give up, so 'determination' is the closest match. 'Politeness' describes manner, 'experience' describes background, and 'patience' is calm waiting rather than persistence."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The results were broadly ____ with those obtained by the other laboratory.","opts":["comparison","comparable","comparably","compare"],"ans":"B","expl":"After 'were' and the adverb 'broadly' an adjective is needed, and 'comparable with' is the fixed pattern. 'Comparison' is a noun, 'comparably' is an adverb, and 'compare' is a verb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The college is renowned ____ the quality of its engineering courses.","opts":["of","for","about","with"],"ans":"B","expl":"The adjective 'renowned' takes 'for' before the thing somebody is known for. 'Of', 'about' and 'with' are not used after this adjective."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The report described the response of the authorities as ~belated~.","opts":["coming later than it should have done","carried out with unusual speed","organised by several agencies together","announced without any public explanation"],"ans":"A","expl":"'Belated' means coming too late, which is why the word is a criticism. B is the opposite, C describes cooperation, and D describes secrecy."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A bottleneck is:","opts":["a narrow point where progress becomes slow","a container used for storing liquids","a route that avoids the centre of a town","a sudden increase in the price of goods"],"ans":"A","expl":"A 'bottleneck' is a narrow point at which movement or progress slows down. B takes the word literally, C describes a bypass, and D describes inflation."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["economical","frugal","prudent","mean"],"ans":"D","expl":"'Mean' describes somebody unwilling to spend or share, and it is always critical. 'Economical', 'frugal' and 'prudent' describe careful spending in an approving way."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To explain a change in the way meals are paid for","To announce new opening hours for the canteen","To warn pupils that prices will rise next term","To invite pupils to suggest new dishes"],"ans":"A","expl":"The notice explains that cash will no longer be taken and that accounts must be topped up online or at the machine. B is not mentioned, C invents a price rise, and D describes a consultation the notice never announces.","block":["Read the text and answer questions 21-22.","CHANGES TO CANTEEN PAYMENTS","From the start of next term the canteen will no longer accept cash. Pupils will pay using their school account, which can be topped up online by a parent or at the machine outside the main office. Accounts may not go below zero, so please check the balance regularly. Pupils entitled to free meals will see the correct amount added automatically each morning. Any cash remaining on an old card will be transferred during the first week."]},{"no":22,"pts":"2.6","head":"What are pupils told to do regularly?","text":"","opts":["Check how much is left in their account","Collect a new card from the office","Hand in cash at the machine each morning","Confirm their entitlement to free meals"],"ans":"A","expl":"The notice says accounts may not go below zero and asks pupils to check the balance regularly. B and C describe actions the notice never requires, and D applies only to a group whose amount is added automatically."},{"no":23,"pts":"2.6","head":"You hear a supervisor say: \"I will keep you posted on the inspection.\" What does this mean?","text":"","opts":["She will send the results by post","She will postpone the inspection","She will give you regular news about it","She will ask you to write a report"],"ans":"C","expl":"To 'keep somebody posted' is to go on giving them news. A takes 'posted' literally, B confuses it with postponing, and D reverses who does the writing."},{"no":24,"pts":"2.6","head":"You see this notice at a cycle hire point: \"Release code valid for ten minutes. Re-enter your booking reference if the light stays red.\" What is the main message?","text":"","opts":["Bicycles may be kept for a maximum of ten minutes","The red light means the station is closed","Use the code quickly, and try the reference again if it fails","A new code must be requested every ten minutes"],"ans":"C","expl":"The notice says the code lasts ten minutes and that the booking reference should be entered again if the light stays red. A misreads the code's life as the hire period, B invents a meaning for the light, and D is not what the instruction says."},{"no":25,"pts":"2.6","head":"What does the text say about the natural sleep pattern of teenagers?","text":"","opts":["It is identical to that of younger children","They need fewer hours than adults do","Their body clock shifts to later hours","It changes only during examination periods"],"ans":"C","expl":"The first paragraph says the body clock shifts later during adolescence. A and B contradict the comparison drawn, and D invents a link with examinations.","block":["Read the text and answer questions 25-27.","Most secondary schools begin before nine in the morning. Sleep researchers have argued for years that this is the wrong time for teenagers. During adolescence the body clock shifts later, so a sixteen-year-old may not feel sleepy until well after midnight and will struggle to wake at seven.","A number of schools have tested a later start. In one English study, pupils who began at ten reported better concentration and fewer absences. Examination results improved as well, although the researchers were careful to note that other changes were made at the same time, which makes the cause difficult to isolate.","The practical objections are considerable. Buses run to fixed timetables, parents leave for work early, and after-school activities would finish in darkness for much of the year. Several schools that tried the later start have since returned to their old hours, not because the research was wrong but because the day would not fit around it."]},{"no":26,"pts":"2.6","head":"What did the researchers point out about the examination results?","text":"","opts":["The improvement was smaller than expected","Only younger pupils showed any benefit","Other changes made the cause hard to isolate","The results were not measured properly"],"ans":"C","expl":"The second paragraph says the researchers noted that other changes were made at the same time, which makes the cause difficult to isolate. A and B are never stated, and D criticises the method in a way the text does not."},{"no":27,"pts":"2.6","head":"Why have some schools returned to their old hours?","text":"","opts":["The rest of the day would not fit around the change","The research was shown to be mistaken","Pupils asked to start earlier again","Absences increased after the later start"],"ans":"A","expl":"The final paragraph says schools returned not because the research was wrong but because the day would not fit around it. B is explicitly denied, and C and D contradict the reported benefits."},{"no":28,"pts":"2.6","head":"What does the text say about the size of a typical tiny house?","text":"","opts":["It is usually larger than a small flat","It is generally under forty square metres","It varies according to local building rules","It must be no bigger than a single room"],"ans":"B","expl":"The first paragraph says most are under forty square metres. A reverses the comparison, C confuses the later point about regulations, and D is narrower than the text states.","block":["Read the text and answer questions 28-30.","A tiny house is a permanent home built on a very small scale, usually under forty square metres and often on a trailer so that it can be moved. Owners describe two main attractions. The first is cost, since a tiny house can be built for a fraction of the price of a flat. The second is the freedom that comes with owning very little.","The reality is more complicated. Planning rules in many countries were not written with such buildings in mind, and owners frequently find that they cannot park legally for more than a few months. Banks are reluctant to lend against a house with wheels, so most owners must save the whole sum first.","Those who stay in them longest tend to be people without young children. Storage is the common complaint, followed by the difficulty of having guests. Even so, surveys of owners report high satisfaction, and the main regret is usually the time spent searching for somewhere to put the house."]},{"no":29,"pts":"2.6","head":"Why are banks reluctant to lend?","text":"","opts":["The house has wheels and can be moved","The houses are too expensive to insure","The owners rarely have regular work","Planning permission is never granted"],"ans":"A","expl":"The second paragraph says banks are reluctant to lend against a house with wheels. B and C are never mentioned, and D overstates the planning difficulty described."},{"no":30,"pts":"2.6","head":"According to the surveys, what do owners most often regret?","text":"","opts":["The lack of storage space","The cost of building the house","The difficulty of inviting guests","The time spent looking for a place to put the house"],"ans":"D","expl":"The final paragraph says the main regret is usually the time spent searching for somewhere to put the house. A and C are listed as complaints rather than the main regret, and B contradicts the low cost described earlier."}]},{"variant":6,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Rarely ____ a small company ____ such a large contract on its own.","opts":["does / wins","has / winning","did / won","does / win"],"ans":"D","expl":"After 'Rarely' the auxiliary comes before the subject and the main verb stays in the base form: 'does ... win'. A adds a third-person s after 'does', B uses an -ing form after 'has', and C uses a past form after 'did'."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The soil ____ for contamination long before the new houses ____.","opts":["was tested / were built","had been tested / were built","has been tested / were built","was being tested / had been built"],"ans":"B","expl":"The testing came first, so the past perfect passive 'had been tested' is used with the past simple 'were built'. A loses the time order, C puts a present perfect in a past narrative, and D reverses which event came first."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the committee met every week, the report was still three months late.","opts":["Although","Despite","Owing to","Thus"],"ans":"A","expl":"'Although' introduces a contrast and takes a full clause. B needs a noun phrase, C gives a cause, and D is a linking adverb that cannot join the clauses."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was not until the second inspection ____ the fault was identified.","opts":["when","that","which","then"],"ans":"B","expl":"A cleft beginning 'It was not until ...' is completed by 'that'. A and D cannot introduce the second clause, and C would need a noun to refer back to."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the archive ____ digitised, researchers ____ to travel across the country today.","opts":["was / would not need","had been / would not have needed","had been / would not need","is / will not need"],"ans":"C","expl":"The digitising belongs to the past but the result is present, so the mixed conditional 'had been / would not need' is correct. A puts both halves in the present, B places the result in the past although 'today' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that something was possible but did not happen?","text":"","opts":["The driver must have avoided the junction.","The driver had to avoid the junction.","The driver was able to avoid the junction.","The driver could have avoided the junction."],"ans":"D","expl":"'Could have avoided' describes a past possibility that was not taken. A expresses certainty that it happened, B states an obligation, and C says the driver actually managed it."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The inspector demanded that the records ____ available at once.","opts":["are made","be made","were made","make"],"ans":"B","expl":"After 'demanded that' the subjunctive is used, and in the passive this is 'be made'. A and C use ordinary tenses, and D is active and leaves the records doing the making."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The revised timetable is ____ more convenient for pupils travelling by bus.","opts":["very","too","markedly","so"],"ans":"C","expl":"Comparatives take modifiers such as 'markedly', 'far' or 'considerably'. A and D cannot modify a comparative, and B would mean excessively convenient."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The womens' changing room is at the end of the corridor.","The womens changing room's is at the end of the corridor.","The womens's changing room is at the end of the corridor.","The women's changing room is at the end of the corridor."],"ans":"D","expl":"'Women' is already plural, so the possessive adds an apostrophe and s: 'the women's changing room'. A treats 'womens' as the plural, B puts the apostrophe on the wrong word, and C adds both forms."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me how often does the bus run?","Do you know what time will the doors open?","I would like to know whether the application was received.","Can you explain where did the error occur?"],"ans":"C","expl":"An indirect question keeps statement order with no extra auxiliary: 'whether the application was received'. A, B and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two departments agreed to ____ their resources for the new project.","opts":["pile","pour","pool","pack"],"ans":"C","expl":"To 'pool' resources is to combine them for a shared purpose. 'Pile' means to heap up, 'pour' is used for liquids, and 'pack' means to put things into a container."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["catch a deadline","reach a deadline sharply and damp","meet a deadline","hold a deadline"],"ans":"C","expl":"English says 'meet a deadline'. A and D use verbs that do not collocate with 'deadline', and B adds words that make no sense with this noun."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The measures introduced after the accident were widely seen as ~inadequate~.","opts":["unpopular","sufficient","expensive","temporary"],"ans":"B","expl":"'Inadequate' means not enough, so its opposite is 'sufficient'. 'Unpopular' describes how people feel, and 'expensive' and 'temporary' describe cost and duration."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a building?","text":"","opts":["derelict","fluent","imposing","sprawling"],"ans":"B","expl":"'Fluent' describes speech and cannot be used of a building. 'Derelict' means abandoned, 'imposing' means large and impressive, and 'sprawling' means spreading over a wide area."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The instructions for assembling the shelves were needlessly ~convoluted~.","opts":["expensive","detailed","modern","complicated"],"ans":"D","expl":"'Convoluted' means twisted and hard to follow, so 'complicated' is the closest match. 'Expensive' refers to cost, 'detailed' to length, and 'modern' to period."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"Her ____ of the local dialect surprised everyone at the meeting.","opts":["knowledge","knowledgeable","knowing","known"],"ans":"A","expl":"The possessive 'Her' needs a noun, and 'knowledge of' is the fixed pattern. 'Knowledgeable' is an adjective, 'knowing' is a participle, and 'known' is a past participle."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme depends heavily ____ the goodwill of local volunteers.","opts":["on","from","of","to"],"ans":"A","expl":"The verb 'depend' is always followed by the preposition 'on' before the thing that decides the outcome. 'From' is used after verbs such as 'suffer', 'of' after 'consist', and 'to' after 'belong', so none of them can follow 'depend' in this sentence."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The manager was criticised for her ~autocratic~ style of leadership.","opts":["giving orders without consulting anybody else","allowing others to take all the decisions","changing her mind more often than necessary","explaining every instruction in great detail"],"ans":"A","expl":"'Autocratic' describes somebody who decides alone and does not consult others. B is the opposite, C describes indecision, and D describes thoroughness."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A loophole is:","opts":["a window in the wall of an old castle","a gap in a rule that allows it to be avoided","a mistake made when copying a document","a path that returns to its starting point"],"ans":"B","expl":"A 'loophole' is a gap in a rule or law that lets somebody get round it. A takes the word literally, C describes a copying error, and D describes a circular route."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["nosy","curious","inquisitive","interested"],"ans":"A","expl":"'Nosy' describes somebody who asks about matters that are none of their business, and it is always critical. 'Curious', 'inquisitive' and 'interested' describe the same wish to know in a neutral way."},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To explain how pupils can obtain tickets","To announce that the theatre club has closed","To ask pupils to audition for the next production","To thank the staff who built the scenery"],"ans":"A","expl":"The notice explains when tickets go on sale, where to buy them and what the limits are. B contradicts the forthcoming performances, C and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","THEATRE CLUB: TICKETS","Tickets for the three evening performances go on sale on Monday at the school office. Each pupil may buy up to four tickets, and family members are welcome. The Wednesday performance is usually the quietest, so anyone bringing younger children may prefer that evening. Tickets cannot be reserved by telephone. Any seats still unsold on the day will be offered free to pupils in Years 7 and 8."]},{"no":22,"pts":"2.6","head":"What does the notice suggest to people bringing young children?","text":"","opts":["They should buy their tickets by telephone","They should come to the Wednesday performance","They should sit at the back of the hall","They should wait until the day of the performance"],"ans":"B","expl":"The notice says Wednesday is usually the quietest and that anyone bringing younger children may prefer it. A is ruled out by the ban on telephone reservations, and C and D are never suggested."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"Let us touch base again before the end of the week.\" What does this mean?","text":"","opts":["He wants to meet the client together","He wants to speak again briefly before Friday","He is cancelling the arrangement for this week","He wants the work finished by the end of the week"],"ans":"B","expl":"To 'touch base' is to make brief contact again. A adds a client he never mentions, C reverses the plan, and D turns a conversation into a deadline for the work."},{"no":24,"pts":"2.6","head":"You see this notice at a recycling point: \"Glass only. Containers must be rinsed and lids removed.\" What is the main message?","text":"","opts":["Lids may be left on if the container is clean","All household waste may be deposited here","Only clean glass without lids should be put in","The point is closed for cleaning"],"ans":"C","expl":"The notice limits the point to glass and requires rinsing and the removal of lids. A contradicts the instruction, B ignores 'glass only', and D invents a closure."},{"no":25,"pts":"2.6","head":"What does the text say about the data collected by volunteers?","text":"","opts":["It is used only for teaching in schools","It is checked by a single national laboratory","It is rarely published in scientific journals","It covers areas professional teams could not reach"],"ans":"D","expl":"The first paragraph says volunteers cover a spread of places and times that no professional team could manage. A and C understate the use made of it, and B is never mentioned.","block":["Read the text and answer questions 25-27.","Citizen science asks members of the public to collect information that researchers then use. Volunteers count garden birds, photograph insects, record the first frogspawn of the year and measure rainfall. The value lies in coverage, because the volunteers between them reach a spread of places and times that no professional team could manage.","Accuracy is the obvious worry. Projects deal with it by keeping the task simple and by asking for evidence. A photograph can be checked by an expert, and a count of a single familiar species is harder to get wrong than a survey of everything present. Records that cannot be confirmed are marked as uncertain rather than thrown away.","The benefit runs in both directions. Long runs of volunteer data have shown changes in the timing of spring that no short study could reveal. Volunteers, for their part, report that they notice far more in a familiar place once they have started recording it, which may be the most lasting result of all."]},{"no":26,"pts":"2.6","head":"How do projects deal with the problem of accuracy?","text":"","opts":["By training every volunteer for several weeks","By accepting records only from experienced naturalists","By comparing every record with a professional survey","By keeping the task simple and asking for evidence"],"ans":"D","expl":"The second paragraph says projects keep the task simple and ask for evidence such as a photograph. A, B and C describe methods the text never mentions."},{"no":27,"pts":"2.6","head":"What does the writer suggest may be the most lasting result?","text":"","opts":["The change in how volunteers see a familiar place","The discovery of several new species","The improvement of weather forecasting","The reduction in the cost of research"],"ans":"A","expl":"The final sentence says volunteers notice far more in a familiar place once they have started recording, which may be the most lasting result. B, C and D are outcomes the text never claims."},{"no":28,"pts":"2.6","head":"What does the text say about the speed of delivery robots?","text":"","opts":["They move at about walking pace","They travel faster than a cyclist","They are slower in winter than in summer","Their speed is set by the customer"],"ans":"A","expl":"The first paragraph says the machines travel at about walking pace. B reverses the comparison, and C and D describe variations the text never mentions.","block":["Read the text and answer questions 28-30.","Small delivery robots are now a familiar sight on the pavements of several towns. The machines travel at about walking pace, carry a single order in a locked compartment and find their way using cameras and satellite positioning. A customer unlocks the lid with a code sent to a telephone.","Operators list the advantages readily. The robots are cheap to run, they produce no exhaust, and they can work at hours when few drivers want to. Supermarkets report that customers who live within a mile are happy to wait an extra twenty minutes if the delivery costs less.","Pavements, however, belong to pedestrians. Organisations representing blind and partially sighted people have objected that a silent machine is difficult to detect, and wheelchair users report being blocked at narrow corners. Several cities now require the robots to emit a sound and to give way at all times, and one has banned them from its oldest streets altogether."]},{"no":29,"pts":"2.6","head":"What do supermarkets report about customers living nearby?","text":"","opts":["They prefer to collect their orders in person","They complain about the twenty-minute wait","They order more often than customers further away","They accept a longer wait in return for a lower cost"],"ans":"D","expl":"The second paragraph says customers within a mile are happy to wait an extra twenty minutes if the delivery costs less. A and B contradict that, and C is never stated."},{"no":30,"pts":"2.6","head":"What have several cities decided to do?","text":"","opts":["Ban the robots from all residential streets","Limit deliveries to the hours of darkness","Require the robots to make a sound and give way","Charge operators for the use of the pavement"],"ans":"C","expl":"The final paragraph says several cities now require the robots to emit a sound and give way at all times. A overstates the single ban mentioned, and B and D are never described."}]},{"variant":7,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Only when the final witness had spoken ____ the jury ____ to consider its verdict.","opts":["did / began","had / begun","was / beginning","did / begin"],"ans":"D","expl":"After the fronted 'Only when ...' clause the main clause inverts, and after 'did' the verb stays in the base form: 'did the jury begin'. A adds a past form after 'did', B needs a participle in a different structure, and C keeps statement order."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The samples ____ in a sealed container ever since the laboratory ____ its new procedures.","opts":["are kept / adopted","have been kept / adopted","were kept / had adopted","had been kept / adopts"],"ans":"B","expl":"'Ever since' links a present perfect to a past event, so 'have been kept ... adopted' is correct. A uses a simple present for a period, C loses the connection with the present, and D mixes a past perfect with a present verb."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ its reputation for bad weather, the island attracts visitors throughout the year.","opts":["Although","Notwithstanding","Because of","However"],"ans":"B","expl":"'Notwithstanding' is followed by a noun phrase and introduces a contrast. A and D need a clause, and C gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the delay in ordering the parts ____ caused the factory to close for a week.","opts":["that","what","which it","when"],"ans":"A","expl":"A cleft of this kind is completed by 'that'. B cannot introduce a cleft clause, C adds an unnecessary pronoun, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the council listened to the engineers, the bridge ____ still ____ today.","opts":["would / stand","would / be standing","will / stand","would have / stood"],"ans":"B","expl":"This is an inverted mixed conditional: the past action has a present result, so 'would still be standing today' is correct. A loses the continuous sense of 'still', C uses a future form after an unreal condition, and D puts the result in the past although 'today' is stated."},{"no":6,"pts":"0.9","head":"Which option means that something is forbidden?","text":"","opts":["Visitors don't have to use the side gate.","Visitors needn't use the side gate.","Visitors mustn't use the side gate.","Visitors shouldn't have used the side gate."],"ans":"C","expl":"'Mustn't' expresses a prohibition. A and B say only that it is unnecessary, and D criticises something that was already done."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is essential that the application ____ before the end of the month.","opts":["be submitted","is submitted","was submitted","submits"],"ans":"A","expl":"After 'It is essential that' the subjunctive is used, and the passive form is 'be submitted'. B and C use ordinary tenses, and D is active and makes the application do the submitting."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The new design is ____ lighter than the model it replaces.","opts":["too","very","substantially","so"],"ans":"C","expl":"Comparatives take modifiers such as 'substantially', 'far' or 'much'. A would mean excessively light, and B and D cannot modify a comparative."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The passenger's luggage were searched before boarding.","The passengers' luggage was searched before boarding.","The passengers luggage's was searched before boarding.","The passengers's luggage was searched before boarding."],"ans":"B","expl":"A plural ending in s takes the apostrophe after the s, and 'luggage' is uncountable so the verb is singular. A has a plural verb with an uncountable noun, C puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me how long will the repairs take?","Can you explain where did the committee meet?","Do you know whether the results have been published?","I wonder what time does the office close?"],"ans":"C","expl":"An indirect question keeps statement order: 'whether the results have been published'. A, B and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The committee decided to ____ the matter to a higher authority.","opts":["reflect","refuse","reform","refer"],"ans":"D","expl":"To 'refer a matter to somebody' is to pass it on for their decision. 'Reflect' means to think carefully, 'refuse' means to say no, and 'reform' means to change an institution."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["make responsibility","have responsibility loudly and round","take responsibility","hold responsibility quickly"],"ans":"C","expl":"English says 'take responsibility'. A uses a verb that does not collocate with this noun, and B and D add adverbs that make no sense with it."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The response from the local authority was disappointingly ~sluggish~.","opts":["prompt","careful","expensive","public"],"ans":"A","expl":"'Sluggish' means slow to act, so its opposite is 'prompt'. 'Careful' describes thoroughness, and 'expensive' and 'public' describe cost and openness."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a smell?","text":"","opts":["pungent","faint","lucrative","acrid"],"ans":"C","expl":"'Lucrative' means producing a lot of money and cannot be used of a smell. 'Pungent' means strong and sharp, 'faint' means very weak, and 'acrid' means bitter and unpleasant."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The minister gave a ~succinct~ reply to a very long question.","opts":["angry","concise","evasive","detailed"],"ans":"B","expl":"'Succinct' means short and clearly expressed, so 'concise' is the closest match. 'Angry' describes mood, 'evasive' means avoiding the point, and 'detailed' is the opposite of brief."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The two accounts of the accident were ____ inconsistent with each other.","opts":["glaringly","glare","glaring","glared"],"ans":"A","expl":"An adverb is needed to modify the adjective 'inconsistent', and 'glaringly' is the adverb. 'Glare' and 'glared' are verb forms, and 'glaring' is an adjective."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The results were entirely ____ with the theory proposed ten years earlier.","opts":["in place","in time","in turn","in line"],"ans":"D","expl":"The fixed phrase is 'in line with', meaning in agreement with. 'In place' means ready, 'in time' refers to punctuality, and 'in turn' means one after another."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The review described the performance as ~lacklustre~.","opts":["carried out with unexpected skill","performed without energy or excitement","repeated too often during the season","attended by a very small audience"],"ans":"B","expl":"'Lacklustre' means dull and without energy, which is why the review is negative. A is the opposite, C describes frequency, and D describes the size of the audience."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A deterrent is:","opts":["a substance used for cleaning industrial surfaces","a payment made before a service is provided","an official who settles a dispute between two sides","something that discourages people from acting"],"ans":"D","expl":"A 'deterrent' is something that stops people from doing what they might otherwise do. A describes a detergent, B describes a deposit, and C describes an arbitrator."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["ambitious","driven","motivated","ruthless"],"ans":"D","expl":"'Ruthless' describes somebody who will hurt others to get what they want, and it is always critical. 'Ambitious', 'driven' and 'motivated' describe strong purpose without that implication."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To explain the arrangements during the repair work","To announce that the pool will be closed all summer","To invite swimmers to join a new club","To warn swimmers about the cost of lessons"],"ans":"A","expl":"The notice gives the dates of the closure, the alternative pool and the arrangement for season tickets. B overstates a four-week closure, C and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","POOL CLOSURE","The main pool will be closed for four weeks from 2 June while the filtration system is replaced. The small teaching pool will remain open for lessons only. Swimmers holding a season ticket may use the pool at Greenside during this period without further charge, on production of their ticket. Season tickets will be extended by four weeks at no cost. We apologise for the inconvenience and will post progress updates at reception."]},{"no":22,"pts":"2.6","head":"What may season ticket holders do during the closure?","text":"","opts":["Use the teaching pool at any time","Swim at Greenside by showing their ticket","Claim a refund at reception","Book private lessons at a reduced rate"],"ans":"B","expl":"The notice says season ticket holders may use the Greenside pool without further charge on production of their ticket. A contradicts 'for lessons only', and C and D describe arrangements the notice never offers."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"Getting the permit by Friday is a bit of a long shot.\" What does this mean?","text":"","opts":["He thinks the permit will certainly arrive on Friday","He has decided not to apply for the permit","He thinks it is unlikely that the permit will arrive by then","He believes the permit will take only a short time"],"ans":"C","expl":"'A long shot' is an attempt with little chance of succeeding. A reverses the meaning, B describes a decision he never announces, and D contradicts the doubt he expresses."},{"no":24,"pts":"2.6","head":"You see this notice in a hotel: \"Checkout is at 11:00. Late departure may be arranged at reception, subject to availability.\" What is the main message?","text":"","opts":["Guests must leave by eleven and cannot stay longer","Reception will charge every guest who leaves after eleven","Rooms are cleaned only after eleven o'clock","Guests may stay later if a room is free, but must ask first"],"ans":"D","expl":"The notice gives eleven as the normal time and says a later departure can be arranged if rooms allow. A ignores the second sentence, B invents a charge, and C describes cleaning that is never mentioned."},{"no":25,"pts":"2.6","head":"What does the text say about the growing of coral fragments?","text":"","opts":["They are grown on underwater frames before being replanted","They are kept in tanks on land for several years","They are collected from reefs that have already died","They grow faster when left attached to the parent colony"],"ans":"A","expl":"The first paragraph says fragments are tied to underwater frames, grown for months and then attached to damaged reef. B, C and D all contradict the method described.","block":["Read the text and answer questions 25-27.","Coral reefs can be rebuilt, at least in part, by a method borrowed from gardening. Small fragments are broken from a healthy colony and tied to frames anchored on the seabed. There they grow for several months, far faster than they would on the reef itself, before divers attach them to damaged areas.","The results are mixed. Survival after replanting depends almost entirely on the water. Where the sea warms sharply in summer, new colonies bleach and die as readily as old ones, and the work has to begin again. Where conditions are stable, cover can return to a damaged patch within a few years.","Most scientists therefore describe restoration as a way of buying time. It can keep a reef alive near a tourist centre, protect a stretch of coast from waves, and preserve particular species while the wider problem is addressed. What it cannot do, they insist, is replace action on the temperature of the ocean itself."]},{"no":26,"pts":"2.6","head":"What does survival after replanting depend on?","text":"","opts":["The depth at which the frames are anchored","The condition of the water, especially its temperature","The number of divers available for the work","The species of coral chosen for the fragments"],"ans":"B","expl":"The second paragraph says survival depends almost entirely on the water and describes what happens where the sea warms sharply. A, C and D are factors the text never names."},{"no":27,"pts":"2.6","head":"How do most scientists describe reef restoration?","text":"","opts":["As a way of buying time while the wider problem is tackled","As a complete solution to the problem","As a method suitable only for tourist areas","As too expensive to be worth attempting"],"ans":"A","expl":"The final paragraph says scientists describe restoration as a way of buying time. B is explicitly denied, C narrows the uses listed, and D is never claimed."},{"no":28,"pts":"2.6","head":"What does the text say about the number of people working from home?","text":"","opts":["It settled well above where it had been before","It returned to its earlier level within a year","It is now higher in factories than in offices","It has been falling steadily since 2021"],"ans":"A","expl":"The first paragraph says the figure fell back from its peak but settled well above where it began. B contradicts 'well above', C ignores the point about work that must be done on site, and D overstates the decline.","block":["Read the text and answer questions 28-30.","Working from home was unusual before 2020. It briefly became normal for anybody whose job allowed it. The figure fell back once offices reopened, but it has settled well above where it began. A large share of office employees now work at home for part of the week. Work that must be done on site has returned entirely.","Employers report two findings that sit awkwardly together. Individual tasks are generally completed at least as well at home, and often faster. Work that depends on several people learning from one another, however, suffers when nobody shares a room, and new staff in particular take longer to settle.","The compromise most organisations have reached is a fixed number of days in the office. The days are chosen so that teams overlap. Few employees say they want to return full time. Surveys suggest that the offer of home working now matters nearly as much as salary to candidates changing jobs."]},{"no":29,"pts":"2.6","head":"What do employers find about work done at home?","text":"","opts":["All kinds of work take longer than in the office","New staff settle more quickly than experienced staff","Teams communicate better than they did before","Individual tasks are done at least as well, often faster"],"ans":"D","expl":"The second paragraph says individual tasks are completed at least as well at home and often faster. A ignores that finding, B reverses the point about new staff, and C contradicts the difficulty with shared learning."},{"no":30,"pts":"2.6","head":"What do surveys suggest about candidates changing jobs?","text":"","opts":["They care little about where the work is done","Most want to return to the office full time","Home working matters nearly as much as pay","They prefer employers with no fixed office days"],"ans":"C","expl":"The final paragraph says the offer of home working now matters nearly as much as salary. A contradicts that, B reverses the finding about full-time return, and D is the opposite of the fixed-day compromise described."}]},{"variant":8,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"At no point ____ the officials ____ that the figures might be wrong.","opts":["did / suggested","had / suggesting","did / suggest","were / suggest"],"ans":"C","expl":"After the negative adverbial 'At no point' the auxiliary comes first and the verb stays in the base form: 'did the officials suggest'. A adds a past form after 'did', B uses an -ing form after 'had', and D mixes 'were' with a base form."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The tunnel ____ for over a decade before the first train ____ through it.","opts":["was built / ran","had been built / ran","has been built / ran","was being built / had run"],"ans":"B","expl":"A long process completed before a later past event takes the past perfect passive 'had been built', with the past simple 'ran'. A loses the order, C uses a present perfect in a past narrative, and D reverses the two events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ repeated requests from residents, the crossing has still not been repaired.","opts":["Although","Because of","In spite of","Nevertheless"],"ans":"C","expl":"'In spite of' is followed by a noun phrase and introduces a contrast. A and D need a clause, and B gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was not the cost ____ persuaded the trustees to reject the scheme.","opts":["what","which it","when","that"],"ans":"D","expl":"A cleft sentence of this kind is completed by 'that'. A cannot introduce a cleft, B adds an unnecessary pronoun, and C refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the engineers ____ the warning signs, the dam ____ intact today.","opts":["had noticed / would be","noticed / would be","had noticed / would have been","notice / will be"],"ans":"A","expl":"The action is past but the result is present, so the mixed conditional 'had noticed / would be' is correct. B puts both halves in the present, C places the result in the past although 'today' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that an obligation no longer exists?","text":"","opts":["You don't have to attend the briefing any longer.","You mustn't attend the briefing any longer.","You shouldn't have attended the briefing.","You needn't have attended the briefing."],"ans":"A","expl":"'Don't have to ... any longer' states that an obligation has ended. B forbids attendance, C criticises an action already taken, and D says the briefing was attended unnecessarily."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The regulations stipulate that every sample ____ within twenty-four hours.","opts":["be analysed","is analysed","was analysed","analyses"],"ans":"A","expl":"After 'stipulate that' the subjunctive is used, and the passive form is 'be analysed'. B and C use ordinary tenses, and D is active and makes the sample do the analysing."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The revised figures are ____ more reliable than those published last year.","opts":["very","so","too","appreciably"],"ans":"D","expl":"Comparatives take modifiers such as 'appreciably', 'far' or 'much'. A and B cannot modify a comparative, and C would mean excessively reliable, which is not a comparison."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The three author's names appeared on the cover in alphabetical order.","The three authors names' appeared on the cover in alphabetical order.","The three authors' names appeared on the cover in alphabetical order.","The three authors's names appeared on the cover in alphabetical order."],"ans":"C","expl":"A plural ending in s takes the apostrophe after the s: 'the three authors' names'. A is a singular possessive after 'three', B puts the apostrophe on the wrong word, and D adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me when the next collection is due?","Do you know how far is the nearest station?","Can you explain what did the inspector find?","I wonder why has the service been withdrawn?"],"ans":"A","expl":"An indirect question keeps statement order: 'when the next collection is due'. B, C and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The company was forced to ____ the faulty batteries from sale.","opts":["withhold","withdraw","withstand","wither"],"ans":"B","expl":"To 'withdraw' goods from sale is to take them off the market. 'Withhold' means to refuse to give, 'withstand' means to resist, and 'wither' means to dry up."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["pull a conclusion","catch a conclusion firmly and damp","fetch a conclusion","draw a conclusion"],"ans":"D","expl":"English says 'draw a conclusion'. A and C use verbs that do not collocate with 'conclusion', and B adds words that make no sense with this noun."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The explanation given by the department was entirely ~plausible~.","opts":["convincing","unbelievable","complicated","official"],"ans":"B","expl":"'Plausible' means believable, so its opposite is 'unbelievable'. 'Convincing' is a synonym, and 'complicated' and 'official' describe difficulty and source."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a decision?","text":"","opts":["porous","hasty","unanimous","provisional"],"ans":"A","expl":"'Porous' describes a material that lets liquid through and cannot be used of a decision. 'Hasty' means made too quickly, 'unanimous' means agreed by everybody, and 'provisional' means temporary."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The witness gave a ~coherent~ account of what had happened that evening.","opts":["lengthy","logical","emotional","cautious"],"ans":"B","expl":"'Coherent' means clear and logically connected, so 'logical' is the closest match. 'Lengthy' describes length, 'emotional' describes feeling, and 'cautious' describes care."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The hospital is entirely ____ on donations for its specialist equipment.","opts":["relied","reliance","reliant","reliably"],"ans":"C","expl":"After 'is' an adjective is needed, and 'reliant on' is the fixed pattern. 'Relied' is a verb form, 'reliance' is a noun, and 'reliably' is an adverb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The trustees were reluctant to ____ responsibility for the error.","opts":["admit","acknowledge","confess","recognise"],"ans":"B","expl":"'Acknowledge responsibility' is the standard collocation in a formal context. 'Admit' needs 'to' with a noun here, 'confess' takes a fault rather than responsibility, and 'recognise' means to identify rather than accept."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The agreement was condemned as a ~token~ gesture by several charities.","opts":["done only in small measure so as to appear to act","carried out with great care and attention","repeated every year on the same date","agreed by all the parties at the same time"],"ans":"A","expl":"A 'token' gesture is a small act done mainly for appearances, which is why charities condemned it. B describes thoroughness, C describes an annual event, and D describes unanimity."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"An incentive is:","opts":["a fault found during an official inspection","a payment demanded before work begins","a rule that applies only to new employees","something that encourages somebody to act"],"ans":"D","expl":"An 'incentive' is something offered to encourage action. A describes a defect, B describes a deposit, and C describes a regulation."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["timid","cautious","careful","measured"],"ans":"A","expl":"'Timid' suggests a lack of courage and is used critically. 'Cautious', 'careful' and 'measured' describe the same restraint in a neutral or approving way."},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To announce the cancellation of the careers fair","To invite employers to take part in the fair","To explain why some pupils may not attend","To tell pupils how to prepare for the fair"],"ans":"D","expl":"The notice tells pupils what to bring, how to dress and what to prepare. A contradicts the arrangements, B addresses employers rather than pupils, and C describes an exclusion the notice never mentions.","block":["Read the text and answer questions 21-22.","CAREERS FAIR: HOW TO PREPARE","Twenty-two employers and four universities will attend the fair on 18 October. Pupils should bring a short list of questions, since staff on the stands have very little time for each visitor. Smart dress is expected but a uniform is not required. Those hoping to discuss apprenticeships should print a one-page summary of their qualifications. The hall will be crowded between one and two o'clock, so pupils with a free period earlier are advised to come then."]},{"no":22,"pts":"2.6","head":"What does the notice advise pupils with a free period to do?","text":"","opts":["Bring a printed summary of their qualifications","Visit the university stands first","Wear school uniform to the fair","Arrive before the busiest hour"],"ans":"D","expl":"The notice says the hall will be crowded between one and two and advises pupils with an earlier free period to come then. A applies only to those discussing apprenticeships, B is never suggested, and C contradicts the statement about uniform."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"That project has been put on hold for the time being.\" What does this mean?","text":"","opts":["The project has been cancelled altogether","The project is being held up by a supplier","The project has been stopped temporarily","The project has been handed to another team"],"ans":"C","expl":"To 'put something on hold' is to pause it, and 'for the time being' shows the pause is temporary. A makes it permanent, B blames a supplier who is never mentioned, and D describes a transfer she does not announce."},{"no":24,"pts":"2.6","head":"You see this notice on a train: \"Quiet coach. Please set devices to silent and take telephone calls in the vestibule.\" What is the main message?","text":"","opts":["Telephones must be switched off completely","Passengers may not use devices of any kind in this coach","Keep devices silent and make calls outside the seating area","Calls are allowed only when the train is in a station"],"ans":"C","expl":"The notice asks for silent devices and for calls to be taken in the vestibule. A goes further than 'silent', B bans devices the notice allows, and D invents a rule about stations."},{"no":25,"pts":"2.6","head":"What does the text say about the cost of cultivated meat?","text":"","opts":["It has stayed the same since the first demonstration","It has fallen enormously but is still above farmed meat","It is now lower than the price of beef in most countries","It cannot be calculated because no product is on sale"],"ans":"B","expl":"The first paragraph says the cost has fallen enormously yet remains well above farmed meat. A contradicts the fall, C reverses the comparison, and D is contradicted by the approvals mentioned later.","block":["Read the text and answer questions 25-27.","Cultivated meat is grown from animal cells in a tank rather than taken from a slaughtered animal. The first laboratory burger, produced in 2013, cost a sum that would have bought a small house. Since then the cost has fallen enormously, although it remains well above the price of farmed meat.","Two countries have now approved the sale of such products, and small quantities are served in a handful of restaurants. Scaling up is the central difficulty. The tanks must be kept perfectly sterile, the liquid that feeds the cells is expensive, and the engineering that works in a laboratory does not simply become larger.","Opinions about the purpose differ. Some supporters emphasise animal welfare. Others point to the land and water that conventional farming requires. Critics question whether the energy used to keep the tanks warm and clean is any improvement. They add that nobody yet knows how the public will react once the novelty has passed."]},{"no":26,"pts":"2.6","head":"What is described as the central difficulty?","text":"","opts":["Obtaining approval from governments","Finding restaurants willing to serve the product","Persuading farmers to supply the cells","Increasing production to a larger scale"],"ans":"D","expl":"The second paragraph says scaling up is the central difficulty and explains why. A is contradicted by the two approvals, B is contradicted by the restaurants already serving it, and C is never mentioned."},{"no":27,"pts":"2.6","head":"What point do critics make?","text":"","opts":["The product tastes different from farmed meat","The energy used may cancel out the benefits","The tanks cannot be kept sterile for long","Governments have approved the sale too quickly"],"ans":"B","expl":"The final paragraph says critics question whether the energy used to keep tanks warm and clean is any improvement. A, C and D are objections the text never records."},{"no":28,"pts":"2.6","head":"Why did museums first begin opening late?","text":"","opts":["To attract people who cannot visit during working hours","To reduce the number of visitors during the day","To save money on heating and lighting","To allow more time for cleaning the galleries"],"ans":"A","expl":"The first paragraph says late openings were introduced to reach people who cannot come during working hours. B, C and D give reasons the text never offers.","block":["Read the text and answer questions 28-30.","Many museums now open late one evening a month. The idea was introduced to reach people who cannot visit during working hours, and it has been more successful than most directors expected. The evening audience is markedly younger than the daytime one, and a large proportion are visiting the building for the first time.","The programme matters. An evening that offers only the usual galleries draws modest numbers. Where there is music, a bar, a talk or a workshop, attendance rises sharply. Some curators worry that the collection itself becomes a background to the event, and that visitors leave having looked at very little.","The financial case is not straightforward either. Staffing an evening costs more than a weekday afternoon, and the income from tickets rarely covers it. Directors justify the expense in other terms. A first visit at twenty-five, they argue, may produce a member at thirty-five and a donor at fifty-five."]},{"no":29,"pts":"2.6","head":"What happens when an evening offers only the usual galleries?","text":"","opts":["Visitors stay much longer than usual","Attendance is modest","Curators report higher satisfaction","The income from tickets increases"],"ans":"B","expl":"The second paragraph says such an evening draws modest numbers, while music, a bar or a talk raises attendance sharply. A, C and D describe outcomes the text never reports."},{"no":30,"pts":"2.6","head":"How do directors justify the cost of late openings?","text":"","opts":["Ticket income covers the extra staffing","Evening visitors spend more in the shop","A first visit may lead to membership and donations later","The galleries need fewer staff in the evening"],"ans":"C","expl":"The final paragraph says directors argue that a first visit at twenty-five may produce a member at thirty-five and a donor at fifty-five. A contradicts the statement about income, and B and D are never mentioned."}]},{"variant":9,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Not until the following morning ____ anyone ____ that the painting was missing.","opts":["did / noticed","had / noticing","was / notice","did / notice"],"ans":"D","expl":"After the fronted negative 'Not until ...' the auxiliary comes before the subject and the verb stays in the base form: 'did anyone notice'. A adds a past form after 'did', B uses an -ing form, and C mixes 'was' with a base form."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The road ____ for repairs twice before the council finally ____ to rebuild it.","opts":["was closed / decided","has been closed / decided","had been closed / decided","closed / had decided"],"ans":"C","expl":"Two earlier closures before a later decision take the past perfect passive 'had been closed' with the past simple 'decided'. A loses the order, B uses a present perfect in a past narrative, and D reverses the events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the shortage of volunteers, the festival ran exactly as planned.","opts":["Although","Because of","Despite","Moreover"],"ans":"C","expl":"'Despite' is followed by a noun phrase and introduces a contrast. A and D need a clause, and B gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the second storm ____ brought down the power lines across the valley.","opts":["what","which it","that","when"],"ans":"C","expl":"A cleft of this kind is completed by 'that'. A cannot introduce a cleft, B adds a pronoun the sentence does not need, and D refers to time rather than the cause."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Had the samples ____ correctly, the error ____ at the first inspection.","opts":["been labelled / would have been found","been labelled / would be found","labelled / would have found","been labelled / will be found"],"ans":"A","expl":"This is an inverted third conditional in the passive: 'would have been found'. B leaves the result in the present, C is active and changes the meaning, and D uses a future form after an unreal condition."},{"no":6,"pts":"0.9","head":"Which option means that something was not required and was done anyway?","text":"","opts":["You didn't need to bring the original documents.","You mustn't bring the original documents.","You shouldn't bring the original documents.","You needn't have brought the original documents."],"ans":"D","expl":"'Needn't have brought' means the documents were brought although it was unnecessary. A leaves the action undone, B forbids it, and C advises against it in future."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The library insisted that every borrower ____ the new terms before using the service.","opts":["accepts","accept","accepted","is accepting"],"ans":"B","expl":"After 'insisted that' the subjunctive is used, which is the base form 'accept'. A is the ordinary present, C is past, and D is continuous."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The replacement engine is ____ quieter than the one it replaced.","opts":["very","too","so","noticeably"],"ans":"D","expl":"Comparatives take modifiers such as 'noticeably', 'far' or 'much'. A and C cannot modify a comparative, and B would mean excessively quiet."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["My parents-in-laws' house stands at the end of the lane.","My parent's-in-law house stands at the end of the lane.","My parents in law's house stands at the end of the lane.","My parents-in-law's house stands at the end of the lane."],"ans":"D","expl":"A compound noun takes the possessive at the end of the whole phrase: 'my parents-in-law's house'. A adds the apostrophe to the wrong element, B places it on the first word, and C omits the hyphens."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me where is the booking office?","Can you explain why was the meeting cancelled?","I wonder when will the report be ready?","Do you know how many copies were printed?"],"ans":"D","expl":"An indirect question keeps statement order: 'how many copies were printed'. A, B and C all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two companies agreed to ____ their differences out of court.","opts":["solve","settle","answer","repair"],"ans":"B","expl":"To 'settle' differences is to reach agreement about them. 'Solve' is used of problems and puzzles, 'answer' is used of questions, and 'repair' is used of objects and relationships."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["strike a balance","hit a balance","beat a balance neatly and tall","punch a balance"],"ans":"A","expl":"English says 'strike a balance'. B and D use verbs that do not collocate with 'balance', and C adds words that make no sense with this noun."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The design was praised for being remarkably ~robust~.","opts":["strong","fragile","simple","modern"],"ans":"B","expl":"'Robust' means strong and able to withstand rough treatment, so its opposite is 'fragile'. 'Strong' is a synonym, and 'simple' and 'modern' describe other qualities."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a road?","text":"","opts":["winding","congested","articulate","potholed"],"ans":"C","expl":"'Articulate' describes somebody who speaks clearly and cannot be used of a road. 'Winding' means full of bends, 'congested' means crowded with traffic, and 'potholed' means full of holes."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The witness described the events in ~meticulous~ detail.","opts":["confusing","brief","unexpected","careful"],"ans":"D","expl":"'Meticulous' means showing great attention to detail, so 'careful' is the closest match. 'Confusing' describes the effect on the listener, 'brief' is the opposite, and 'unexpected' refers to surprise."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"Her ____ to the project never wavered, even during the difficult months.","opts":["commitment","committed","commit","committing"],"ans":"A","expl":"The possessive 'Her' needs a noun, and 'commitment to' is the fixed pattern. 'Committed' is an adjective, 'commit' is a verb, and 'committing' is an -ing form."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The decision was taken ____ the advice of the legal department.","opts":["despite of","opposite to","contrary to","against of"],"ans":"C","expl":"'Contrary to' means in opposition to and is the standard phrase before 'advice'. A and D are not possible forms in English, and B describes physical position rather than disagreement."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The proposals were dismissed as ~unfeasible~ by the planning committee.","opts":["unpopular with people living nearby","more expensive than anybody expected","prepared without the correct documents","impossible to carry out in practice"],"ans":"D","expl":"'Unfeasible' means impossible to carry out. A describes opposition, B describes cost, and C describes a procedural fault."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A prerequisite is:","opts":["something that must exist before something else can happen","a question asked at the start of an interview","a payment made at the end of a contract","a summary written before a longer report"],"ans":"A","expl":"A 'prerequisite' is a condition that must be met first. B describes an opening question, C describes a final payment, and D describes an abstract."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["frank","direct","blunt","straightforward"],"ans":"C","expl":"'Blunt' suggests speaking so directly that feelings are hurt, and it carries criticism. 'Frank', 'direct' and 'straightforward' describe the same openness without that edge."},{"no":21,"pts":"2.6","head":"Why has this notice been displayed?","text":"","opts":["To explain a temporary change to the service","To announce that the bus service will stop","To invite passengers to suggest new routes","To warn passengers that fares will rise"],"ans":"A","expl":"The notice explains a diversion while a bridge is repaired and gives the alternative stop. B contradicts the continuing service, C and D concern matters the notice never raises.","block":["Read the text and answer questions 21-22.","SERVICE 14: TEMPORARY DIVERSION","While the canal bridge is repaired, service 14 will not serve Mill Road. Buses will instead follow Station Street and stop outside the post office. The diversion adds about six minutes to the journey, so passengers are advised to allow extra time. Timetables displayed at the affected stops have been covered and are not in use. The normal route will resume on 30 April, or earlier if the work finishes ahead of schedule."]},{"no":22,"pts":"2.6","head":"What are passengers told about the timetables at the affected stops?","text":"","opts":["They have been replaced with new ones","They are covered and should not be used","They should be read together with the notice","They will be removed on 30 April"],"ans":"B","expl":"The notice says the timetables have been covered and are not in use. A and C contradict that, and D applies the date to the wrong thing."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"The final date is still up in the air.\" What does this mean?","text":"","opts":["The date has been fixed but not announced","The date has not been decided yet","The date has been changed twice already","The date depends on the weather"],"ans":"B","expl":"To be 'up in the air' is to be undecided. A suggests a decision already made, C describes changes he does not mention, and D takes the phrase literally."},{"no":24,"pts":"2.6","head":"You see this notice at an airport: \"Gate closes 20 minutes before departure. Passengers arriving later will not be accepted.\" What is the main message?","text":"","opts":["You must be at the gate at least twenty minutes before the flight","Boarding begins twenty minutes before departure","Latecomers may be accepted if seats remain","The gate number changes twenty minutes before departure"],"ans":"A","expl":"The notice says the gate closes twenty minutes before departure and that later arrivals will not be accepted. B confuses closing with starting, C contradicts 'will not be accepted', and D invents a change of gate."},{"no":25,"pts":"2.6","head":"What does the text say about the first solar road surfaces?","text":"","opts":["They were cheaper to lay than ordinary roads","They produced far less power than expected","They were built only inside car parks","They lasted longer than the engineers hoped"],"ans":"B","expl":"The second paragraph says the output was far below the forecast. A contradicts the cost described, C ignores the public roads mentioned, and D reverses the wear problem.","block":["Read the text and answer questions 25-27.","The idea sounds attractive. Roads cover an enormous area and sit in the open all day. If the surface itself could generate electricity, no new land would be needed at all. Several countries have built short stretches of solar road to test the principle.","The results have been disappointing. Panels laid flat receive less light than panels tilted towards the sun. They are also shaded by vehicles and quickly become dirty. On every test stretch the output was far below the forecast, and the surfaces wore out faster than ordinary asphalt under heavy lorries.","Engineers have not abandoned the principle, but they have moved it. Solar panels are now built above roads rather than into them. A roof over a motorway catches more light, shelters the surface from rain and ice, and can be repaired without closing a lane. Several such roofs are already working in Europe."]},{"no":26,"pts":"2.6","head":"Why do panels laid flat perform poorly?","text":"","opts":["They are too heavy for most road surfaces","They receive less light than tilted panels","They cannot be connected to the electricity network","They are damaged by rain and ice"],"ans":"B","expl":"The second paragraph says panels laid flat receive less light than panels tilted towards the sun. A and C are never mentioned, and D belongs to the later point about roofs sheltering the surface."},{"no":27,"pts":"2.6","head":"What is the advantage of building panels above a road?","text":"","opts":["They catch more light and can be repaired without closing a lane","They can be cleaned automatically by rain","They cost less than panels laid into the surface","They allow the road below to be narrower"],"ans":"A","expl":"The final paragraph says a roof catches more light, shelters the surface and can be repaired without closing a lane. B, C and D describe ben
