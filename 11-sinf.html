<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>11-sinf Olimpiada Trenajori</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
</head>
<body>
<style>
/* Layout: friendly exam shell - branded masthead, one question column, numbered rail.
   Palette taken from the channel logo: teal puzzle piece, orange puzzle piece. */
:root{
  --bg:#F4F8F8; --surface:#FFFFFF; --surface-2:#E9F1F2; --fg:#15262A; --muted:#577076;
  --line:#D5E3E5; --line-strong:#B6CCD0;
  --teal:#15808F; --teal-soft:#DDF0F2; --orange:#D2561A; --orange-soft:#FCEADF;
  --ok:#17795A; --ok-soft:#DFF3EC; --bad:#B23A2B; --bad-soft:#FCE7E3;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-q:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:5px}
.wrap{max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- start ---------- */
#start{padding-block:34px 56px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;
  box-shadow:0 1px 2px rgba(21,38,42,.05)}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:18px;padding:22px 18px}}
.logo{width:124px;height:124px;border-radius:16px;display:block;object-fit:cover;
  border:1px solid var(--line)}
@media (max-width:640px){.logo{width:104px;height:104px}}
.hero h1{font-family:var(--font-display);font-size:clamp(1.45rem,4.2vw,2.3rem);line-height:1.15;
  font-weight:700;letter-spacing:-.01em;color:var(--teal)}
.hero .sub{margin-top:10px;font-size:clamp(.95rem,2.2vw,1.05rem);color:var(--fg);
  border-left:3px solid var(--orange);padding-left:12px;max-width:60ch}
@media (max-width:640px){.hero .sub{border-left:0;border-top:3px solid var(--orange);
  padding-left:0;padding-top:10px;text-align:center}}
.hero .chan{margin-top:12px;font-size:.86rem;color:var(--muted)}
.hero .chan b{color:var(--fg)}
.specs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
@media (max-width:640px){.specs{justify-content:center}}
.spec{font-size:.78rem;background:var(--teal-soft);color:var(--fg);border-radius:999px;padding:4px 11px}
.spec b{color:var(--teal);font-weight:700}

.block{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
.mode{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;align-items:flex-start;transition:border-color .12s,background .12s}
.mode[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.mode .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-strong);margin-top:4px;flex:none}
.mode[aria-pressed="true"] .dot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--surface)}
.mode h3{font-size:1rem;font-weight:700}
.mode span.d{font-size:.85rem;color:var(--muted);display:block;margin-top:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
.vcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:border-color .12s,transform .12s,box-shadow .12s}
.vcard:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 4px 12px rgba(21,128,143,.14)}
.vcard b{font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1;color:var(--teal)}
.vcard span{font-size:.74rem;color:var(--muted)}
.vcard .resume{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:16px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel p{margin:0;font-size:.92rem;flex:1 1 220px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
  padding:10px 16px;font-size:.9rem;font-weight:600;transition:border-color .12s,filter .12s}
.btn:hover{border-color:var(--teal)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0C1416}}
.btn-primary:hover{filter:brightness(1.08)}

/* ---------- exam ---------- */
#exam{display:flex;flex-direction:column;min-height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:13px;padding-block:10px;max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .mini{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover}
.bar .vname{font-weight:700;font-size:.92rem;white-space:nowrap;line-height:1.2}
.bar .vname small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.clock{margin-left:auto;font-size:1.22rem;font-weight:700;padding:3px 11px;border-radius:9px;
  background:var(--surface-2)}
.clock.warn{background:var(--bad-soft);color:var(--bad)}
.prog{flex:1 1 80px;min-width:60px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .2s}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;
  font-size:.85rem;font-weight:600;flex:none}
@media (max-width:560px){
  .bar-in{gap:9px}
  .bar .mini{display:none}
  .bar .prog{display:none}
  .bar .vname{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .clock{font-size:1.05rem;padding:3px 8px}
  .icon-btn{padding:7px 10px;font-size:.8rem}
}

.cols{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;max-width:1140px;
  margin:0 auto;width:100%;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
@media (max-width:460px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1;color:var(--teal)}
.pts{font-size:.76rem;font-weight:700;color:var(--orange);background:var(--orange-soft);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.sect{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-left:auto;font-weight:700}
.passage{border:1px solid var(--line);border-left:4px solid var(--teal);background:var(--surface-2);
  border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:16px;font-family:var(--font-q);
  font-size:.98rem;line-height:1.64;max-height:46vh;overflow-y:auto}
.passage .plead{font-family:var(--font-ui);font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);font-weight:700;margin-bottom:8px}
.passage .ptitle{font-weight:600;letter-spacing:.03em}
.passage p{margin:0 0 .7em}.passage p:last-child{margin-bottom:0}
.qhead{font-weight:700;font-size:1rem;margin-bottom:6px}
.qtext{font-family:var(--font-q);font-size:1.1rem;line-height:1.6;margin-bottom:16px}
.qtext u{text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:9px}
.optwrap{display:flex;flex-direction:column}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-family:var(--font-q);font-size:1.03rem;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.opt .letter{font-family:var(--font-ui);font-size:.82rem;font-weight:700;flex:none;
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;color:var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"] .letter{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.why{font-size:.88rem;line-height:1.5;margin:5px 0 0 38px;padding-left:11px;
  border-left:2px solid var(--line-strong);color:var(--muted)}
.why.good{border-left-color:var(--ok);color:var(--fg)}
.why.bad{border-left-color:var(--bad)}
.why b{font-weight:700}
.why.good b{color:var(--ok)}.why.bad b{color:var(--bad)}
.verdict{margin-top:14px;border-radius:11px;padding:10px 14px;font-weight:700;font-size:.93rem}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.nav .btn{min-width:98px;text-align:center}
.nav .spacer{flex:1}

.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}
.rail h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  font-size:.83rem;font-weight:600;display:grid;place-items:center;padding:0}
.cell:hover{border-color:var(--teal)}
.cell.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.cell.cur{outline:2px solid var(--orange);outline-offset:1px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.railfoot{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:9px}
@media (max-width:880px){.rail{position:static;order:-1}.cells{grid-template-columns:repeat(10,1fr)}}

/* ---------- result ---------- */
#result{padding-block:34px 56px}
.score{display:flex;flex-wrap:wrap;gap:22px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:6px 6px 16px 16px;padding:22px}
.score .big{font-family:var(--font-display);font-size:clamp(2.5rem,9vw,3.5rem);font-weight:700;
  line-height:.95;color:var(--teal)}
.score .big small{font-size:.36em;color:var(--muted);font-weight:600}
.score .meta{display:flex;flex-direction:column;gap:3px}
.score .meta b{font-size:1.05rem}
.score .meta span{font-size:.87rem;color:var(--muted)}
.breakdown{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bd{border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:116px;background:var(--surface-2)}
.bd .k{font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bd .v{font-size:1.15rem;font-weight:700;margin-top:2px}
.filters{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;
  font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C1416}}
.rev{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 19px}
.rev-item.miss{border-left:4px solid var(--bad)}
.rev-item.hit{border-left:4px solid var(--ok)}
.rev-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.rev-head .n{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--teal)}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px}
.tag.hit{background:var(--ok-soft);color:var(--ok)}
.tag.miss{background:var(--bad-soft);color:var(--bad)}
.rev-q{font-family:var(--font-q);font-size:1.02rem;margin-bottom:10px}
.rev-q .h{font-family:var(--font-ui);font-weight:700;font-size:.95rem;display:block}
.endbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
footer{color:var(--muted);font-size:.82rem;padding-block:24px;border-top:1px solid var(--line);margin-top:36px}
footer b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="start" class="wrap"></div>
<div id="exam" hidden></div>
<div id="result" class="wrap" hidden></div>

rish ma'nosini beradi va bu yerga mos emas.","D":"'Marshalled' saflash yoki tartibga solishni bildiradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["reach a verdict","arrive a verdict","achieve a verdict loudly and thin","gain a verdict"],"ans":"A","why":{"A":"Ingliz tilida hukmga kelish 'reach a verdict' deyiladi.","B":"'Arrive' bu ot bilan to'g'ridan-to'g'ri birikmaydi, u 'at' predlogini talab qiladi.","C":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","D":"'Gain' bu ot bilan ishlatilmaydi."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The explanation offered at the hearing was decidedly ~plausible~.","opts":["convincing","detailed","far-fetched","lengthy"],"ans":"C","why":{"A":"'Convincing' ma'no jihatidan sinonim, teskarisi emas.","B":"'Detailed' batafsillikni bildiradi, ishonarlilikni emas.","C":"'Plausible' ishonarli degani, uning teskarisi 'far-fetched' ya'ni haqiqatdan uzoq.","D":"'Lengthy' uzunlikni bildiradi va teskari ma'no bermaydi."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe an argument?","text":"","opts":["compelling","circular","perishable","flawed"],"ans":"C","why":{"A":"'Compelling' ishonarli degani va dalilni tasvirlaydi.","B":"'Circular' o'z o'zini takrorlaydigan degani, bu ham dalilga tegishli.","C":"'Perishable' tez buziladigan degani bo'lib, faqat oziq-ovqat haqida ishlatiladi.","D":"'Flawed' kamchiligi bor degani va dalil haqida aytiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The curator gave a ~meticulous~ account of the restoration process.","opts":["painstaking","hurried","informal","partial"],"ans":"A","why":{"A":"'Meticulous' nihoyatda puxta va mayda-chuyda e'tiborli degani, 'painstaking' esa shu ma'noni beradi.","B":"'Hurried' shoshilinch degani va teskari tomonga tortadi.","C":"'Informal' uslubni bildiradi, puxtalikni emas.","D":"'Partial' to'liq emaslikni bildiradi va bu yerga mos kelmaydi."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The proposal was rejected on the grounds of its sheer ____.","opts":["complex","complexly","complexities","complexity"],"ans":"D","why":{"A":"'Complex' sifat bo'lib, 'its' dan keyin ot talab qilinadi.","B":"'Complexly' ravish bo'lib, fe'lni izohlaydi.","C":"'Complexities' ko'plik shakli bo'lib, 'sheer' bilan bu ma'noda ishlatilmaydi.","D":"'Its sheer' dan keyin sanalmaydigan ot kerak, 'complexity' esa shu shakldir."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The findings cast serious doubt ____ the methods used by the earlier team.","opts":["in","of","on","against"],"ans":"C","why":{"A":"'Doubt' bu birikmada 'in' predlogini olmaydi.","B":"'Of' bu ot bilan bunday qurilishda kelmaydi.","C":"'Cast doubt on' barqaror birikma bo'lib, shubha qaratilgan narsani ko'rsatadi.","D":"'Against' qarshilikni bildiradi va bu iboraga mos emas."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The report described the department's record-keeping as ~lax~.","opts":["deliberately kept from the public","not strict or careful enough","spread across too many offices","written in an outdated style"],"ans":"B","why":{"A":"Yashirish bu so'zning ma'nosi emas.","B":"'Lax' talabchan emas, beparvo degani.","C":"Bo'linib ketgani haqidagi ta'rif mos kelmaydi.","D":"Uslub haqidagi ta'rif bu so'zga aloqador emas."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A precedent is:","opts":["a formal warning given before a penalty","an earlier case used as a guide for later ones","a summary read at the start of a meeting","a rule that applies for a limited period"],"ans":"B","why":{"A":"Ogohlantirish 'caution' deb ataladi.","B":"'Precedent' keyingi holatlar uchun namuna bo'luvchi avvalgi voqea degani.","C":"Yig'ilish boshidagi bayon 'opening statement' deyiladi.","D":"Muddatli qoida 'temporary provision' deb ataladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["meticulous","thorough","precise","pedantic"],"ans":"D","why":{"A":"'Meticulous' puxta degani va ijobiy baho beradi.","B":"'Thorough' sinchkov degani, bu ham ijobiy so'z.","C":"'Precise' aniq degani va maqtov ma'nosini beradi.","D":"'Pedantic' arzimas tafsilotlarga ortiqcha yopishadigan degani bo'lib, tanqidiy ma'noga ega."}},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To announce that the open day has been cancelled","To invite staff to volunteer as guides","To set out what visitors can do on the open day","To explain how to apply for a place on a course"],"ans":"C","why":{"A":"Bekor qilish haqida e'londa hech narsa aytilmagan.","B":"Xodimlardan ko'ngillilik so'ralmagan.","C":"E'londa dastur, ro'yxatdan o'tish, laboratoriya tashrifi va transport haqida ma'lumot berilgan.","D":"Kursga hujjat topshirish tartibi e'londa tushuntirilmagan."},"block":["Read the text and answer questions 21-22.","UNIVERSITY OPEN DAY","Talks begin at ten and are repeated at two. Visitors who arrive late therefore miss nothing. Laboratory tours must be booked at the welcome desk on arrival, as numbers in each group are limited. Current students will be in the main hall all day. They are the best source of practical information. Parking on campus is reserved for visitors with limited mobility; everyone else should use the shuttle from the station."]},{"no":22,"pts":"2.6","head":"What does the notice suggest about the students in the main hall?","text":"","opts":["They will give the formal talks","They will guide the laboratory tours","They must be booked in advance","They are the best source of practical information"],"ans":"D","why":{"A":"Ma'ruzalar haqida e'londa kim o'qishi aytilmagan.","B":"Laboratoriya tashrifini kim olib borishi e'londa ko'rsatilmagan.","C":"Oldindan band qilish faqat laboratoriya tashrifiga tegishli.","D":"E'londa talabalar amaliy ma'lumot uchun eng yaxshi manba ekani aytilgan."}},{"no":23,"pts":"2.6","head":"You hear a researcher say: \"I would take those figures with a pinch of salt.\" What does she mean?","text":"","opts":["She believes the figures have been invented","She thinks the figures should be treated with caution","She wants the figures to be published quickly","She finds the figures difficult to understand"],"ans":"B","why":{"A":"Ibora soxtalashtirish kabi og'ir ayblovni bildirmaydi.","B":"'Take something with a pinch of salt' iborasi unga to'liq ishonmaslik kerakligini bildiradi.","C":"Nashr etish haqida ibora hech narsa demaydi.","D":"Tushunish qiyinligi bu iboraning ma'nosi emas."}},{"no":24,"pts":"2.6","head":"You see this notice in a library: \"Silent study area. Discussion rooms are available on the first floor.\" What is the main message?","text":"","opts":["The whole library must be kept silent at all times","Talking is not allowed here, but there is a room for it upstairs","Discussion rooms must be booked at the desk","This area is reserved for members of staff"],"ans":"B","why":{"A":"E'lon butun kutubxonaga emas, faqat shu qismga tegishli.","B":"E'londa bu joyda jim bo'lish kerakligi va suhbat uchun alohida xona borligi aytilgan.","C":"Band qilish haqida e'londa hech narsa yozilmagan.","D":"Xodimlar uchun ajratilgani haqida gap yo'q."}},{"no":25,"pts":"2.6","head":"What does the text say about the purpose of seed banks?","text":"","opts":["They preserve varieties that are no longer grown commercially","They supply seed directly to large commercial farms","They store only the varieties that grow fastest","They were set up to replace plant breeding programmes"],"ans":"A","why":{"A":"Birinchi xatboshida savdoda qolmagan navlarni saqlash maqsadi aytilgan.","B":"Yirik fermalarga sotish haqida matnda hech narsa yozilmagan.","C":"Tez o'sadigan navlar haqida matnda gap yo'q.","D":"Seleksiyani almashtirish haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 25-27.","A seed bank is a store of varieties that are no longer grown commercially. Farming has narrowed to a handful of high-yielding types, and the ones left behind carry traits that may matter later: resistance to a disease, tolerance of salt or drought, a root that goes deeper.","Storage is the straightforward part. Seeds are dried, sealed and kept below freezing, where many remain viable for decades. The demanding work is regeneration, because a sample that is never grown eventually dies. Each variety must be planted out, allowed to set seed and harvested again on a cycle.","The collections have already proved their worth. When a disease swept through wheat crops in one region, resistant material was found in a bank rather than in a field. The varieties nobody wanted turned out to be the ones that mattered, which is an argument for keeping what currently seems useless."]},{"no":26,"pts":"2.6","head":"Why is regeneration described as the demanding part?","text":"","opts":["Frozen seeds lose their value after a single season","A sample that is never grown eventually dies","The seeds must be tested for disease every year","Each variety needs a different storage temperature"],"ans":"B","why":{"A":"Bir mavsumda yo'qolishi haqida matnda hech narsa aytilmagan.","B":"Ikkinchi xatboshida hech qachon ekilmagan namuna oxir-oqibat nobud bo'lishi aytilgan.","C":"Kasallikka tekshirish haqida matnda gap yo'q.","D":"Turli harorat haqida matnda ma'lumot berilmagan."}},{"no":27,"pts":"2.6","head":"What conclusion does the writer draw from the wheat example?","text":"","opts":["It is worth keeping material that currently seems useless","Banks should concentrate on commercial varieties","Field research is more reliable than stored collections","Disease resistance can be created in a laboratory"],"ans":"A","why":{"A":"Uchinchi xatboshida hozir keraksiz tuyulgan narsani saqlash foydali ekani xulosa qilingan.","B":"Matn aksincha, savdo navlariga e'tibor qaratishga qarshi dalil keltiradi.","C":"Dala tadqiqoti ustunligi haqida matnda gap yo'q.","D":"Laboratoriyada yaratish haqida matnda hech narsa yozilmagan."}},{"no":28,"pts":"2.6","head":"What does the text say about the closure of bank branches?","text":"","opts":["It has been resisted successfully in most countries","It has slowed since cash use began to rise again","It has affected city centres more than rural areas","It has been fastest in small towns and villages"],"ans":"D","why":{"A":"Muvaffaqiyatli qarshilik haqida matnda hech narsa yozilmagan.","B":"Sekinlashuv haqida matnda gap yo'q.","C":"Matnda aksincha, qishloq joylar ko'proq zarar ko'rgani aytilgan.","D":"Birinchi xatboshida yopilish kichik shahar va qishloqlarda eng tez borgani aytilgan."},"block":["Read the text and answer questions 28-30.","Bank branches have been closing for two decades, and the process has been fastest in small towns and villages. The reasoning is plain enough. Most transactions now happen on a screen. A counter that serves forty people a day is expensive to keep open.","The people left behind are not a random sample. They are disproportionately elderly, and they include the small businesses that still deal in cash. A shop that takes two hundred pounds in coins on a Saturday needs somewhere to put it. A forty-mile round trip is not a solution.","Several countries have settled on shared premises. One counter, staffed by a single operator, handles the customers of every major bank in turn. The arrangement satisfies nobody completely, and it is plainly a compromise, but it keeps a cash service within reach of the people who still need one."]},{"no":29,"pts":"2.6","head":"Who is most affected by the closures?","text":"","opts":["Customers who bank online most often","Employees of the banks themselves","Visitors who need foreign currency","Elderly people and small cash businesses"],"ans":"D","why":{"A":"Onlayn mijozlar aynan yopilishning sababi bo'lib, ular zarar ko'rmaydi.","B":"Xodimlar haqida matnda hech narsa yozilmagan.","C":"Valyuta xizmati haqida matnda gap yo'q.","D":"Ikkinchi xatboshida keksalar va naqd pul bilan ishlovchi kichik biznes aytilgan."}},{"no":30,"pts":"2.6","head":"How does the writer describe the shared premises?","text":"","opts":["As a compromise that keeps a service within reach","As a complete solution to the problem","As an arrangement that banks have refused to join","As a temporary measure that has already ended"],"ans":"A","why":{"A":"Uchinchi xatboshida bu hech kimni to'liq qoniqtirmagan, ammo xizmatni yetib boradigan masofada saqlagan murosa deb baholangan.","B":"Matnda aynan to'liq yechim emasligi aytilgan.","C":"Banklarning rad etgani haqida matnda gap yo'q.","D":"Tugagani haqida matnda hech narsa yozilmagan."}}]},{"variant":2,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Scarcely ____ the results ____ when the first objections were raised.","opts":["have / been published","did / publish","had / publishing","had / been published"],"ans":"D","why":{"A":"'Have' hozirgi zamonni bildiradi, gapning qolgan qismi esa o'tgan zamonda.","B":"'Did publish' aktiv shakl bo'lib, natijalarning o'zi chop etgan degan ma'no chiqadi.","C":"'Had' dan keyin uchinchi shakl kerak, '-ing' shakli emas.","D":"'Scarcely' gap boshida kelsa 'had' egadan oldinga chiqadi va majhul nisbat 'had been published' bo'ladi."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The settlement ____ for over a century before archaeologists ____ the first trench.","opts":["was abandoned / dug","has been abandoned / dug","had been abandoned / dug","was being abandoned / had dug"],"ans":"C","why":{"A":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.","B":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","C":"Avvalgi uzoq holat past perfect majhul 'had been abandoned', keyingi ish past simple 'dug' bo'ladi.","D":"Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the funding had been secured, the project remained at a standstill.","opts":["Despite","Even though","Owing to","Hence"],"ans":"B","why":{"A":"'Despite' dan keyin ot birikmasi keladi, bu yerda esa to'liq gap turibdi.","B":"'Even though' to'liq gap bilan keladi va qarama-qarshilikni kuchli ifodalaydi.","C":"'Owing to' sababni bildiradi va gapning mantiqini teskari qiladi.","D":"'Hence' natijani bildiruvchi kirish so'z bo'lib, gapni bunday bog'lamaydi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was not until the second inspection ____ the defect came to light.","opts":["when","that","which","what"],"ans":"B","why":{"A":"'When' bu qurilishda 'that' o'rnini bosa olmaydi.","B":"'It was not until ... that' barqaror ta'kidlovchi qurilish bo'lib, 'that' bilan to'ldiriladi.","C":"'Which' narsaga ishora qiladi, bu yerda esa vaqt ta'kidlanmoqda.","D":"'What' ta'kidlovchi gapni boshlay olmaydi."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"Were the climate ____ a decade ago, the agreement ____ far easier to reach.","opts":["understood / would be","understood as well as it is / would have been","to be understood / will be","as well understood / would have been"],"ans":"D","why":{"A":"Bu shakl o'tmishdagi holat va o'tmishdagi natijani bog'lamaydi, qiyoslash ham tushib qolgan.","B":"Bu variant haddan tashqari cho'zilgan va 'Were' qurilishiga mos tushmaydi.","C":"'To be understood' shart gapda ishlatilmaydi va 'will be' noreal shartga mos emas.","D":"'Were ... as well understood' teskari tartibli shart bo'lib, o'tmishdagi natija 'would have been' bilan beriladi."}},{"no":6,"pts":"0.9","head":"Which option expresses a confident deduction about the past?","text":"","opts":["The courier may have delivered it to the wrong office.","The courier must have delivered it to the wrong office.","The courier ought to have delivered it to the right office.","The courier might have delivered it to the wrong office."],"ans":"B","why":{"A":"'May have' faqat ehtimolni bildiradi.","B":"'Must have' so'zlovchining o'tmish haqidagi ishonchli xulosasini bildiradi.","C":"'Ought to have' qilinmagan ish uchun tanbeh bildiradi.","D":"'Might have' ham faqat taxminni bildiradi."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The regulations stipulate that each specimen ____ before it leaves the laboratory.","opts":["is labelled","was labelled","be labelled","labelling"],"ans":"C","why":{"A":"'Is labelled' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi.","B":"'Was labelled' oddiy o'tgan zamon bo'lib, talab ma'nosini bermaydi.","C":"'Stipulate that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be labelled' bo'ladi.","D":"'Labelling' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second survey was ____ more comprehensive than the first.","opts":["very","substantially","too","so"],"ans":"B","why":{"A":"'Very' qiyosiy daraja oldidan kelmaydi.","B":"Qiyosiy daraja 'substantially', 'far' yoki 'considerably' bilan kuchaytiriladi.","C":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.","D":"'So' ham qiyosiy darajani kuchaytira olmaydi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The passer-bys' accounts differed on several points.","The passers-by accounts' differed on several points.","The passers-by's accounts differs on several points.","The passers-by's accounts differed on several points."],"ans":"D","why":{"A":"Bu yerda ko'plik qo'shimchasi noto'g'ri qismga qo'yilgan.","B":"Apostrof butunlay boshqa so'zga qo'yilgan va gap buzilgan.","C":"Ega ko'plikda, kesim esa birlikda berilgan, 'differed' bo'lishi kerak.","D":"Qo'shma otda ko'plik 'passers' bo'ladi, egalik belgisi esa butun birikmaning oxiriga qo'shiladi."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you indicate whether the site remains accessible to visitors?","Could you indicate is the site accessible to visitors?","I should like to know when will the excavation resume.","Do you know why has the trench been covered over?"],"ans":"A","why":{"A":"Bilvosita savolda so'z tartibi darak gapdagidek: 'whether the site remains accessible'.","B":"Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan.","C":"'Will' egadan oldin turibdi, to'g'ri shakli 'when the excavation will resume' bo'ladi.","D":"'Has' egadan oldin kelgan, bu to'g'ridan-to'g'ri savol tartibi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The committee agreed to ____ the question until the next session.","opts":["differ","defer","deter","deflect"],"ans":"B","why":{"A":"'Differ' farq qilish yoki rozi bo'lmaslikni bildiradi.","B":"'Defer' masalani keyinga qoldirish ma'nosini beradi.","C":"'Deter' qo'rqitib to'xtatishni bildiradi.","D":"'Deflect' zarbani yoki savolni chetga burishni bildiradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["pose a threat","place a threat","set a threat sharply and round","carry a threat out"],"ans":"A","why":{"A":"Ingliz tilida xavf tug'dirish 'pose a threat' deyiladi.","B":"'Place' bu ot bilan birikmaydi.","C":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","D":"Bu variantga ortiqcha so'z qo'shilib, ibora ma'nosi o'zgargan."}},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The tone of the response was notably ~conciliatory~.","opts":["accommodating","confrontational","formal","brief"],"ans":"B","why":{"A":"'Accommodating' ma'no jihatidan sinonim, teskarisi emas.","B":"'Conciliatory' murosaga chaqiruvchi degani, uning teskarisi 'confrontational'.","C":"'Formal' uslubni bildiradi va teskari ma'no bermaydi.","D":"'Brief' uzunlikni bildiradi, ohangni emas."}},{"no":14,"pts":"1.5","head":"Which word does NOT describe a procedure?","text":"","opts":["cumbersome","streamlined","nutritious","rigorous"],"ans":"C","why":{"A":"'Cumbersome' og'ir va noqulay degani va tartibni tasvirlaydi.","B":"'Streamlined' soddalashtirilgan degani, bu ham tartibga tegishli.","C":"'Nutritious' to'yimli degani bo'lib, faqat ovqat haqida ishlatiladi.","D":"'Rigorous' qat'iy degani va tartib haqida aytiladi."}},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The evidence presented in the second chapter is largely ~anecdotal~.","opts":["supported by official statistics","drawn from laboratory trials","based on individual reports","taken from earlier studies"],"ans":"C","why":{"A":"Rasmiy statistika bu so'zning aynan teskarisi.","B":"Laboratoriya sinovlari bu so'zning ma'nosi emas.","C":"'Anecdotal' alohida kishilarning hikoyalariga asoslangan degani.","D":"Avvalgi tadqiqotlar haqidagi ta'rif mos kelmaydi."}},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme was criticised for the ____ of its reporting requirements.","opts":["onerous","onerously","more onerous","onerousness"],"ans":"D","why":{"A":"'Onerous' sifat bo'lib, 'the' dan keyin ot talab qilinadi.","B":"'Onerously' ravish bo'lib, fe'lni izohlaydi.","C":"'More onerous' qiyosiy daraja bo'lib, bu gapda o'rinsiz.","D":"'The ... of' qurilishida ot kerak, 'onerousness' esa ot shaklidir."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The decision was taken in accordance ____ the rules agreed last year.","opts":["to","with","of","for"],"ans":"B","why":{"A":"'In accordance' birikmasi 'to' predlogini olmaydi.","B":"'In accordance with' barqaror birikma bo'lib, nimaga muvofiqligini ko'rsatadi.","C":"'Of' bu birikmada ishlatilmaydi.","D":"'For' maqsadni bildiradi va bu iboraga mos emas."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"Several delegates complained that the chairman had been ~partisan~.","opts":["unwilling to answer questions","absent for much of the session","speaking for far too long","unfairly favouring one side"],"ans":"D","why":{"A":"Savolga javob bermaslik bu so'zning ma'nosi emas.","B":"Yo'qlik haqidagi ta'rif mos kelmaydi.","C":"Uzoq gapirish 'long-winded' so'ziga tegishli.","D":"'Partisan' bir tomonni noo'rin qo'llab-quvvatlaydigan degani."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A moratorium is:","opts":["an agreed halt to an activity for a period","a formal apology issued by an institution","a payment made before a service begins","a meeting held to settle a dispute"],"ans":"A","why":{"A":"'Moratorium' biror faoliyatni muayyan muddatga to'xtatish haqidagi kelishuv degani.","B":"Rasmiy uzr 'apology' deyiladi.","C":"Oldindan to'lov 'deposit' deb ataladi.","D":"Nizoni hal qiluvchi uchrashuv 'mediation' deyiladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["domineering","assertive","confident","forthright"],"ans":"A","why":{"A":"'Domineering' boshqalarni bosib turadigan degani bo'lib, salbiy ma'noga ega.","B":"'Assertive' o'z fikrini qat'iy ayta oladigan degani va ijobiy baho beradi.","C":"'Confident' ishonchli degani, bu ham ijobiy so'z.","D":"'Forthright' ochiq va to'g'ri gapiradigan degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To report the finds made last season","To set out the conditions for joining the excavation","To invite the public to visit the site","To request funding for the next season"],"ans":"B","why":{"A":"Topilmalar haqida e'londa hech narsa aytilmagan.","B":"E'londa yosh chegarasi, davomiylik, tayyorgarlik, jihoz va yashash sharti tushuntirilgan.","C":"Ommaviy tashrif haqida e'londa gap yo'q.","D":"Mablag' so'rash haqida e'londa ma'lumot berilmagan."},"block":["Read the text and answer questions 21-22.","VOLUNTEER EXCAVATION: CONDITIONS OF ENTRY","Volunteers must be at least sixteen and are asked to commit to a minimum of two weeks. No previous experience is required, and the first two days are given over to training in recording and handling finds. Boots and waterproofs are essential; trowels and other tools are provided on site. Accommodation is in shared tents, and volunteers who prefer to stay in the village must arrange this themselves."]},{"no":22,"pts":"2.6","head":"What does the notice say about equipment?","text":"","opts":["Tools are supplied, but boots and waterproofs are not","Volunteers must bring everything they need","All equipment is provided free of charge","Equipment may be hired from the site office"],"ans":"A","why":{"A":"E'londa etik va suv o'tkazmaydigan kiyim shaxsiy, asboblar esa beriladi deb yozilgan.","B":"E'londa asboblar joyida berilishi aytilgan, demak hammasini olib kelish shart emas.","C":"Hammasi bepul berilishi aytilmagan, kiyim o'zidan.","D":"Ijaraga olish haqida e'londa hech narsa yozilmagan."}},{"no":23,"pts":"2.6","head":"You hear a specialist say: \"On that question the jury is still out.\" What does this mean?","text":"","opts":["No settled conclusion has been reached yet","The matter has been decided against her view","The question is being examined by a court","Most experts now agree on the answer"],"ans":"A","why":{"A":"'The jury is still out' iborasi masala hali hal qilinmaganini bildiradi.","B":"Ibora qaror chiqqanini bildirmaydi.","C":"Ibora ko'chma ma'noda ishlatiladi va sudga aloqasi yo'q.","D":"Kelishuvga erishilgani iboraning ma'nosiga zid."}},{"no":24,"pts":"2.6","head":"You see this notice at a museum entrance: \"Timed entry. Please arrive within fifteen minutes of the time on your ticket.\" What is the main message?","text":"","opts":["Tickets are valid at any time on the day of issue","Visitors may stay for fifteen minutes only","Come close to the time printed on your ticket","Tickets must be collected fifteen minutes in advance"],"ans":"C","why":{"A":"E'lon aksincha, chiptada belgilangan vaqt borligini bildiradi.","B":"Tashrif davomiyligi haqida e'londa gap yo'q.","C":"E'londa chiptadagi vaqtdan o'n besh daqiqa ichida kelish so'ralmoqda.","D":"Chiptani olish haqida e'londa hech narsa yozilmagan."}},{"no":25,"pts":"2.6","head":"What does the text say about the cost of desalination?","text":"","opts":["It is lower than the cost of transporting water by pipe","It has risen steadily since the first plants were built","It depends chiefly on the salinity of the sea water","It falls mainly on the energy needed to run the plant"],"ans":"D","why":{"A":"Quvur bilan taqqoslash matnda berilmagan.","B":"Narxning o'sishi haqida matnda gap yo'q.","C":"Sho'rlanish darajasi haqida matnda ma'lumot berilmagan.","D":"Birinchi xatboshida xarajatning asosiy qismi energiya ekani aytilgan."},"block":["Read the text and answer questions 25-27.","Desalination turns sea water into drinking water, and the cost falls mainly on the energy needed to push that water through a membrane. Plants are therefore built where power is cheap, and they have multiplied along coasts where rainfall has become unreliable.","The waste is the part that is least discussed. For every litre of fresh water produced, roughly the same volume of concentrated brine is returned to the sea. Released carelessly, it sinks and spreads along the bottom, where it can smother the communities that live there.","Engineers have made progress on both fronts. Membranes now need a fraction of the pressure they once did, and outfalls that mix the brine with a large volume of sea water before release have become standard in new plants. Desalination has not become cheap, but it has become defensible."]},{"no":26,"pts":"2.6","head":"Why is brine described as a problem?","text":"","opts":["It raises the temperature of the surrounding water","It cannot be returned to the sea at all","It sinks and can smother life on the sea bed","It damages the membranes used in the plant"],"ans":"C","why":{"A":"Harorat haqida matnda hech narsa aytilmagan.","B":"Matnda aksincha, u dengizga qaytarilishi aytilgan.","C":"Ikkinchi xatboshida tuzli suv cho'kib, tubdagi jonzotlarni bo'g'ib qo'yishi aytilgan.","D":"Membranaga zarar haqida matnda gap yo'q."}},{"no":27,"pts":"2.6","head":"What does the writer mean by saying desalination has become 'defensible'?","text":"","opts":["It is now cheaper than any alternative","It no longer produces any waste at all","It has been approved by international bodies","It can now be justified despite its drawbacks"],"ans":"D","why":{"A":"Matnda aynan arzon bo'lmagani ta'kidlangan.","B":"Chiqindi butunlay yo'qolgani aytilmagan, faqat uni aralashtirish usuli yaxshilangan.","C":"Xalqaro tashkilotlar haqida matnda gap yo'q.","D":"Uchinchi xatboshida arzon bo'lmagani, ammo kamchiliklariga qaramay oqlanishi mumkinligi aytilgan."}},{"no":28,"pts":"2.6","head":"What does the text say about the records kept by amateur birdwatchers?","text":"","opts":["They stretch back further than professional surveys","They are collected only during the winter months","They have been rejected by most research teams","They are limited to a small number of species"],"ans":"A","why":{"A":"Birinchi xatboshida havaskorlarning yozuvlari professional kuzatuvlardan ancha uzoqqa borishi aytilgan.","B":"Faqat qish oylari haqida matnda hech narsa yozilmagan.","C":"Rad etish haqida matnda gap yo'q.","D":"Tur soni chegarasi haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 28-30.","Amateur birdwatchers have been keeping records for well over a century. In many places those notebooks stretch back further than any professional survey. A single observer counting in the same wood every spring produces exactly the kind of long run that a research grant cannot buy.","The difficulty is consistency. Observers differ in skill and in the hours they can give. A species that becomes fashionable is suddenly reported more often without becoming more common. Statisticians now correct for effort, which turns a ragged set of sightings into something that can be compared year by year.","The relationship has changed as a result. Volunteers are no longer treated as a cheap source of raw material; several national schemes are designed with them rather than for them. The recorders choose the sites, and the professionals supply the methods and the analysis."]},{"no":29,"pts":"2.6","head":"Why can a fashionable species distort the data?","text":"","opts":["It attracts observers away from other sites","It is harder to identify than other species","It is reported more often without becoming more common","It is counted twice by different observers"],"ans":"C","why":{"A":"Kuzatuvchilarning joy almashtirishi haqida matnda gap yo'q.","B":"Aniqlash qiyinligi haqida matnda hech narsa yozilmagan.","C":"Ikkinchi xatboshida mashhur bo'lib qolgan tur ko'proq qayd etilishi, lekin ko'payib ketmasligi aytilgan.","D":"Ikki marta sanash haqida matnda ma'lumot berilmagan."}},{"no":30,"pts":"2.6","head":"How has the relationship between volunteers and professionals changed?","text":"","opts":["Schemes are now designed with volunteers rather than for them","Volunteers now carry out the statistical analysis","Professionals have taken over the counting themselves","Volunteers are paid for the records they supply"],"ans":"A","why":{"A":"Uchinchi xatboshida dasturlar ko'ngillilar uchun emas, ular bilan birga tuzilishi aytilgan.","B":"Tahlilni mutaxassislar bajarishi matnda aytilgan.","C":"Mutaxassislar sanashni o'z zimmasiga olgani haqida gap yo'q.","D":"To'lov haqida matnda hech narsa yozilmagan."}}]},{"variant":3,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Under no circumstances ____ the specimens ____ outside the laboratory.","opts":["are / taking","do / be taken","are / to be taken","have / taken"],"ans":"C","why":{"A":"'Are' dan keyin '-ing' shakli bu majburiyat ma'nosini bera olmaydi.","B":"'Do' bilan 'be taken' birikmasi grammatik jihatdan noto'g'ri.","C":"'Under no circumstances' gap boshida kelsa yordamchi fe'l egadan oldinga chiqadi: 'are the specimens to be taken'.","D":"'Have taken' aktiv shakl bo'lib, namunalarning o'zi olgan degan ma'no chiqadi."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The ward ____ quieter than any other before the new monitors ____ installed.","opts":["was / were","has been / were","had been / were","was being / had been"],"ans":"C","why":{"A":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, qaysi ish avval bo'lgani ko'rinmaydi.","B":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","C":"Avvalgi holat past perfect 'had been', keyingi ish past simple 'were installed' bo'ladi.","D":"Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ its reputation, the clinic was unable to fill the vacancy for a year.","opts":["Although","Because of","Thereby","For all"],"ans":"D","why":{"A":"'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.","B":"'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.","C":"'Thereby' natijani bildiruvchi ravish bo'lib, gapni bunday bog'lamaydi.","D":"'For all' ot birikmasi bilan keladi va 'shunga qaramay' ma'nosini beradi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the constant noise at night ____ patients complained about most.","opts":["what","whom","that","where"],"ans":"C","why":{"A":"'What' ta'kidlovchi gapni boshlay olmaydi.","B":"'Whom' odamga ishora qiladi, bu yerda esa shovqin ta'kidlanmoqda.","C":"Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi.","D":"'Where' joyga ishora qiladi va bu qurilishga mos emas."}},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the trial ____ a year earlier, the drug ____ in use by now.","opts":["was completed / would be","had been completed / would have been","had been completed / would be","is completed / will be"],"ans":"C","why":{"A":"'Was completed' bilan 'would be' o'tmishdagi amalga oshmagan ishni ko'rsatmaydi.","B":"'Would have been' natijani o'tmishga olib ketadi, gapda esa 'by now' aytilgan.","C":"O'tmishdagi ish va hozirgi natija aralash shart gap 'had been completed / would be' bilan beriladi.","D":"Bu birinchi shart gap bo'lib, amalga oshmagan vaziyatni bildirmaydi."}},{"no":6,"pts":"0.9","head":"Which option means that an obligation did not exist and was not fulfilled?","text":"","opts":["She needn't have attended the briefing.","She didn't have to attend the briefing.","She mustn't attend the briefing.","She shouldn't have attended the briefing."],"ans":"B","why":{"A":"'Needn't have attended' ish bajarilgan, lekin kerak emas edi degani.","B":"'Didn't have to attend' majburiyat bo'lmagani va odatda ish ham bajarilmaganini bildiradi.","C":"'Mustn't attend' taqiqni bildiradi.","D":"'Shouldn't have attended' bajarilgan ish uchun tanbeh bildiradi."}},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is imperative that the alarm ____ audible in every corridor.","opts":["is","was","being","be"],"ans":"D","why":{"A":"'Is' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi.","B":"'Was' o'tgan zamon bo'lib, hozirgi talabga mos kelmaydi.","C":"'Being' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi.","D":"'It is imperative that' dan keyin fe'lning o'zgarmas shakli 'be' qo'yiladi."}},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The new ward is ____ quieter at night than the one it replaced.","opts":["markedly","very","so","too"],"ans":"A","why":{"A":"Qiyosiy daraja 'markedly', 'far' yoki 'considerably' bilan kuchaytiriladi.","B":"'Very' qiyosiy daraja oldidan kelmaydi.","C":"'So' ham qiyosiy darajani kuchaytira olmaydi.","D":"'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi."}},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The children's ward's windows were replaced last summer.","The childrens' ward's windows were replaced last summer.","The children's wards windows' were replaced last summer.","The children's ward's windows was replaced last summer."],"ans":"A","why":{"A":"'Children' ko'plik shakli 's' bilan tugamaydi, shuning uchun apostrof va 's' qo'shiladi, keyin 'ward's' ham egalik shaklida keladi.","B":"'Childrens' degan shakl ingliz tilida mavjud emas.","C":"Apostrof noto'g'ri so'zlarga qo'yilgan va gap buzilgan.","D":"Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak."}},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you confirm were the results forwarded to the ward?","I wonder when will the equipment be replaced.","Could you confirm whether the results were forwarded to the ward?","Do you know why was the corridor closed overnight?"],"ans":"C","why":{"A":"Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan.","B":"'Will' egadan oldin turibdi, to'g'ri shakli 'when the equipment will be replaced' bo'ladi.","C":"Bilvosita savolda so'z tartibi darak gapdagidek: 'whether the results were forwarded'.","D":"'Was' egadan oldin kelgan, bu to'g'ridan-to'g'ri savol tartibi."}},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The editor asked the reporter to ____ the claim before publication.","opts":["collaborate","corroborate","correlate","consolidate"],"ans":"B","why":{"A":"'Collaborate' hamkorlikda ishlashni bildiradi.","B":"'Corroborate' boshqa dalil bilan tasdiqlash ma'nosini beradi.","C":"'Correlate' ikki narsa o'rtasidagi bog'liqlikni ko'rsatishni bildiradi.","D":"'Consolidate' mustahkamlash yoki birlashtirishni bildiradi."}},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["greet a shortfall","hold a shortfall thinly and blue","meet a shortfall","press a shortfall"],"ans":"C","why":{"A":"'Greet' bu ot bilan birikmaydi.","B":"Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.","C":"Ingliz tilida yetishmovchilik d":"Choose the correct answer.","text":"The hospital was reproached ____ failing to act on the earlier report.","opts":["for","of","with","from"],"ans":"A","why":{"A":"'Reproach somebody for something' barqaror qurilish bo'lib, ayb sababini ko'rsatadi.","B":"'Reproach' fe'li 'of' predlogi bilan ishlatilmaydi.","C":"'With' bu fe'l bilan boshqa ma'noda keladi va bu yerga mos emas.","D":"'From' manbani bildiradi va bu fe'lga to'g'ri kelmaydi."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The first draft of the translation was criticised as ~stilted~.","opts":["far longer than the original","full of factual mistakes","produced without a dictionary","awkward and unnatural in style"],"ans":"D","why":{"A":"Uzunlik haqidagi ta'rif bu so'zga aloqador emas.","B":"Faktik xatolar bu so'zning ma'nosi emas.","C":"Lug'atsiz tayyorlangani haqidagi ta'rif mos kelmaydi.","D":"'Stilted' g'ovlab, tabiiy bo'lmagan uslub degani."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A proviso is:","opts":["a short summary placed at the front","a condition attached to an agreement","a payment held back until the end","a person appointed to settle a dispute"],"ans":"B","why":{"A":"Qisqa bayon 'abstract' deb ataladi.","B":"'Proviso' kelishuvga qo'shilgan shart degani.","C":"Ushlab qolingan to'lov 'retention' deyiladi.","D":"Nizoni hal qiluvchi shaxs 'arbitrator' deb ataladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["economical","miserly","prudent","frugal"],"ans":"B","why":{"A":"'Economical' tejamli degani va ijobiy baho beradi.","B":"'Miserly' xasis degani bo'lib, salbiy ma'noga ega.","C":"'Prudent' oqilona degani, bu ham ijobiy so'z.","D":"'Frugal' kam sarflaydigan degani va maqtov ma'nosini beradi."}},{"no":21,"pts":"2.6","head":"Why has this notice been written?","text":"","opts":["To explain how students can contribute to the paper","To announce that the paper will close","To ask readers to pay for the printed edition","To report the results of a readers' survey"],"ans":"A","why":{"A":"E'londa materiallar turi, muddat, hajm va tahrir tartibi tushuntirilgan.","B":"Gazetaning yopilishi haqida e'londa hech narsa aytilmagan.","C":"To'lov haqida e'londa gap yo'q.","D":"So'rov natijalari haqida e'londa ma'lumot berilmagan."},"block":["Read the text and answer questions 21-22.","STUDENT NEWSPAPER: CALL FOR CONTRIBUTIONS","We welcome reports, reviews and opinion pieces of up to seven hundred words. Anything longer will be returned rather than cut. The deadline is the fifteenth of each month, and late pieces are held over to the following issue rather than dropped. Every contribution is edited for length and clarity, and writers see the edited version before it appears. Photographs are welcome, but we cannot publish images of people who have not agreed to appear."]},{"no":22,"pts":"2.6","head":"What happens to a piece that arrives after the deadline?","text":"","opts":["It is returned to the writer unedited","It is published without any editing","It is shortened to fit the space left","It is held over to the following issue"],"ans":"D","why":{"A":"Qaytarish faqat hajmi oshib ketgan materiallarga tegishli.","B":"Tahrirsiz chop etish haqida e'londa gap yo'q.","C":"Qisqartirish kechikish bilan emas, umumiy tahrir bilan bog'liq.","D":"E'londa kechikkan material keyingi songa qoldirilishi aytilgan."}},{"no":23,"pts":"2.6","head":"You hear an administrator say: \"They keep moving the goalposts.\" What does this mean?","text":"","opts":["They keep postponing the final decision","They keep asking for the same documents","They keep rejecting every proposal","They keep changing the requirements"],"ans":"D","why":{"A":"Kechiktirish bu iboraning ma'nosi emas.","B":"Hujjat so'rash haqida ibora hech narsa demaydi.","C":"Rad etish iboraning ma'nosiga kirmaydi.","D":"'Move the goalposts' iborasi shartlarni ish davomida o'zgartirib turishni bildiradi."}},{"no":24,"pts":"2.6","head":"You see this notice in a hotel: \"Check-out is at eleven. Luggage may be left at reception until six.\" What is the main message?","text":"","opts":["Guests may stay in the room until six","Leave the room by eleven, but your bags can stay until six","Luggage must be collected before eleven","Rooms are cleaned between eleven and six"],"ans":"B","why":{"A":"E'lon xonada qolishga ruxsat bermaydi.","B":"E'londa soat o'n birda xonani bo'shatish, yuklarni esa oltigacha qoldirish mumkinligi aytilgan.","C":"Yuklarni o'n birgacha olish talab qilinmagan.","D":"Tozalash haqida e'londa hech narsa yozilmagan."}},{"no":25,"pts":"2.6","head":"What does the text say about noise in hospital wards at night?","text":"","opts":["It is now within the levels recommended by health bodies","It comes mainly from equipment and conversation, not from patients","It affects staff more seriously than it affects patients","It has been reduced by moving patients into single rooms"],"ans":"B","why":{"A":"Matnda aksincha, tavsiya etilgan darajadan yuqori ekani aytilgan.","B":"Birinchi xatboshida shovqinning asosiy manbai jihoz va suhbat ekani aytilgan.","C":"Xodimlar haqida bunday taqqoslash berilmagan.","D":"Yakka xonalar haqida matnda hech narsa yozilmagan."},"block":["Read the text and answer questions 25-27.","Measurements in hospital wards regularly show night-time noise well above the levels health bodies recommend. Most of it comes not from patients but from equipment and from conversation at the nurses' station, where the work of the ward continues through the night.","The consequences are not merely a matter of comfort. Sleep broken repeatedly delays recovery, lengthens the stay and raises the dose of painkillers that patients ask for. A quiet ward is therefore cheaper to run, although the saving appears in a different column from the cost of fixing the problem.","The remedies turn out to be unglamorous. Soft-closing bins, rubber wheels on trolleys, alarms that call a handset rather than the whole corridor, and a culture in which staff lower their voices after midnight. No single measure is dramatic; together they bring the figures down by a third."]},{"no":26,"pts":"2.6","head":"Why does the writer say a quiet ward is cheaper to run?","text":"","opts":["Quiet wards need fewer staff at night","Noisy equipment wears out more quickly","Broken sleep lengthens the patient's stay","Patients in quiet wards need less food"],"ans":"C","why":{"A":"Xodimlar soni haqida matnda hech narsa yozilmagan.","B":"Jihozning eskirishi haqida matnda gap yo'q.","C":"Ikkinchi xatboshida uyqu buzilishi yotish muddatini uzaytirishi aytilgan.","D":"Ovqat haqida matnda ma'lumot berilmagan."}},{"no":27,"pts":"2.6","head":"What does the text say about the remedies?","text":"","opts":["No single measure is dramatic, but together they work","Only expensive rebuilding has any real effect","They depend entirely on new equipment","They have been tried but have not reduced the noise"],"ans":"A","why":{"A":"Uchinchi xatboshida hech bir chora alohida sezilarli emas, birgalikda esa natija berishi aytilgan.","B":"Qimmat qayta qurish haqida matnda gap yo'q.","C":"Chora-tadbirlar orasida xodimlar madaniyati ham bor, faqat jihoz emas.","D":"Matnda aksincha, ko'rsatkich uchdan birga kamaygani aytilgan."}},{"no":28,"pts":"2.6","head":"What does the text say about machine translation of everyday text?","text":"","opts":["It is now good enough for most practical purposes","It still fails on simple sentences","It is used mainly by professional translators","It works only between closely related languages"],"ans":"A","why":{"A":"Birinchi xatboshida kundalik matnlar uchun amaliy jihatdan yetarli darajaga yetgani aytilgan.","B":"Matnda aksincha, oddiy matnlarda yaxshi ishlashi aytilgan.","C":"Kasbiy tarjimonlar haqida bunday cheklov berilmagan.","D":"Tillar yaqinligi haqida matnda gap yo'q."},"block":["Read the text and answer questions 28-30.","Machine translation of everyday text is now good enough for most practical purposes. A notice, an email or a set of instructions comes out in a form that a reader can act on. The remaining errors are usually obvious enough to be spotted.","Difficulty begins where meaning depends on more than the sentence in front of the machine. A legal clause carries the weight of the clauses around it, and a line of dialogue carries the weight of the character who speaks it. A system that translates sentence by sentence has no access to either.","The profession has changed shape rather than disappeared. Much of the work is now revision of a machine draft. That is faster but less satisfying. The remaining prestige has moved towards the texts no machine handles well. Literary translators report more offers of work than at any time in the past decade."]},{"no":29,"pts":"2.6","head":"Where does the difficulty begin, according to the text?","text":"","opts":["Where the vocabulary is highly technical","Where meaning depends on more than one sentence","Where the original text contains mistakes","Where two languages have different alphabets"],"ans":"B","why":{"A":"Texnik lug'at haqida matnda hech narsa yozilmagan.","B":"Ikkinchi xatboshida ma'no bitta gapdan tashqariga chiqqanda qiyinchilik boshlanishi aytilgan.","C":"Asl matndagi xatolar haqida matnda gap yo'q.","D":"Alifbo haqida matnda ma'lumot berilmagan."}},{"no":30,"pts":"2.6","head":"What does the text report about literary translators?","text":"","opts":["They are receiving more offers of work than for a decade","They now spend most of their time revising machine drafts","They have moved into other areas of the profession","They are paid less than they were ten years ago"],"ans":"A","why":{"A":"Uchinchi xatboshida adabiy tarjimonlarga o'n yil ichida eng ko'p taklif kelayotgani aytilgan.","B":"Mashina matnini tahrirlash kasbning umumiy qismi haqida aytilgan, adabiy tarjimonlar haqida emas.","C":"Boshqa sohaga o'tish haqida matnda gap yo'q.","D":"To'lov haqida matnda hech narsa yozilmagan."}}]},{"variant":4,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"So convincing ____ the demonstration that the sceptics ____ their objections.","opts":["did / withdraw","had / withdrawing","were / withdrew","was / withdrew"],"ans":"D","why":{"A":"'Did' bu qurilishda 'be' fe'li o'rnini bosa olmaydi.","B":"'Had' bilan 'withdrawing' ravishdoshi mos kelmaydi.","C":"'Were' birlikdagi 'demonstration' bilan moslashmaydi.","D":"Gap boshidagi 'So + sifat' dan keyin fe'l egadan oldinga chiqadi: 'So convincing was the demonstration'."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The equipment ____ three times before the supplier ____ that the design was at fault.","opts":["was replaced / admitted","had been replaced / admitted","has been replaced / admitted","was being replaced / had admitted"],"ans":"B","why":{"A":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.","B":"Avvalgi takroriy ish past perfect majhul 'had been replaced', keyingisi past simple 'admitted' bo'ladi.","C":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","D":"Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the warnings printed on every page, the form was returned incomplete.","opts":["For all","Although","Because of","Thus"],"ans":"A","why":{"A":"'For all' ot birikmasi bilan keladi va 'shunga qaramay' ma'nosini beradi.","B":"'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.","C":"'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.","D":"'Thus' natijani bildiruvchi ravish bo'lib, gapni bunday bog'lamaydi."}},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the labelling rather than the product ____ the inspectors objected to.","opts":["that","what","whom","when"],"ans":"A","why":{"A":"Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi.","B":"'What' ta'kidlovchi gapni rs were struck by the ____ of the record-keeping.","opts":["thorough","thoroughly","thoroughness","more thorough"],"ans":"C","why":{"A":"'Thorough' sifat bo'lib, 'the' dan keyin ot talab qilinadi.","B":"'Thoroughly' ravish bo'lib, fe'lni izohlaydi.","C":"'The ... of' qurilishida ot kerak, 'thoroughness' esa ot shaklidir.","D":"'More thorough' qiyosiy daraja bo'lib, bu gapda o'rinsiz."}},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The firm was held ____ for the errors on the packaging.","opts":["response","responsible","responsive","responsibly"],"ans":"B","why":{"A":"'Response' ot bo'lib, bu o'rinda kelmaydi.","B":"'Hold somebody responsible' barqaror qurilish bo'lib, sifat talab qiladi.","C":"'Responsive' tez javob beradigan degani bo'lib, ma'noga mos emas.","D":"'Responsibly' ravish bo'lib, bu qurilishda ishlatilmaydi."}},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The spokesman's answer struck most reporters as ~evasive~.","opts":["delivered far too quickly","prepared in advance by lawyers","avoiding a direct reply","repeated from an earlier statement"],"ans":"C","why":{"A":"Tezlik haqidagi ta'rif bu so'zga aloqador emas.","B":"Oldindan tayyorlangani bu so'zning ma'nosi emas.","C":"'Evasive' to'g'ridan-to'g'ri javob berishdan qochadigan degani.","D":"Takrorlash haqidagi ta'rif mos kelmaydi."}},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A loophole is:","opts":["a formal objection raised during a debate","a gap in a rule that allows it to be avoided","a period during which a rule does not apply","a penalty imposed for a first offence"],"ans":"B","why":{"A":"Rasmiy e'tiroz 'objection' deb ataladi.","B":"'Loophole' qoidadagi bo'shliq bo'lib, undan qochib o'tish imkonini beradi.","C":"Qoida amal qilmaydigan davr 'grace period' deyiladi.","D":"Birinchi jazo 'caution' deb ataladi."}},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["adaptable","versatile","flexible","inconsistent"],"ans":"D","why":{"A":"'Adaptable' moslasha oladigan degani va ijobiy baho beradi.","B":"'Versatile' ko'p ishni uddalaydigan degani, bu ham ijobiy so'z.","C":"'Flexible' moslashuvchan degani va maqtov ma'nosini beradi.","D":"'Inconsistent' bir xilda ish tutmaydigan degani bo'lib, salbiy ma'noga ega."}},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To explain how students should prepare for the careers fair","To list the companies that will attend the fair","To announce that the fair has been moved to another hall","To ask students to help set out the stands"],"ans":"A","why":{"A":"E'londa ro'yxatdan o'tish, hujjat, savol tayyorlash va kiyim haqida ko'rsatma berilgan.","B":"Kompaniyalar ro'yxati e'londa keltirilmagan.","C":"Zalning o'zgarishi haqida e'londa hech narsa aytilmagan.","D":"Yordam so'rash haqida e'londa gap yo'q."},"block":["Read the text and answer questions 21-22.","CAREERS FAIR: HOW TO GET THE MOST FROM IT","Register online beforehand; those who do are sent the list of employers and can plan which stands to visit. Bring several printed copies of your CV, since not every employer will take a file from a memory stick. Prepare two or three questions for each stand you intend to visit, because a visitor who has nothing to ask is quickly forgotten. Dress as you would for an interview. The hall is open from ten until four, and the quietest hour is the first."]},{"no":22,"pts":"2.6","head":"Why does the notice advise preparing questions?","text":"","opts":["Employers judge visitors on their questions alone","Each stand allows only a few minutes per visitor","The employers will not answer unprepared questions","A visitor with nothing to ask is soon forgotten"],"ans":"D","why":{"A":"Faqat savollarga qarab baholanishi haqida e'londa aytilmagan.","B":"Vaqt chegarasi haqida e'londa gap yo'q.","C":"Javob bermaslik haqida e'londa hech narsa yozilmagan.","D":"E'londa savoli yo'q tashrifchi tez esdan chiqishi aytilgan."}},{"no":23,"pts":"2.6","head":"You hear a manager say: \"We cannot afford to cut corners on this one.\" What does she mean?","text":"","opts":["The work must not be done in a cheap or hasty way","The budget for the project has been reduced","The deadline cannot be extended any further","Fewer people should be working on the task"],"ans":"A","why":{"A":"'Cut corners' iborasi vaqt yoki pul tejash uchun ishni yarim-yorti qilishni bildiradi.","B":"Byudjet haqida ibora hech narsa demaydi.","C":"Muddat haqida ibora gapirmaydi.","D":"Xodimlar soni iboraning ma'nosiga kirmaydi."}},{"no":24,"pts":"2.6","head":"You see this notice at a cycle hire point: \"Return the bicycle to any docking station. Charges continue until it locks.\" What is the main message?","text":"","opts":["The bicycle must be returned to the same station","Charges stop as soon as you arrive at a station","Only one docking station accepts returns","You pay until the bicycle is properly locked in a dock"],"ans":"D","why":{"A":"E'lon istalgan bekatga qaytarish mumkinligini aytmoqda.","B":"To'lov bekatga yetib borish bilan emas, qulflash bilan to'xtaydi.","C":"Bitta bekat haqidagi cheklov e'londa yo'q.","D":"E'londa velosiped qulflangunicha to'lov davom etishi aytilgan."}},{"no":25,"pts":"2.6","head":"What does the text say about the carbon stored in permafrost?","text":"","opts":["It is released at a steady rate throughout the year","It consists mainly of methane rather than carbon dioxide","It has already been almost entirely released","It is roughly twice the amount now in the atmosphere"],"ans":"D","why":{"A":"Bir tekis chiqishi haqida matnda hech narsa yozilmagan.","B":"Tarkib haqida matnda bunday ma'lumot berilmagan.","C":"To'liq chiqib bo'lgani haqida matnda gap yo'q.","D":"Birinchi xatboshida saqlangan uglerod hozir atmosferadagidan taxminan ikki barobar ko'p ekani aytilgan."},"block":["Read the text and answer questions 25-27.","Permafrost holds roughly twice as much carbon as the atmosphere does now, locked in plant material that froze before it could decay. As the ground warms, that material begins to break down, and the carbon it holds starts to escape.","The process is not smooth. Much of the thaw happens abruptly, when ice lenses within the soil melt and the ground above them collapses. A hillside can slump in a single season, exposing material that models based on gradual warming had assumed would stay frozen for decades.","Measurement is the immediate obstacle. The region is vast, lightly populated and hard to reach, and most of the instruments sit near the few settlements that exist. Satellites see the surface but not the depth, so estimates still rest on a thin scatter of measurements across an enormous area."]},{"no":26,"pts":"2.6","head":"Why is the abrupt thaw significant?","text":"","opts":["It occurs only in the coldest parts of the region","It exposes material models had assumed would stay frozen","It makes the ground easier to reach by vehicle","It slows the release of carbon from the soil"],"ans":"B","why":{"A":"Eng sovuq hudud haqida matnda gap yo'q.","B":"Ikkinchi xatboshida keskin erish modellar muzlab qoladi deb hisoblagan qatlamni ochib qo'yishi aytilgan.","C":"Transport haqida matnda hech narsa yozilmagan.","D":"Matnda aksincha, uglerod chiqishi haqida xavotir bildirilgan."}},{"no":27,"pts":"2.6","head":"What limits the accuracy of current estimates?","text":"","opts":["Satellites cannot photograph the region in winter","The permafrost changes too quickly to measure","Instruments are concentrated near the few settlements","Researchers disagree about how to define permafrost"],"ans":"C","why":{"A":"Sun'iy yo'ldoshlar sirtni ko'radi, lekin chuqurlikni emas; qish haqida gap yo'q.","B":"O'zgarish tezligi haqida matnda hech narsa yozilmagan.","C":"Uchinchi xatboshida asboblarning aksariyati kam sonli aholi punktlari yonida joylashgani aytilgan.","D":"Ta'rif borasidagi bahs haqida matnda ma'lumot berilmagan."}},{"no":28,"pts":"2.6","head":"What does the text say about traffic-light labels on food?","text":"","opts":["Shoppers use them most when they are in a hurry","They have replaced the full list of ingredients","They are required by law in every country","They were designed by the food industry itself"],"ans":"A","why":{"A":"Birinchi xatboshida shoshayotgan xaridor uchun eng foydali ekani aytilgan.","B":"Tarkib ro'yxatini almashtirgani haqida matnda gap yo'q.","C":"Qonun talabi haqida matnda hech narsa yozilmagan.","D":"Kim ishlab chiqqani haqida matnda ma'lumot berilmagan."},"block":["Read the text and answer questions 28-30.","Colour-coded labels on the front of a packet are read in about a second, and that is their point. A shopper in a hurry takes in red, amber and green far faster than a table of figures on the back. The effect on choice is measurable where the scheme is used.","Manufacturers responded in two ways. Some reformulated their products to move a red into amber, which was the outcome the scheme was designed to produce. Others simply reduced the stated portion size, so that the figures fell without the recipe changing at all.","That second response is why the detail of such schemes matters more than the principle. A label is only as honest as the serving it describes. Regulators who set the colours without fixing the portions have done half the work."]},{"no":29,"pts":"2.6","head":"What was the second response of manufacturers?","text":"","opts":["They removed the labels from their packets","They changed the recipes of all their products","They reduced the stated portion size","They challenged the scheme in the courts"],"ans":"C","why":{"A":"Yorliqni olib tashlash haqida matnda gap yo'q.","B":"Retseptni o'zgartirish birinchi javob edi, ikkinchisi emas.","C":"Ikkinchi xatboshida ba'zi ishlab chiqaruvchilar e'lon qilingan ulush hajmini kamaytirgani aytilgan.","D":"Sudga murojaat haqida matnda hech narsa yozilmagan."}},{"no":30,"pts":"2.6","head":"What is the writer's main point in the final paragraph?","text":"","opts":["The detail of the scheme matters more than the principle","Colour labels should be abandoned altogether","Shoppers should read the back of the packet instead","Regulators should leave portion sizes to manufacturers"],"ans":"A","why":{"A":"Uchinchi xatboshida tizimning tafsilotlari uning g'oyasidan muhimroq ekani aytilgan.","B":"Yorliqdan voz kechish taklif qilinmagan.","C":"Orqa tomonni o'qish haqida xulosa chiqarilmagan.","D":"Matnda aksincha, ulush hajmini tartibga solish kerakligi aytilgan."}}]},{"variant":5,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"At no time ____ the operator ____ to override the safety lock.","opts":["is / permitting","does / permitted","is / permitted","has / permit"],"ans":"C","why":{"A":"'Is' dan keyin '-ing' shakli bu majhul ma'noni bera olmaydi.","B":"'Does' bilan uchinchi shakl birikmaydi.","C":"'At no time' gap boshida kelsa yordamchi fe'l egadan oldinga chiqadi: 'is the operator permitted'.","D":"'Has permit' grammatik jihatdan noto'g'ri qurilish."}},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The recording ____ in an archive for years before anyone ____ its importance.","opts":["sat / recognised","has sat / recognised","had sat / recognised","was sitting / had recognised"],"ans":"C","why":{"A":"Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.","B":"Present perfect o'tgan zamon hikoyasida ishlatilmaydi.","C":"Avvalgi uzoq holat past perfect 'had sat', keyingi ish past simple 'recognised' bo'ladi.","D":"Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the resources available to it, the team produced a remarkable result.","opts":["Given","Although","Because","Hence"],"ans":"A","why":{"A":"'Given' ot birikmasi bilan keladi va 'hisobga olganda' ma'nosini beradi.","B":"'Although' to'liq gapni talab qiladi, bu yerda esa ot biri
