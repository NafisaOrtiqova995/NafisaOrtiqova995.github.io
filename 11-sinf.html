<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Olimpiada Trenajyori</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
</head>
<body>
<style>
/* Layout: exam shell — sticky status bar, one question column, numbered navigator rail. */
:root{
  --bg:#F6F8FB; --surface:#FFFFFF; --surface-2:#EEF2F7; --fg:#16202E; --muted:#5B6B80;
  --line:#DBE2EC; --line-strong:#C3CEDC; --navy:#1F3A5F; --navy-soft:#E8EEF6;
  --gold:#9A7116; --gold-soft:#FBF1D8; --ok:#19704A; --ok-soft:#E3F3EA;
  --bad:#AA2318; --bad-soft:#FBE8E6;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-q:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --surface-2:#1E2733; --fg:#E7ECF3; --muted:#93A3B7;
  --line:#2A3443; --line-strong:#3A4759; --navy:#7FB0E0; --navy-soft:#1B2838;
  --gold:#E3B457; --gold-soft:#2C2616; --ok:#64C79A; --ok-soft:#14291F;
  --bad:#F08A7E; --bad-soft:#2E1A18; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface-2:#1E2733; --fg:#E7ECF3; --muted:#93A3B7;
  --line:#2A3443; --line-strong:#3A4759; --navy:#7FB0E0; --navy-soft:#1B2838;
  --gold:#E3B457; --gold-soft:#2C2616; --ok:#64C79A; --ok-soft:#14291F;
  --bad:#F08A7E; --bad-soft:#2E1A18; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- start ---------- */
#start{padding-block:40px 56px}
.masthead{border-top:3px solid var(--navy);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.masthead h1{font-family:var(--font-q);font-size:clamp(1.8rem,5vw,2.6rem);font-weight:600;letter-spacing:-.01em}
.masthead p{margin:0;color:var(--muted);max-width:62ch}
.byline{font-size:.85rem;color:var(--muted)}
.byline b{color:var(--fg);font-weight:600}
.specs{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.spec{font-size:.78rem;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;color:var(--muted)}
.spec b{color:var(--fg);font-weight:600}
.block{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px;align-items:flex-start}
.mode[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);box-shadow:inset 3px 0 0 var(--navy)}
.mode .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);margin-top:3px;flex:none}
.mode[aria-pressed="true"] .dot{border-color:var(--navy);background:var(--navy);box-shadow:inset 0 0 0 3px var(--surface)}
.mode h3{font-size:.98rem;font-weight:600}
.mode span{font-size:.84rem;color:var(--muted);display:block;margin-top:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.vcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .12s,transform .12s}
.vcard:hover{border-color:var(--navy);transform:translateY(-1px)}
.vcard b{font-family:var(--font-q);font-size:1.45rem;font-weight:600;line-height:1}
.vcard span{font-size:.72rem;color:var(--muted)}
.vcard .resume{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.note{font-size:.84rem;color:var(--muted);max-width:68ch}

/* resume panel */
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:16px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel p{margin:0;font-size:.9rem;flex:1 1 220px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  padding:9px 15px;font-size:.88rem;font-weight:500}
.btn:hover{border-color:var(--navy)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:#0E131A}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
.btn-primary:hover{filter:brightness(1.08)}

/* ---------- exam ---------- */
#exam{display:flex;flex-direction:column;min-height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:14px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1180px;margin:0 auto}
.bar .vname{font-weight:600;font-size:.92rem;white-space:nowrap}
.bar .vname small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.clock{margin-left:auto;font-family:var(--font-ui);font-size:1.22rem;font-weight:600;
  letter-spacing:.02em;padding:3px 10px;border-radius:7px;background:var(--surface-2)}
.clock.warn{background:var(--bad-soft);color:var(--bad)}
.prog{flex:1 1 90px;min-width:70px;height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy);transition:width .2s}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:.84rem}

.cols{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 218px;gap:26px;
  max-width:1180px;margin:0 auto;width:100%;padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}
@media (max-width:460px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qno{font-family:var(--font-q);font-size:1.55rem;font-weight:600;line-height:1}
.pts{font-size:.76rem;font-weight:600;color:var(--gold);background:var(--gold-soft);
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.sect{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:auto}
.passage{border:1px solid var(--line);border-left:3px solid var(--navy);background:var(--surface-2);
  border-radius:0 8px 8px 0;padding:14px 16px;margin-bottom:16px;font-family:var(--font-q);
  font-size:.97rem;line-height:1.62;max-height:46vh;overflow-y:auto}
.passage .plead{font-family:var(--font-ui);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:8px}
.passage .ptitle{font-weight:600;letter-spacing:.03em}
.passage p{margin:0 0 .7em}
.passage p:last-child{margin-bottom:0}
.qhead{font-weight:600;font-size:1rem;margin-bottom:6px}
.qtext{font-family:var(--font-q);font-size:1.08rem;line-height:1.6;margin-bottom:16px}
.qtext u{text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  font-family:var(--font-q);font-size:1.02rem;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-strong);background:var(--surface-2)}
.opt .letter{font-family:var(--font-ui);font-size:.82rem;font-weight:600;flex:none;
  width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;color:var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.opt[aria-pressed="true"] .letter{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;border-top:1px dashed var(--line-strong);padding-top:12px;font-size:.92rem;color:var(--muted)}
.expl b{color:var(--fg);font-weight:600}

.nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.nav .btn{min-width:96px;text-align:center}
.nav .spacer{flex:1}

.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.rail h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;
  font-size:.82rem;font-weight:500;display:grid;place-items:center;padding:0}
.cell:hover{border-color:var(--navy)}
.cell.done{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:600}
.cell.cur{outline:2px solid var(--navy);outline-offset:1px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.railfoot{margin-top:12px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
@media (max-width:860px){
  .rail{position:static;order:-1}
  .cells{grid-template-columns:repeat(10,1fr)}
}

/* ---------- result ---------- */
#result{padding-block:36px 56px}
.score{display:flex;flex-wrap:wrap;gap:22px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:4px 4px 12px 12px;padding:22px}
.score .big{font-family:var(--font-q);font-size:clamp(2.6rem,9vw,3.6rem);font-weight:600;line-height:.95}
.score .big small{font-size:.38em;color:var(--muted);font-weight:400}
.score .meta{display:flex;flex-direction:column;gap:3px}
.score .meta b{font-size:1.05rem}
.score .meta span{font-size:.86rem;color:var(--muted)}
.breakdown{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bd{border:1px solid var(--line);border-radius:9px;padding:9px 13px;min-width:112px;background:var(--surface-2)}
.bd .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bd .v{font-size:1.12rem;font-weight:600;margin-top:2px}
.rev{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px 18px}
.rev-item.miss{border-left:3px solid var(--bad)}
.rev-item.hit{border-left:3px solid var(--ok)}
.rev-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.rev-head .n{font-family:var(--font-q);font-size:1.15rem;font-weight:600}
.tag{font-size:.74rem;font-weight:600;border-radius:999px;padding:2px 9px}
.tag.hit{background:var(--ok-soft);color:var(--ok)}
.tag.miss{background:var(--bad-soft);color:var(--bad)}
.rev-q{font-family:var(--font-q);font-size:1rem;margin-bottom:8px}
.rev-ans{font-size:.9rem;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.rev-ans .ln b{font-weight:600}
.rev-ans .you{color:var(--bad)}
.rev-ans .key{color:var(--ok)}
.rev-expl{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line-strong);padding-top:9px}
.filters{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.endbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
footer{color:var(--muted);font-size:.8rem;padding-block:26px;border-top:1px solid var(--line);margin-top:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="start" class="wrap"></div>
<div id="exam" hidden></div>
<div id="result" class="wrap" hidden></div>

<script>
const DATA = [{"variant":1,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"No sooner ____ the committee reached a decision than the situation ____ completely.","opts":["has / changed","did / changed","had / had changed","had / changed"],"ans":"D","expl":"After the negative adverbial 'No sooner' the auxiliary comes before the subject, and the pattern is 'No sooner had ... than + past simple'. A uses the present perfect, B uses 'did' with a past participle, and C wrongly puts both verbs in the past perfect."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The equipment ____ for months before the engineers finally ____ what the fault was.","opts":["was tested / discovered","has been tested / discovered","was being tested / had discovered","had been tested / discovered"],"ans":"D","expl":"The testing happened over a period before another past event, so the past perfect passive 'had been tested' is needed with the past simple 'discovered'. A loses the earlier time, B uses a present perfect in a past narrative, and C reverses which action came first."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the heavy criticism it received, the museum refused to withdraw the exhibition.","opts":["Owing to","Although","Despite","Whereas"],"ans":"C","expl":"'Despite' is followed directly by a noun phrase and introduces a contrast. 'Although' and 'Whereas' must be followed by a clause with a verb, and 'Owing to' gives a cause, which reverses the logic of the sentence."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was not until the final report appeared ____ the true scale of the problem became clear.","opts":["that","when","which","then"],"ans":"A","expl":"This is a cleft sentence, and the pattern 'It was not until ...' is always completed by 'that'. 'When' and 'then' cannot introduce the second clause here, and 'which' would need a noun to refer back to."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the organisers ____ the weather forecast, the concert ____ indoors yesterday.","opts":["checked / would be held","had checked / would have been held","have checked / would be held","had checked / would be held"],"ans":"B","expl":"'Yesterday' places an unreal situation firmly in the past, so the third conditional 'had checked / would have been held' is correct. A is a second conditional about the present, C mixes a present perfect with 'would', and D leaves the result in the present although the time is past."},{"no":6,"pts":"0.9","head":"Which option means that the action was unnecessary but was done anyway?","text":"","opts":["You shouldn't have paid the fee in advance.","You mustn't have paid the fee in advance.","You needn't have paid the fee in advance.","You didn't need to pay the fee in advance."],"ans":"C","expl":"'Needn't have paid' means the payment was made although it was not necessary. A expresses criticism of a wrong action, B is not a possible structure in this meaning, and D states only that there was no obligation, without saying that the money was actually paid."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"It is essential that every candidate ____ the instructions before the examination begins.","opts":["reads","read","is reading","has read"],"ans":"B","expl":"After 'It is essential that' English uses the subjunctive, which is the base form 'read' for every person. 'Reads' is the ordinary third-person present, 'is reading' is continuous and 'has read' is present perfect, and none of these is used in a subjunctive clause."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second interview proved ____ more difficult than the candidate had imagined.","opts":["very","far","quite","too"],"ans":"B","expl":"Before a comparative we use intensifiers such as 'far', 'much' or 'a lot'. 'Very' and 'quite' cannot modify a comparative, and 'too' would mean excessively, which does not fit a comparison with what the candidate imagined."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The witnesses' statements were recorded in the presence of two officers.","The witness's statements were recorded in the presence of two officer's.","The witnesses statements' were recorded in the presence of two officers.","The witnesses's statements were recorded in the presence of two officers."],"ans":"A","expl":"The plural noun 'witnesses' takes an apostrophe after the final s. B adds a wrong apostrophe to 'officers', C puts the apostrophe on the wrong word altogether, and D adds an extra s after a plural that already ends in s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me where does the nearest pharmacy stand?","Do you know why did the committee reject the proposal?","I wonder whether the results have already been published.","Can you explain when will the new timetable begin?"],"ans":"C","expl":"An indirect question keeps statement word order with no auxiliary 'do': 'whether the results have already been published'. A, B and D all keep the inverted question order with 'does', 'did' and 'will', which belongs only to direct questions."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The publisher decided to ____ the contract after the author missed three deadlines.","opts":["call off","put off","take off","get off"],"ans":"A","expl":"To 'call off' an agreement is to cancel it, which fits the missed deadlines. 'Put off' means to postpone rather than cancel, 'take off' means to remove or to leave the ground, and 'get off' means to leave a vehicle."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["deep research","strong evidence","wide damage","tall importance"],"ans":"B","expl":"English says 'strong evidence' when evidence is convincing. The usual collocations for the others are 'thorough research', 'widespread damage' and 'great importance', so A, C and D are all unnatural combinations."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The instructions that came with the device were remarkably ~concise~.","opts":["precise","lengthy","practical","formal"],"ans":"B","expl":"'Concise' means short and clear, so its opposite is 'lengthy'. 'Precise' is close in meaning rather than opposite, and 'practical' and 'formal' describe different qualities altogether."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a sound?","text":"","opts":["piercing","muffled","faint","vivid"],"ans":"D","expl":"'Vivid' describes colours, memories or descriptions, not sounds. 'Piercing' means very sharp and high, 'muffled' means unclear because something covers it, and 'faint' means very quiet."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The committee gave a ~cursory~ glance at the figures before approving the budget.","opts":["hasty","detailed","hostile","reluctant"],"ans":"A","expl":"'Cursory' means done quickly and without attention to detail, so 'hasty' is the closest match. 'Detailed' is the opposite, 'hostile' means unfriendly, and 'reluctant' means unwilling."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"Her response to the complaint showed considerable ____ and calmed the situation at once.","opts":["sensitivity","sensible","sensibly","sensitive"],"ans":"A","expl":"The verb 'showed' needs a noun as its object, and 'sensitivity' is the noun. 'Sensible' and 'sensitive' are adjectives and 'sensibly' is an adverb, so none of them can follow 'considerable'."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The scientist was widely praised ____ her contribution to renewable energy research.","opts":["about","on","with","for"],"ans":"D","expl":"The verb 'praise' takes the preposition 'for' before the reason. 'About' follows verbs such as 'talk', 'on' follows 'congratulate' in some varieties but not 'praise', and 'with' is not used after this verb."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The negotiations collapsed because neither side was willing to ~compromise~.","opts":["to repeat an argument in a louder voice","to refuse any form of discussion with an opponent","to settle an argument by each side accepting less than it wanted","to ask a third person to make the final decision"],"ans":"C","expl":"To 'compromise' is to reach agreement by each side giving up part of what it wanted, which explains why the talks failed. A describes raising your voice, B describes a refusal to talk, and D describes arbitration by somebody else."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A sceptic is:","opts":["someone who believes every claim without checking it","someone who doubts a claim until there is good evidence","someone who refuses to take part in public debate","someone who studies the history of scientific discovery"],"ans":"B","expl":"A sceptic is a person who questions claims and waits for evidence. A describes the opposite attitude, C describes somebody who avoids debate, and D describes a historian of science."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["thrifty","frugal","miserly","prudent"],"ans":"C","expl":"'Miserly' describes somebody unwilling to spend money, and it is always critical. 'Thrifty', 'frugal' and 'prudent' all describe careful use of money in an approving way."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To explain how students can borrow books during the repairs","To tell students that the reading room will close permanently","To invite students to help the staff move the shelves","To warn students about the cost of returning books late"],"ans":"A","expl":"The notice says the reading room is closed but that borrowing continues from a desk in the main hall, with an online form for the rest. B is wrong because the closure lasts three weeks, C is wrong because the staff are doing the moving, and D is never mentioned.","block":["Read the text and answer questions 21-22.","NOTICE TO ALL STUDENTS","The second-floor reading room will be closed for three weeks from Monday while the shelves are replaced. Borrowing will continue as normal from a temporary desk in the main hall. Library staff are moving the books themselves, so please do not take anything from the second floor. Titles that are not yet downstairs can be requested through the online form. Staff will bring them down within one working day. Returns should be placed in the box beside the main entrance."]},{"no":22,"pts":"2.6","head":"What should a student do to get a book that is not on the temporary shelves?","text":"","opts":["Go up to the second floor and find it","Ask a member of staff at the main entrance","Place a request using the online form","Wait until the reading room opens again"],"ans":"C","expl":"The notice says titles not yet on the temporary shelves can be requested through the online form. A contradicts the instruction not to take books yourself, B confuses the returns box with a request point, and D ignores the service that is offered during the closure."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"We are looking into whether the deadline can be brought forward.\" What does this mean?","text":"","opts":["They are considering making the deadline earlier","The deadline has already been moved to an earlier date","They have decided to give the team more time","The deadline will definitely stay as it is"],"ans":"A","expl":"'Looking into whether' means the matter is being considered, and 'brought forward' means moved to an earlier date. B treats a possibility as a decision, C reverses the direction of the change, and D rules out a change that is still being examined."},{"no":24,"pts":"2.6","head":"You see this notice at a sports centre: \"Lockers are emptied nightly. Items left inside are held for 14 days.\" What is the main message?","text":"","opts":["Members must pay a fee to use the lockers overnight","Lost property is thrown away at the end of each day","Lockers may not be used by visitors after 14 days","Belongings left in a locker can be collected within two weeks"],"ans":"D","expl":"The notice says lockers are cleared every night and that anything found is kept for fourteen days, so owners have two weeks to collect it. A invents a fee, B contradicts the fourteen-day period, and C misreads the time limit as a rule about using the lockers."},{"no":25,"pts":"2.6","head":"What does the text say about the main advantage of vertical farms?","text":"","opts":["They produce food using far less land and water","They remove the need for any electricity","They grow a wider range of crops than ordinary farms","They employ more workers than traditional farms"],"ans":"A","expl":"The first paragraph says a vertical farm uses a fraction of the land and up to ninety-five per cent less water. B contradicts the later point about high energy use, C is the opposite of what the text says about a narrow range of crops, and D is never mentioned.","block":["Read the text and answer questions 25-27.","A vertical farm grows food in stacked layers inside a building rather than in open fields. The method uses a fraction of the land that conventional agriculture requires. Because the water circulates in a closed system, some operators report using up to ninety-five per cent less of it. Production continues throughout the year, and the weather outside is entirely irrelevant.","There are real limits, however. The lamps and pumps run constantly, so energy consumption is considerable. In countries where electricity is expensive, a vertical farm struggles to compete with a conventional field. Only a narrow range of crops is currently worth growing, mainly leafy greens and herbs. Wheat and potatoes demand substantially more space for the value they generate.","Proponents argue that the genuine advantage is proximity. A facility inside a city can deliver perishable salad to a shop on the morning it is harvested, which cuts transport costs and waste. Critics reply that the energy saved on lorries is simply spent on lamps instead. Most researchers now expect vertical farms to supplement conventional agriculture rather than replace it."]},{"no":26,"pts":"2.6","head":"Why is energy a problem for vertical farms?","text":"","opts":["The buildings are difficult to heat in winter","The lamps and pumps have to run all the time","The water system uses more power than the lamps","Electricity is cheaper in cities than in the countryside"],"ans":"B","expl":"The second paragraph says the lamps and pumps run constantly, so energy consumption is considerable. A is never mentioned, C invents a comparison the text does not make, and D reverses the point that high electricity prices make competing hard."},{"no":27,"pts":"2.6","head":"What do most researchers now expect?","text":"","opts":["That vertical farms will replace field farming within a decade","That vertical farms will be built only outside cities","That wheat will soon be the main vertical farm crop","That vertical farms will work alongside ordinary agriculture"],"ans":"D","expl":"The last sentence says researchers expect vertical farms to supplement conventional agriculture rather than replace it. A contradicts 'rather than replace it', B contradicts the advantage of being inside a city, and C contradicts the statement that wheat needs too much space."},{"no":28,"pts":"2.6","head":"Why did night trains almost disappear in Europe?","text":"","opts":["Governments banned them for safety reasons","Cheap flights and fast daytime trains took their passengers","The carriages were too expensive to build","Passengers complained that the journeys were too short"],"ans":"B","expl":"The first paragraph says budget airlines sold cheap flights and new high-speed lines carried passengers between capitals in a single afternoon, after which operators withdrew their sleeper services. A is never mentioned, C confuses the later point about the cost of new carriages, and D makes no sense for an overnight journey.","block":["Read the text and answer questions 28-30.","Twenty years ago the overnight train appeared to be finished. Budget airlines advertised a flight across Europe for the price of a restaurant meal, and new high-speed lines carried passengers between capital cities in a single afternoon. One operator after another withdrew its sleeper services, and the carriages were sold or scrapped.","The situation has altered considerably. Several countries have reinstated overnight routes, and new ones are planned between cities that had no direct connection for decades. Part of the explanation is environmental. An overnight train generates a small fraction of the carbon dioxide emissions of an equivalent short flight, and an increasing number of travellers say that they will pay more to avoid flying.","There is a practical argument as well. A passenger who boards at ten in the evening and arrives at seven the following morning avoids the expense of overnight accommodation and loses no working day. The obstacle is financial. New sleeping carriages are extremely expensive, they carry fewer passengers than seated ones, and they can be operated only once a day. Without public subsidy, most operators maintain, the resurgence will halt as abruptly as it began."]},{"no":29,"pts":"2.6","head":"According to the text, why are some travellers returning to night trains?","text":"","opts":["Because flights have become much more expensive","Because the journeys are faster than they used to be","Because hotels near stations are difficult to book","Because they want to reduce the carbon dioxide they produce"],"ans":"D","expl":"The second paragraph says an overnight train generates a small fraction of the carbon dioxide emissions of a short flight, and that travellers will pay more to avoid flying. A is never stated, B contradicts the speed of daytime services, and C misreads the separate point about saving a hotel bill."},{"no":30,"pts":"2.6","head":"What is the main difficulty facing the revival?","text":"","opts":["Passengers dislike sleeping on trains","There are not enough drivers for overnight routes","The new carriages are costly and carry few passengers","Most cities have closed their night-time stations"],"ans":"C","expl":"The final paragraph says new sleeping carriages are expensive, carry fewer passengers and can be used only once a day. A contradicts the growing demand, and B and D describe obstacles that the text never mentions."}]},{"variant":2,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Not only ____ the deadline, but the team also ____ the budget by a wide margin.","opts":["they missed / exceeded","did they miss / exceeded","they did miss / exceeded","had they missed / exceed"],"ans":"B","expl":"After the negative adverbial 'Not only' the auxiliary comes before the subject: 'did they miss'. A keeps statement order, C puts the auxiliary after the subject, and D leaves the second verb in the base form with no agreement."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The manuscript ____ in the archive for decades before a student finally ____ it.","opts":["lay / discovered","has lain / discovered","was lying / had discovered","had lain / discovered"],"ans":"D","expl":"A state that continued up to a later past event takes the past perfect 'had lain', with the past simple 'discovered' for the discovery itself. A loses the earlier time, B puts a present perfect into a past narrative, and C reverses the order of the two events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the evidence was incomplete, the panel reached a unanimous decision.","opts":["In spite of","Due to","Although","Therefore"],"ans":"C","expl":"'Although' introduces a contrast and is followed by a full clause with a verb. A must be followed by a noun phrase, B gives a cause and reverses the logic, and D is a linking adverb that cannot join two clauses in this way."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was the shortage of trained staff ____ delayed the opening of the new wing.","opts":["that","what","which was","when"],"ans":"A","expl":"In a cleft sentence of this kind the gap is filled by 'that': 'It was the shortage ... that delayed'. B is never used to join a cleft, C adds a verb the sentence does not need, and D introduces time rather than the subject of the delay."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the warning system ____ properly, the villagers ____ in time last winter.","opts":["had worked / would have been evacuated","worked / would be evacuated","works / will be evacuated","had worked / would be evacuated"],"ans":"A","expl":"'Last winter' places the unreal situation in the past, so the third conditional 'had worked / would have been evacuated' is correct. B is a second conditional about the present, C is a first conditional, and D leaves the result in the present although the time is past."},{"no":6,"pts":"0.9","head":"Which option means that something was certainly not true in the past?","text":"","opts":["She may not have received the invitation.","She might not have received the invitation.","She cannot have received the invitation.","She did not have to receive the invitation."],"ans":"C","expl":"'Cannot have received' expresses a confident conclusion that something did not happen. A and B both express uncertainty rather than certainty, and D states only that there was no obligation."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The inspector insisted that the laboratory ____ its safety records immediately.","opts":["updates","update","updated","is updating"],"ans":"B","expl":"After 'insisted that' English uses the subjunctive, which is the base form 'update' for every person. A is the ordinary present, C is the past simple, and D is a continuous form, and none of these appears in a subjunctive clause."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The revised plan turned out to be ____ less expensive than the original proposal.","opts":["considerably","very","so","too"],"ans":"A","expl":"Before a comparative we use intensifiers such as 'considerably', 'far' or 'much'. B and C cannot modify a comparative form, and D would mean excessively, which makes no sense with a saving."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The childrens' drawings were displayed in the main corridor.","The children's drawings were displayed in the main corridor.","The childrens drawing's were displayed in the main corridor.","The childrens's drawings were displayed in the main corridor."],"ans":"B","expl":"'Children' is already plural, so the possessive adds an apostrophe and s: 'the children's drawings'. A treats 'childrens' as the plural, C puts the apostrophe on the wrong word, and D adds both forms at once."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me how much does the repair cost?","I would like to know what time the gallery closes.","Do you remember where did you leave the keys?","Can you explain why is the system so slow?"],"ans":"B","expl":"An indirect question uses statement order with no added auxiliary: 'what time the gallery closes'. A, C and D all keep the inverted order with 'does', 'did' and 'is', which belongs only to direct questions."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The council had to ____ the proposal after the public consultation produced strong objections.","opts":["shelve","draw up","back down","look up"],"ans":"A","expl":"To 'shelve' a plan is to put it aside without going ahead. 'Draw up' means to prepare a document, 'back down' needs no object and means to stop arguing, and 'look up' means to search for information."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["do a decision","take a decision quickly and heavy","perform a decision","make a decision"],"ans":"D","expl":"English says 'make a decision'. A and C use verbs that do not collocate with 'decision', and B adds 'heavy', which is never used with this noun."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The changes introduced last year proved remarkably ~beneficial~ for small businesses.","opts":["helpful","harmful","costly","temporary"],"ans":"B","expl":"'Beneficial' means producing good results, so its opposite is 'harmful'. 'Helpful' is a synonym rather than an opposite, and 'costly' and 'temporary' describe price and duration instead."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a journey?","text":"","opts":["lengthy","articulate","uneventful","gruelling"],"ans":"B","expl":"'Articulate' describes somebody who speaks clearly and cannot be used of a journey. 'Lengthy' refers to duration, 'uneventful' means nothing unusual happened, and 'gruelling' means extremely tiring."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The director gave a ~candid~ account of the mistakes that had been made.","opts":["cautious","frank","detailed","formal"],"ans":"B","expl":"'Candid' means open and truthful, so 'frank' is the closest match. 'Cautious' suggests holding back, 'detailed' describes length rather than honesty, and 'formal' describes style."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"Her ____ to detail made her the obvious choice for the editing role.","opts":["attentive","attend","attentively","attention"],"ans":"D","expl":"The possessive 'Her' needs a noun, and the fixed phrase is 'attention to detail'. 'Attentive' is an adjective, 'attend' is a verb and 'attentively' is an adverb, so none of them can follow 'Her' here."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The report was highly critical ____ the way the funds had been managed.","opts":["about","on","of","for"],"ans":"C","expl":"The adjective 'critical' takes the preposition 'of' before the thing being judged. 'About' follows nouns such as 'complaint', 'on' follows 'comment', and 'for' is not used after 'critical' in this meaning."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The company was accused of trying to ~conceal~ the results of the survey.","opts":["to keep something hidden from other people","to publish something earlier than planned","to explain something in simple language","to repeat something several times"],"ans":"A","expl":"To 'conceal' is to hide something so that others do not find it, which is why the accusation is serious. B describes early publication, C describes simplifying, and D describes repetition."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A deadlock is:","opts":["a lock that opens only with two separate keys","a period when a business has no customers","a delay caused by bad weather","a situation in which no agreement can be reached"],"ans":"D","expl":"A 'deadlock' is a situation in which neither side will move and no agreement is possible. A takes the word literally, B describes a quiet trading period, and C describes a weather delay."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["persistent","determined","resolute","obstinate"],"ans":"D","expl":"'Obstinate' describes somebody who refuses to change their mind, and it is always critical. 'Persistent', 'determined' and 'resolute' all describe the same quality in an approving way."},{"no":21,"pts":"2.6","head":"What is the purpose of this notice?","text":"","opts":["To announce that the gallery is closing for good","To invite visitors to donate works of art","To warn visitors about building work outside","To explain how the new booking system works"],"ans":"D","expl":"The notice explains that entry now needs a free timed ticket booked online, and says what to do if you have no ticket. A is contradicted by the opening next month, B is never mentioned, and C confuses the refurbished rooms with building work outside.","block":["Read the text and answer questions 21-22.","VISITOR INFORMATION","From the first of next month, entry to the gallery will require a free timed ticket. Tickets can be booked on our website up to four weeks in advance. Visitors who arrive without a ticket may still be admitted, but only if space allows. The new system is being introduced because the refurbished rooms are smaller than the old ones. Members of the gallery do not need to book and may use the side entrance at any time."]},{"no":22,"pts":"2.6","head":"What are visitors without a ticket told?","text":"","opts":["They must become members before entering","They will be turned away at the door","They may be admitted if there is space","They can buy a ticket at the side entrance"],"ans":"C","expl":"The notice says such visitors may still be admitted, but only if space allows. A confuses the separate note about members, B is too absolute, and D wrongly combines the side entrance, which is for members, with buying a ticket."},{"no":23,"pts":"2.6","head":"You hear a colleague say: \"I am inclined to think the figures have been overstated.\" What does this mean?","text":"","opts":["She is certain that the figures are wrong","She has decided to recalculate the figures","She tends to believe the figures are too high","She thinks the figures are lower than expected"],"ans":"C","expl":"'I am inclined to think' expresses a leaning rather than a firm view, and 'overstated' means presented as larger than they really are. A turns an opinion into certainty, B describes an action she never mentions, and D reverses the direction of the error."},{"no":24,"pts":"2.6","head":"You see this notice in a car park: \"Barrier release requires a validated ticket. Validation is available at any ground-floor desk.\" What is the main message?","text":"","opts":["Parking is free for customers of the ground-floor shops","The barrier is out of order until further notice","You must have your ticket validated downstairs to leave","Drivers must pay for parking before returning to the car"],"ans":"C","expl":"The notice says the barrier opens only with a validated ticket and that validation happens at a ground-floor desk. A invents free parking, B contradicts the instruction, and D assumes a payment that the notice never mentions."},{"no":25,"pts":"2.6","head":"What does the text say about the number of urban hives?","text":"","opts":["It has risen sharply in several European cities","It has fallen since beekeepers moved to the countryside","It is now controlled by a single national register","It has stayed the same for more than a decade"],"ans":"A","expl":"The first paragraph says the number of hives in several European cities has risen sharply over the last fifteen years. B reverses the movement, C confuses registration schemes with control, and D contradicts the word 'sharply'.","block":["Read the text and answer questions 25-27.","Keeping bees on a city roof was once unusual. Over the last fifteen years the number of hives in several European cities has risen sharply. Enthusiasts point to the warmth of the city, the long flowering season in parks and gardens, and the absence of agricultural pesticides. A single hive can produce a surprising quantity of honey in a good summer.","Ecologists are less enthusiastic than they once were. The honeybee is a managed species, not a wild one, and it competes for pollen with the solitary bees and hoverflies that live naturally in cities. Research in Paris and London suggests that where hives become very dense, wild pollinators decline. The flowers available simply cannot support everybody.","The advice now given is more careful. Cities are encouraged to count their hives before approving new ones, and to spend money on planting rather than on equipment. A balcony of flowering plants, several researchers argue, helps urban insects considerably more than another rooftop hive."]},{"no":26,"pts":"2.6","head":"Why are ecologists now more cautious?","text":"","opts":["City honey has been found to contain pesticides","The warmth of cities shortens the flowering season","Beekeepers rarely register their hives correctly","Honeybees compete with wild pollinators for pollen"],"ans":"D","expl":"The second paragraph says the honeybee competes for pollen with solitary bees and hoverflies, and that wild pollinators decline where hives are dense. A contradicts the point about the absence of pesticides, B reverses the advantage of a long season, and C is never mentioned."},{"no":27,"pts":"2.6","head":"What do researchers now recommend?","text":"","opts":["Removing all hives from city centres","Moving city hives into the surrounding countryside","Planting flowers rather than adding more hives","Giving equipment to new beekeepers free of charge"],"ans":"C","expl":"The final paragraph says money should go on planting rather than equipment, and that a balcony of flowers helps more than another hive. A goes much further than the text, B is never suggested, and D is the opposite of the advice given."},{"no":28,"pts":"2.6","head":"What is a repair cafe?","text":"","opts":["A free meeting where volunteers help people mend things","A shop that sells second-hand electrical goods","A training course for professional electricians","A service that collects broken items from homes"],"ans":"A","expl":"The first paragraph describes a free monthly meeting where volunteers with tools help visitors mend their own belongings. B describes a shop, C describes a course for professionals, and D describes a collection service.","block":["Read the text and answer questions 28-30.","A repair cafe is a free meeting, usually held once a month in a hall or library, where volunteers with tools help visitors mend their own belongings. People bring toasters, lamps, bicycles and torn coats. Nobody is charged, although most groups accept donations towards tea and spare parts.","The movement began in Amsterdam in 2009 and there are now several thousand groups worldwide. Organisers say the aim is not only to save objects from the bin. Visitors watch the repair and learn how the thing works, which makes them more willing to attempt the next one alone.","Not everything can be saved. Modern appliances are often sealed, and spare parts for them may be unavailable or absurdly expensive. Volunteers report that about six items in every ten leave the cafe working. Campaigners use that figure to argue for laws requiring manufacturers to supply parts and repair instructions."]},{"no":29,"pts":"2.6","head":"According to the text, what is the aim of the organisers?","text":"","opts":["To teach visitors so that they can repair things themselves","To sell spare parts at a reasonable price","To train volunteers as professional repairers","To collect money for local libraries and halls"],"ans":"A","expl":"The second paragraph says visitors watch the repair and learn how the thing works, which makes them more willing to try alone next time. B and D confuse donations and parts with the purpose, and C is never stated."},{"no":30,"pts":"2.6","head":"Why do campaigners quote the figure of six items in ten?","text":"","opts":["To show that most visitors never return a second time","To argue that manufacturers should supply parts and instructions","To prove that volunteers need more training","To explain why repair cafes charge a small fee"],"ans":"B","expl":"The final paragraph says campaigners use that figure to argue for laws requiring manufacturers to supply parts and repair instructions. A and C are never mentioned, and D contradicts the statement that nobody is charged."}]},{"variant":3,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Seldom ____ a public inquiry ____ its findings so quickly.","opts":["has / published","does / published","had / publish","has / publishing"],"ans":"A","expl":"After the negative adverbial 'Seldom' the auxiliary comes before the subject, and 'has ... published' is the correct present perfect. B mixes a present auxiliary with a past participle, C uses a base form after 'had', and D uses an -ing form after 'has'."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"By the time the inspectors arrived, the samples ____ already ____ to another laboratory.","opts":["have / been sent","were / sending","had / been sent","had / sent"],"ans":"C","expl":"An action completed before another past event takes the past perfect passive: 'had already been sent'. A uses a present perfect in a past narrative, B makes the samples do the sending, and D is active and leaves no agent."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ its small budget, the festival attracted performers from eleven countries.","opts":["Despite","Although","Because of","However"],"ans":"A","expl":"'Despite' is followed directly by a noun phrase and introduces a contrast. B needs a clause with a verb, C gives a cause and reverses the logic, and D is a linking adverb that cannot join the two parts like this."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It is the lack of reliable data ____ makes the forecast so difficult to trust.","opts":["what","that","which it","where"],"ans":"B","expl":"A cleft sentence of this type is completed by 'that'. A cannot introduce a cleft clause, C adds a pronoun the sentence does not need, and D introduces place rather than the subject of the verb."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the surveyors ____ the ground more carefully, the foundations ____ so quickly.","opts":["examined / would not crack","had examined / would not have cracked","examine / will not crack","had examined / would not crack"],"ans":"B","expl":"The cracking has already happened, so the third conditional 'had examined / would not have cracked' is needed. A is a second conditional about the present, C is a first conditional, and D leaves the result in the present although the event is past."},{"no":6,"pts":"0.9","head":"Which option means that permission was refused?","text":"","opts":["They were not supposed to enter the building.","They did not have to enter the building.","They were not allowed to enter the building.","They need not have entered the building."],"ans":"C","expl":"'Were not allowed to' states plainly that permission was refused. A suggests an expectation rather than a rule, B says only that it was unnecessary, and D says they entered although it was unnecessary."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The regulations require that every visitor ____ a badge at all times.","opts":["wears","wear","is wearing","wore"],"ans":"B","expl":"After 'require that' English uses the subjunctive, which is the base form 'wear'. A is the ordinary third-person present, C is continuous, and D is past, and none of these is used after this verb."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The second edition is ____ clearer than the one published five years ago.","opts":["very","too","quite","much"],"ans":"D","expl":"Comparatives are strengthened by 'much', 'far' or 'considerably'. A and C cannot modify a comparative, and B would mean excessively clear, which is not a sensible comparison."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The two companies logo's appeared side by side on the poster.","The two companies' logos appeared side by side on the poster.","The two company's logos appeared side by side on the poster.","The two companies's logos appeared side by side on the poster."],"ans":"B","expl":"A plural noun ending in s takes the apostrophe after the s: 'the two companies' logos'. A puts the apostrophe on the wrong word, C uses a singular possessive after 'two', and D adds an extra s to a plural that already ends in s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Do you know how long has the exhibition been open?","Can you explain when will the refund arrive?","Could you tell me whether the results are available yet?","I wonder what does the second symbol mean?"],"ans":"C","expl":"An indirect question keeps statement order with no extra auxiliary: 'whether the results are available'. A, B and D all keep the inverted order of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The union agreed to ____ the strike while further talks took place.","opts":["call off","take up","bring up","put off"],"ans":"D","expl":"To 'put off' an event is to postpone it, which fits a strike delayed while talks continue. 'Call off' means to cancel it altogether, 'take up' means to begin an activity, and 'bring up' means to mention a subject."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["pay attention","give attention quickly and wide","make attention","do attention"],"ans":"A","expl":"English says 'pay attention'. C and D use verbs that never collocate with 'attention', and B adds 'wide', which is not used with this noun."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The explanation offered by the spokesperson was deliberately ~vague~.","opts":["brief","polite","precise","technical"],"ans":"C","expl":"'Vague' means unclear and lacking detail, so its opposite is 'precise'. 'Brief' describes length, 'polite' describes manner, and 'technical' describes the kind of language used."},{"no":14,"pts":"1.5","head":"Which word does NOT describe weather?","text":"","opts":["humid","blustery","overcast","fluent"],"ans":"D","expl":"'Fluent' describes speech and cannot be used of weather. 'Humid' means damp, 'blustery' means windy, and 'overcast' means covered with cloud."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The new regulations placed an ~onerous~ burden on small farms.","opts":["unexpected","temporary","heavy","unclear"],"ans":"C","expl":"'Onerous' means difficult and demanding, so 'heavy' is the closest match. 'Unexpected' refers to surprise, 'temporary' to duration, and 'unclear' to how well something is explained."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The findings were entirely ____ with the results of the earlier study.","opts":["consistency","consistently","consist","consistent"],"ans":"D","expl":"After the verb 'were' and the adverb 'entirely' the sentence needs an adjective, and 'consistent with' is the fixed pattern. 'Consistency' is a noun, 'consistently' is an adverb, and 'consist' is a verb."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The minister was heavily criticised ____ failing to answer the central question.","opts":["about","on","with","for"],"ans":"D","expl":"The verb 'criticise' takes 'for' before the reason. 'About' follows nouns such as 'argument', 'on' follows 'comment', and 'with' is not used after this verb."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The witness was praised for her ~integrity~ throughout the long hearing.","opts":["the ability to remember small details","the quality of being honest and having strong principles","the habit of speaking at great length","the willingness to change an opinion quickly"],"ans":"B","expl":"'Integrity' is the quality of being honest and holding firmly to principles. A describes memory, C describes talkativeness, and D describes flexibility rather than honesty."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A stalemate is:","opts":["a short break in a long negotiation","a position from which neither side can make progress","an agreement signed by only one of the parties","a formal complaint made to a higher authority"],"ans":"B","expl":"A 'stalemate' is a position in which neither side can move forward. A describes a pause, C describes a one-sided agreement, and D describes a complaint."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["pedantic","meticulous","thorough","careful"],"ans":"A","expl":"'Pedantic' describes somebody who worries about tiny details in an irritating way, and it is always critical. 'Meticulous', 'thorough' and 'careful' describe the same attention to detail approvingly."},{"no":21,"pts":"2.6","head":"Why has the notice been written?","text":"","opts":["To explain how to sign up for the swimming trials","To announce the results of this year's trials","To warn pupils that the pool will be closed","To invite parents to watch the training sessions"],"ans":"A","expl":"The notice gives the dates of the trials and says pupils must add their names to the list outside the sports office. B is premature, C contradicts the trials taking place, and D is never mentioned.","block":["Read the text and answer questions 21-22.","SWIMMING SQUAD TRIALS","Trials for next season's swimming squad will take place on the afternoons of 14 and 15 March. Pupils who wish to take part should add their names to the list outside the sports office by 10 March. Anyone who misses both afternoons cannot be considered this year. Pupils should bring their own swimming kit and a towel. Results will be posted on the sports board at the end of the following week."]},{"no":22,"pts":"2.6","head":"What happens to a pupil who misses both afternoons?","text":"","opts":["They may try again at a later date","They will be placed in a lower squad","They cannot be considered this year","They must ask the sports office for a new form"],"ans":"C","expl":"The notice states plainly that anyone missing both afternoons cannot be considered this year. A contradicts that, and B and D describe outcomes the notice never offers."},{"no":23,"pts":"2.6","head":"You hear a manager say: \"Let me run the proposal past the finance team first.\" What does this mean?","text":"","opts":["He wants the finance team to rewrite the proposal","He has already been refused by the finance team","He thinks the proposal is too expensive to consider","He intends to show the proposal to the finance team for their view"],"ans":"D","expl":"To 'run something past' somebody is to show it to them and ask what they think. A assumes a rewrite he never requests, B places the consultation in the past, and C states an opinion he does not give."},{"no":24,"pts":"2.6","head":"You see this notice in a museum: \"Large bags must be left in the cloakroom. Fragile items should be declared on deposit.\" What is the main message?","text":"","opts":["Visitors may not bring any bags into the museum","Big bags go in the cloakroom and delicate contents must be mentioned","The cloakroom is only open to visitors with fragile items","Visitors must pay a deposit before using the cloakroom"],"ans":"B","expl":"The notice says large bags go in the cloakroom and that fragile items should be mentioned when they are handed over. A is too absolute, since only large bags are covered, C reverses the rule, and D reads 'on deposit' as a payment."},{"no":25,"pts":"2.6","head":"What does the text say about the enzyme discovered in Japan?","text":"","opts":["It was found in bacteria living near a recycling plant","It was produced deliberately in a university laboratory","It works only at very low temperatures","It digests all known types of plastic"],"ans":"A","expl":"The first paragraph says the enzyme was found in bacteria living in soil near a bottle recycling plant. B contradicts an accidental discovery, C is the opposite of the warm conditions mentioned later, and D overstates what one enzyme can do.","block":["Read the text and answer questions 25-27.","In 2016 researchers in Japan found bacteria living in the soil beside a bottle recycling plant. The bacteria were feeding on PET, the plastic used for drinks bottles, with the help of an enzyme that breaks the material into its chemical building blocks. The discovery was accidental, and it attracted immediate attention.","Laboratories elsewhere have since produced faster versions. One engineered enzyme can reduce a batch of bottles to raw material in under a day, provided the plastic is warmed and finely ground first. The products can then be used to make new bottles of the same quality, which ordinary mechanical recycling cannot achieve.","The obstacles are industrial rather than biological. Grinding and heating consume energy. The enzymes are also expensive to produce in quantity, and mixed waste must be sorted carefully beforehand. Several pilot plants are now running in Europe. Their operators admit that the process will only compete with new plastic if the price of oil stays high."]},{"no":26,"pts":"2.6","head":"What advantage does the engineered enzyme have over mechanical recycling?","text":"","opts":["It produces material good enough for new bottles","It needs no sorting of the waste beforehand","It works without any heating of the plastic","It costs less than ordinary recycling methods"],"ans":"A","expl":"The second paragraph says the products can be used to make new bottles of the same quality, which mechanical recycling cannot achieve. B and C contradict the stated conditions, and D is the opposite of the cost problem described later."},{"no":27,"pts":"2.6","head":"What do the operators of the pilot plants accept?","text":"","opts":["That the enzymes damage the quality of the plastic","That the process depends on the oil price remaining high","That mixed waste cannot be processed at all","That the plants will close within a year"],"ans":"B","expl":"The final paragraph says operators admit the process will only compete with new plastic if the oil price stays high. A contradicts the quality claim, C overstates the sorting problem, and D is never suggested."},{"no":28,"pts":"2.6","head":"What did the Icelandic study find?","text":"","opts":["Shorter hours left output unchanged or slightly better","Workers on shorter hours produced less than before","Most workers asked to return to a five-day week","Only office workers benefited from the change"],"ans":"A","expl":"The second paragraph says output stayed the same or improved slightly. B contradicts that, C is the opposite of the demand for the arrangement, and D ignores the hospitals and nurseries included in the trial.","block":["Read the text and answer questions 28-30.","The idea of a four-day working week is older than most people assume. It was discussed seriously in the 1930s, when rising productivity seemed likely to shorten everybody's hours. Instead the five-day week became standard and stayed that way for almost a century.","Recent trials have revived the argument. Between 2015 and 2019 about one per cent of the Icelandic workforce moved to shorter hours with no loss of pay. The trial covered offices, hospitals and nurseries. Output stayed the same or improved slightly, and measures of stress fell. Unions then negotiated shorter hours for a large part of the country.","Critics make two points. The first is that gains may come from cutting unnecessary meetings, a saving that can only be made once. The second is that shift work in hospitals and factories cannot simply be compressed, because somebody has to be present. Supporters answer that the trials deliberately included such services, and that each sector found its own arrangement."]},{"no":29,"pts":"2.6","head":"What is the first criticism mentioned in the final paragraph?","text":"","opts":["Shorter hours increase the cost of running hospitals","Workers in factories dislike compressed shifts","The savings come from cutting meetings and cannot be repeated","Unions negotiated the change without consulting staff"],"ans":"C","expl":"The final paragraph says gains may come from cutting unnecessary meetings, a saving that can only be made once. A and B belong to the second criticism about shift work, and D is never mentioned."},{"no":30,"pts":"2.6","head":"How do supporters answer the criticism about shift work?","text":"","opts":["They argue that hospitals should be excluded","They point out that factories were never involved","They admit that no solution has been found","They say such services were included in the trials"],"ans":"D","expl":"Supporters answer that the trials deliberately included such services and that each sector found its own arrangement. A and B contradict the coverage of the trial, and C reverses their position."}]},{"variant":4,"items":[{"no":1,"pts":"0.9","head":"Fill in the gaps with correct answer.","text":"Under no circumstances ____ the alarm ____ during a drill.","opts":["should / ignore","is / ignored","must / ignoring","should / be ignored"],"ans":"D","expl":"After 'Under no circumstances' the auxiliary comes before the subject, and the alarm is acted upon, so the passive 'should be ignored' is needed. A is active, B keeps statement order, and C uses an -ing form after a modal."},{"no":2,"pts":"0.9","head":"Choose the correct answer.","text":"The paintings ____ for nearly a century before anyone ____ their true value.","opts":["hung / recognised","have hung / recognised","were hanging / had recognised","had hung / recognised"],"ans":"D","expl":"A long state before a later past event takes the past perfect 'had hung' with the past simple 'recognised'. A loses the time relationship, B puts a present perfect into a past narrative, and C reverses the order of events."},{"no":3,"pts":"0.9","head":"Choose the correct answer.","text":"____ the sudden drop in temperature, the match was played to the end.","opts":["Although","Owing to","Whereas","In spite of"],"ans":"D","expl":"'In spite of' is followed by a noun phrase and introduces a contrast. A and C must be followed by a clause with a verb, and B gives a cause, which reverses the logic."},{"no":4,"pts":"0.9","head":"Choose the correct answer.","text":"It was only after the audit ____ the board understood how serious the losses were.","opts":["when","that","which","then"],"ans":"B","expl":"A cleft beginning 'It was only after ...' is completed by 'that'. A and D cannot introduce the second clause, and C would need a noun to refer back to."},{"no":5,"pts":"0.9","head":"Choose the correct answer.","text":"If the translator ____ the original wording, the agreement ____ ambiguous today.","opts":["had kept / would not be","kept / would not be","had kept / would not have been","keeps / will not be"],"ans":"A","expl":"The action is past but the result is present, so a mixed conditional 'had kept / would not be' is correct. B puts both halves in the present, C places the result in the past although 'today' is stated, and D is a first conditional."},{"no":6,"pts":"0.9","head":"Which option means that something was not necessary and was not done?","text":"","opts":["You needn't have renewed the licence.","You didn't need to renew the licence.","You mustn't have renewed the licence.","You shouldn't have renewed the licence."],"ans":"B","expl":"'Didn't need to renew' states that there was no obligation and leaves the action undone. A means the licence was renewed although it was unnecessary, C is not a possible structure here, and D criticises an action that was taken."},{"no":7,"pts":"0.9","head":"Choose the correct answer.","text":"The committee recommended that the deadline ____ by two weeks.","opts":["be extended","is extended","was extended","extends"],"ans":"A","expl":"After 'recommended that' English uses the subjunctive, so the passive is 'be extended'. B and C use ordinary tenses, and D is active and leaves the deadline doing the extending."},{"no":8,"pts":"0.9","head":"Choose the word that fits best.","text":"The replacement part was ____ heavier than the one it replaced.","opts":["very","too","so","slightly"],"ans":"D","expl":"Comparatives take modifiers such as 'slightly', 'far' or 'much'. A and C cannot modify a comparative, and B would mean excessively heavy, which is not a comparison."},{"no":9,"pts":"0.9","head":"Choose the correct sentence.","text":"","opts":["The two witness's accounts differed on one important detail.","The two witnesses accounts' differed on one important detail.","The two witnesses's accounts differed on one important detail.","The two witnesses' accounts differed on one important detail."],"ans":"D","expl":"A plural ending in s takes the apostrophe after the s: 'the two witnesses' accounts'. A is a singular possessive after 'two', B puts the apostrophe on the wrong word, and C adds an extra s."},{"no":10,"pts":"0.9","head":"Choose the correct indirect question.","text":"","opts":["Could you tell me where is the registration desk?","Do you know how many places are still available?","Can you explain why did the flight leave early?","I wonder when will the next edition appear?"],"ans":"B","expl":"An indirect question keeps statement order: 'how many places are still available'. A, C and D all keep the inversion of a direct question."},{"no":11,"pts":"1.5","head":"Choose the word that fits best.","text":"The two sides eventually managed to ____ their differences and sign the agreement.","opts":["wear out","iron out","hand out","point out"],"ans":"B","expl":"To 'iron out' differences is to remove the problems between two sides. 'Wear out' means to exhaust, 'hand out' means to distribute, and 'point out' means to draw attention to something."},{"no":12,"pts":"1.5","head":"Which option shows the best correct collocation match?","text":"","opts":["break a record","crack a record","smash a record completely and tall","burst a record"],"ans":"A","expl":"English says 'break a record'. B and D use verbs that do not collocate with 'record', and C adds 'tall', which is never used with this noun."},{"no":13,"pts":"1.5","head":"Which word is opposite in meaning to the underlined word?","text":"The instructions given to the volunteers were unusually ~rigid~.","opts":["flexible","strict","detailed","written"],"ans":"A","expl":"'Rigid' means fixed and allowing no change, so its opposite is 'flexible'. 'Strict' is a synonym, and 'detailed' and 'written' describe different qualities."},{"no":14,"pts":"1.5","head":"Which word does NOT describe a voice?","text":"","opts":["hoarse","porous","soothing","shrill"],"ans":"B","expl":"'Porous' describes a material that lets liquid through and cannot be used of a voice. 'Hoarse' means rough, 'soothing' means calming, and 'shrill' means high and unpleasant."},{"no":15,"pts":"1.5","head":"Which word is closest in meaning to the underlined word?","text":"The author's style is admirably ~lucid~, even when the subject is difficult.","opts":["brief","modern","formal","clear"],"ans":"D","expl":"'Lucid' means easy to understand, so 'clear' is the closest match. 'Brief' describes length, 'modern' describes period, and 'formal' describes register."},{"no":16,"pts":"1.5","head":"Choose the correct answer.","text":"The scheme was abandoned because of the ____ of qualified applicants.","opts":["scarce","scarcely","scarcity","scarcer"],"ans":"C","expl":"After 'the' and before 'of' the sentence needs a noun, and 'scarcity' is the noun. 'Scarce' is an adjective, 'scarcely' is an adverb, and 'scarcer' is a comparative adjective."},{"no":17,"pts":"1.5","head":"Choose the correct answer.","text":"The findings cast serious doubt ____ the methods used in the earlier survey.","opts":["on","about","for","against"],"ans":"A","expl":"The fixed phrase is 'cast doubt on something'. 'About' follows nouns such as 'argument', 'for' introduces a reason, and 'against' is not used after 'doubt' in this pattern."},{"no":18,"pts":"1.5","head":"Find the definition of the underlined word.","text":"The council was accused of being ~complacent~ about the risk of flooding.","opts":["too worried about a danger to act sensibly","satisfied with a situation and so not making any effort","unwilling to spend public money on repairs","unable to understand a technical explanation"],"ans":"B","expl":"To be 'complacent' is to be so satisfied with a situation that you stop making an effort, which is why the accusation stings. A describes anxiety, C describes meanness, and D describes confusion."},{"no":19,"pts":"1.5","head":"Choose the correct answer.","text":"A bystander is:","opts":["a person who waits for a vehicle at a stop","a person who watches an event without taking part","a person who supports a team from the side of the pitch","a person who replaces another at short notice"],"ans":"B","expl":"A 'bystander' is somebody present at an event who does not take part in it. A describes a passenger, C describes a supporter, and D describes a substitute."},{"no":20,"pts":"1.5","head":"Which word has a negative meaning?","text":"","opts":["confident","assertive","arrogant","self-assured"],"ans":"C","expl":"'Arrogant' describes somebody who thinks too highly of themselves, and it is always critical. 'Confident', 'assertive' and 'self-assured' describe the same self-belief in a neutral or positive way."},{"no":21,"pts":"2.6","head":"Why has this notice been displayed?","text":"","opts":["To announce that the exchange has been cancelled","To thank the families who hosted last year's visitors","To ask pupils to improve their German before travelling","To give the conditions for joining the exchange"],"ans":"D","expl":"The notice sets out who may apply, what the deposit is and when the meeting takes place. A contradicts the arrangements described, B and C mention matters the notice never raises.","block":["Read the text and answer questions 21-22.","GERMAN EXCHANGE: INFORMATION FOR YEAR 11","Places on the exchange visit in April are open to any pupil in Year 11. A deposit of thirty pounds is required when you apply, and this is returned if the visit cannot go ahead. Pupils must be prepared to host a German partner in October. An information meeting for pupils and parents will be held in the hall on 3 February. Applications received after that meeting cannot be accepted."]},{"no":22,"pts":"2.6","head":"What happens to the deposit if the visit does not take place?","text":"","opts":["It is kept towards next year's trip","It is given back to the pupil","It is used to pay the German partner's costs","It is shared between the families who host"],"ans":"B","expl":"The notice says the deposit is returned if the visit cannot go ahead. A, C and D all describe uses of the money that the notice never mentions."},{"no":23,"pts":"2.6","head":"You hear a team leader say: \"I will take your comments on board before the final draft.\" What does this mean?","text":"","opts":["She will pass the comments to somebody else","She has already included the comments in the draft","She will consider the comments when she revises the draft","She disagrees with the comments but will record them"],"ans":"C","expl":"To 'take comments on board' is to consider them seriously, and 'before the final draft' places this in the future. A describes passing them on, B places the work in the past, and D adds a disagreement she never expresses."},{"no":24,"pts":"2.6","head":"You see this notice in a library: \"Wi-Fi access requires a reader number. Guest codes are issued at the enquiry desk on production of ID.\" What is the main message?","text":"","opts":["Only members of the library may enter the building","The wireless network is unavailable to the public","Visitors without a reader number can get a code by showing ID","Readers must pay a small charge for internet access"],"ans":"C","expl":"The notice says guest codes are issued at the desk when identification is shown. A is wider than the notice, which concerns Wi-Fi, B contradicts the guest codes, and D invents a charge."},{"no":25,"pts":"2.6","head":"What does the text say about the original meaning of rewilding?","text":"","opts":["It meant returning large areas to natural processes","It referred to planting trees in city parks","It described the careful management of farmland","It applied only to rivers and wetlands"],"ans":"A","expl":"The first paragraph says the term originally described returning large areas to natural processes with as little management as possible. B, C and D all narrow the idea in ways the text contradicts.","block":["Read the text and answer questions 25-27.","The word rewilding originally described something ambitious. Large areas would be returned to natural processes, with as little human management as possible, and missing species would be brought back. In practice the term is now applied to projects of every size, from an abandoned quarry to a single verge beside a road.","The best known European example is a former farm in the Netherlands, where cattle, ponies and deer were released to graze freely. Within twenty years the land had changed completely. Birds that had not nested in the country for decades returned, and the area became a destination for naturalists.","The project has not been free of controversy. During one hard winter many animals starved, and the public reaction was severe. Managers now provide limited winter feeding, which critics say contradicts the whole idea. Supporters reply that no European landscape is truly wild, and that honest management is better than pretending otherwise."]},{"no":26,"pts":"2.6","head":"What happened on the former farm within twenty years?","text":"","opts":["The grazing animals had to be removed","The land was returned to ordinary farming","Birds absent for decades began to nest there","Visitors were banned to protect the wildlife"],"ans":"C","expl":"The second paragraph says birds that had not nested in the country for decades returned. A contradicts the continuing grazing, B reverses the direction of the change,
