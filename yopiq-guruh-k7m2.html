<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yopiq guruh mock testlari</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
</head>
<body>
<style>
/* Layout: friendly exam shell - branded masthead, one question column, numbered rail.
   Palette taken from the channel logo: teal puzzle piece, orange puzzle piece. */
:root{
  --bg:#F4F8F8; --surface:#FFFFFF; --surface-2:#E9F1F2; --fg:#15262A; --muted:#577076;
  --line:#D5E3E5; --line-strong:#B6CCD0;
  --teal:#15808F; --teal-soft:#DDF0F2; --orange:#D2561A; --orange-soft:#FCEADF;
  --ok:#17795A; --ok-soft:#DFF3EC; --bad:#B23A2B; --bad-soft:#FCE7E3;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-q:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1416; --surface:#132023; --surface-2:#1B2B2F; --fg:#E6EFF0; --muted:#93AAAF;
  --line:#26383C; --line-strong:#38504F;
  --teal:#6FCBD6; --teal-soft:#13282D; --orange:#F0A074; --orange-soft:#2D1D14;
  --ok:#63CCA4; --ok-soft:#102620; --bad:#F09184; --bad-soft:#2B1714; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:5px}
.wrap{max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- start ---------- */
#start{padding-block:34px 56px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;
  box-shadow:0 1px 2px rgba(21,38,42,.05)}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:18px;padding:22px 18px}}
.logo{width:124px;height:124px;border-radius:16px;display:block;object-fit:cover;
  border:1px solid var(--line)}
@media (max-width:640px){.logo{width:104px;height:104px}}
.hero h1{font-family:var(--font-display);font-size:clamp(1.45rem,4.2vw,2.3rem);line-height:1.15;
  font-weight:700;letter-spacing:-.01em;color:var(--teal)}
.hero .sub{margin-top:10px;font-size:clamp(.95rem,2.2vw,1.05rem);color:var(--fg);
  border-left:3px solid var(--orange);padding-left:12px;max-width:60ch}
@media (max-width:640px){.hero .sub{border-left:0;border-top:3px solid var(--orange);
  padding-left:0;padding-top:10px;text-align:center}}
.hero .chan{margin-top:12px;font-size:.86rem;color:var(--muted)}
.hero .chan b{color:var(--fg)}
.specs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
@media (max-width:640px){.specs{justify-content:center}}
.spec{font-size:.78rem;background:var(--teal-soft);color:var(--fg);border-radius:999px;padding:4px 11px}
.spec b{color:var(--teal);font-weight:700}

.block{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
.mode{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;align-items:flex-start;transition:border-color .12s,background .12s}
.mode[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.mode .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-strong);margin-top:4px;flex:none}
.mode[aria-pressed="true"] .dot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--surface)}
.mode h3{font-size:1rem;font-weight:700}
.mode span.d{font-size:.85rem;color:var(--muted);display:block;margin-top:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
.vcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:border-color .12s,transform .12s,box-shadow .12s}
.vcard:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 4px 12px rgba(21,128,143,.14)}
.vcard b{font-family:var(--font-display);font-size:1.25rem;font-weight:700;line-height:1;color:var(--teal)}
.vcard span{font-size:.74rem;color:var(--muted)}
.vcard .resume{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.note{font-size:.85rem;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:16px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel p{margin:0;font-size:.92rem;flex:1 1 220px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
  padding:10px 16px;font-size:.9rem;font-weight:600;transition:border-color .12s,filter .12s}
.btn:hover{border-color:var(--teal)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0C1416}}
.btn-primary:hover{filter:brightness(1.08)}

/* ---------- exam ---------- */
#exam{display:flex;flex-direction:column;min-height:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:13px;padding-block:10px;max-width:1140px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .mini{width:34px;height:34px;border-radius:9px;flex:none;object-fit:cover}
.bar .vname{font-weight:700;font-size:.92rem;white-space:nowrap;line-height:1.2}
.bar .vname small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.clock{margin-left:auto;font-size:1.22rem;font-weight:700;padding:3px 11px;border-radius:9px;
  background:var(--surface-2)}
.clock.warn{background:var(--bad-soft);color:var(--bad)}
.prog{flex:1 1 80px;min-width:60px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .2s}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;
  font-size:.85rem;font-weight:600;flex:none}
@media (max-width:560px){
  .bar-in{gap:9px}
  .bar .mini{display:none}
  .bar .prog{display:none}
  .bar .vname{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .clock{font-size:1.05rem;padding:3px 8px}
  .icon-btn{padding:7px 10px;font-size:.8rem}
}

.cols{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;max-width:1140px;
  margin:0 auto;width:100%;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
@media (max-width:460px){.qcard{padding:16px}}
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1;color:var(--teal)}
.pts{font-size:.76rem;font-weight:700;color:var(--orange);background:var(--orange-soft);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.sect{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-left:auto;font-weight:700}
.passage{border:1px solid var(--line);border-left:4px solid var(--teal);background:var(--surface-2);
  border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:16px;font-family:var(--font-q);
  font-size:.98rem;line-height:1.64;max-height:46vh;overflow-y:auto}
.passage .plead{font-family:var(--font-ui);font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);font-weight:700;margin-bottom:8px}
.passage .ptitle{font-weight:600;letter-spacing:.03em}
.passage p{margin:0 0 .7em}.passage p:last-child{margin-bottom:0}
.qhead{font-weight:700;font-size:1rem;margin-bottom:6px}
.qtext{font-family:var(--font-q);font-size:1.1rem;line-height:1.6;margin-bottom:16px}
.qtext u{text-underline-offset:3px}
.opts{display:flex;flex-direction:column;gap:9px}
.optwrap{display:flex;flex-direction:column}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-family:var(--font-q);font-size:1.03rem;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.opt .letter{font-family:var(--font-ui);font-size:.82rem;font-weight:700;flex:none;
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;color:var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[aria-pressed="true"] .letter{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.why{font-size:.88rem;line-height:1.5;margin:5px 0 0 38px;padding-left:11px;
  border-left:2px solid var(--line-strong);color:var(--muted)}
.why.good{border-left-color:var(--ok);color:var(--fg)}
.why.bad{border-left-color:var(--bad)}
.why b{font-weight:700}
.why.good b{color:var(--ok)}.why.bad b{color:var(--bad)}
.verdict{margin-top:14px;border-radius:11px;padding:10px 14px;font-weight:700;font-size:.93rem}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.nav .btn{min-width:98px;text-align:center}
.nav .spacer{flex:1}

.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}
.rail h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  font-size:.83rem;font-weight:600;display:grid;place-items:center;padding:0}
.cell:hover{border-color:var(--teal)}
.cell.done{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.cell.cur{outline:2px solid var(--orange);outline-offset:1px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.railfoot{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:9px}
@media (max-width:880px){.rail{position:static;order:-1}.cells{grid-template-columns:repeat(10,1fr)}}

/* ---------- result ---------- */
#result{padding-block:34px 56px}
.score{display:flex;flex-wrap:wrap;gap:22px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:6px 6px 16px 16px;padding:22px}
.score .big{font-family:var(--font-display);font-size:clamp(2.5rem,9vw,3.5rem);font-weight:700;
  line-height:.95;color:var(--teal)}
.score .big small{font-size:.36em;color:var(--muted);font-weight:600}
.score .meta{display:flex;flex-direction:column;gap:3px}
.score .meta b{font-size:1.05rem}
.score .meta span{font-size:.87rem;color:var(--muted)}
.breakdown{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bd{border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:116px;background:var(--surface-2)}
.bd .k{font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bd .v{font-size:1.15rem;font-weight:700;margin-top:2px}
.filters{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;
  font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C1416}}
.rev{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.rev-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 19px}
.rev-item.miss{border-left:4px solid var(--bad)}
.rev-item.hit{border-left:4px solid var(--ok)}
.rev-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.rev-head .n{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--teal)}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px}
.tag.hit{background:var(--ok-soft);color:var(--ok)}
.tag.miss{background:var(--bad-soft);color:var(--bad)}
.rev-q{font-family:var(--font-q);font-size:1.02rem;margin-bottom:10px}
.rev-q .h{font-family:var(--font-ui);font-weight:700;font-size:.95rem;display:block}
.endbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
footer{color:var(--muted);font-size:.82rem;padding-block:24px;border-top:1px solid var(--line);margin-top:36px}
footer b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="start" class="wrap"></div>
<div id="exam" hidden></div>
<div id="result" class="wrap" hidden></div>

<script>

fore.", "opts": ["had bought", "bought", "has bought", "buys"], "ans": "A", "expl": "To'g'ri javob - A) Past simple o'zlashtirma gapda past perfect 'had bought' ga aylanadi. Qolgan variantlar: B) Oddiy o'tgan zamon o'zlashtirma gapda bir pog'ona orqaga suriladi; C) Present perfect bu yerda zamon moslashuviga to'g'ri kelmaydi; D) Hozirgi zamon asl gapning ma'nosini butunlay o'zgartiradi.", "why": {"A": "Past simple o'zlashtirma gapda past perfect 'had bought' ga aylanadi.", "B": "Oddiy o'tgan zamon o'zlashtirma gapda bir pog'ona orqaga suriladi.", "C": "Present perfect bu yerda zamon moslashuviga to'g'ri kelmaydi.", "D": "Hozirgi zamon asl gapning ma'nosini butunlay o'zgartiradi."}}, {"no": 4, "pts": "0.9", "head": "Choose the correct answer.", "text": "The man ____ repaired our roof lives at the end of our street.", "opts": ["which", "who", "whose", "where"], "ans": "B", "expl": "To'g'ri javob - B) Odamni bildiruvchi ergash gap 'who' bilan boshlanadi. Qolgan variantlar: A) 'Which' narsa va hayvonlarga ishora qiladi, odamga emas; C) 'Whose' egalikni bildiradi, bu yerda esa egalik ma'nosi yo'q; D) 'Where' joyga ishora qiladi va bu yerga mos kelmaydi.", "why": {"A": "'Which' narsa va hayvonlarga ishora qiladi, odamga emas.", "B": "Odamni bildiruvchi ergash gap 'who' bilan boshlanadi.", "C": "'Whose' egalikni bildiradi, bu yerda esa egalik ma'nosi yo'q.", "D": "'Where' joyga ishora qiladi va bu yerga mos kelmaydi."}}, {"no": 5, "pts": "0.9", "head": "Choose the correct answer.", "text": "You ____ take an umbrella; the forecast says it will be dry all day.", "opts": ["don't have to", "mustn't", "can't", "shouldn't have"], "ans": "A", "expl": "To'g'ri javob - A) 'Don't have to' zarurat yo'qligini bildiradi va ob-havo ma'lumotiga mos keladi. Qolgan variantlar: B) 'Mustn't' taqiqni bildiradi, bu esa gap mantiqiga zid; C) 'Can't' imkoniyat yo'qligini bildiradi; D) 'Shouldn't have' o'tmishdagi ish uchun tanbeh bildiradi.", "why": {"A": "'Don't have to' zarurat yo'qligini bild gs to slow the fall", "It uses its tail as a kind of wing", "It pushes against the air with its paws"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida mushuk tanasining old va orqa qismini navbatma-navbat burishi aytilgan. Qolgan variantlar: B) Oyoqlarni yoyish tezlikni kamaytirish uchun, lekin bu burilish mexanizmi emas; C) Dum muvozanat uchun, qanot sifatida emas; D) Havoga turtish haqida matnda hech narsa yozilmagan.", "why": {"A": "Birinchi xatboshida mushuk tanasining old va orqa qismini navbatma-navbat burishi aytilgan.", "B": "Oyoqlarni yoyish tezlikni kamaytirish uchun, lekin bu burilish mexanizmi emas.", "C": "Dum muvozanat uchun, qanot sifatida emas.", "D": "Havoga turtish haqida matnda hech narsa yozilmagan."}, "block": ["Read the text and answer questions 25-27.", "A falling cat turns itself over without pushing against anything. It bends in the middle and rotates the front half of its body one way and the back half the other. It then reverses the movement. Each rotation gains a little, and the complete operation takes approximately a third of a second.", "The tail contributes, although considerably less than people assume. Cats born without tails manage the identical manoeuvre. What matters far more is the flexible backbone, which permits the two halves to rotate independently.", "Height has a surprising effect. Below about two floors a cat has no time to complete the turn. Above seven it has not only turned but relaxed and spread its legs, which slows the fall. Vets record the worst injuries from the middle of that range."]}, {"no": 26, "pts": "2.6", "head": "What does the text say about cats born without tails?", "text": "", "opts": ["They manage the same manoeuvre", "They cannot turn over in the air", "They fall more slowly than other cats", "They are more common than people think"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida dumsiz mushuklar ham xuddi shu harakatni bajarishi aytilgan. Qolgan variantlar: B) Matnda aksincha, ular ham uddalashi aytilgan; C) Tushish tezligi haqida matnda bunday ma'lumot yo'q; D) Ularning qanchaligi haqida matnda gap yo'q.", "why": {"A": "Ikkinchi xatboshida dumsiz mushuklar ham xuddi shu harakatni bajarishi aytilgan.", "B": "Matnda aksincha, ular ham uddalashi aytilgan.", "C": "Tushish tezligi haqida matnda bunday ma'lumot yo'q.", "D": "Ularning qanchaligi haqida matnda gap yo'q."}}, {"no": 27, "pts": "2.6", "head": "From which heights are the worst injuries recorded?", "text": "", "opts": ["From below two floors", "From the middle of the range", "From above seven floors", "From any height equally"], "ans": "B", "expl": "To'g'ri javob - B) Uchinchi xatboshida eng og'ir jarohatlar o'rta balandlikda qayd etilishi aytilgan. Qolgan variantlar: A) Ikki qavatdan pastda mushuk burila olmaydi, lekin matnda eng og'ir jarohat shu yerda deyilmagan; C) Yetti qavatdan yuqorida mushuk oyoqlarini yoyib, tushishni sekinlashtiradi; D) Matnda balandlikka qarab farq borligi aniq ko'rsatilgan.", "why": {"A": "Ikki qavatdan pastda mushuk burila olmaydi, lekin matnda eng og'ir jarohat shu yerda deyilmagan.", "B": "Uchinchi xatboshida eng og'ir jarohatlar o'rta balandlikda qayd etilishi aytilgan.", "C": "Yetti qavatdan yuqorida mushuk oyoqlarini yoyib, tushishni sekinlashtiradi.", "D": "Matnda balandlikka qarab farq borligi aniq ko'rsatilgan."}}, {"no": 28, "pts": "2.6", "head": "Why did the two brothers start making chairs?", "text": "", "opts": ["They could not find work after the factory closed", "They had studied furniture design at college", "Their father had left them a workshop", "A shop in the capital had ordered some"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida zavod yopilgach ish topa olmagani aytilgan. Qolgan variantlar: B) Kollejda o'qish haqida matnda hech narsa yozilmagan; C) Ustaxona merosi haqida matnda gap yo'q; D) Buyurtma keyinroq, ish boshlangandan so'ng kelgan.", "why": {"A": "Birinchi xatboshida zavod yopilgach ish topa olmagani aytilgan.", "B": "Kollejda o'qish haqida matnda hech narsa yozilmagan.", "C": "Ustaxona merosi haqida matnda gap yo'q.", "D": "Buyurtma keyinroq, ish boshlangandan so'ng kelgan."}, "block": ["Read the text and answer questions 28-30.", "When the furniture factory in their town closed, two brothers found that there was no other work within forty kilometres. They had both worked on the production line, and between them they knew every stage of making a chair. They began in their own yard with tools bought from the closing factory.", "The first year was difficult. They sold to neighbours and at two local markets, and for months the money barely covered the wood. What changed things was a photograph. A customer posted one of their chairs online, and an order arrived from a shop in the capital.", "Nine people work in the yard today, several of them former colleagues from the factory. The brothers still construct the first chair of every new design themselves. They say that is the part they would least like to surrender."]}, {"no": 29, "pts": "2.6", "head": "What changed the situation in the first year?", "text": "", "opts": ["A photograph posted online by a customer", "A loan from the local council", "A second market opening nearby", "The return of their former colleagues"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida xaridorning internetga joylagan surati vaziyatni o'zgartirgani aytilgan. Qolgan variantlar: B) Qarz haqida matnda hech narsa yozilmagan; C) Ikkinchi bozor allaqachon bor edi; D) Sobiq hamkasblar keyinroq ishga olingan.", "why": {"A": "Ikkinchi xatboshida xaridorning internetga joylagan surati vaziyatni o'zgartirgani aytilgan.", "B": "Qarz haqida matnda hech narsa yozilmagan.", "C": "Ikkinchi bozor allaqachon bor edi.", "D": "Sobiq hamkasblar keyinroq ishga olingan."}}, {"no": 30, "pts": "2.6", "head": "What do the brothers say about the first chair of a new design?", "text": "", "opts": ["It is always the most difficult to sell", "It is the part rs call the damage described in the last paragraph?", "text": "", "opts": ["Frost heave", "Surface wear", "Water seepage", "Crack repair"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida bu jarayon 'frost heave' deb atalishi aytilgan. Qolgan variantlar: B) Bunday atama matnda keltirilmagan; C) Suv sizishi jarayonning bir qismi, atamasi emas; D) Ta'mirlash haqida matnda gap yo'q.", "why": {"A": "Uchinchi xatboshida bu jarayon 'frost heave' deb atalishi aytilgan.", "B": "Bunday atama matnda keltirilmagan.", "C": "Suv sizishi jarayonning bir qismi, atamasi emas.", "D": "Ta'mirlash haqida matnda gap yo'q."}}, {"no": 28, "pts": "2.6", "head": "Why did the boy build his own weather station?", "text": "", "opts": ["His school had asked him to do a project", "The nearest official station was forty kilometres away", "He wanted to sell the readings to farmers", "His father had worked as a forecaster"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi xatboshida eng yaqin rasmiy stansiya qirq kilometr uzoqda ekani aytilgan. Qolgan variantlar: A) Maktab topshirig'i haqida matnda hech narsa yozilmagan; C) Sotish haqida matnda gap yo'q; D) Otasining kasbi haqida matnda ma'lumot berilmagan.", "why": {"A": "Maktab topshirig'i haqida matnda hech narsa yozilmagan.", "B": "Birinchi xatboshida eng yaqin rasmiy stansiya qirq kilometr uzoqda ekani aytilgan.", "C": "Sotish haqida matnda gap yo'q.", "D": "Otasining kasbi haqida matnda ma'lumot berilmagan."}, "block": ["Read the text and answer questions 28-30.", "The nearest official weather station was forty kilometres from Rustam's village. Its measurements often did not match what he could observe from his window. At fifteen he constructed his own: a rain gauge from a plastic bottle, a thermometer in a wooden box, and a notebook.", "He recorded the figures twice a day for three years without missing a morning. Neighbours began asking him before they cut hay, and one of them lent him a second thermometer for the far end of t buraladi deyilgan.", "C": "Ko'chirilgani haqida matnda hech narsa yozilmagan.", "D": "Tunda jim turishi haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 23-24.", "The clock above the market hall has been keeping time since 1908. It is wound by hand once a week. The job takes about forty minutes and is done every Sunday morning. The same family has performed it for three generations. The clock has stopped twice: once during a storm in 1962 and once when the mechanism was cleaned in 1998."]}, {"no": 24, "pts": "2.6", "head": "Who winds the clock?", "text": "", "opts": ["A member of the same family for three generations", "An engineer sent by the town council", "Anyone who volunteers on a Sunday", "The keeper of the market hall"], "ans": "A", "expl": "To'g'ri javob - A) Matnda uch avloddan beri bir oilaning a'zosi burab kelishi aytilgan. Qolgan variantlar: B) Muhandis haqida matnda hech narsa yozilmagan; C) Ko'ngillilar haqida matnda gap yo'q; D) Bozor qorovuli haqida matnda ma'lumot berilmagan.", "why": {"A": "Matnda uch avloddan beri bir oilaning a'zosi burab kelishi aytilgan.", "B": "Muhandis haqida matnda hech narsa yozilmagan.", "C": "Ko'ngillilar haqida matnda gap yo'q.", "D": "Bozor qorovuli haqida matnda ma'lumot berilmagan."}}, {"no": 25, "pts": "2.6", "head": "Where does most of the salt in the sea come from?", "text": "", "opts": ["From salt mines under the sea bed", "From rain falling on the open ocean", "From rivers carrying minerals off the land", "From fish and other sea creatures"], "ans": "C", "expl": "To'g'ri javob - C) Birinchi xatboshida daryolar quruqlikdan minerallarni olib kelishi aytilgan. Qolgan variantlar: A) Dengiz ostidagi konlar haqida matnda hech narsa yozilmagan; B) Yomg'ir haqida matnda bu sabab sifatida berilmagan; D) Baliqlar haqida matnda gap yo'q.", "why": {"A": "Dengiz ostidagi konlar haqida matnda hech narsa yozilmagan.", "B": "Yomg'ir haqida matnda bu sabab sifatida berilmagan.", "C": "Birinchi xatboshida daryolar quruqlikdan minerallarni olib kelishi aytilgan.", "D": "Baliqlar haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 25-27.", "Rain falling on land is almost pure, but it dissolves a little of the rock it crosses. Rivers transport those dissolved minerals to the sea. When sea water evaporates the water departs and the minerals remain behind. Over an enormous period the sea has become salty while the rivers have not.", "The sea is not becoming steadily saltier, however. Minerals are also removed. Some settle to the bottom as sediment, and others are absorbed by sea creatures constructing shells. Over millions of years the quantity added and the quantity removed have approximately balanced.", "Certain seas are saltier than others. Where a sea is almost enclosed and the climate is hot, evaporation is considerable and little fresh water arrives. The Dead Sea is the extreme example, sufficiently salty for a swimmer to float effortlessly."]}, {"no": 26, "pts": "2.6", "head": "Why is the sea not getting steadily saltier?", "text": "", "opts": ["Rain falling on the sea dilutes it", "Rivers now carry fewer minerals", "The sea is growing larger each year", "Minerals are removed as well as added"], "ans": "D", "expl": "To'g'ri javob - D) Ikkinchi xatboshida minerallar qo'shilgani kabi olib ham ketilishi aytilgan. Qolgan variantlar: A) Yomg'ir haqida matnda bu sabab sifatida keltirilmagan; B) Daryolarning o'zgarishi haqida matnda hech narsa yozilmagan; C) Dengiz hajmi haqida matnda gap yo'q.", "why": {"A": "Yomg'ir haqida matnda bu sabab sifatida keltirilmagan.", "B": "Daryolarning o'zgarishi haqida matnda hech narsa yozilmagan.", "C": "Dengiz hajmi haqida matnda gap yo'q.", "D": "Ikkinchi xatboshida minerallar qo'shilgani kabi olib ham ketilishi aytilgan."}}, {"no": 27, "pts": "2.6", "head": "Why is the Dead Sea given as an example?", "text": "", "opts": ["It is almost closed and the climate is hot", "It receives no rivers at all", "It has the deepest sediment", "It is the largest closed sea"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida yopiq va issiq iqlimli dengizlar sho'rroq bo'lishi aytilib, u eng ekstremal misol sifatida berilgan. Qolgan variantlar: B) Daryo umuman yo'qligi haqida matnda aytilmagan; C) Cho'kindi haqida matnda gap yo'q; D) O'lchami haqida matnda hech narsa yozilmagan.", "why": {"A": "Uchinchi xatboshida yopiq va issiq iqlimli dengizlar sho'rroq bo'lishi aytilib, u eng ekstremal misol sifatida berilgan.", "B": "Daryo umuman yo'qligi haqida matnda aytilmagan.", "C": "Cho'kindi haqida matnda gap yo'q.", "D": "O'lchami haqida matnda hech narsa yozilmagan."}}, {"no": 28, "pts": "2.6", "head": "Why did the woman start the seed library?", "text": "", "opts": ["The town had asked her to run a project", "Old local varieties were disappearing from gardens", "She wanted to sell seeds to the market", "Her own garden had become too small"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi xatboshida eski mahalliy navlar bog'lardan yo'qolib borayotgani aytilgan. Qolgan variantlar: A) Shahar topshirig'i haqida matnda hech narsa yozilmagan; C) Sotish haqida matnda gap yo'q; D) Bog' o'lchami haqida matnda ma'lumot berilmagan.", "why": {"A": "Shahar topshirig'i haqida matnda hech narsa yozilmagan.", "B": "Birinchi xatboshida eski mahalliy navlar bog'lardan yo'qolib borayotgani aytilgan.", "C": "Sotish haqida matnda gap yo'q.", "D": "Bog' o'lchami haqida matnda ma'lumot berilmagan."}, "block": ["Read the text and answer questions 28-30.", "Gulnora noticed that the tomatoes her grandmother had cultivated were no longer sold anywhere. Two other traditional varieties had vanished from the gardens in her street. She began collecting seeds from the few neighbours who still had them, and labelling each packet with the name of the garden it came from.", "The library works by exchange. A member takes a packet in spring and brings back twice as much seed in autumn, so the collection grows rather than shrinks. Nothing is sold. One rule caused considerable argument at first. Members must let at least one plant of each variety go to seed instead of eating it.", "There are now eleven such libraries in the region, and they send packets to one another when a variety runs low. Gulnora says the hardest part was never the seeds. It was persuading good gardeners to leave a perfect tomato on the plant until it split."]}, {"no": 29, "pts": "2.6", "head": "What rule caused the most argument at first?", "text": "", "opts": ["That one plant of each variety must go to seed", "That nothing could be sold", "That members had to attend meetings", "That packets must be labelled by garden"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida har bir navdan kamida bitta o'simlikni urug'ga qoldirish qoidasi eng ko'p bahsga sabab bo'lgani aytilgan. Qolgan variantlar: B) Sotmaslik qoidasi bor, lekin bahs sababi sifatida ko'rsatilmagan; C) Yig'ilishlar haqida matnda hech narsa yozilmagan; D) Yorliqlash birinchi xatboshida, qoida sifatida emas, usul sifatida eslatilgan.", "why": {"A": "Ikkinchi xatboshida har bir navdan kamida bitta o'simlikni urug'ga qoldirish qoidasi eng ko'p bahsga sabab bo'lgani aytilgan.", "B": "Sotmaslik qoidasi bor, lekin bahs sababi sifatida ko'rsatilmagan.", "C": "Yig'ilishlar haqida matnda hech narsa yozilmagan.", "D": "Yorliqlash birinchi xatboshida, qoida sifatida emas, usul sifatida eslatilgan."}}, {"no": 30, "pts": "2.6", "head": "What does Gulnora say was the hardest part?", "text": "", "opts": ["Finding neighbours who still had the seeds", "Persuading gardeners to leave a tomato on the plant", "Keeping the packets dry through the winter", "Sending seeds to the other libraries"], "ans": "B", "expl": "To'g'ri javob - B) Uchinchi xatboshida eng qiyini yaxshi bog'bonlarni mukammal pomidorni shoxda qoldirishga ko'ndirish bo'lgani aytilgan. Qolgan variantlar: A) Qo'shnilarni topish birinchi xatboshida, qiyinchilik sifatida emas; C) Saqlash haqida matnda hech narsa yozilmagan; D) Boshqa kutubxonalarga yuborish oddiy amaliyot sifatida tasvirlangan.", "why": {"A": "Qo'shnilarni topish birinchi xatboshida, qiyinchilik sifatida emas.", "B": "Uchinchi xatboshida eng qiyini yaxshi bog'bonlarni mukammal pomidorni shoxda qoldirishga ko'ndirish bo'lgani aytilgan.", "C": "Saqlash haqida matnda hech narsa yozilmagan.", "D": "Boshqa kutubxonalarga yuborish oddiy amaliyot sifatida tasvirlangan."}}]}, {"variant": 4, "label": "9-sinf", "sub": "6-mock", "items": [{"no": 1, "pts": "0.9", "head": "Choose the correct answer.", "text": "A new footbridge ____ over the canal at the moment.", "opts": ["builds", "is building", "has built", "is being built"], "ans": "D", "expl": "To'g'ri javob - D) Hozir davom etayotgan ish majhul nisbatda 'is being built' bo'ladi. Qolgan variantlar: A) Aktiv shakl bo'lib, ko'prikning o'zi quradi degan ma'no chiqadi; B) Aktiv davomli shakl bo'lib, majhul ma'no bermaydi; C) Present perfect aktiv shakli 'at the moment' bilan mos kelmaydi.", "why": {"A": "Aktiv shakl bo'lib, ko'prikning o'zi quradi degan ma'no chiqadi.", "B": "Aktiv davomli shakl bo'lib, majhul ma'no bermaydi.", "C": "Present perfect aktiv shakli 'at the moment' bilan mos kelmaydi.", "D": "Hozir davom etayotgan ish majhul nisbatda 'is being built' bo'ladi."}}, {"no": 2, "pts": "0.9", "head": "Choose the correct answer.", "text": "If you ____ the instructions, the machine ____ working properly.", "opts": ["followed / will keep", "follow / will keep", "follow / would keep", "had followed / will keep"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi shart gapda 'if' dan keyin hozirgi zamon, asosiy gapda 'will' keladi. Qolgan variantlar: A) 'Followed' o'tgan zamon shakli bo'lib, 'will keep' bilan bir gapda kelmaydi; C) 'Would keep' ikkinchi shart gapga tegishli; D) 'Had followed' uchinchi shart gapga tegishli va 'will' bilan ishlatilmaydi.", "why": {"A": "'Followed' o'tgan zamon shakli bo'lib, 'will keep' bilan bir gapda kelmaydi.", "B": "Biri ons", "decorated", "decorative"], "ans": "B", "expl": "To'g'ri javob - B) 'With' dan keyin ot kerak, 'decorations' esa ot shaklidir. Qolgan variantlar: A) 'Decorate' fe'l bo'lib, 'with' dan keyin ot talab qilinadi; C) 'Decorated' sifatdosh bo'lib, bu o'rinda ot vazifasini bajara olmaydi; D) 'Decorative' sifat bo'lib, otni izohlaydi.", "why": {"A": "'Decorate' fe'l bo'lib, 'with' dan keyin ot talab qilinadi.", "B": "'With' dan keyin ot kerak, 'decorations' esa ot shaklidir.", "C": "'Decorated' sifatdosh bo'lib, bu o'rinda ot vazifasini bajara olmaydi.", "D": "'Decorative' sifat bo'lib, otni izohlaydi."}}, {"no": 14, "pts": "1.5", "head": "Which word is opposite in meaning to the underlined word?", "text": "The first draft of his speech was far too ~formal~ for a school assembly.", "opts": ["polite", "relaxed", "detailed", "short"], "ans": "B", "expl": "To'g'ri javob - B) 'Formal' rasmiy degani, uning teskarisi 'relaxed' ya'ni erkin uslub. Qolgan variantlar: A) 'Polite' odoblilikni bildiradi, uslubni emas; C) 'Detailed' batafsillikni bildiradi va teskari ma'no bermaydi; D) 'Short' uzunlikni bildiradi, uslubni emas.", "why": {"A": "'Polite' odoblilikni bildiradi, uslubni emas.", "B": "'Formal' rasmiy degani, uning teskarisi 'relaxed' ya'ni erkin uslub.", "C": "'Detailed' batafsillikni bildiradi va teskari ma'no bermaydi.", "D": "'Short' uzunlikni bildiradi, uslubni emas."}}, {"no": 15, "pts": "1.5", "head": "Choose the correct answer.", "text": "The result was quite different ____ what we had expected.", "opts": ["from", "of", "to", "with"], "ans": "A", "expl": "To'g'ri javob - A) 'Different from' barqaror birikma bo'lib, taqqoslanayotgan narsani ko'rsatadi. Qolgan variantlar: B) 'Different' sifati 'of' predlogi bilan ishlatilmaydi; C) 'To' bu sifat bilan ba'zi shevalarda uchraydi, lekin standart shakl emas; D) 'With' bu sifat bilan birikmaydi.", "why": {"A": "'Different from' barqaror birikma bo'lib, taqqoslanayotgan narsani ko'rsatadi.", "B": "'Different' sifati 'of' predlogi bilan ishlatilmaydi.", "C": "'To' bu sifat bilan ba'zi shevalarda uchraydi, lekin standart shakl emas.", "D": "'With' bu sifat bilan birikmaydi."}}, {"no": 16, "pts": "1.5", "head": "Choose the correct answer.", "text": "After the injury he needed three months of ____ before he could run again.", "opts": ["recovery", "discovery", "delivery", "memory"], "ans": "A", "expl": "To'g'ri javob - A) 'Recovery' sog'ayish jarayonini bildiradi va jarohatdan keyingi davrga mos keladi. Qolgan variantlar: B) 'Discovery' kashfiyotni bildiradi; C) 'Delivery' yetkazib berishni bildiradi; D) 'Memory' xotirani bildiradi.", "why": {"A": "'Recovery' sog'ayish jarayonini bildiradi va jarohatdan keyingi davrga mos keladi.", "B": "'Discovery' kashfiyotni bildiradi.", "C": "'Delivery' yetkazib berishni bildiradi.", "D": "'Memory' xotirani bildiradi."}}, {"no": 17, "pts": "1.5", "head": "What does the underlined expression mean in this sentence?", "text": "We should ~play it by ear~ and decide when we see the weather.", "opts": ["listen to the forecast carefully", "decide as the situation develops", "practise music without written notes", "ask somebody else to decide"], "ans": "B", "expl": "To'g'ri javob - B) 'Play it by ear' vaziyatga qarab yo'l tutishni bildiradi. Qolgan variantlar: A) Ob-havo ma'lumotini tinglash iboraning ma'nosi emas; C) Bu iboraning musiqadagi tom ma'nosi, bu yerda ko'chma ma'noda ishlatilgan; D) Boshqaga topshirish haqida ibora hech narsa demaydi.", "why": {"A": "Ob-havo ma'lumotini tinglash iboraning ma'nosi emas.", "B": "'Play it by ear' vaziyatga qarab yo'l tutishni bildiradi.", "C": "Bu iboraning musiqadagi tom ma'nosi, bu yerda ko'chma ma'noda ishlatilgan.", "D": "Boshqaga topshirish haqida ibora hech narsa demaydi."}}, {"no": 18, "pts": "1.5", "head": "Choose the correct answer.", "text": "Could you ____ me the salt, please?", "opts": ["pass", "bring", "carry", "take"], "ans": "A", "expl": "To'g'ri javob - A) 'Pass' yaqindagi narsani uzatishni bildirad the weekend", "It begins work in the middle of the night", "It was opened by the baker's son"], "ans": "C", "expl": "To'g'ri javob - C) Matnda ish kechasi soat ikkida boshlanishi aytilgan. Qolgan variantlar: A) Matnda bir necha xil non eslatilgan; B) Dam olish kunlari haqida matnda hech narsa yozilmagan; D) Kim ochgani haqida matnda gap yo'q.", "why": {"A": "Matnda bir necha xil non eslatilgan.", "B": "Dam olish kunlari haqida matnda hech narsa yozilmagan.", "C": "Matnda ish kechasi soat ikkida boshlanishi aytilgan.", "D": "Kim ochgani haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 23-24.", "The bakery on Navoi Street starts work at two in the morning. The first customers arrive at six. By then the flat bread is already out of the oven and the sweet rolls are cooling on racks behind the counter. The baker says the hardest part is not the hour but the summer. The room reaches forty degrees before the sun is properly up."]}, {"no": 24, "pts": "2.6", "head": "What does the baker find hardest?", "text": "", "opts": ["The early hour", "Carrying the sacks of flour", "The heat in summer", "Serving the first customers"], "ans": "C", "expl": "To'g'ri javob - C) Matnda yozda xona qirq darajaga yetishi eng qiyin ekani aytilgan. Qolgan variantlar: A) Matnda aynan erta soat emasligi aytilgan; B) Un qoplari haqida matnda hech narsa yozilmagan; D) Xaridorlarga xizmat haqida matnda gap yo'q.", "why": {"A": "Matnda aynan erta soat emasligi aytilgan.", "B": "Un qoplari haqida matnda hech narsa yozilmagan.", "C": "Matnda yozda xona qirq darajaga yetishi eng qiyin ekani aytilgan.", "D": "Xaridorlarga xizmat haqida matnda gap yo'q."}}, {"no": 25, "pts": "2.6", "head": "Why do some animals hibernate?", "text": "", "opts": ["The cold damages their fur and skin", "They need to grow before the spring", "Their young are born during the winter", "Food becomes too scarce to support them"], "ans": "D", "expl": "To'g'ri javob - D) Birinchi xatboshida qishda oziq-ovqat yetarli bo'lmasligi sabab qilib ko'rsatilgan. Qolgan variantlar: A) Jun va teri haqida matnda hech narsa yozilmagan; B) O'sish haqida matnda gap yo'q; C) Bolalash haqida matnda ma'lumot berilmagan.", "why": {"A": "Jun va teri haqida matnda hech narsa yozilmagan.", "B": "O'sish haqida matnda gap yo'q.", "C": "Bolalash haqida matnda ma'lumot berilmagan.", "D": "Birinchi xatboshida qishda oziq-ovqat yetarli bo'lmasligi sabab qilib ko'rsatilgan."}, "block": ["Read the text and answer questions 25-27.", "Hibernation is a response to hunger rather than to temperature. In winter many places contain insufficient food to support an active animal, so certain species shut down instead. The body temperature falls, the heartbeat slows, and the animal survives on the fat accumulated in autumn.", "It is not the same as sleep. A hibernating animal is extremely difficult to wake, and waking is expensive: a single disturbance can burn several days of stored fat. That is why caves where bats hibernate are closed to visitors in winter.", "Many hibernators wake briefly on their own, every week or two, and nobody is certain why. One idea is that the immune system cannot work at a low temperature, so the animal warms up to let it do its job. The cost is high, which suggests the benefit must be high too."]}, {"no": 26, "pts": "2.6", "head": "Why are bat caves closed to visitors in winter?", "text": "", "opts": ["Waking a hibernating animal is very costly", "The caves become dangerous in cold weather", "The bats give birth at that time of year", "Visitors cannot see anything in the dark"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida uyg'otish bir necha kunlik zaxirani yoqib yuborishi aytilgan. Qolgan variantlar: B) G'orning xavfliligi haqida matnda hech narsa yozilmagan; C) Bolalash haqida matnda gap yo'q; D) Ko'rinish haqida matnda ma'lumot berilmagan.", "why": {"A": "Ikkinchi xatboshida uyg'otish bir necha kunlik zaxirani yoqib yuborishi aytilgan.", "B": "G'orning xavfliligi haqida matnda hech narsa yozilmagan.", "C": "Bolalash haqida matnda gap yo'q.", "D": "Ko'rinish haqida matnda ma'lumot berilmagan."}}, {"no": 27, "pts": "2.6", "head": "What does the text say about the brief wakings?", "text": "", "opts": ["They happen only in the warmest weeks", "They are caused by noise outside the cave", "Nobody is certain why they happen", "They cost the animal almost nothing"], "ans": "C", "expl": "To'g'ri javob - C) Uchinchi xatboshida ularning sababi aniq emasligi aytilgan. Qolgan variantlar: A) Ob-havo haqida matnda hech narsa yozilmagan; B) Shovqin haqida matnda gap yo'q; D) Matnda aksincha, bu qimmatga tushishi aytilgan.", "why": {"A": "Ob-havo haqida matnda hech narsa yozilmagan.", "B": "Shovqin haqida matnda gap yo'q.", "C": "Uchinchi xatboshida ularning sababi aniq emasligi aytilgan.", "D": "Matnda aksincha, bu qimmatga tushishi aytilgan."}}, {"no": 28, "pts": "2.6", "head": "Why did the village buy a tractor together?", "text": "", "opts": ["The old tractor had been sold by the council", "No single family could afford one alone", "They wanted to rent it out to other villages", "A company had offered them a large discount"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi xatboshida hech bir oila yolg'iz sotib ola olmasligi aytilgan. Qolgan variantlar: A) Eski traktor haqida matnda hech narsa yozilmagan; C) Ijaraga berish keyinroq paydo bo'lgan, sabab emas; D) Chegirma haqida matnda gap yo'q.", "why": {"A": "Eski traktor haqida matnda hech narsa yozilmagan.", "B": "Birinchi xatboshida hech bir oila yolg'iz sotib ola olmasligi aytilgan.", "C": "Ijaraga berish keyinroq paydo bo'lgan, sabab emas.", "D": "Chegirma haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 28-30.", "No family in Tersak could afford a tractor. Hiring one from the district centre meant waiting until the owner had finished his own fields. Eleven households combined their money and purchased a second-hand machine. They drew up a written agreement about who would use it and when.", "The agreement turned out to matter more than the tractor. The order of use follows the sequence in which the fields require ploughing, not the sequence in which the money was contributed. A household that misses its turn moves to the end of the list rather than losing it. Two families left the group in the first year and were replaced.", "Nine years later the same machine is still working. One of the members, a mechanic in the army, repairs it each winter. Three other villages have copied the arrangement. In each case they requested a copy of the agreement rather than advice about which tractor to purchase."]}, {"no": 29, "pts": "2.6", "head": "How is the order of use decided?", "text": "", "opts": ["By when the fields need ploughing", "By how much each household paid", "By the size of each family's land", "By who repairs the machine"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida navbat dalalarning haydash ehtiyojiga qarab belgilanishi aytilgan. Qolgan variantlar: B) To'lov miqdori aniq rad etilgan; C) Yer maydoni haqida matnda hech narsa yozilmagan; D) Ta'mirlovchi haqida matnda bunday imtiyoz berilmagan.", "why": {"A": "Ikkinchi xatboshida navbat dalalarning haydash ehtiyojiga qarab belgilanishi aytilgan.", "B": "To'lov miqdori aniq rad etilgan.", "C": "Yer maydoni haqida matnda hech narsa yozilmagan.", "D": "Ta'mirlovchi haqida matnda bunday imtiyoz berilmagan."}}, {"no": 30, "pts": "2.6", "head": "What did the other villages ask for?", "text": "", "opts": ["Advice about which tractor to buy", "The name of the mechanic", "A copy of the written agreement", "Help with their first ploughing"], "ans": "C", "expl": "To'g'ri javob - C) Uchinchi xatboshida ular traktor haqida maslahat emas, kelishuv nusxasini so'ragani aytilgan. Qolgan variantlar: A) Matnda aynan bu so'ralmagani ta'kidlangan; B) Usta haqida matnda gap yo'q; D) Yordam so'rash haqida matnda hech narsa yozilmagan.", "why": {"A": "Matnda aynan bu so'ralm olves this. One end of it is attracted to water and the other to grease, so the soap takes hold of both and the grease is carried away when the water runs off.", "This also explains the bubbles. Soap molecules gather at the surface with their water-loving ends inwards, which weakens the pull that normally makes the surface of water behave like a skin. A weaker skin stretches more easily, and a stretched film of water is a bubble.", "Hard water complicates matters. The minerals it carries combine with the soap to form a grey scum that sticks to the bath rather than to the dirt. Modern detergents are designed around this problem, which is why they work where traditional soap leaves a ring."]}, {"no": 26, "pts": "2.6", "head": "Why does soap make bubbles?", "text": "", "opts": ["It weakens the skin-like surface of water", "It traps air inside the grease", "It thickens the water around the air", "It cools the water very quickly"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida sovun suv sirtining tarangligini zaiflashtirishi aytilgan. Qolgan variantlar: B) Havoni ushlash haqida matnda hech narsa yozilmagan; C) Suvning quyuqlashishi haqida matnda gap yo'q; D) Harorat haqida matnda ma'lumot berilmagan.", "why": {"A": "Ikkinchi xatboshida sovun suv sirtining tarangligini zaiflashtirishi aytilgan.", "B": "Havoni ushlash haqida matnda hech narsa yozilmagan.", "C": "Suvning quyuqlashishi haqida matnda gap yo'q.", "D": "Harorat haqida matnda ma'lumot berilmagan."}}, {"no": 27, "pts": "2.6", "head": "What problem does hard water cause?", "text": "", "opts": ["The soap dissolves before it is used", "The water cannot carry the grease away", "The bubbles burst almost at once", "The minerals and soap form a grey scum"], "ans": "D", "expl": "To'g'ri javob - D) Uchinchi xatboshida minerallar sovun bilan birikib, kulrang qoldiq hosil qilishi aytilgan. Qolgan variantlar: A) Sovunning erib ketishi haqida matnda hech narsa yozilmagan; B) Suv yog'ni tashiy olmasligi haqida bu o'rinda gap yo'q; C) Pufakchalarning yorilishi haqida matnda ma'lumot berilmagan.", "why": {"A": "Sovunning erib ketishi haqida matnda hech narsa yozilmagan.", "B": "Suv yog'ni tashiy olmasligi haqida bu o'rinda gap yo'q.", "C": "Pufakchalarning yorilishi haqida matnda ma'lumot berilmagan.", "D": "Uchinchi xatboshida minerallar sovun bilan birikib, kulrang qoldiq hosil qilishi aytilgan."}}, {"no": 28, "pts": "2.6", "head": "Why did the school start growing its own vegetables?", "text": "", "opts": ["The land behind the school was unused", "The cook wanted food that had not travelled far", "Parents had complained about the meals", "A competition had offered a prize for it"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi xatboshida oshpazning uzoqdan kelmagan mahsulot istagi sabab qilib berilgan. Qolgan variantlar: A) Yer bo'sh edi, lekin bu asosiy sabab sifatida ko'rsatilmagan; C) Shikoyat haqida matnda hech narsa yozilmagan; D) Tanlov haqida matnda gap yo'q.", "why": {"A": "Yer bo'sh edi, lekin bu asosiy sabab sifatida ko'rsatilmagan.", "B": "Birinchi xatboshida oshpazning uzoqdan kelmagan mahsulot istagi sabab qilib berilgan.", "C": "Shikoyat haqida matnda hech narsa yozilmagan.", "D": "Tanlov haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 28-30.", "The idea originated with the school cook. She wanted vegetables that had not spent four days in a lorry. The strip of land behind the kitchen had been cut for grass and nothing else for years. The head teacher agreed to let her cultivate half of it.", "The first season was largely a failure. Everything was planted simultaneously and ripened simultaneously. The kitchen consequently had more courgettes than it could use in July and nothing whatever in May. The second year the planting was distributed across eight weeks, and a simple chart on the kitchen wall showed what would arrive when.", "The garden now supplies approximately a fifth of what the kitchen consumes between June and October. Pupils in the lower classes do the watering. The cook says that is the part which has changed most. Children who have watered a plant will usually eat what grows on it."]}, {"no": 29, "pts": "2.6", "head": "What went wrong in the first season?", "text": "", "opts": ["Everything ripened at the same time", "The soil turned out to be too poor", "The pupils forgot to water the plants", "The cook was given too little land"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida hamma narsa bir vaqtda pishib, iyulda ortiqcha, mayda esa hech narsa bo'lmagani aytilgan. Qolgan variantlar: B) Tuproq haqida matnda hech narsa yozilmagan; C) Sug'orish keyinroq, o'quvchilar ishi sifatida eslatilgan; D) Yer maydoni haqida shikoyat matnda yo'q.", "why": {"A": "Ikkinchi xatboshida hamma narsa bir vaqtda pishib, iyulda ortiqcha, mayda esa hech narsa bo'lmagani aytilgan.", "B": "Tuproq haqida matnda hech narsa yozilmagan.", "C": "Sug'orish keyinroq, o'quvchilar ishi sifatida eslatilgan.", "D": "Yer maydoni haqida shikoyat matnda yo'q."}}, {"no": 30, "pts": "2.6", "head": "What does the cook say has changed most?", "text": "", "opts": ["Children eat what they have watered", "The kitchen spends far less money", "The vegetables taste better than before", "The garden needs less work each year"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida o'simlikni sug'organ bola odatda undan yetishganini yeyishi eng katta o'zgarish deb aytilgan. Qolgan variantlar: B) Xarajat haqida matnda bunday xulosa yo'q; C) Ta'm haqida matnda gap yo'q; D) Ish hajmi haqida matnda hech narsa yozilmagan.", "why": {"A": "Uchinchi xatboshida o'simlikni sug'organ bola odatda undan yetishganini yeyishi eng katta o'zgarish deb aytilgan.", "B": "Xarajat haqida matnda bunday xulosa yo'q.", "C": "Ta'm haqida matnda gap yo'q.", "D": "Ish hajmi haqida matnda hech narsa yozilmagan."}}]}, {"variant": 6, "label": "10-sinf", "sub": "3-mock", "items": [{"no": 1, "pts": "0.9", "head": "Choose the correct answer.", nges"], "ans": "B", "expl": "To'g'ri javob - B) 'Shelve' biror rejani vaqtincha chetga surib qo'yishni bildiradi. Qolgan variantlar: A) Butunlay rad etish iboraning ma'nosi emas; C) Boshqaga topshirish haqida ibora hech narsa demaydi; D) Nashr etish iboraning ma'nosiga zid.", "why": {"A": "Butunlay rad etish iboraning ma'nosi emas.", "B": "'Shelve' biror rejani vaqtincha chetga surib qo'yishni bildiradi.", "C": "Boshqaga topshirish haqida ibora hech narsa demaydi.", "D": "Nashr etish iboraning ma'nosiga zid."}}, {"no": 14, "pts": "1.5", "head": "Choose the correct answer.", "text": "The scheme was criticised for its ____ to the needs of small villages.", "opts": ["indifferent", "indifference", "indifferently", "differ"], "ans": "B", "expl": "To'g'ri javob - B) 'Its ... to' qurilishida ot kerak, 'indifference' esa ot shaklidir. Qolgan variantlar: A) 'Indifferent' sifat bo'lib, 'its' dan keyin ot talab qilinadi; C) 'Indifferently' ravish bo'lib, fe'lni izohlaydi; D) 'Differ' fe'l bo'lib, bu o'rinda kelmaydi.", "why": {"A": "'Indifferent' sifat bo'lib, 'its' dan keyin ot talab qilinadi.", "B": "'Its ... to' qurilishida ot kerak, 'indifference' esa ot shaklidir.", "C": "'Indifferently' ravish bo'lib, fe'lni izohlaydi.", "D": "'Differ' fe'l bo'lib, bu o'rinda kelmaydi."}}, {"no": 15, "pts": "1.5", "head": "Which word is opposite in meaning to the underlined word?", "text": "The opening paragraph of the report is unusually ~concise~.", "opts": ["brief", "formal", "technical", "long-winded"], "ans": "D", "expl": "To'g'ri javob - D) 'Concise' qisqa va lo'nda degani, uning teskarisi 'long-winded'. Qolgan variantlar: A) 'Brief' ma'no jihatidan sinonim, teskarisi emas; B) 'Formal' uslubni bildiradi va teskari ma'no bermaydi; C) 'Technical' mazmun turini bildiradi, uzunlikni emas.", "why": {"A": "'Brief' ma'no jihatidan sinonim, teskarisi emas.", "B": "'Formal' uslubni bildiradi va teskari ma'no bermaydi.", "C": "'Technical' mazmun turini bildiradi, uzunlikni emas.", "D": "'Concise' qisqa va lo'nda degani, uning teskarisi 'long-winded'."}}, {"no": 16, "pts": "1.5", "head": "Choose the correct answer.", "text": "The committee will ____ the new timetable at its next meeting.", "opts": ["adapt", "adept", "adjust", "adopt"], "ans": "D", "expl": "To'g'ri javob - D) 'Adopt' rasman qabul qilishni bildiradi va qo'mita qaroriga mos keladi. Qolgan variantlar: A) 'Adapt' moslashtirish yoki o'zgartirishni bildiradi; B) 'Adept' sifat bo'lib, mohir degani; C) 'Adjust' kichik tuzatish kiritishni bildiradi.", "why": {"A": "'Adapt' moslashtirish yoki o'zgartirishni bildiradi.", "B": "'Adept' sifat bo'lib, mohir degani.", "C": "'Adjust' kichik tuzatish kiritishni bildiradi.", "D": "'Adopt' rasman qabul qilishni bildiradi va qo'mita qaroriga mos keladi."}}, {"no": 17, "pts": "1.5", "head": "Choose the correct answer.", "text": "The decision was taken ____ the advice of the legal department.", "opts": ["contrary to", "in spite to", "in return of", "on account to"], "ans": "A", "expl": "To'g'ri javob - A) 'Contrary to' maslahatga zid ravishda degani va gapga mos keladi. Qolgan variantlar: B) Bunday birikma ingliz tilida mavjud emas; C) Bu birikma 'in return for' shaklida bo'ladi; D) Bu birikma 'on account of' shaklida bo'ladi.", "why": {"A": "'Contrary to' maslahatga zid ravishda degani va gapga mos keladi.", "B": "Bunday birikma ingliz tilida mavjud emas.", "C": "Bu birikma 'in return for' shaklida bo'ladi.", "D": "Bu birikma 'on account of' shaklida bo'ladi."}}, {"no": 18, "pts": "1.5", "head": "Choose the correct answer.", "text": "The two studies reached ____ conclusions, which surprised the reviewers.", "opts": ["conflicted", "conflict", "conflicting", "conflictingly"], "ans": "C", "expl": "To'g'ri javob - C) 'Conflicting' bir-biriga zid degani va 'conclusions' ni izohlaydi. Qolgan variantlar: A) 'Conflicted' odamning ichki ziddiyatini bildiradi; B) 'Conflict' ot yoki fe'l bo'lib, bu o'rinda sifat kerak; D) Bunday ravish shakli ingliz tilida ishlatilmaydi.", "why": {"A": "'Conflicted' odamning ichki ziddiyatini bildiradi.", "B": "'Conflict' ot yoki fe'l bo'lib, bu o'rinda sifat kerak.", "C": "'Conflicting' bir-biriga zid degani va 'conclusions' ni izohlaydi.", "D": "Bunday ravish shakli ingliz tilida ishlatilmaydi."}}, {"no": 19, "pts": "1.5", "head": "Choose the correct answer.", "text": "Although the room was small, it was ____ enough for a seminar group.", "opts": ["adequate", "spacious", "vast", "narrow"], "ans": "A", "expl": "To'g'ri javob - A) 'Adequate' yetarli degani va qarama-qarshilikni to'g'ri yakunlaydi. Qolgan variantlar: B) 'Spacious' keng degani va 'although the room was small' bilan ziddir; C) 'Vast' juda keng degani va gap mantiqiga zid; D) 'Narrow' torlikni bildiradi va 'enough' bilan bu ma'noda kelmaydi.", "why": {"A": "'Adequate' yetarli degani va qarama-qarshilikni to'g'ri yakunlaydi.", "B": "'Spacious' keng degani va 'although the room was small' bilan ziddir.", "C": "'Vast' juda keng degani va gap mantiqiga zid.", "D": "'Narrow' torlikni bildiradi va 'enough' bilan bu ma'noda kelmaydi."}}, {"no": 20, "pts": "1.5", "head": "Which option is the most formal way of writing this sentence?", "text": "We are sorry but we cannot take your application.", "opts": ["Sorry, we can't take your application this time.", "We regret that we are unable to accept your application.", "Unfortunately your application is a no from us.", "We are afraid your application has not made it."], "ans": "B", "expl": "To'g'ri javob - B) 'We regret' va 'are unable to accept' rasmiy uslubga xos. Qolgan variantlar: A) 'Sorry' va qisqartirilgan shakl so'zlashuv uslubiga tegishli; C) 'A no from us' juda erkin, og'zaki ifoda; D) 'Has not made it' ham so'zlashuv uslubiga tegishli.", "why": {"A": "'Sorry' va qisqartirilgan shakl so'zlashuv uslubiga tegishli.", "B": "'We regret' va 'are unable to accept' rasmiy uslubga xos.", "C": "'A no from us' juda erkin, og'zaki ifoda.", "D": "'Has not made it' ham so'zlashuv uslubiga tegishli."}}, {"no": 21, "pts": "2.6", "head": "What is the purpose of this notice?", "text": "", "opts": ["To announce new equipment in the laboratory", "To explain how the language laboratory is booked", "To invite students to a language course", "To report the results of a listening test"], "ans": "B", "expl": "To'g'ri javob - B) E'londa band qilish, muddat, cheklov va bekor qilish tartibi tushuntirilgan. Qolgan variantlar: A) Jihoz haqida e'londa hech narsa aytilmagan; C) Kurs haqida e'londa gap yo'q; D) Test natijalari haqida e'londa ma'lumot berilmagan.", "why": {"A": "Jihoz haqida e'londa hech narsa aytilmagan.", "B": "E'londa band qilish, muddat, cheklov va bekor qilish tartibi tushuntirilgan.", "C": "Kurs haqida e'londa gap yo'q.", "D": "Test natijalari haqida e'londa ma'lumot berilmagan."}, "block": ["Read the text and answer questions 21-22.", "LANGUAGE LABORATORY: BOOKING", "Sessions are booked on the sheet outside room 12 and open one week in advance. A student may hold two bookings at a time, which keeps the room available to the whole year group. Headsets are issued at the desk and signed for. A session that is not cancelled by nine on the morning of the booking counts against that limit for the rest of the week."]}, {"no": 22, "pts": "2.6", "head": "What happens if a session is not cancelled in time?", "text": "", "opts": ["It counts against the booking limit", "The student is charged a small fee", "The headset is not issued again", "The room is closed for that day"], "ans": "A", "expl": "To'g'ri javob - A) E'londa vaqtida bekor qilinmagan band qilish hafta oxirigacha chegaradan hisoblanishi aytilgan. Qolgan variantlar: B) To'lov haqida e'londa hech narsa yozilmagan; C) Garnitura haqida bunday jazo ko'rsatilmagan; D) Xonaning yopilishi haqida e'londa gap yo'q.", "why": {"A": "E'londa vaqtida bekor qilinmagan band qilish hafta oxirigacha chegaradan hisoblanishi aytilgan.", "B": "To'lov haqida e'londa hech narsa yozilmagan.", "C": "Garnitura haqida bunday jazo ko'rsatilmagan.", "D": "Xonaning yopilishi haqida e'londa gap yo'q."}}, {"no": 23, "pts": "2.6", "head": "What is the writer's main argument?", "text": "", "opts": ["School trips abroad should be stopped altogether", "Trips abroad are too expensive for most families", "Teachers should choose the destinations themselves", "A trip is worth little unless pupils are prepared for it"], "ans": "D", "expl": "To'g'ri javob - D) Muallif tayyorgarliksiz safar deyarli foyda bermasligini ta'kidlaydi. Qolgan variantlar: A) Muallif safarlarni butunlay bekor qilishni taklif qilmaydi; B) Narx haqida matnda hech narsa yozilmagan; C) Yo'nalish tanlash haqida matnda gap yo'q.", "why": {"A": "Muallif safarlarni butunlay bekor qilishni taklif qilmaydi.", "B": "Narx haqida matnda hech narsa yozilmagan.", "C": "Yo'nalish tanlash haqida matnda gap yo'q.", "D": "Muallif tayyorgarliksiz safar deyarli foyda bermasligini ta'kidlaydi."}, "block": ["Read the text and answer questions 23-24.", "A week abroad is often described as worth a term of lessons. It can be, but only when the preparation has been done. A group that arrives knowing nothing of the language, the history or the arguments of the place will photograph it and come home unchanged. The trip is not the lesson; it is the examination, and it rewards those who have revised."]}, {"no": 24, "pts": "2.6", "head": "What does the writer compare the trip to?", "text": "", "opts": ["A long lesson", "A photograph album", "An examination", "A holiday"], "ans": "C", "expl": "To'g'ri javob - C) Matnda safar dars emas, imtihon deb atalgan. Qolgan variantlar: A) Matn aynan safarni dars deb atashga qarshi chiqadi; B) Surat olish tanqid qilingan, taqqoslash sifatida emas; D) Ta'til haqida matnda gap yo'q.", "why": {"A": "Matn aynan safarni dars deb atashga qarshi chiqadi.", "B": "Surat olish tanqid qilingan, taqqoslash sifatida emas.", "C": "Matnda safar dars emas, imtihon deb atalgan.", "D": "Ta'til haqida matnda gap yo'q."}}, {"no": 25, "pts": "2.6", "head": "Why is a city warmer than the countryside around it?", "text": "", "opts": ["Dark surfaces absorb heat and release it slowly", "Cities are usually built in warmer valleys", "There are fewer clouds above a large city", "Traffic produces most of the extra heat"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida to'q sirtlar issiqlikni yutib, sekin chiqarishi aytilgan. Qolgan variantlar: B) Joylashuv haqida matnda hech narsa yozilmagan; C) Bulutlar haqida matnda gap yo'q; D) Transport eslatilgan, lekin asosiy sabab sifatida ko'rsatilmagan.", "why": {"A": "Birinchi xatboshida to'q sirtlar issiqlikni yutib, sekin chiqarishi aytilgan.", "B": "Joylashuv haqida matnda hech narsa yozilmagan.", "C": "Bulutlar haqida matnda gap yo'q.", "D": "Transport eslatilgan, lekin asosiy sabab sifatida ko'rsatilmagan."}, "block": ["Read the text and answer questions 25-27.", "A large city is measurably warmer than the countryside surrounding it. Dark roofs and asphalt absorb sunlight during the day and release the heat slowly through the night, so the difference is greatest a few hours after sunset. Engines and air conditioning contribute, but the surfaces matter more.", "The effect is not evenly distributed. Districts with mature trees can be several degrees cooler than districts without them, and the gap follows the map of who planted what decades ago. Heat is therefore distributed unequally across a city rather than uniformly.", "The remedies are well understood. Lighter roof surfaces reflect rather than absorb, street trees shade the pavement, and small parks interrupt the mass of brick and tarmac. None of these is expensive compared with the cost of cooling buildings that need not have become so warm."]}, {"no": 26, "pts": "2.6", "head": "Why does the gap between districts follow an old map?", "text": "", "opts": ["Older districts were built with lighter materials", "The oldest streets are the narrowest", "It depends on who planted trees decades ago", "Air conditioning arrived earlier in some areas"], "ans": "C", "expl": "To'g'ri javob - C) Ikkinchi xatboshida farq o'nlab yillar oldin kim daraxt ekkaniga bog'liqligi aytilgan. Qolgan variantlar: A) Qurilish materiali haqida matnda bunday ma'lumot yo'q; B) Ko'cha kengligi haqida matnda gap yo'q; D) Konditsioner haqida bu o'rinda hech narsa yozilmagan.", "why": {"A": "Qurilish materiali haqida matnda bunday ma'lumot yo'q.", "B": "Ko'cha kengligi haqida matnda gap yo'q.", "C": "Ikkinchi xatboshida farq o'nlab yillar oldin kim daraxt ekkaniga bog'liqligi aytilgan.", "D": "Konditsioner haqida bu o'rinda hech narsa yozilmagan."}}, {"no": 27, "pts": "2.6", "head": "How does the writer describe the remedies?", "text": "", "opts": ["Effective only in the newest districts", "Too slow to make any real difference", "Dependent on changes in the law", "Cheap compared with the cost of cooling buildings"], "ans": "D", "expl": "To'g'ri javob - D) Uchinchi xatboshida ular binolarni sovitish xarajatiga nisbatan arzon ekani aytilgan. Qolgan variantlar: A) Tumanlar bo'yicha cheklov haqida matnda gap yo'q; B) Sekinligi haqida matnda hech narsa yozilmagan; C) Qonun haqida matnda ma'lumot berilmagan.", "why": {"A": "Tumanlar bo'yicha cheklov haqida matnda gap yo'q.", "B": "Sekinligi haqida matnda hech narsa yozilmagan.", "C": "Qonun haqida matnda ma'lumot berilmagan.", "D": "Uchinchi xatboshida ular binolarni sovitish xarajatiga nisbatan arzon ekani aytilgan."}}, {"no": 28, "pts": "2.6", "head": "Why were standard time zones introduced?", "text": "", "opts": ["Factories wanted all shifts to begin together", "Railways needed a single time along each line", "Governments wished to collect taxes on time", "Ships could not navigate without them"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi xatboshida temir yo'llar har bir yo'nalishda yagona vaqtni talab qilgani aytilgan. Qolgan variantlar: A) Zavodlar haqida matnda hech narsa yozilmagan; C) Soliq haqida matnda gap yo'q; D) Kemalar haqida matnda ma'lumot berilmagan.", "why": {"A": "Zavodlar haqida matnda hech narsa yozilmagan.", "B": "Birinchi xatboshida temir yo'llar har bir yo'nalishda yagona vaqtni talab qilgani aytilgan.", "C": "Soliq haqida matnda gap yo'q.", "D": "Kemalar haqida matnda ma'lumot berilmagan."}, "block": ["Read the text and answer questions 28-30.", "Before the railways, each town kept its own time, set by the sun at noon. The difference between neighbouring towns was a matter of minutes and troubled nobody. A timetable, however, cannot be written in dozens of local times, and railway companies began imposing a single time along each line.", "Resistance was considerable. Town councils argued that the clock in the market square was correct and that the railway's clock was a foreign invention. Some public buildings carried two minute hands for years, one for local time and one for railway time.", "The argument was settled not by science but by habit. As more of daily life came to depend on the timetable, railway time became the time that mattered, and the local hour quietly disappeared. What began as a convenience for one industry ended as the way everybody measures the day."]}, {"no": 29, "pts": "2.6", "head": "What did some public buildings do during the dispute?", "text": "", "opts": ["They removed their clocks altogether", "They followed the railway time only", "They set their clocks by the stars", "They carried two minute hands"], "ans": "D", "expl": "To'g'ri javob - D) Ikkinchi xatboshida ba'zi binolarda ikkita daqiqa mili bo'lgani aytilgan. Qolgan variantlar: A) Soatlarni olib tashlash haqida matnda hech narsa yozilmagan; B) Faqat temir yo'l vaqti qabul qilingani bu bosqichda emas; C) Yulduzlar haqida matnda gap yo'q.", "why": {"A": "Soatlarni olib tashlash haqida matnda hech narsa yozilmagan.", "B": "Faqat temir yo'l vaqti qabul qilingani bu bosqichda emas.", "C": "Yulduzlar haqida matnda gap yo'q.", "D": "Ikkinchi xatboshida ba'zi binolarda ikkita daqiqa mili bo'lgani aytilgan."}},  "Plastic in the ocean attracts most of the attention, but soil is thought to hold more of it. The sources are agricultural as much as domestic: sheeting used to warm the ground, coatings on slow-release fertiliser, and fibres that arrive with treated sewage spread as a soil improver.", "Measurement is harder than in water. Soil contains organic fragments that look like plastic under a microscope, and separating the two requires chemical analysis rather than a trained eye. Published figures for the same region therefore differ by a wide margin.", "The effects are still being established. Experiments show changes in how water moves through soil and in the communities of organisms living in it, but field conditions vary so much that confident general statements remain premature. What is agreed is that the material does not simply disappear."]}, {"no": 26, "pts": "2.6", "head": "Why is measurement harder in soil than in water?", "text": "", "opts": ["Organic fragments resemble plastic under a microscope", "Soil samples cannot be taken in winter", "Plastic sinks below the level that is sampled", "The equipment is far more expensive"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida organik bo'laklar mikroskop ostida plastikka o'xshashi aytilgan. Qolgan variantlar: B) Fasl haqida matnda hech narsa yozilmagan; C) Chuqurlik haqida matnda gap yo'q; D) Jihoz narxi haqida matnda ma'lumot berilmagan.", "why": {"A": "Ikkinchi xatboshida organik bo'laklar mikroskop ostida plastikka o'xshashi aytilgan.", "B": "Fasl haqida matnda hech narsa yozilmagan.", "C": "Chuqurlik haqida matnda gap yo'q.", "D": "Jihoz narxi haqida matnda ma'lumot berilmagan."}}, {"no": 27, "pts": "2.6", "head": "What does the writer say is agreed?", "text": "", "opts": ["The effects on crops are now clear", "Soil holds less plastic than was feared", "Field experiments are no longer needed", "The material does not simply disappear"], "ans": "D", "expl": "To'g'ri javob - D) Uchinchi xatboshida material shunchaki yo'qolib ketmasligi kelishilgan nuqta deb aytilgan. Qolgan variantlar: A) Ekinlarga ta'siri haqida matnda aniqlik yo'qligi aytilgan; B) Miqdor haqida bunday xulosa chiqarilmagan; C) Dala tajribalari haqida matnda bunday gap yo'q.", "why": {"A": "Ekinlarga ta'siri haqida matnda aniqlik yo'qligi aytilgan.", "B": "Miqdor haqida bunday xulosa chiqarilmagan.", "C": "Dala tajribalari haqida matnda bunday gap yo'q.", "D": "Uchinchi xatboshida material shunchaki yo'qolib ketmasligi kelishilgan nuqta deb aytilgan."}}, {"no": 28, "pts": "2.6", "head": "Why did textbooks become so expensive, according to the text?", "text": "", "opts": ["A new edition appears before the old one is worn out", "They are printed in very small numbers", "The paper used is of unusually high quality", "Teachers insist on the most recent research"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida eskisi yemirilmasdan yangi nashr chiqishi narxning sababi deb ko'rsatilgan. Qolgan variantlar: B) Tiraj haqida matnda hech narsa yozilmagan; C) Qog'oz sifati haqida matnda gap yo'q; D) O'qituvchilarning talabi haqida matnda ma'lumot berilmagan.", "why": {"A": "Birinchi xatboshida eskisi yemirilmasdan yangi nashr chiqishi narxning sababi deb ko'rsatilgan.", "B": "Tiraj haqida matnda hech narsa yozilmagan.", "C": "Qog'oz sifati haqida matnda gap yo'q.", "D": "O'qituvchilarning talabi haqida matnda ma'lumot berilmagan."}, "block": ["Read the text and answer questions 28-30.", "The price of a school textbook has risen faster than almost anything else on a school's budget. The reason is not the printing. A new edition appears every three or four years, long before the old copies are worn out. A class cannot use two editions simultaneously, because the exercises are renumbered.", "Publishers answer that each edition costs a great deal to prepare and that schools would complain if the content were never revised. There is something in this, although a comparison of consecutive editions often shows changes of arrangement rather than of substance.", "Several countries have responded by funding open textbooks, written once and distributed without charge. The early examples were criticised as dull, and some were. The later ones are harder to dismiss. The argument has shifted from whether they can be good to who should finance keeping them current."]}, {"no": 29, "pts": "2.6", "head": "What does a comparison of consecutive editions often show?", "text": "", "opts": ["A large amount of entirely new material", "Fewer exercises than the previous edition", "Changes of arrangement rather than of substance", "Corrections made by the teachers themselves"], "ans": "C", "expl": "To'g'ri javob - C) Ikkinchi xatboshida ketma-ket nashrlar taqqoslanganda mazmun emas, tartib o'zgarishi ko'rinishi aytilgan. Qolgan variantlar: A) Yangi material haqida matnda aksincha aytilgan; B) Mashqlar soni haqida matnda gap yo'q; D) O'qituvchilarning tuzatishi haqida matnda hech narsa yozilmagan.", "why": {"A": "Yangi material haqida matnda aksincha aytilgan.", "B": "Mashqlar soni haqida matnda gap yo'q.", "C": "Ikkinchi xatboshida ketma-ket nashrlar taqqoslanganda mazmun emas, tartib o'zgarishi ko'rinishi aytilgan.", "D": "O'qituvchilarning tuzatishi haqida matnda hech narsa yozilmagan."}}, {"no": 30, "pts": "2.6", "head": "How has the argument about open textbooks shifted?", "text": "", "opts": ["From their cost to their printing quality", "From who writes them to who may use them", "From their length to the subjects they cover", "From whether they can be good to who pays to update them"], "ans": "D", "expl": "To'g'ri javob - D) Uchinchi xatboshida bahs sifat masalasidan yangilash xarajati masalasiga ko'chgani aytilgan. Qolgan variantlar: A) Chop sifati haqida matnda gap yo'q; B) Foydalanish huquqi haqida matnda hech narsa yozilmagan; C) Hajm va fanlar haqida matnda ma'lumot berilmagan.", "why": {"A": "Chop sifati haqida matnda gap yo'q.", "B": "Foydalanish huquqi haqida matnda hec il with nowhere quiet to work", "The pupil who has missed lessons"], "ans": "C", "expl": "To'g'ri javob - C) Matnda to'garak tinch joyi va so'raydigan odami yo'q o'quvchiga yetib borishi aytilgan. Qolgan variantlar: A) To'lay oladigan oila repetitor haqida aytilgan; B) Yaxshi o'qiydigan o'quvchi haqida matnda gap yo'q; D) Dars qoldirish haqida matnda hech narsa yozilmagan.", "why": {"A": "To'lay oladigan oila repetitor haqida aytilgan.", "B": "Yaxshi o'qiydigan o'quvchi haqida matnda gap yo'q.", "C": "Matnda to'garak tinch joyi va so'raydigan odami yo'q o'quvchiga yetib borishi aytilgan.", "D": "Dars qoldirish haqida matnda hech narsa yozilmagan."}}, {"no": 25, "pts": "2.6", "head": "What does the text say about fire in these forests?", "text": "", "opts": ["It destroys the soil for several decades", "It occurs only where people have settled", "Some tree species depend on it to reproduce", "It has become less frequent over time"], "ans": "C", "expl": "To'g'ri javob - C) Birinchi xatboshida ba'zi daraxt turlari ko'payish uchun olovga tayanishi aytilgan. Qolgan variantlar: A) Tuproq haqida matnda bunday da'vo yo'q; B) Odamlar haqida matnda bunday cheklov berilmagan; D) Chastota haqida matnda aksincha aytilgan.", "why": {"A": "Tuproq haqida matnda bunday da'vo yo'q.", "B": "Odamlar haqida matnda bunday cheklov berilmagan.", "C": "Birinchi xatboshida ba'zi daraxt turlari ko'payish uchun olovga tayanishi aytilgan.", "D": "Chastota haqida matnda aksincha aytilgan."}, "block": ["Read the text and answer questions 25-27.", "Fire is not simply a disaster in these forests. Parts of the system depend on it. Certain pines hold their seeds in cones sealed with resin, and only the heat of a passing fire opens them. The ash that follows is a bed of nutrients. The seedlings then develop in open light rather than deep shade.", "A century of suppression changed that balance. Small fires were extinguished wherever possible, so dead wood accumulated on the forest floor instead of burning away every few years. When fire eventually arrives in such a forest it burns hotter and higher, reaching the canopy rather than running along the ground.", "Managers now use controlled burning in the cooler months, which removes the accumulated fuel under conditions they can predict. The policy is unpopular when the smoke reaches a town, and it is expensive, but the alternative has proved far more costly."]}, {"no": 26, "pts": "2.6", "head": "What did a century of suppression cause?", "text": "", "opts": ["Dead wood accumulated on the forest floor", "The pines stopped producing cones", "The soil became too poor for seedlings", "Fires moved to the neighbouring valleys"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida kichik yong'inlar o'chirilgani uchun o'lik yog'och to'planib qolgani aytilgan. Qolgan variantlar: B) Qubba hosil qilish haqida matnda hech narsa yozilmagan; C) Tuproq haqida matnda gap yo'q; D) Yong'inlarning joyi haqida matnda ma'lumot berilmagan.", "why": {"A": "Ikkinchi xatboshida kichik yong'inlar o'chirilgani uchun o'lik yog'och to'planib qolgani aytilgan.", "B": "Qubba hosil qilish haqida matnda hech narsa yozilmagan.", "C": "Tuproq haqida matnda gap yo'q.", "D": "Yong'inlarning joyi haqida matnda ma'lumot berilmagan."}}, {"no": 27, "pts": "2.6", "head": "Why is controlled burning unpopular?", "text": "", "opts": ["The smoke reaches nearby towns", "It kills the seedlings as well", "It can only be done in summer", "It requires foreign equipment"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida tutun shaharga yetib borganda siyosat norozilik tug'dirishi aytilgan. Qolgan variantlar: B) Nihollar haqida matnda bunday ma'lumot yo'q; C) Matnda aksincha, salqin oylarda o'tkazilishi aytilgan; D) Jihoz haqida matnda gap yo'q.", "why": {"A": "Uchinchi xatboshida tutun shaharga yetib borganda siyosat norozilik tug'dirishi aytilgan.", "B": "Nihollar haqida matnda bunday ma'lumot yo'q.", "C": "Matnda aksincha, salqin oylarda o'tkazil
