artibi darak gapdagidek: 'whether the deadline remains unchanged'. Qolgan variantlar: A) Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan; C) 'Do' bilvosita savolda tushib qolishi kerak edi; D) 'Was' egadan oldin kelgan, bu to'g'ridan-to'g'ri savol tartibi.", "why": {"A": "Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan.", "B": "Bilvosita savolda so'z tartibi darak gapdagidek: 'whether the deadline remains unchanged'.", "C": "'Do' bilvosita savolda tushib qolishi kerak edi.", "D": "'Was' egadan oldin kelgan, bu to'g'ridan-to'g'ri savol tartibi."}}, {"no": 11, "pts": "1.5", "head": "Choose the word that fits best.", "text": "The board ____ the objections raised by the minority group.", "opts": ["brushed up", "brushed past", "brushed down", "brushed aside"], "ans": "D", "expl": "To'g'ri javob - D) 'Brush aside' e'tirozlarni jiddiy qabul qilmay, chetga surishni bildiradi. Qolgan variantlar: A) 'Brush up' bilimni yangilashni bildiradi; B) 'Brush past' yonidan tez o'tib ketishni bildiradi; C) 'Brush down' kiyimni qoqishni bildiradi.", "why": {"A": "'Brush up' bilimni yangilashni bildiradi.", "B": "'Brush past' yonidan tez o'tib ketishni bildiradi.", "C": "'Brush down' kiyimni qoqishni bildiradi.", "D": "'Brush aside' e'tirozlarni jiddiy qabul qilmay, chetga surishni bildiradi."}}, {"no": 12, "pts": "1.5", "head": "Which option shows the best correct collocation match?", "text": "", "opts": ["make issue of", "hold issue against thinly and blue", "take issue with", "put issue to"], "ans": "C", "expl": "To'g'ri javob - C) Ingliz tilida rozi bo'lmaslik 'take issue with' deyiladi. Qolgan variantlar: A) Bu birikma 'make an issue of' shaklida bo'ladi va boshqa ma'no beradi; B) Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan; D) 'Put issue to' birikmasi ingliz tilida ishlatilmaydi.", "why": {"A": "Bu birikma 'make an issue of' shaklida bo'ladi va boshqa ma'no beradi.", "B": "Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.", "C": "Ingliz tilida rozi bo'lmaslik 'take issue with' deyiladi.", "D": "'Put issue to' birikmasi ingliz tilida ishlatilmaydi."}}, {"no": 13, "pts": "1.5", "head": "Which word is opposite in meaning to the underlined word?", "text": "The committee's handling of the complaint was notably ~transparent~.", "opts": ["secretive", "open", "prompt", "formal"], "ans": "A", "expl": "To'g'ri javob - A) 'Transparent' ochiq va tushunarli degani, uning teskarisi 'secretive'. Qolgan variantlar: B) 'Open' ma'no jihatidan sinonim, teskarisi emas; C) 'Prompt' tezlikni bildiradi, ochiqlikni emas; D) 'Formal' uslubni bildiradi va teskari ma'no bermaydi.", "why": {"A": "'Transparent' ochiq va tushunarli degani, uning teskarisi 'secretive'.", "B": "'Open' ma'no jihatidan sinonim, teskarisi emas.", "C": "'Prompt' tezlikni bildiradi, ochiqlikni emas.", "D": "'Formal' uslubni bildiradi va teskari ma'no bermaydi."}}, {"no": 14, "pts": "1.5", "head": "Which word does NOT describe a policy?", "text": "", "opts": ["edible", "coherent", "short-sighted", "controversial"], "ans": "A", "expl": "To'g'ri javob - A) 'Edible' yeyish mumkin degani bo'lib, faqat ovqat haqida ishlatiladi. Qolgan variantlar: B) 'Coherent' izchil degani va siyosatni tasvirlaydi; C) 'Short-sighted' kelajakni hisobga olmagan degani, bu ham siyosatga tegishli; D) 'Controversial' bahsli degani va siyosat haqida aytiladi.", "why": {"A": "'Edible' yeyish mumkin degani bo'lib, faqat ovqat haqida ishlatiladi.", "B": "'Coherent' izchil degani va siyosatni tasvirlaydi.", "C": "'Short-sighted' kelajakni hisobga olmagan degani, bu ham siyosatga tegishli.", "D": "'Controversial' bahsli degani va siyosat haqida aytiladi."}}, {"no": 15, "pts": "1.5", "head": "Which word is closest in meaning to the underlined word?", "text": "The explanation offered by the contractor was frankly ~implausible~.", "opts": ["difficult to follow", "hard to believe", "longer than expected", "given in writing"], "ans": "B", "expl": "To'g'ri javob - B) 'Implausible' ishonish qiyin degani, 'hard to believe' shu ma'noni beradi. Qolgan variantlar: A) Tushunish qiyinligi boshqa masala; C) Uzunlik haqidagi ta'rif mos kelmaydi; D) Yozma shakl bu so'zning ma'nosiga kirmaydi.", "why": {"A": "Tushunish qiyinligi boshqa masala.", "B": "'Implausible' ishonish qiyin degani, 'hard to believe' shu ma'noni beradi.", "C": "Uzunlik haqidagi ta'rif mos kelmaydi.", "D": "Yozma shakl bu so'zning ma'nosiga kirmaydi."}}, {"no": 16, "pts": "1.5", "head": "Choose the correct answer.", "text": "The inquiry questioned the ____ of the original risk assessment.", "opts": ["adequacy", "adequate", "adequately", "adequateness"], "ans": "A", "expl": "To'g'ri javob - A) 'The ... of' qurilishida ot kerak, 'adequacy' esa standart ot shaklidir. Qolgan variantlar: B) 'Adequate' sifat bo'lib, 'the ... of' qurilishida ot talab qilinadi; C) 'Adequately' ravish bo'lib, fe'lni izohlaydi; D) Bunday shakl ingliz tilida deyarli ishlatilmaydi.", "why": {"A": "'The ... of' qurilishida ot kerak, 'adequacy' esa standart ot shaklidir.", "B": "'Adequate' sifat bo'lib, 'the ... of' qurilishida ot talab qilinadi.", "C": "'Adequately' ravish bo'lib, fe'lni izohlaydi.", "D": "Bunday shakl ingliz tilida deyarli ishlatilmaydi."}}, {"no": 17, "pts": "1.5", "head": "Choose the correct answer.", "text": "The decision was based ____ evidence collected over three years.", "opts": ["in", "on", "of", "from"], "ans": "B", "expl": "To'g'ri javob - B) 'Based on' barqaror birikma bo'lib, asosni ko'rsatadi. Qolgan variantlar: A) 'Base' fe'li 'in' predlogi bilan ishlatilmaydi; C) 'Of' bu fe'l bilan kelmaydi; D) 'From' manbani bildiradi va bu qurilishga mos emas.", "why": {"A": "'Base' fe'li 'in' predlogi bilan ishlatilmaydi.", "B": "'Based on' barqaror birikma bo'lib, asosni ko'rsatadi.", "C": "'Of' bu fe'l bilan kelmaydi.", "D": "'From' manbani bildiradi va bu qurilishga mos emas."}}, {"no": 18, "pts": "1.5", "head": "Find the definition of the underlined word.", "text": "The agreement contains a clause that both sides now regard as ~redundant~.", "opts": ["open to more than one reading", "impossible to enforce in law", "no longer serving any purpose", "copied from an earlier contract"], "ans": "C", "expl": "To'g'ri javob - C) 'Redundant' endi hech qanday vazifani bajarmaydigan degani. Qolgan variantlar: A) Ikki xil tushunish 'ambiguous' so'ziga tegishli; B) Amalga oshirib bo'lmaslik boshqa masala; D) Ko'chirib olish bu so'zning ma'nosi emas.", "why": {"A": "Ikki xil tushunish 'ambiguous' so'ziga tegishli.", "B": "Amalga oshirib bo'lmaslik boshqa masala.", "C": "'Redundant' endi hech qanday vazifani bajarmaydigan degani.", "D": "Ko'chirib olish bu so'zning ma'nosi emas."}}, {"no": 19, "pts": "1.5", "head": "Choose the correct answer.", "text": "A quorum is:", "opts": ["the written record of what was decided", "the minimum number present for a valid decision", "the person who chairs a formal meeting", "the period allowed for objections to be raised"], "ans": "B", "expl": "To'g'ri javob - B) 'Quorum' qaror qabul qilish uchun zarur bo'lgan eng kam ishtirokchilar soni degani. Qolgan variantlar: A) Yozma bayon 'minutes' deb ataladi; C) Raislik qiluvchi 'chair' deyiladi; D) E'tiroz muddati 'objection period' deb ataladi.", "why": {"A": "Yozma bayon 'minutes' deb ataladi.", "B": "'Quorum' qaror qabul qilish uchun zarur bo'lgan eng kam ishtirokchilar soni degani.", "C": "Raislik qiluvchi 'chair' deyiladi.", "D": "E'tiroz muddati 'objection period' deb ataladi."}}, {"no": 20, "pts": "1.5", "head": "Which word has a negative meaning?", "text": "", "opts": ["meticulous", "thorough", "fussy", "exacting"], "ans": "C", "expl": "To'g'ri javob - C) 'Fussy' arzimas narsaga ilashadigan degani bo'lib, tanqidiy ma'noga ega. Qolgan variantlar: A) 'Meticulous' puxta degani va ijobiy baho beradi; B) 'Thorough' sinchkov degani, bu ham ijobiy so'z; D) 'Exacting' talabchan degani va hurmat ma'nosini beradi.", "why": {"A": "'Meticulous' puxta degani va ijobiy baho beradi.", "B": "'Thorough' sinchkov degani, bu ham ijobiy so'z.", "C": "'Fussy' arzimas narsaga ilashadigan degani bo'lib, tanqidiy ma'noga ega.", "D": "'Exacting' talabchan degani va hurmat ma'nosini beradi."}}, {"no": 21, "pts": "2.6", "head": "What is the purpose of this notice?", "text": "", "opts": ["To announce a change in the complaints staff", "To explain how complaints are handled", "To report the number of complaints received", "To invite the public to a consultation"], "ans": "B", "expl": "To'g'ri javob - B) E'londa topshirish, tasdiqlash, muddat va qayta ko'rib chiqish tartibi berilgan. Qolgan variantlar: A) Xodimlar haqida e'londa hech narsa aytilmagan; C) Shikoyatlar soni haqida e'londa gap yo'q; D) Maslahat yig'ilishi haqida e'londa ma'lumot berilmagan.", "why": {"A": "Xodimlar haqida e'londa hech narsa aytilmagan.", "B": "E'londa topshirish, tasdiqlash, muddat va qayta ko'rib chiqish tartibi berilgan.", "C": "Shikoyatlar soni haqida e'londa gap yo'q.", "D": "Maslahat yig'ilishi haqida e'londa ma'lumot berilmagan."}, "block": ["Read the text and answer questions 21-22.", "COMPLAINTS PROCEDURE", "A complaint is submitted in writing and acknowledged within three working days. The acknowledgement states the name of the officer handling the case, who will not be anyone named in the complaint itself. A full response is due within twenty working days. A complainant dissatisfied with it may request a review by a different department within one month."]}, {"no": 22, "pts": "2.6", "head": "Who will handle the case?", "text": "", "opts": ["An officer not named in the complaint", "The head of the department concerned", "Any officer available that week", "A reviewer from outside the organisation"], "ans": "A", "expl": "To'g'ri javob - A) E'londa ishni shikoyatda nomi tilga olinmagan xodim yuritishi aytilgan. Qolgan variantlar: B) Bo'lim rahbari haqida e'londa gap yo'q; C) Tasodifiy tanlov haqida e'londa hech narsa yozilmagan; D) Tashqi mutaxassis haqida e'londa ma'lumot berilmagan.", "why": {"A": "E'londa ishni shikoyatda nomi tilga olinmagan xodim yuritishi aytilgan.", "B": "Bo'lim rahbari haqida e'londa gap yo'q.", "C": "Tasodifiy tanlov haqida e'londa hech narsa yozilmagan.", "D": "Tashqi mutaxassis haqida e'londa ma'lumot berilmagan."}}, {"no": 23, "pts": "2.6", "head": "You see this sign at a site entrance: \"All visitors must report to the gatehouse before proceeding.\" What is the main message?", "text": "", "opts": ["Visitors may enter only with an escort", "The gatehouse is closed to visitors", "Only authorised vehicles may pass", "Go to the gatehouse first, whoever you are"], "ans": "D", "expl": "To'g'ri javob - D) Belgida har bir tashrifchi avval nazorat punktiga borishi talab qilinmoqda. Qolgan variantlar: A) Hamrohlik haqida belgida hech narsa yozilmagan; B) Belgi aksincha, u yerga borishni buyuradi; C) Transport haqida belgida gap yo'q.", "why": {"A": "Hamrohlik haqida belgida hech narsa yozilmagan.", "B": "Belgi aksincha, u yerga borishni buyuradi.", "C": "Transport haqida belgida gap yo'q.", "D": "Belgida har bir tashrifchi avval nazorat punktiga borishi talab qilinmoqda."}}, {"no": 24, "pts": "2.6", "head": "You hear a project leader say: \"That is outside the scope of this review.\" What does this mean?", "text": "", "opts": ["The matter has already been reviewed elsewhere", "The review will be extended to include it", "The review is not intended to cover that matter", "The matter is too complicated to assess"], "ans": "C", "expl": "To'g'ri javob - C) Bu ibora masala ushbu tekshiruv doirasiga kirmasligini bildiradi. Qolgan variantlar: A) Boshqa joyda ko'rib chiqilgani haqida gapda hech narsa aytilmagan; B) Kengaytirish iboraning ma'nosiga zid; D) Murakkablik haqida ibora gapirmaydi.", "why": {"A": "Boshqa joyda ko'rib chiqilgani haqida gapda hech narsa aytilmagan.", "B": "Kengaytirish iboraning ma'nosiga zid.", "C": "Bu ibora masala ushbu tekshiruv doirasiga kirmasligini bildiradi.", "D": "Murakkablik haqida ibora gapirmaydi."}}, {"no": 25, "pts": "2.6", "head": "What does the text say about the colour of a flower?", "text": "", "opts": ["It depends chiefly on the mineral content of the soil", "It changes according to the temperature at night", "It is partly a signal aimed at particular pollinators", "It has no measurable effect on which insects visit"], "ans": "C", "expl": "To'g'ri javob - C) Birinchi xatboshida rang muayyan changlatuvchilarga qaratilgan signal ekani aytilgan. Qolgan variantlar: A) Tuproq haqida matnda bunday da'vo yo'q; B) Harorat haqida matnda gap yo'q; D) Matnda aksincha, ta'siri borligi aytilgan.", "why": {"A": "Tuproq haqida matnda bunday da'vo yo'q.", "B": "Harorat haqida matnda gap yo'q.", "C": "Birinchi xatboshida rang muayyan changlatuvchilarga qaratilgan signal ekani aytilgan.", "D": "Matnda aksincha, ta'siri borligi aytilgan."}, "block": ["Read the text and answer questions 25-27.", "The colour of a flower is not decoration. It is partly a signal, tuned to the vision of the insects that carry its pollen, and the tuning is specific. Bees see ultraviolet and are effectively blind to red. That is why bee-pollinated flowers cluster in the blue and yellow range, while red flowers are commonly visited by birds.", "Many flowers carry patterns invisible to us. Photographed under ultraviolet light, a plain yellow petal often shows a dark centre and radiating lines. These direct an approaching insect towards the nectar. The guides shorten the visit, which benefits the plant. A bee that finds the reward quickly visits more flowers of the same species.", "The relationship imposes limits on both sides. A plant that specialises in one pollinator is efficient while that pollinator is abundant and vulnerable when it is not. Generalist flowers attract a wider range of visitors but receive less reliable transfer. A bee carrying mixed pollen delivers less of it where it is useful."]}, {"no": 26, "pts": "2.6", "head": "Why do nectar guides benefit the plant?", "text": "", "opts": ["They make the flower visible from a greater distance", "A bee that finds the reward quickly visits more flowers", "They prevent birds from taking the nectar", "They allow the flower to produce less nectar"], "ans": "B", "expl": "To'g'ri javob - B) Ikkinchi xatboshida mukofotni tez topgan ari ko'proq gulga uchishi aytilgan. Qolgan variantlar: A) Masofa haqida matnda hech narsa yozilmagan; C) Qushlar haqida bu o'rinda gap yo'q; D) Nektar miqdori haqida matnda ma'lumot berilmagan.", "why": {"A": "Masofa haqida matnda hech narsa yozilmagan.", "B": "Ikkinchi xatboshida mukofotni tez topgan ari ko'proq gulga uchishi aytilgan.", "C": "Qushlar haqida bu o'rinda gap yo'q.", "D": "Nektar miqdori haqida matnda ma'lumot berilmagan."}}, {"no": 27, "pts": "2.6", "head": "What is the drawback of being a generalist flower?", "text": "", "opts": ["Pollen transfer is less reliable", "Fewer insects visit the flower", "The flower must produce more colour", "The nectar is taken without pollination"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida aralash chang olib yurgan ari changni kamroq foydali joyga yetkazishi aytilgan. Qolgan variantlar: B) Matnda aksincha, kengroq doiradagi hasharot kelishi aytilgan; C) Rang ishlab chiqarish haqida matnda gap yo'q; D) Nektar o'g'irlanishi haqida matnda hech narsa yozilmagan.", "why": {"A": "Uchinchi xatboshida aralash chang olib yurgan ari changni kamroq foydali joyga yetkazishi aytilgan.", "B": "Matnda aksincha, kengroq doiradagi hasharot kelishi aytilgan.", "C": "Rang ishlab chiqarish haqida matnda gap yo'q.", "D": "Nektar o'g'irlanishi haqida matnda hech narsa yozilmagan."}}, {"no": 28, "pts": "2.6", "head": "What does the text say about the early hospital wards?", "text": "", "opts": ["They were divided by the cost of treatment", "They were built without windows for warmth", "They were copied from military barracks", "They were designed around the movement of air"], "ans": "D", "expl": "To'g'ri javob - D) Birinchi xatboshida ular havo harakati atrofida loyihalangani aytilgan. Qolgan variantlar: A) To'lov haqida matnda hech narsa yozilmagan; B) Deraza haqida matnda aksincha aytilgan; C) Kazarma haqida matnda gap yo'q.", "why": {"A": "To'lov haqida matnda hech narsa yozilmagan.", "B": "Deraza haqida matnda aksincha aytilgan.", "C": "Kazarma haqida matnda gap yo'q.", "D": "Birinchi xatboshida ular havo harakati atrofida loyihalangani aytilgan."}, "block": ["Read the text and answer questions 28-30.", "The long open ward with windows down both sides was not an accident of architecture. It was designed around a theory: that disease spread through foul air, and that a current of fresh air moving steadily across the beds would carry it away. The theory was wrong in its mechanism and remarkably useful in its effects.", "Ventilation does reduce transmission of airborne infection, and daylight has measurable effects on recovery. Wards built on a mistaken principle therefore performed well, and the principle survived long after the germ theory had replaced it. Several features of modern design can be traced to it.", "The episode is often cited in discussions of how medicine changes. A correct explanation is not always what produces a correct practice, and a practice that works may be defended for the wrong reason for decades. Historians warn against assuming that the two advance together."]}, {"no": 29, "pts": "2.6", "head": "Why did wards built on a mistaken principle perform well?", "text": "", "opts": ["The theory was later shown to be correct", "The wards were smaller than modern ones", "Patients were selected more carefully then", "Ventilation and daylight have real effects"], "ans": "D", "expl": "To'g'ri javob - D) Ikkinchi xatboshida shamollatish va kunduzgi yorug'lik haqiqatan ta'sir qilishi aytilgan. Qolgan variantlar: A) Matnda nazariya noto'g'ri bo'lgani ta'kidlangan; B) O'lcham haqida matnda gap yo'q; C) Bemor tanlash haqida matnda hech narsa yozilmagan.", "why": {"A": "Matnda nazariya noto'g'ri bo'lgani ta'kidlangan.", "B": "O'lcham haqida matnda gap yo'q.", "C": "Bemor tanlash haqida matnda hech narsa yozilmagan.", "D": "Ikkinchi xatboshida shamollatish va kunduzgi yorug'lik haqiqatan ta'sir qilishi aytilgan."}}, {"no": 30, "pts": "2.6", "head": "What do historians warn against?", "text": "", "opts": ["Relying on evidence from a single hospital", "Assuming explanation and practice advance together", "Changing a practice before the theory is settled", "Treating old buildings as models for new ones"], "ans": "B", "expl": "To'g'ri javob - B) Uchinchi xatboshida tushuntirish va amaliyot birga rivojlanadi deb o'ylashdan ogohlantirilgan. Qolgan variantlar: A) Bitta shifoxona haqida matnda gap yo'q; C) O'zgartirish tartibi haqida matnda hech narsa yozilmagan; D) Eski binolar haqida matnda ma'lumot berilmagan.", "why": {"A": "Bitta shifoxona haqida matnda gap yo'q.", "B": "Uchinchi xatboshida tushuntirish va amaliyot birga rivojlanadi deb o'ylashdan ogohlantirilgan.", "C": "O'zgartirish tartibi haqida matnda hech narsa yozilmagan.", "D": "Eski binolar haqida matnda ma'lumot berilmagan."}}]}, {"variant": 14, "label": "11-sinf", "sub": "6-mock", "items": [{"no": 1, "pts": "0.9", "head": "Fill in the gaps with correct answer.", "text": "Under no circumstances ____ the seal ____ without written authority.", "opts": ["may / break", "can / breaking", "may / be broken", "is / broken"], "ans": "C", "expl": "To'g'ri javob - C) 'Under no circumstances' bilan boshlangan gapda modal fe'l egadan oldinga chiqadi va majhul nisbat 'be broken' bo'ladi. Qolgan variantlar: A) 'Break' aktiv shakl bo'lib, muhrning o'zi biror narsani sindiradi degan ma'no chiqadi; B) Modal fe'ldan keyin '-ing' shakli kelmaydi; D) 'Is' bilan teskari tartib buzilib, ruxsat ma'nosi ham yo'qoladi.", "why": {"A": "'Break' aktiv shakl bo'lib, muhrning o'zi biror narsani sindiradi degan ma'no chiqadi.", "B": "Modal fe'ldan keyin '-ing' shakli kelmaydi.", "C": "'Under no circumstances' bilan boshlangan gapda modal fe'l egadan oldinga chiqadi va majhul nisbat 'be broken' bo'ladi.", "D": "'Is' bilan teskari tartib buzilib, ruxsat ma'nosi ham yo'qoladi."}}, {"no": 2, "pts": "0.9", "head": "Choose the correct answer.", "text": "The archive ____ by the time the first researchers ____ access to it.", "opts": ["had been catalogued / were granted", "was catalogued / were granted", "has been catalogued / were granted", "had catalogued / had been granted"], "ans": "A", "expl": "To'g'ri javob - A) Avvalgi ish past perfect majhul 'had been catalogued', keyingisi past simple majhul 'were granted' bo'ladi. Qolgan variantlar: B) Oddiy o'tgan zamon ikki ishning qaysi biri oldin bo'lganini ko'rsatmaydi; C) Present perfect o'tgan zamon hikoyasi ichida ishlatilmaydi; D) Birinchi fe'l aktiv berilgan, arxivning o'zi ro'yxat tuzgan degan ma'no chiqadi.", "why": {"A": "Avvalgi ish past perfect majhul 'had been catalogued', keyingisi past simple majhul 'were granted' bo'ladi.", "B": "Oddiy o'tgan zamon ikki ishning qaysi biri oldin bo'lganini ko'rsatmaydi.", "C": "Present perfect o'tgan zamon hikoyasi ichida ishlatilmaydi.", "D": "Birinchi fe'l aktiv berilgan, arxivning o'zi ro'yxat tuzgan degan ma'no chiqadi."}}, {"no": 3, "pts": "0.9", "head": "Choose the correct answer.", "text": "____ its many merits, the plan says nothing about the cost of upkeep.", "opts": ["Although", "Due to", "For all", "Thus"], "ans": "C", "expl": "To'g'ri javob - C) 'For all' ot birikmasi bilan keladi va qarama-qarshilikni bildiradi. Qolgan variantlar: A) 'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi; B) 'Due to' sababni bildiradi va gap mantiqini teskari qiladi; D) 'Thus' natijani bildiruvchi ravish bo'lib, bunday bog'lanishni bermaydi.", "why": {"A": "'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.", "B": "'Due to' sababni bildiradi va gap mantiqini teskari qiladi.", "C": "'For all' ot birikmasi bilan keladi va qarama- re the machine is started.\" What is the main message?", "text": "", "opts": ["The machine is started only by trained staff", "The guards are checked once a week", "The machine must not be used today", "Fit the guards first, then start the machine"], "ans": "D", "expl": "To'g'ri javob - D) Belgida mashinani ishga tushirishdan avval himoya qalqonlarini o'rnatish talab qilinmoqda. Qolgan variantlar: A) Xodimlarning tayyorgarligi haqida belgida hech narsa yozilmagan; B) Haftalik tekshiruv haqida belgida gap yo'q; C) Bugungi taqiq haqida belgida ma'lumot berilmagan.", "why": {"A": "Xodimlarning tayyorgarligi haqida belgida hech narsa yozilmagan.", "B": "Haftalik tekshiruv haqida belgida gap yo'q.", "C": "Bugungi taqiq haqida belgida ma'lumot berilmagan.", "D": "Belgida mashinani ishga tushirishdan avval himoya qalqonlarini o'rnatish talab qilinmoqda."}}, {"no": 24, "pts": "2.6", "head": "You hear a manager say: \"Let us take that up at the next meeting.\" What does this mean?", "text": "", "opts": ["The matter has already been settled", "The matter will be decided by one person", "The matter is not worth discussing", "The matter will be discussed later"], "ans": "D", "expl": "To'g'ri javob - D) 'Take up' iborasi masalani keyingi yig'ilishda muhokama qilishni bildiradi. Qolgan variantlar: A) Hal bo'lgani haqida gapda hech narsa aytilmagan; B) Yakka qaror haqida ibora gapirmaydi; C) Ahamiyatsizlik haqida gapda bunday ma'no yo'q.", "why": {"A": "Hal bo'lgani haqida gapda hech narsa aytilmagan.", "B": "Yakka qaror haqida ibora gapirmaydi.", "C": "Ahamiyatsizlik haqida gapda bunday ma'no yo'q.", "D": "'Take up' iborasi masalani keyingi yig'ilishda muhokama qilishni bildiradi."}}, {"no": 25, "pts": "2.6", "head": "What does the text say about seeds carried by wind?", "text": "", "opts": ["Their shape slows the fall and lengthens the journey", "They are heavier than seeds carried by water", "They are produced only by trees in open ground", "They germinate sooner than other kinds of seed"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida shakl tushishni sekinlashtirib, yo'lni uzaytirishi aytilgan. Qolgan variantlar: B) Og'irlik haqida matnda bunday taqqoslash keltirilmagan; C) Daraxtlar haqida matnda bunday da'vo yo'q; D) Unib chiqish vaqti haqida matnda gap yo'q.", "why": {"A": "Birinchi xatboshida shakl tushishni sekinlashtirib, yo'lni uzaytirishi aytilgan.", "B": "Og'irlik haqida matnda bunday taqqoslash keltirilmagan.", "C": "Daraxtlar haqida matnda bunday da'vo yo'q.", "D": "Unib chiqish vaqti haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 25-27.", "A plant cannot move, so its seeds must travel in its place. The simplest mechanism is wind, and the adaptations are immediately visible. A sycamore seed carries a stiff wing that makes it rotate as it descends, and the rotation slows the fall considerably. A few additional seconds in the air can represent a hundred extra metres on the ground.", "Water transports seeds further but far less predictably. A coconut floats for weeks and arrives in good condition. Yet most of what a river carries is deposited within a short distance of the parent plant. The mechanism suits species established along coasts and riverbanks, where a single long journey now and then is sufficient.", "The most expensive mechanism is also the most reliable. A fleshy fruit is costly for the plant to construct. An animal that consumes it, however, deposits the seed in an entirely new location, surrounded by a little fertiliser. Plants that depend on animals generally produce fewer seeds, since each one has a considerably better chance of taking root."]}, {"no": 26, "pts": "2.6", "head": "What does the text say about seeds carried by water?", "text": "", "opts": ["They travel further than seeds eaten by animals", "They arrive in poor condition after weeks afloat", "They are found only on small islands", "Most are left close to the parent plant"], "ans": "D", "expl": "To'g'ri javob - D) Ikkinchi xatboshida daryo olib ketgan urug'lar asosan ona o'simlik yaqinida qolishi aytilgan. Qolgan variantlar: A) Hayvonlar bilan taqqoslash bu xatboshida berilmagan; B) Matnda aksincha, kokos yaxshi holatda yetib borishi aytilgan; C) Orollar haqida matnda hech narsa yozilmagan.", "why": {"A": "Hayvonlar bilan taqqoslash bu xatboshida berilmagan.", "B": "Matnda aksincha, kokos yaxshi holatda yetib borishi aytilgan.", "C": "Orollar haqida matnda hech narsa yozilmagan.", "D": "Ikkinchi xatboshida daryo olib ketgan urug'lar asosan ona o'simlik yaqinida qolishi aytilgan."}}, {"no": 27, "pts": "2.6", "head": "Why do plants that use animals produce fewer seeds?", "text": "", "opts": ["Each seed has a better chance of taking root", "The fruit takes a long time to ripen", "Animals eat only a small part of the crop", "The seeds cannot survive in dry soil"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida har bir urug'ning ildiz otish ehtimoli yuqoriroq bo'lishi sabab qilib ko'rsatilgan. Qolgan variantlar: B) Pishish muddati haqida matnda gap yo'q; C) Hosilning qancha qismi yeyilishi haqida matnda ma'lumot berilmagan; D) Quruq tuproq haqida matnda hech narsa aytilmagan.", "why": {"A": "Uchinchi xatboshida har bir urug'ning ildiz otish ehtimoli yuqoriroq bo'lishi sabab qilib ko'rsatilgan.", "B": "Pishish muddati haqida matnda gap yo'q.", "C": "Hosilning qancha qismi yeyilishi haqida matnda ma'lumot berilmagan.", "D": "Quruq tuproq haqida matnda hech narsa aytilmagan."}}, {"no": 28, "pts": "2.6", "head": "Why did local time become a problem in the nineteenth century?", "text": "", "opts": ["Clocks had become too expensive for most towns", "The railways needed one timetable across many towns", "The sun was no longer used to set the time", "Each town had chosen the same hour for noon"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi xatboshida temir yo'l ko'p shaharlar uchun yagona jadval talab qilgani aytilgan. Qolgan variantlar: A) Soat narxi haqida matnda hech narsa yozilmagan; C) Matnda aksincha, vaqt quyoshga qarab belgilangani aytilgan; D) Matnda har bir shaharda peshin boshqa paytda bo'lgani ko'rsatilgan.", "why": {"A": "Soat narxi haqida matnda hech narsa yozilmagan.", "B": "Birinchi xatboshida temir yo'l ko'p shaharlar uchun yagona jadval talab qilgani aytilgan.", "C": "Matnda aksincha, vaqt quyoshga qarab belgilangani aytilgan.", "D": "Matnda har bir shaharda peshin boshqa paytda bo'lgani ko'rsatilgan."}, "block": ["Read the text and answer questions 28-30.", "For most of history every town maintained its own time, established by the sun at noon. The discrepancy between two towns an hour apart on foot was a minute or two, and nobody objected. The railway transformed that situation. A train departing from one town and arriving in another required a timetable that both places could read. A discrepancy of a minute or two had suddenly become a collision risk.", "Railway companies therefore imposed a single time along their lines, taken from the capital. For a period two times operated side by side: the station clock and the municipal clock, occasionally on the same square, a few minutes apart. Travellers learned to enquire which one a particular notice intended.", "National time followed, and then the zones that divide the world today. The sequence deserves attention. The standard was not agreed by astronomers and then applied. It was imposed on the public by a technology, accepted because it was convenient, and only afterwards given a scientific foundation."]}, {"no": 29, "pts": "2.6", "head": "What happened for a while in some towns?", "text": "", "opts": ["Two different times were shown at once", "Station clocks were removed from the square", "Trains ran without any timetable", "Town councils refused to build stations"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida bir maydonda stansiya va shahar soatlari turli vaqtni ko'rsatgani aytilgan. Qolgan variantlar: B) Soatlarni olib tashlash haqida matnda gap yo'q; C) Jadvalsiz qatnov haqida matnda hech narsa yozilmagan; D) Kengashlarning rad etishi haqida matnda ma'lumot berilmagan.", "why": {"A": "Ikkinchi xatboshida bir maydonda stansiya va shahar soatlari turli vaqtni ko'rsatgani aytilgan.", "B": "Soatlarni olib tashlash haqida matnda gap yo'q.", "C": "Jadvalsiz qatnov haqida matnda hech narsa yozilmagan.", "D": "Kengashlarning rad etishi haqida matnda ma'lumot berilmagan."}}, {"no": 30, "pts": "2.6", "head": "What point does the writer make about the standard?", "text": "", "opts": ["Astronomers opposed it from the beginning", "It was adopted in every country at the same time", "Convenience came before the scientific case for it", "It has been revised several times since"], "ans": "C", "expl": "To'g'ri javob - C) Uchinchi xatboshida standart qulaylik uchun qabul qilinib, ilmiy asos keyin berilgani aytilgan. Qolgan variantlar: A) Astronomlarning qarshiligi haqida matnda hech narsa yozilmagan; B) Bir vaqtda qabul qilinish haqida matnda bunday da'vo yo'q; D) Keyingi o'zgartirishlar haqida matnda gap yo'q.", "why": {"A": "Astronomlarning qarshiligi haqida matnda hech narsa yozilmagan.", "B": "Bir vaqtda qabul qilinish haqida matnda bunday da'vo yo'q.", "C": "Uchinchi xatboshida standart qulaylik uchun qabul qilinib, ilmiy asos keyin berilgani aytilgan.", "D": "Keyingi o'zgartirishlar haqida matnda gap yo'q."}}]}, {"variant": 15, "label": "11-sinf", "sub": "7-mock", "items": [{"no": 1, "pts": "0.9", "head": "Fill in the gaps with correct answer.", "text": "So complete ____ the failure of the device that the trial ____ abandoned.", "opts": ["did / was", "was / was", "had / been", "were / was"], "ans": "B", "expl": "To'g'ri javob - B) 'So + sifat' bilan boshlangan gapda 'was' egadan oldinga chiqadi, keyin 'that' bo'lagi keladi. Qolgan variantlar: A) 'Did' bu qurilishda yordamchi fe'l bo'la olmaydi; C) 'Had been' bu qurilishga mos kelmaydi; D) 'Were' birlikdagi ega bilan moslashmaydi.", "why": {"A": "'Did' bu qurilishd qurilishida ot kerak, 'simplicity' esa standart ot shaklidir.", "B": "'Simple' sifat bo'lib, 'the ... of' qurilishida ot talab qilinadi.", "C": "'Simply' ravish bo'lib, fe'lni izohlaydi.", "D": "Bunday shakl ingliz tilida deyarli ishlatilmaydi."}}, {"no": 17, "pts": "1.5", "head": "Choose the correct answer.", "text": "The company was accused ____ withholding the results of the second trial.", "opts": ["for", "on", "with", "of"], "ans": "D", "expl": "To'g'ri javob - D) 'Accuse of' barqaror birikma bo'lib, ayblovning mazmunini ko'rsatadi. Qolgan variantlar: A) 'For' bu fe'l bilan kelmaydi, u 'blame' bilan ishlatiladi; B) 'On' predlogi ayblov bildiruvchi bu fe'l bilan mos kelmaydi; C) 'With' ayblov bildiruvchi bu fe'l bilan ishlatilmaydi.", "why": {"A": "'For' bu fe'l bilan kelmaydi, u 'blame' bilan ishlatiladi.", "B": "'On' predlogi ayblov bildiruvchi bu fe'l bilan mos kelmaydi.", "C": "'With' ayblov bildiruvchi bu fe'l bilan ishlatilmaydi.", "D": "'Accuse of' barqaror birikma bo'lib, ayblovning mazmunini ko'rsatadi."}}, {"no": 18, "pts": "1.5", "head": "Find the definition of the underlined word.", "text": "The terms of the new licence are unusually ~stringent~.", "opts": ["renewed every single year", "strict and difficult to meet", "written in plain language", "the same for every applicant"], "ans": "B", "expl": "To'g'ri javob - B) 'Stringent' qattiq va bajarish qiyin degani. Qolgan variantlar: A) Yillik yangilanish bu so'zning ma'nosi emas; C) Sodda tilda yozilganlik boshqa masala; D) Hamma uchun bir xillik haqidagi ta'rif mos kelmaydi.", "why": {"A": "Yillik yangilanish bu so'zning ma'nosi emas.", "B": "'Stringent' qattiq va bajarish qiyin degani.", "C": "Sodda tilda yozilganlik boshqa masala.", "D": "Hamma uchun bir xillik haqidagi ta'rif mos kelmaydi."}}, {"no": 19, "pts": "1.5", "head": "Choose the correct answer.", "text": "A precedent is:", "opts": ["a formal warning issued before a penalty", "the opening section of a legal document", "a person who speaks on behalf of another", "an earlier case used as a guide for later ones"], "ans": "D", "expl": "To'g'ri javob - D) 'Precedent' keyingi holatlar uchun namuna bo'ladigan oldingi holat degani. Qolgan variantlar: A) Rasmiy ogohlantirish 'warning' deb ataladi; B) Hujjatning kirish qismi 'preamble' deyiladi; C) Boshqa nomidan gapiruvchi 'representative' deb ataladi.", "why": {"A": "Rasmiy ogohlantirish 'warning' deb ataladi.", "B": "Hujjatning kirish qismi 'preamble' deyiladi.", "C": "Boshqa nomidan gapiruvchi 'representative' deb ataladi.", "D": "'Precedent' keyingi holatlar uchun namuna bo'ladigan oldingi holat degani."}}, {"no": 20, "pts": "1.5", "head": "Which word has a negative meaning?", "text": "", "opts": ["stingy", "frugal", "economical", "prudent"], "ans": "A", "expl": "To'g'ri javob - A) 'Stingy' qizg'anchiq degani bo'lib, tanqidiy ma'noga ega. Qolgan variantlar: B) 'Frugal' tejamkor degani va ijobiy baho beradi; C) 'Economical' pulni oqilona sarflaydigan degani, bu ham ijobiy so'z; D) 'Prudent' ehtiyotkor degani va hurmat ma'nosini beradi.", "why": {"A": "'Stingy' qizg'anchiq degani bo'lib, tanqidiy ma'noga ega.", "B": "'Frugal' tejamkor degani va ijobiy baho beradi.", "C": "'Economical' pulni oqilona sarflaydigan degani, bu ham ijobiy so'z.", "D": "'Prudent' ehtiyotkor degani va hurmat ma'nosini beradi."}}, {"no": 21, "pts": "2.6", "head": "What is the purpose of this notice?", "text": "", "opts": ["To announce that the workshop has been cancelled", "To report how many places were taken last term", "To explain how a place in the workshop is obtained", "To ask members to suggest new workshop topics"], "ans": "C", "expl": "To'g'ri javob - C) E'londa ro'yxatga yozilish, navbat va bo'sh joy tartibi tushuntirilgan. Qolgan variantlar: A) Bekor qilinishi haqida e'londa hech narsa aytilmagan; B) Egallangan joylar soni haqida e'londa gap yo'q; D) Mavzu taklif qilish haqida e'londa ma'lumot berilmagan.", "why": {"A": "Bekor qilinishi haqida e'londa hech narsa aytilmagan.", "B": "Egallangan joylar soni haqida e'londa gap yo'q.", "C": "E'londa ro'yxatga yozilish, navbat va bo'sh joy tartibi tushuntirilgan.", "D": "Mavzu taklif qilish haqida e'londa ma'lumot berilmagan."}, "block": ["Read the text and answer questions 21-22.", "WORKSHOP PLACES", "Places are limited to twelve and are given in the order the forms are received. A member not offered a place is added to a waiting list. The position on that list is stated in the reply. A place that is not confirmed by the Friday before the session is passed to the first name on that list."]}, {"no": 22, "pts": "2.6", "head": "What happens to an unconfirmed place?", "text": "", "opts": ["It is given to the first person on the waiting list", "It is held until the morning of the session", "It is offered again to the same member", "It is removed and the group meets with eleven"], "ans": "A", "expl": "To'g'ri javob - A) E'londa tasdiqlanmagan joy navbatdagi birinchi kishiga berilishi aytilgan. Qolgan variantlar: B) Mashg'ulot kuni haqida e'londa bunday ma'lumot yo'q; C) Qayta taklif qilish haqida e'londa hech narsa yozilmagan; D) Guruh soni haqida e'londa bunday izoh berilmagan.", "why": {"A": "E'londa tasdiqlanmagan joy navbatdagi birinchi kishiga berilishi aytilgan.", "B": "Mashg'ulot kuni haqida e'londa bunday ma'lumot yo'q.", "C": "Qayta taklif qilish haqida e'londa hech narsa yozilmagan.", "D": "Guruh soni haqida e'londa bunday izoh berilmagan."}}, {"no": 23, "pts": "2.6", "head": "You see this sign in a laboratory: \"Samples left unlabelled will be disposed of.\" What is the main message?", "text": "", "opts": ["Label your samples or they will be thrown away", "Samples are collected for disposal every week", "Only labelled samples may be brought in", "The laboratory is closed for cleaning"], "ans": "A", "expl": "To'g'ri javob - A) Belgida yorliqsiz namunalar yo'q qilinishi ogohlantirilmoqda. Qolgan variantlar: B) Haftalik yig'ish haqida belgida hech narsa yozilmagan; C) Olib kirish taqiqi haqida belgida gap yo'q; D) Yopilish haqida belgida ma'lumot berilmagan.", "why": {"A": "Belgida yorliqsiz namunalar yo'q qilinishi ogohlantirilmoqda.", "B": "Haftalik yig'ish haqida belgida hech narsa yozilmagan.", "C": "Olib kirish taqiqi haqida belgida gap yo'q.", "D": "Yopilish haqida belgida ma'lumot berilmagan."}}, {"no": 24, "pts": "2.6", "head": "You hear a colleague say: \"I would not read too much into one result.\" What does this mean?", "text": "", "opts": ["A single result should not be given great weight", "The result was difficult to understand", "The result should be read again carefully", "The result confirms what was expected"], "ans": "A", "expl": "To'g'ri javob - A) Bu ibora bitta natijaga ortiqcha ahamiyat bermaslikni bildiradi. Qolgan variantlar: B) Tushunish qiyinligi haqida ibora gapirmaydi; C) Qayta o'qish haqida gapda hech narsa aytilmagan; D) Tasdiqlanish haqida iborada bunday ma'no yo'q.", "why": {"A": "Bu ibora bitta natijaga ortiqcha ahamiyat bermaslikni bildiradi.", "B": "Tushunish qiyinligi haqida ibora gapirmaydi.", "C": "Qayta o'qish haqida gapda hech narsa aytilmagan.", "D": "Tasdiqlanish haqida iborada bunday ma'no yo'q."}}, {"no": 25, "pts": "2.6", "head": "Why can a castle be built from damp sand?", "text": "", "opts": ["Wet grains are heavier than dry ones", "Water fills every space between the grains", "Damp sand contains more salt than dry sand", "Thin films of water hold the grains together"], "ans": "D", "expl": "To'g'ri javob - D) Birinchi xatboshida yupqa suv pardalari donalarni bir-biriga tortib turishi aytilgan. Qolgan variantlar: A) Og'irlik haqida matnda bunday izoh berilmagan; B) Bo'shliqlar butunlay to'lib ketganda aksincha, qum shaklini yo'qotishi aytilgan; C) Tuz haqida matnda hech narsa yozilmagan.", "why": {"A": "Og'irlik haqida matnda bunday izoh berilmagan.", "B": "Bo'shliqlar butunlay to'lib ketganda aksincha, qum shaklini yo'qotishi aytilgan.", "C": "Tuz haqida matnda hech narsa yozilmagan.", "D": "Birinchi xatboshida yupqa suv pardalari donalarni bir-biriga tortib turishi aytilgan."}, "block": ["Read the text and answer questions 25-27.", "Dry sand runs through the fingers and maintains no shape whatever. Introduce a little water and the identical sand can be constructed into a castle. The explanation involves capillary action rather than adhesion. A microscopic film of water forms a bridge at every point where two grains make contact, and each bridge consequently pulls the grains together.", "The effect has a limit, and the limit is easily exceeded. Excessive water fills the spaces between the grains completely. The bridges effectively disappear, and the sand flows again as a thick liquid. The best material on a beach lies slightly above the waterline, where the sand is damp but not saturated.", "Engineers encounter the identical problem on a considerably larger scale. A slope of damp soil can stand for years and then slide in a single afternoon of heavy rain. The mechanism is precisely the one that collapses a sandcastle in the rising tide. Much of the work of a site survey is an estimate of how much water the ground can tolerate."]}, {"no": 26, "pts": "2.6", "head": "What happens when too much water is added?", "text": "", "opts": ["The grains become too heavy to move", "The water bridges disappear and the sand flows", "The sand sets hard and cannot be shaped", "The surface tension increases sharply"], "ans": "B", "expl": "To'g'ri javob - B) Ikkinchi xatboshida ortiqcha suv ko'priklarni yo'q qilib, qum suyuqlik kabi oqishi aytilgan. Qolgan variantlar: A) Og'irlik haqida bu xatboshida gap yo'q; C) Qotib qolish haqida matnda hech narsa yozilmagan; D) Matnda aksincha, sirt tarangligining ta'siri yo'qolishi aytilgan.", "why": {"A": "Og'irlik haqida bu xatboshida gap yo'q.", "B": "Ikkinchi xatboshida ortiqcha suv ko'priklarni yo'q qilib, qum suyuqlik kabi oqishi aytilgan.", "C": "Qotib qolish haqida matnda hech narsa yozilmagan.", "D": "Matnda aksincha, sirt tarangligining ta'siri yo'qolishi aytilgan."}}, {"no": 27, "pts": "2.6", "head": "Why is a site survey largely about water?", "text": "", "opts": ["A slope can slide when the ground takes too much of it", "Water is the most expensive part of building work", "Soil cannot be measured when it is dry", "Rain makes the survey itself difficult to carry out"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida yonbag'ir ko'p suv olganda siljib ketishi aytilgan. Qolgan variantlar: B) Narx haqida matnda hech narsa yozilmagan; C) O'lchash haqida matnda bunday da'vo yo'q; D) Tekshiruv o'tkazish qiyinligi haqida matnda gap yo'q.", "why": {"A": "Uchinchi xatboshida yonbag'ir ko'p suv olganda siljib ketishi aytilgan.", "B": "Narx haqida matnda hech narsa yozilmagan.", "C": "O'lchash haqida matnda bunday da'vo yo'q.", "D": "Tekshiruv o'tkazish qiyinligi haqida matnda gap yo'q."}}, {"no": 28, "pts": "2.6", "head": "What were the first public museums like?", "text": "", "opts": ["Arranged by subject with long printed labels", "Open only to members of learned societies", "Crowded with objects and with little explanation", "Built to hold a single large collection"], "ans": "C", "expl": "To'g'ri javob - C) Birinchi xatboshida ashyolar zich joylashtirilib, izoh deyarli berilmagani aytilgan. Qolgan variantlar: A) Mavzu bo'yicha tartib haqida matnda aksincha aytilgan; B) A'zolar haqida matnda bunday cheklov ko'rsatilmagan; D) Bitta to'plam haqida matnda hech narsa yozilmagan.", "why": {"A": "Mavzu bo'yicha tartib haqida matnda aksincha aytilgan.", "B": "A'zolar haqida matnda bunday cheklov ko'rsatilmagan.", "C": "Birinchi xatboshida ashyolar zich joylashtirilib, izoh deyarli berilmagani aytilgan.", "D": "Bitta to'plam haqida matnda hech narsa yozilmagan."}, "block": ["Read the text and answer questions 28-30.", "The first museums accessible to the public resembled ours hardly at all. Cases were packed from floor to ceiling and specimens stood three deep. The labels, where they existed at all, supplied nothing but a name and a donor. The visitor was expected to admire the accumulation rather than to understand it.", "The transformation came with a change of audience. Once schools began sending classes, a case packed with shells was no longer sufficient. Curators had to determine what a particular room was about. Specimens were removed from display, groups were given a theme, and the space surrounding an object became as important as the object itself.", "Something was nevertheless lost in the process. A modern gallery tells a clear story, but essentially a single story, selected for the visitor by somebody else. The old crowded arrangement advanced no argument and left the viewer entirely free to draw comparisons that no curator had anticipated. A few museums now preserve one such room intentionally."]}, {"no": 29, "pts": "2.6", "head": "What forced curators to change their displays?", "text": "", "opts": ["Collections grew too large for the cases", "Donors asked for better labels", "School classes began to visit", "New buildings had less space"], "ans": "C", "expl": "To'g'ri javob - C) Ikkinchi xatboshida maktab sinflari kela boshlagani sabab qilib ko'rsatilgan. Qolgan variantlar: A) To'plam hajmi haqida matnda bunday izoh berilmagan; B) Xayriyachilar haqida matnda hech narsa yozilmagan; D) Bino maydoni haqida matnda gap yo'q.", "why": {"A": "To'plam hajmi haqida matnda bunday izoh berilmagan.", "B": "Xayriyachilar haqida matnda hech narsa yozilmagan.", "C": "Ikkinchi xatboshida maktab sinflari kela boshlagani sabab qilib ko'rsatilgan.", "D": "Bino maydoni haqida matnda gap yo'q."}}, {"no": 30, "pts": "2.6", "head": "What does the writer say was lost?", "text": "", "opts": ["The chance to see objects of real value", "The record of who had given each object", "The quiet in which a visitor could think", "The freedom to make unplanned comparisons"], "ans": "D", "expl": "To'g'ri javob - D) Uchinchi xatboshida eski vitrinalar tomoshabinni erkin taqqoslashg const TITLE = "Yopiq guruh: 2026 spetsifikatsiyasi bo'yicha mock testlar";
const SUBTITLE = "9, 10 va 11-sinf uchun beshtadan mock test (3-7). Har bir savol spetsifikatsiyadagi o'z bandiga biriktirilgan. Faqat yopiq guruh uchun.";
const AUTHOR = {name:'Nafisa Ortiqova', tg:'@english_worksheets_more'};
const LET = ['A','B','C','D'];
const SECT = n => n<=10 ? 'Grammar' : n<=20 ? 'Vocabulary' : 'Reading';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark = s => esc(s).replace(/~([^~]+)~/g, '<u>$1</u>');
const fmt = ms => { const t=Math.max(0,Math.round(ms/1000));
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const ball = p => p.replace('.', ',') + ' ball';

function passages(items){
  const map = {};
  for (const q of items){
    if (!q.block) continue;
    const m = /questions (\d+)-(\d+)/.exec(q.block[0]);
    if (!m) continue;
    for (let n=+m[1]; n<=+m[2]; n++) map[n] = q.block;
  }
  return map;
}
const VAR = {};
for (const d of DATA) VAR[d.variant] = {items:d.items, pass:passages(d.items), label:d.label, sub:d.sub};

const KEY = (v,m) => 'olimp26:'+v+':'+m;
function save(){ if(!S||S.done) return;
  try{ localStorage.setItem(KEY(S.v,S.mode), JSON.stringify(
    {a:S.ans, i:S.i, left:S.mode==='exam' ? S.deadline-Date.now() : null})); }catch(e){} }
function load(v,m){ try{ const r=localStorage.getItem(KEY(v,m)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clear(v,m){ try{ localStorage.removeItem(KEY(v,m)); }catch(e){} }

let S = null, MODE = 'exam', tick = null;
const startEl = document.getElementById('start');
const examEl = document.getElementById('exam');

function renderStart(resumeFor){
  const vs = Object.keys(VAR).map(Number).sort((a,b)=>a-b);
  startEl.innerHTML = `
  <div class="hero">
    <img class="logo" src="${LOGO}" alt="English_worksheets_more kanali logotipi">
    <div>
      <div class="eyebrow">2026-yil spetsifikatsiyasi</div>
      <h1>${TITLE}</h1>
      <p class="sub">${SUBTITLE}</p>
      <div class="specs">
        <span class="spec"><b>15</b> mock test</span>
        <span class="spec"><b>30</b> savol</span>
        <span class="spec"><b>50</b> ball</span>
        <span class="spec"><b>60</b> daqiqa</span>
        <span class="spec">1&ndash;10: <b>0,9</b></span>
        <span class="spec">11&ndash;20: <b>1,5</b></span>
        <span class="spec">21&ndash;30: <b>2,6</b></span>
      </div>
      <div class="chan">Muallif: <b>${AUTHOR.name}</b> &nbsp;&middot;&nbsp; Telegram: <b>${AUTHOR.tg}</b></div>
    </div>
  </div>

  <div class="block">
    <div class="eyebrow">Rejim</div>
    <div class="modes">
      <button class="mode" data-mode="exam" aria-pressed="${MODE==='exam'}">
        <span class="dot"></span>
        <span><h3>Imtihon</h3><span class="d">60 daqiqa sanaydi. Javoblar va izohlar test tugagach ochiladi.</span></span>
      </button>
      <button class="mode" data-mode="practice" aria-pressed="${MODE==='practice'}">
        <span class="dot"></span>
        <span><h3>Mashq</h3><span class="d">Vaqt chegarasi yo&lsquo;q. Har bir javobdan keyin izoh darhol chiqadi.</span></span>
      </button>
    </div>
  </div>

  ${resumeFor ? `
  <div class="block"><div class="panel">
      <p><b>${resumeFor.v}-variant</b> yarim yo&lsquo;lda qolgan &mdash;
         ${Object.keys(resumeFor.saved.a||{}).length} ta savolga javob berilgan.</p>
      <button class="btn btn-primary" id="doResume">Davom ettirish</button>
      <button class="btn" id="doRestart">Boshidan boshlash</button>
      <button class="btn" id="doCancel">Bekor qilish</button>
  </div></div>` : ''}

  <div class="block">
    <div class="eyebrow">Variantni tanlang</div>
    <div class="vgrid">
      ${vs.map(v=>{ const sv = load(v, MODE);
        const L = VAR[v].label, S = VAR[v].sub;
        return `<button class="vcard" data-v="${v}">
          ${sv?'<span class="resume"></span>':''}
          <b>${L}</b><span>${S}</span></button>`; }).join('')}
    </div>
    <p class="note">Har bir savolda to&lsquo;rt javobning ham izohi beriladi: to&lsquo;g&lsquo;risi nega
       to&lsquo;g&lsquo;ri, qolganlari nega noto&lsquo;g&lsquo;ri. Javoblar shu brauzerda saqlanadi, sahifa
       yopilsa ham o&lsquo;sha joydan davom ettirish mumkin.</p>
    <div><button class="btn" id="rnd">Tasodifiy variant</button></div>
  </div>

  <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  startEl.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; renderStart(null); });
  startEl.querySelectorAll('.vcard').forEach(b=>b.onclick=()=>pick(+b.dataset.v));
  startEl.querySelector('#rnd').onclick = ()=>pick(vs[Math.floor(Math.random()*vs.length)]);
  if (resumeFor){
    startEl.querySelector('#doResume').onclick = ()=>begin(resumeFor.v, resumeFor.saved);
    startEl.querySelector('#doRestart').onclick = ()=>{ clear(resumeFor.v, MODE); begin(resumeFor.v, null); };
    startEl.querySelector('#doCancel').onclick = ()=>renderStart(null);
  }
}
function pick(v){
  const saved = load(v, MODE);
  if (saved && Object.keys(saved.a||{}).length){ renderStart({v, saved}); window.scrollTo(0,0); }
  else begin(v, null);
}

function begin(v, saved){
  S = { v, mode:MODE, items:VAR[v].items, pass:VAR[v].pass,
        ans: saved?.a ? {...saved.a} : {}, i: saved?.i ?? 0, done:false, started: Date.now(),
        deadline: MODE==='exam' ? Date.now() + (saved?.left ?? 60*60*1000) : null };
  startEl.hidden = true; document.getElementById('result').hidden = true; examEl.hidden = false;
  examEl.innerHTML = `
    <div class="bar"><div class="bar-in">
      <img class="mini" src="${LOGO}" alt="">
      <div class="vname">${VAR[v].label} ${VAR[v].sub}<small>${MODE==='exam'?'Imtihon rejimi':'Mashq rejimi'}</small></div>
      <div class="prog"><i id="pbar"></i></div>
      <div class="clock tnum" id="clock">${MODE==='exam'?'60:00':'&nbsp;&mdash;&nbsp;'}</div>
      <button class="icon-btn" id="finish">Yakunlash</button>
    </div></div>
    <div class="cols">
      <div class="qcard" id="qcard"></div>
      <aside class="rail">
        <h3>Savollar</h3>
        <div class="cells" id="cells"></div>
        <div class="railfoot"><span id="cnt"></span><button class="btn" id="quit">Chiqish</button></div>
      </aside>
    </div>`;
  examEl.querySelector('#finish').onclick = finish;
  examEl.querySelector('#quit').onclick = ()=>{ save(); stopClock();
    examEl.hidden=true; startEl.hidden=false; renderStart(null); window.scrollTo(0,0); };
  if (MODE==='exam') startClock();
  draw(); window.scrollTo(0,0);
}
function startClock(){ stopClock();
  tick = setInterval(()=>{
    const left = S.deadline - Date.now();
    const c = document.getElementById('clock'); if(!c) return;
    c.textContent = fmt(left); c.classList.toggle('warn', left < 5*60*1000);
    if (left <= 0) finish();
  }, 250);
}
function stopClock(){ if (tick) clearInterval(tick); tick = null; }

function optionsHtml(q, chosen, reveal){
  return q.opts.map((o,ix)=>{
    const L = LET[ix];
    let cls = '', why = '';
    if (reveal){
      cls = L===q.ans ? ' correct' : (L===chosen ? ' wrong' : '');
      const good = L===q.ans;
      why = `<div class="why ${good?'good':'bad'}"><b>${good?"To'g'ri:":"Noto'g'ri:"}</b> ${esc(q.why[L])}</div>`;
    }
    return `<div class="optwrap"><button class="opt${cls}" data-l="${L}" ${reveal?'disabled':''}
        aria-pressed="${chosen===L}"><span class="letter">${L}</span><span>${mark(o)}</span></button>${why}</div>`;
  }).join('');
}

function draw(){
  const q = S.items[S.i], no = q.no, chosen = S.ans[no];
  const reveal = S.mode==='practice' && !!chosen;
  const p = S.pass[no];
  const card = document.getElementById('qcard');
  card.innerHTML = `
    <div class="qmeta"><span class="qno tnum">${no}</span>
      <span class="pts">${ball(q.pts)}</span><span class="sect">${SECT(no)}</span></div>
    ${p ? `<div class="passage"><div class="plead">${esc(p[0])}</div>
        ${p.slice(1).map(t=>`<p${t===t.toUpperCase()?' class="ptitle"':''}>${mark(t)}</p>`).join('')}</div>` : ''}
    <div class="qhead">${mark(q.head)}</div>
    ${q.text ? `<div class="qtext">${mark(q.text)}</div>` : ''}
    ${reveal ? `<div class="verdict ${chosen===q.ans?'good':'bad'}">${chosen===q.ans
        ? 'Barakalla, javob to’g’ri.'
        : 'Afsus, javob noto’g’ri. To’g’ri javob: '+q.ans+'.'}</div>` : ''}
    <div class="opts" style="margin-top:${reveal?'14px':'0'}">${optionsHtml(q, chosen, reveal)}</div>
    <div class="nav">
      <button class="btn" id="prev" ${S.i===0?'disabled':''}>&larr; Oldingi</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="next">${S.i===29?'Yakunlash':'Keyingi &rarr;'}</button>
    </div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  card.querySelector('#prev').onclick = ()=>go(S.i-1);
  card.querySelector('#next').onclick = ()=> S.i===29 ? finish() : go(S.i+1);
  drawRail();
}
function drawRail(){
  const cells = document.getElementById('cells');
  cells.innerHTML = S.items.map((q,ix)=>{
    const a = S.ans[q.no];
    let cls = 'cell' + (a?' done':'') + (ix===S.i?' cur':'');
    if (S.mode==='practice' && a) cls = 'cell ' + (a===q.ans?'ok':'no') + (ix===S.i?' cur':'');
    return `<button class="${cls}" data-i="${ix}">${q.no}</button>`;
  }).join('');
  cells.querySelectorAll('.cell').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const n = Object.keys(S.ans).length;
  document.getElementById('cnt').textContent = n + ' / 30 javob berildi';
  document.getElementById('pbar').style.width = (n/30*100)+'%';
}
function choose(L){
  const q = S.items[S.i];
  if (S.mode==='practice' && S.ans[q.no]) return;
  S.ans[q.no] = L; save();
  if (S.mode==='practice') draw();
  else { draw(); if (S.i < 29) setTimeout(()=>go(S.i+1), 160); }
}
function go(i){ if (i<0||i>29) return; S.i=i; save(); draw();
  document.getElementById('qcard').scrollIntoView({block:'start', behavior:'auto'}); }

document.addEventListener('keydown', e=>{
  if (!S || S.done || examEl.hidden) return;
  const k = e.key.toUpperCase();
  if (LET.includes(k)) { e.preventDefault(); choose(k); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(S.i+1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); go(S.i-1); }
});

function finish(){
  stopClock(); S.done = true; clear(S.v, S.mode);
  const used = S.mode==='exam' ? (60*60*1000 - Math.max(0, S.deadline - Date.now()))
                               : (Date.now() - S.started);
  let score=0, right=0; const bands={'0.9':0,'1.5':0,'2.6':0};
  for (const q of S.items) if (S.ans[q.no] === q.ans){ score += parseFloat(q.pts); right++; bands[q.pts]++; }
  score = Math.round(score*10)/10;
  const resEl = document.getElementById('result');
  examEl.hidden = true; resEl.hidden = false;
  resEl.innerHTML = `
    <div class="score">
      <div class="big tnum">${String(score).replace('.',',')}<small> / 50</small></div>
      <div class="meta">
        <b>${VAR[S.v].label} ${VAR[S.v].sub} &middot; ${S.mode==='exam'?'imtihon':'mashq'}</b>
        <span>${right} ta to&lsquo;g&lsquo;ri javob (30 tadan)</span>
        <span>Sarflangan vaqt: <span class="tnum">${fmt(used)}</span></span>
      </div>
      <div class="breakdown">
        <div class="bd"><div class="k">Grammar</div><div class="v tnum">${bands['0.9']}/10</div></div>
        <div class="bd"><div class="k">Vocabulary</div><div class="v tnum">${bands['1.5']}/10</div></div>
        <div class="bd"><div class="k">Reading</div><div class="v tnum">${bands['2.6']}/10</div></div>
      </div>
    </div>
    <div class="filters">
      <button class="chip" data-f="wrong" aria-pressed="true">Xatolar (${30-right})</button>
      <button class="chip" data-f="all" aria-pressed="false">Barcha savollar</button>
    </div>
    <div class="rev" id="rev"></div>
    <div class="endbar">
      <button class="btn btn-primary" id="again">Shu variantni qayta ishlash</button>
      <button class="btn" id="home">Boshqa variant tanlash</button>
    </div>
    <footer><b>${AUTHOR.name}</b> &middot; Telegram: <b>${AUTHOR.tg}</b></footer>`;

  let filter = 'wrong';
  const rev = resEl.querySelector('#rev');
  function paint(){
    const list = S.items.filter(q => filter==='all' || S.ans[q.no]!==q.ans);
    rev.innerHTML = list.length ? list.map(q=>{
      const you = S.ans[q.no], ok = you===q.ans;
      return `<div class="rev-item ${ok?'hit':'miss'}">
        <div class="rev-head"><span class="n tnum">${q.no}</span>
          <span class="tag ${ok?'hit':'miss'}">${ok?"to’g’ri":'xato'}</span>
          <span class="sect">${SECT(q.no)} &middot; ${ball(q.pts)}</span></div>
        <div class="rev-q"><span class="h">${mark(q.head)}</span>${q.text?mark(q.text):''}</div>
        <div class="opts">${optionsHtml(q, you, true)}</div>
      </div>`;
    }).join('') : `<div class="rev-item hit"><b>Bu variantda bitta ham xato yo&lsquo;q. Barakalla!</b></div>`;
  }
  paint();
  resEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    filter = c.dataset.f;
    resEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.f===filter)));
    paint();
  });
  resEl.querySelector('#again').onclick = ()=>begin(S.v, null);
  resEl.querySelector('#home').onclick = ()=>{ resEl.hidden=true; startEl.hidden=false;
    renderStart(null); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

window.addEventListener('beforeunload', save);
renderStart(null);
</script>
</body>
</html>
