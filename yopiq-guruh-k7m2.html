sh, muddat, xarajat va tayyorgarlik sharti tushuntirilgan."}, "block": ["Read the text and answer questions 21-22.", "VOLUNTEERING PROGRAMME: CONDITIONS", "Applicants must be eighteen by the date of departure and able to commit to at least six weeks. The programme covers accommodation and food; travel is paid by the volunteer. Two preparation weekends are compulsory, and a place is withdrawn if either is missed. Volunteers work alongside local staff rather than replacing them, and no previous experience is required."]}, {"no": 22, "pts": "2.6", "head": "What happens if a preparation weekend is missed?", "text": "", "opts": ["The volunteer repeats it the following year", "The volunteer pays an additional fee", "The departure date is changed", "The place is withdrawn"], "ans": "D", "expl": "To'g'ri javob - D) E'londa ikkala dam olish kunidan biri qoldirilsa, joy bekor qilinishi aytilgan. Qolgan variantlar: A) Keyingi yil haqida e'londa gap yo'q; B) Qo'shimcha to'lov haqida e'londa hech narsa yozilmagan; C) Jo'nash sanasi haqida e'londa ma'lumot berilmagan.", "why": {"A": "Keyingi yil haqida e'londa gap yo'q.", "B": "Qo'shimcha to'lov haqida e'londa hech narsa yozilmagan.", "C": "Jo'nash sanasi haqida e'londa ma'lumot berilmagan.", "D": "E'londa ikkala dam olish kunidan biri qoldirilsa, joy bekor qilinishi aytilgan."}}, {"no": 23, "pts": "2.6", "head": "What is the writer's main argument?", "text": "", "opts": ["Examinations should be replaced by coursework", "Coursework is always fairer than an examination", "Each method measures something the other cannot", "Both methods should be abandoned altogether"], "ans": "C", "expl": "To'g'ri javob - C) Muallif har bir usul ikkinchisi o'lchay olmaydigan narsani o'lchashini ta'kidlaydi. Qolgan variantlar: A) Muallif imtihonni butunlay almashtirishni taklif qilmaydi; B) Muallif kurs ishining doimo adolatliroq ekanini aytmaydi; D) Ikkalasidan voz kechish haqida matnda gap yo'q.", "why": {"A": "Muallif imtihonni butunlay almashtirishni taklif qilmaydi.", "B": "Muallif kurs ishining doimo adolatliroq ekanini aytmaydi.", "C": "Muallif har bir usul ikkinchisi o'lchay olmaydigan narsani o'lchashini ta'kidlaydi.", "D": "Ikkalasidan voz kechish haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 23-24.", "The argument between examinations and coursework is usually presented as a choice, and it is not. An examination measures what a candidate can do alone, under pressure, without help. Coursework measures what the same candidate can do with time, sources and second attempts. Both of those are worth knowing, and a system that uses only one of them is measuring half a student."]}, {"no": 24, "pts": "2.6", "head": "What does the writer say an examination measures?", "text": "", "opts": ["How well a candidate uses sources", "How much a candidate has revised", "What a candidate can do with second attempts", "What a candidate can do alone and under pressure"], "ans": "D", "expl": "To'g'ri javob - D) Matnda imtihon nomzodning yolg'iz, bosim ostida qila oladiganini o'lchashi aytilgan. Qolgan variantlar: A) Manbalardan foydalanish kurs ishiga tegishli; B) Takrorlash hajmi haqida matnda gap yo'q; C) Ikkinchi urinish kurs ishiga tegishli.", "why": {"A": "Manbalardan foydalanish kurs ishiga tegishli.", "B": "Takrorlash hajmi haqida matnda gap yo'q.", "C": "Ikkinchi urinish kurs ishiga tegishli.", "D": "Matnda imtihon nomzodning yolg'iz, bosim ostida qila oladiganini o'lchashi aytilgan."}}, {"no": 25, "pts": "2.6", "head": "Why does a river begin to meander?", "text": "", "opts": ["A small bend sends the fastest water to one bank", "The bed is always softer on one side", "Rain falls more heavily on one side of a valley", "Bridges force the water to change direction"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida kichik burilish eng tez oqimni bir qirg'oqqa yo'naltirishi aytilgan. Qolgan variantlar: B) Tub qattiqligi haqida matnda bunday umumiy da'vo yo'q; C) Yomg'ir haqida matnda hech narsa yozilmagan; D) Ko'priklar haqida matnda gap yo'q.", "why": {"A": "Birinchi xatboshida kichik burilish eng tez oqimni bir qirg'oqqa yo'naltirishi aytilgan.", "B": "Tub qattiqligi haqida matnda bunday umumiy da'vo yo'q.", "C": "Yomg'ir haqida matnda hech narsa yozilmagan.", "D": "Ko'priklar haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 25-27.", "A river rarely runs straight for long. Any small bend directs the fastest water towards the outer bank, where it cuts away the material. The slower water on the inner side deposits the sand it was transporting. The bend therefore deepens itself, and a nearly straight channel becomes a pronounced curve.", "The curves migrate downstream over time. Where two bends approach one another, the river may cut across the narrow neck between them during a flood and abandon the loop entirely. The abandoned curve remains as a crescent of still water beside the new channel.", "Engineers once straightened rivers to accelerate the water away. Many of those channels are now being restored. A meandering river retains water in the landscape considerably longer. It floods its own margins rather than the settlement downstream, and supports far more life along its banks."]}, {"no": 26, "pts": "2.6", "head": "What happens when two bends approach one another?", "text": "", "opts": ["The river slows down and deposits sand", "The banks become higher on both sides", "The water divides into two channels", "The river may cut across the neck between them"], "ans": "D", "expl": "To'g'ri javob - D) Ikkinchi xatboshida daryo toshqin paytida ikki burilish orasidagi tor bo'yinni kesib o'tishi aytilgan. Qolgan variantlar: A) Qum cho'kishi birinchi xatboshida, boshqa holat uchun aytilgan; B) Qirg'oq balandligi haqida matnda gap yo'q; C) Ikkiga bo'linish haqida matnda hech narsa yozilmagan.", "why": {"A": "Qum cho'kishi birinchi xatboshida, boshqa holat uchun aytilgan.", "B": "Qirg'oq balandligi haqida matnda gap yo'q.", "C": "Ikkiga bo'linish haqida matnda hech narsa yozilmagan.", "D": "Ikkinchi xatboshida daryo toshqin paytida ikki burilish orasidagi tor bo'yinni kesib o'tishi aytilgan."}}, {"no": 27, "pts": "2.6", "head": "Why are straightened channels now being restored?", "text": "", "opts": ["Straight channels are more expensive to maintain", "The new channels were built in the wrong places", "A meandering river floods its own margins", "Boats can no longer use the straight sections"], "ans": "C", "expl": "To'g'ri javob - C) Uchinchi xatboshida egri daryo o'z qirg'oqlarini bosishi afzallik sifatida aytilgan. Qolgan variantlar: A) Xarajat haqida matnda bunday taqqoslash yo'q; B) Joylashuv haqida matnda gap yo'q; D) Kemalar haqida matnda hech narsa yozilmagan.", "why": {"A": "Xarajat haqida matnda bunday taqqoslash yo'q.", "B": "Joylashuv haqida matnda gap yo'q.", "C": "Uchinchi xatboshida egri daryo o'z qirg'oqlarini bosishi afzallik sifatida aytilgan.", "D": "Kemalar haqida matnda hech narsa yozilmagan."}}, {"no": 28, "pts": "2.6", "head": "What does the text say about the origin of the weekend?", "text": "", "opts": ["It was created by a single national law", "It grew out of an arrangement in textile towns", "It began with the spread of the railways", "It was first introduced for office workers"], "ans": "B", "expl": "To'g'ri javob - B) Birinchi xatboshida u to'qimachilik shaharlaridagi kelishuvdan o'sib chiqqani aytilgan. Qolgan variantlar: A) Yagona qonun haqida matnda hech narsa yozilmagan; C) Temir yo'l haqida matnda gap yo'q; D) Idora xodimlari haqida matnda ma'lumot berilmagan.", "why": {"A": "Yagona qonun haqida matnda hech narsa yozilmagan.", "B": "Birinchi xatboshida u to'qimachilik shaharlaridagi kelishuvdan o'sib chiqqani aytilgan.", "C": "Temir yo'l haqida matnda gap yo'q.", "D": "Idora xodimlari haqida matnda ma'lumot berilmagan."}, "block": ["Read the text and answer questions 28-30.", "The two-day weekend was not planned. It developed from an arrangement in textile towns where part of the workforce did not work on Saturday for religious reasons. Manufacturers found it simpler to close the entire Saturday afternoon than to operate at half strength. The half-day then spread from there.", "Employers expected the change to cost them. What they found, after the first years, was that output per hour rose enough to offset much of the lost time, and that absence on Monday fell sharply. The argument then shifted from whether a shorter week was affordable to how it should be arranged.", "The identical argument has returned in a different form. Experiments with a four-day week report similar findings and similar objections. Historians observe that the earlier transformation required about sixty years to become normal. That suggests the current debate is nearer its beginning than its conclusion."]}, {"no": 29, "pts": "2.6", "head": "What did employers find after the first years?", "text": "", "opts": ["Output per hour rose and Monday absence fell", "Workers asked for the old hours back", "The cost was greater than they had expected", "Saturday closing had no measurable effect"], "ans": "A", "expl": "To'g'ri javob - A) Ikkinchi xatboshida soatlik mahsuldorlik oshgani va dushanbadagi ishga chiqmaslik keskin kamaygani aytilgan. Qolgan variantlar: B) Eski tartibga qaytish haqida matnda gap yo'q; C) Matnda aksincha, xarajat qoplangani aytilgan; D) Ta'sir yo'qligi haqida matnda hech narsa yozilmagan.", "why": {"A": "Ikkinchi xatboshida soatlik mahsuldorlik oshgani va dushanbadagi ishga chiqmaslik keskin kamaygani aytilgan.", "B": "Eski tartibga qaytish haqida matnda gap yo'q.", "C": "Matnda aksincha, xarajat qoplangani aytilgan.", "D": "Ta'sir yo'qligi haqida matnda hech narsa yozilmagan."}}, {"no": 30, "pts": "2.6", "head": "What do historians note about the earlier change?", "text": "", "opts": ["It took about sixty years to become normal", "It was reversed in several countries", "It applied only to the textile industry", "It was accepte  "Bunday birikma ingliz tilida mavjud emas."}}, {"no": 18, "pts": "1.5", "head": "Choose the correct answer.", "text": "The author ____ several objections before presenting her own case.", "opts": ["anticipated to", "anticipates", "antique", "anticipation"], "ans": "B", "expl": "To'g'ri javob - B) 'Anticipate' e'tirozlarni oldindan ko'rib, javob berishni bildiradi. Qolgan variantlar: A) 'Anticipate' fe'li 'to' bilan kelmaydi; C) 'Antique' sifat yoki ot bo'lib, qadimiy degani; D) 'Anticipation' ot bo'lib, bu o'rinda kesim bo'la olmaydi.", "why": {"A": "'Anticipate' fe'li 'to' bilan kelmaydi.", "B": "'Anticipate' e'tirozlarni oldindan ko'rib, javob berishni bildiradi.", "C": "'Antique' sifat yoki ot bo'lib, qadimiy degani.", "D": "'Anticipation' ot bo'lib, bu o'rinda kesim bo'la olmaydi."}}, {"no": 19, "pts": "1.5", "head": "Choose the correct answer.", "text": "The results were ____ with the hypothesis, though not conclusive.", "opts": ["consisting", "consistency", "consistently", "consistent"], "ans": "D", "expl": "To'g'ri javob - D) 'Consistent with' barqaror birikma bo'lib, mos kelishni bildiradi. Qolgan variantlar: A) 'Consisting' ravishdosh bo'lib, 'of' predlogini talab qiladi; B) 'Consistency' ot bo'lib, bu o'rinda kelmaydi; C) 'Consistently' ravish bo'lib, fe'lni izohlaydi.", "why": {"A": "'Consisting' ravishdosh bo'lib, 'of' predlogini talab qiladi.", "B": "'Consistency' ot bo'lib, bu o'rinda kelmaydi.", "C": "'Consistently' ravish bo'lib, fe'lni izohlaydi.", "D": "'Consistent with' barqaror birikma bo'lib, mos kelishni bildiradi."}}, {"no": 20, "pts": "1.5", "head": "Which option is the most formal way of writing this sentence?", "text": "We put off the opening because the builders were late.", "opts": ["The opening was postponed owing to a delay in the building work.", "We had to push the opening back as the builders were slow.", "We moved the opening because the builders messed up.", "The opening got held up by the builders."], "ans": "A", "expl": "To'g'ri o a lake can continue to bloom for years after the supply from the land has been cut. Patience is part of the treatment."]}, {"no": 26, "pts": "2.6", "head": "Why do fish die after a bloom?", "text": "", "opts": ["The algae block the light they need", "The water becomes too salty for them", "Bacteria consume the oxygen in deeper water", "The surface layer freezes over"], "ans": "C", "expl": "To'g'ri javob - C) Ikkinchi xatboshida suv o'tlarini parchalovchi bakteriyalar kisloroddan mahrum qilishi aytilgan. Qolgan variantlar: A) Yorug'lik haqida matnda bu sabab sifatida berilmagan; B) Sho'rlik haqida matnda hech narsa yozilmagan; D) Muzlash haqida matnda gap yo'q.", "why": {"A": "Yorug'lik haqida matnda bu sabab sifatida berilmagan.", "B": "Sho'rlik haqida matnda hech narsa yozilmagan.", "C": "Ikkinchi xatboshida suv o'tlarini parchalovchi bakteriyalar kisloroddan mahrum qilishi aytilgan.", "D": "Muzlash haqida matnda gap yo'q."}}, {"no": 27, "pts": "2.6", "head": "Why can a lake keep blooming after the supply is cut?", "text": "", "opts": ["Algae survive the winter under the ice", "Fertiliser continues to arrive from the air", "The bacteria produce phosphorus themselves", "Phosphorus stored in the sediment returns each summer"], "ans": "D", "expl": "To'g'ri javob - D) Uchinchi xatboshida cho'kindida saqlangan fosfor har yozda suvga qaytishi aytilgan. Qolgan variantlar: A) Qishlash haqida matnda hech narsa yozilmagan; B) Havo orqali kelishi haqida matnda gap yo'q; C) Bakteriyalar fosfor ishlab chiqarishi aytilmagan.", "why": {"A": "Qishlash haqida matnda hech narsa yozilmagan.", "B": "Havo orqali kelishi haqida matnda gap yo'q.", "C": "Bakteriyalar fosfor ishlab chiqarishi aytilmagan.", "D": "Uchinchi xatboshida cho'kindida saqlangan fosfor har yozda suvga qaytishi aytilgan."}}, {"no": 28, "pts": "2.6", "head": "What does the text say about the first paperbacks?", "text": "", "opts": ["They were dismissed as a threat to proper publishing", "They were sold only in railway stations", "They contained only new writing", "They were more expensive than expected"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida ular nashriyot ishiga tahdid sifatida qoralangani aytilgan. Qolgan variantlar: B) Sotuv joyi haqida matnda bunday cheklov yo'q; C) Yangi asarlar haqida matnda aksincha aytilgan; D) Narx haqida matnda bunday da'vo berilmagan.", "why": {"A": "Birinchi xatboshida ular nashriyot ishiga tahdid sifatida qoralangani aytilgan.", "B": "Sotuv joyi haqida matnda bunday cheklov yo'q.", "C": "Yangi asarlar haqida matnda aksincha aytilgan.", "D": "Narx haqida matnda bunday da'vo berilmagan."}, "block": ["Read the text and answer questions 28-30.", "When cheap paperbacks appeared, established publishers dismissed them as a threat to serious publishing. The books were reprints rather than new writing, the paper was poor, and the price was a fraction of a bound edition. Booksellers predicted that nobody who bought one would ever buy a hardback again.", "The prediction was wrong in an instructive way. Paperback buyers turned out to be largely people who had not been buying books at all, and a proportion of them moved on to buying more expensive editions of writers they had discovered cheaply. The market grew rather than divided.", "The pattern has repeated with every cheap format since, and the arguments have been almost identical each time. Historians of publishing observe that the industry has been predicting its own collapse for roughly a century. That prediction has so far been a reliable sign of growth."]}, {"no": 29, "pts": "2.6", "head": "Why was the booksellers' prediction wrong?", "text": "", "opts": ["Hardbacks became cheaper at the same time", "The paper proved better than expected", "Paperback buyers had not been buying books before", "New writing appeared in paperback first"], "ans": "C", "expl": "To'g'ri javob - C) Ikkinchi xatboshida xaridorlarning ko'pi avval kitob sotib olmagan odamlar bo'lgani aytilgan. Qolgan variantlar: A) Qattiq muqovaning narxi haqida matnda gap yo'q; B) Qog'oz sifati haqida matnda hech narsa yozilmagan; D) Yangi asarlar haqida matnda ma'lumot berilmagan.", "why": {"A": "Qattiq muqovaning narxi haqida matnda gap yo'q.", "B": "Qog'oz sifati haqida matnda hech narsa yozilmagan.", "C": "Ikkinchi xatboshida xaridorlarning ko'pi avval kitob sotib olmagan odamlar bo'lgani aytilgan.", "D": "Yangi asarlar haqida matnda ma'lumot berilmagan."}}, {"no": 30, "pts": "2.6", "head": "What do historians of publishing note?", "text": "", "opts": ["Cheap formats always reduce the number of readers", "The industry has predicted its own collapse for a century", "Each new format has been welcomed by publishers", "The arguments have changed with every format"], "ans": "B", "expl": "To'g'ri javob - B) Uchinchi xatboshida soha bir asrdan beri o'z inqirozini bashorat qilib kelayotgani aytilgan. Qolgan variantlar: A) Matnda aksincha, bozor kengaygani aytilgan; C) Nashriyotlar qarshi chiqqani ta'kidlangan; D) Matnda dalillar deyarli bir xil bo'lgani aytilgan.", "why": {"A": "Matnda aksincha, bozor kengaygani aytilgan.", "B": "Uchinchi xatboshida soha bir asrdan beri o'z inqirozini bashorat qilib kelayotgani aytilgan.", "C": "Nashriyotlar qarshi chiqqani ta'kidlangan.", "D": "Matnda dalillar deyarli bir xil bo'lgani aytilgan."}}]}, {"variant": 11, "label": "11-sinf", "sub": "3-mock", "items": [{"no": 1, "pts": "0.9", "head": "Fill in the gaps with correct answer.", "text": "Rarely ____ a single discovery ____ an entire field so quickly.", "opts": ["has / transforming", "has / transformed", "did / transformed", "had / transform"], "ans": "B", "expl": "To'g'ri javob - B) 'Rarely' gap boshida kelsa yordamchi fe'l egadan oldinga chiqadi va present perfect 'has transformed' bo'ladi. Qolgan variantlar: A) 'Has' dan keyin uchinchi shakl kerak, '-ing' shakli emas; C) 'Did' dan keyin fe'lning birinchi shakli keladi; D) 'Had' dan keyin uchinchi shakl kerak, 'transform' esa birinchi shakl.", "why": {"A": "'Has' dan keyin uchinchi shakl kerak, '-ing' shakli emas.", "B": "'Rarely' gap boshida kelsa yordamchi fe'l egadan oldinga chiqadi va present perfect 'has transformed' bo'ladi.", "C": "'Did' dan keyin fe'lning birinchi shakli keladi.", "D": "'Had' dan keyin uchinchi shakl kerak, 'transform' esa birinchi shakl."}}, {"no": 2, "pts": "0.9", "head": "Choose the correct answer.", "text": "The collection ____ twice before the trustees ____ that a catalogue was needed.", "opts": ["was valued / decided", "had been valued / decided", "has been valued / decided", "was being valued / had decided"], "ans": "B", "expl": "To'g'ri javob - B) Avvalgi takroriy ish past perfect majhul 'had been valued', keyingisi past simple 'decided' bo'ladi. Qolgan variantlar: A) Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi; C) Present perfect o'tgan zamon hikoyasida ishlatilmaydi; D) Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan.", "why": {"A": "Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.", "B": "Avvalgi takroriy ish past perfect majhul 'had been valued', keyingisi past simple 'decided' bo'ladi.", "C": "Present perfect o'tgan zamon hikoyasida ishlatilmaydi.", "D": "Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}}, {"no": 3, "pts": "0.9", "head": "Choose the correct answer.", "text": "____ the scale of the undertaking, the deadline was met without difficulty.", "opts": ["Despite", "Although", "Because of", "Accordingly"], "ans": "A", "expl": "To'g'ri javob - A) 'Despite' dan keyin ot birikmasi keladi va qarama-qarshilikni bildiradi. Qolgan variantlar: B) 'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi; C) 'Because of' sababni bildiradi va gapning mantiqini teskari qiladi; D) 'Accordingly' natijani bildiruvchi kirish so'z bo'lib, gapni bunday bog'lamaydi.", "why": {"A": "'Despite' dan keyin ot birikmasi keladi va qarama-qarshilikni bildiradi.", "B": "'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.", "C": "'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.", "D": "'Accordingly' natijani bildiruvchi kirish so'z bo'lib, gapni bunday bog'lamaydi."}}, {"no": 4, "pts": "0.9", "head": "Choose the correct answer.", "text": "It was not until the samples were reanalysed ____ the anomaly became obvious.", "opts": ["when", "that", "which", "what"], "ans": "B", "expl": "To'g'ri javob - B) 'It was not until ... that' barqaror ta'kidlovchi qurilish bo'lib, 'that' bilan to'ldiriladi. Qolgan variantlar: A) 'When' bu qurilishda 'that' o'rnini bosa olmaydi; C) 'Which' narsaga ishora qiladi, bu yerda esa vaqt ta'kidlanmoqda; D) 'What' ta'kidlovchi gapni boshlay olmaydi.", "why": {"A": "'When' bu qurilishda 'that' o'rnini bosa olmaydi.", "B": "'It was not until ... that' barqaror ta'kidlovchi qurilish bo'lib, 'that' bilan to'ldiriladi.", "C": "'Which' narsaga ishora qiladi, bu yerda esa vaqt ta'kidlanmoqda.", "D": "'What' ta'kidlovchi gapni boshlay olmaydi."}}, {"no": 5, "pts": "0.9", "head": "Choose the correct answer.", "text": "Had the specimens ____ separately, the contamination ____ at once.", "opts": ["been stored / would be detected", "stored / would have detected", "be stored / will be detected", "been stored / would have been detected"], "ans": "D", "expl": "To'g'ri javob - D) Bu teskari tartibli uchinchi shart gap: majhul nisbatda 'would have been detected' to'g'ri. Qolgan variantlar: A) 'Would be detected' natijani hozirgi paytga olib chiqadi, gapda esa o'tmish nazarda tutilgan; B) 'Stored' aktiv shakl bo'lib, namunalarning o'zi saqlagan degan ma'no chiqadi; C) Noreal shartdan keyin 'will' kelmaydi.", "why": {"A": "'Would be detected' natijani hozirgi paytga olib chiqadi, gapda esa o'tmish nazarda tutilgan.", "B": "'Stored' aktiv shakl bo'lib, namunalarning o'zi saqlagan degan ma'no chiqadi.", "C": "Noreal shartdan keyin 'will' kelmaydi.", "D": "Bu teskari tartibli uchinchi shart gap: majhul nisbatda 'would have been detected' to'g'ri."}}, {"no": 6, "pts": "0.9", "head": "Which option states that something is not required?", "text": "", "opts": ["Candidates needn't submit a printed copy.", "Candidates mustn't submit a printed copy.", "Candidates shouldn't have submitted a printed copy.", "Candidates couldn't submit a printed copy."], "ans": "A", "expl": "To'g'ri javob - A) 'Needn't' majburiyat yo'qligini, ya'ni shart emasligini bildiradi. Qolgan variantlar: B) 'Mustn't' taqiqni bildiradi, ya'ni topshirish mumkin emas degani; C) 'Shouldn't have submitted' bajarilgan ish uchun tanbeh bildiradi; D) 'Couldn't' imkoniyat bo'lmaganini bildiradi.", "why": {"A": "'Needn't' majburiyat yo'qligini, ya'ni shart emasligini bildiradi.", "B": "'Mustn't' taqiqni bildiradi, ya'ni topshirish mumkin emas degani.", "C": "'Shouldn't have submitted' bajarilgan ish uchun tanbeh bildiradi.", "D": "'Couldn't' imkoniyat bo'lmaganini bildiradi."}}, {"no": 7, "pts": "0.9", "head": "Choose the correct answer.", "text": "The panel recommended that the applicant ____ a second interview.", "opts": ["is offered", "be offered", "was offered", "offering"], "ans": "B", "expl": "To'g'ri javob - B) 'Recommended that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be offered' bo'ladi. Qolgan variantlar: A) 'Is offered' oddiy hozirgi zamon bo'lib, bunday tavsiyada ishlatilmaydi; C) 'Was offered' oddiy o'tgan zamon bo'lib, tavsiya ma'nosini bermaydi; D) 'Offering' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi.", "why": {"A": "'Is offered' oddiy hozirgi zamon bo'lib, bunday tavsiyada ishlatilmaydi.", "B": "'Recommended that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be offered' bo'ladi.", "C": "'Was offered' oddiy o'tgan zamon bo'lib, tavsiya ma'nosini bermaydi.", "D": "'Offering' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi."}}, {"no": 8, "pts": "0.9", "head": "Choose the word that fits best.", "text": "The second edition is ____ more accessible than the first.", "opts": ["markedly", "very", "so", "too"], "ans": "A", "expl": "To'g'ri javob - A) Qiyosiy daraja 'markedly', 'far' yoki 'slightly' kabi ravishlar bilan kuchaytiriladi. Qolgan variantlar: B) 'Very' qiyosiy daraja oldidan kelmaydi; C) 'So' ham qiyosiy darajani kuchaytira olmaydi; D) 'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.", "why": {"A": "Qiyosiy daraja 'markedly', 'far' yoki 'slightly' kabi ravishlar bilan kuchaytiriladi.", "B": "'Very' qiyosiy daraja oldidan kelmaydi.", "C": "'So' ham qiyosiy darajani kuchaytira olmaydi.", "D": "'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi."}}, {"no": 9, "pts": "0.9", "head": "Choose the correct sentence.", "text": "", "opts": ["The translators' notes were printed as an appendix.", "The translator's notes was printed as an appendix.", "The translators notes' were printed as an appendix.", "The translators's notes were printed as an appendix."], "ans": "A", "expl": "To'g'ri javob - A) Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: translators'. Qolgan variantlar: B) Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak; C) Apostrof noto'g'ri so'zga qo'yilgan; D) Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q.", "why": {"A": "Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: translators'.", "B": "Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak.", "C": "Apostrof noto'g'ri so'zga qo'yilgan.", "D": "Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q."}}, {"no": 10, "pts": "0.9", "head": "Choose the correct indirect question.", "text": "", "opts": ["Could you confirm have the figures been audited?", "Could you confirm whether the figures have been audited?", "I wonder when will the report be circulated.", "Do you know why was the clause removed?"], "ans": "B", "expl": "To'g'ri javob - B) Bilvosita savolda so'z tartibi darak gapdagidek: 'whether the figures have been audited'. Qolgan variantlar: A) Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan; C) 'Will' egadan oldin turibdi, to'g'ri shakli 'when the report will be circulated' bo'ladi; D) 'Was' egadan oldin kelgan, bu to'g'ridan-to'g'ri savol tartibi.", "why": {"A": "Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan.", "B": "Bilvosita savolda so'z tartibi darak gapdagidek: 'whether the figures have been audited'.", "C": "'Will' egadan oldin turibdi, to'g'ri shakli 'when the report will be circulated' bo'ladi.", "D": "'Was' egadan oldin kelgan, bu to'g'ridan-to'g'ri savol tartibi."}}, {"no": 11, "pts": "1.5", "head": "Choose the word that fits best.", "text": "The department ____ the proposal after three members objected.", "opts": ["backed up", "backed onto", "backed out", "backed down from"], "ans": "D", "expl": "To'g'ri javob - D) 'Back down from' o'z pozitsiyasidan chekinishni bildiradi. Qolgan variantlar: A) 'Back up' qo'llab-quvvatlash yoki nusxa saqlashni bildiradi; B) 'Back onto' bino orqasi biror joyga qarashini bildiradi; C) 'Back out' predlogsiz ishlatiladi va bu qurilishga mos kelmaydi.", "why": {"A": "'Back up' qo'llab-quvvatlash yoki nusxa saqlashni bildiradi.", "B": "'Back onto' bino orqasi biror joyga qarashini bildiradi.", "C": "'Back out' predlogsiz ishlatiladi va bu qurilishga mos kelmaydi.", "D": "'Back down from' o'z pozitsiyasidan chekinishni bildiradi."}}, {"no": 12, "pts": "1.5", "head": "Which option shows the best correct collocation match?", "text": "", "opts": ["pull a parallel", "draw a parallel", "make a parallel thinly and round", "set a parallel"], "ans": "B", "expl": "To'g'ri javob - B) Ingliz tilida o'xshashlik o'tkazish 'draw a parallel' deyiladi. Qolgan variantlar: A) 'Pull' bu ot bilan birikmaydi; C) Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan; D) 'Set a parallel' birikmasi bu ma'noda ishlatilmaydi.", "why": {"A": "'Pull' bu ot bilan birikmaydi.", "B": "Ingliz tilida o'xshashlik o'tkazish 'draw a parallel' deyiladi.", "C": "Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.", "D": "'Set a parallel' birikmasi bu ma'noda ishlatilmaydi."}}, {"no": 13, "pts": "1.5", "head": "Which word is opposite in meaning to the underlined word?", "text": "The author's conclusions are stated in ~tentative~ terms.", "opts": ["categorical", "cautious", "technical", "lengthy"], "ans": "A", "expl": "To'g'ri javob - A) 'Tentative' ehtiyotkor va shartli degani, uning teskarisi 'categorical'. Qolgan variantlar: B) 'Cautious' ma'no jihatidan sinonim, teskarisi emas; C) 'Technical' uslubni bildiradi va teskari ma'no bermaydi; D) 'Lengthy' uzunlikni bildiradi, ishonch darajasini emas.", "why": {"A": "'Tentative' ehtiyotkor va shartli degani, uning teskarisi 'categorical'.", "B": "'Cautious' ma'no jihatidan sinonim, teskarisi emas.", "C": "'Technical' uslubni bildiradi va teskari ma'no bermaydi.", "D": "'Lengthy' uzunlikni bildiradi, ishonch darajasini emas."}}, {"no": 14, "pts": "1.5", "head": "Which word does NOT describe a theory?", "text": "", "opts": ["untested", "elegant", "perishable", "discredited"], "ans": "C", "expl": "To'g'ri javob - C) 'Perishable' tez buziladigan degani bo'lib, faqat oziq-ovqat haqida ishlatiladi. Qolgan variantlar: A) 'Untested' sinovdan o'tmagan degani va nazariyani tasvirlaydi; B) 'Elegant' nafis va ixcham degani, bu ham nazariyaga nisbatan ishlatiladi; D) 'Discredited' obro'sizlangan degani va nazariya haqida aytiladi.", "why": {"A": "'Untested' sinovdan o'tmagan degani va nazariyani tasvirlaydi.", "B": "'Elegant' nafis va ixcham degani, bu ham nazariyaga nisbatan ishlatiladi.", "C": "'Perishable' tez buziladigan degani bo'lib, faqat oziq-ovqat haqida ishlatiladi.", "D": "'Discredited' obro'sizlangan degani va nazariya haqida aytiladi."}}, {"no": 15, "pts": "1.5", "head": "Which word is closest in meaning to the underlined word?", "text": "The procedure described in the appendix is unnecessarily ~convoluted~.", "opts": ["expensive", "outdated", "complicated", "imprecise"], "ans": "C", "expl": "To'g'ri javob - C) 'Convoluted' chigal va murakkab degani, 'complicated' shu ma'noni beradi. Qolgan variantlar: A) 'Expensive' narxni bildiradi, murakkablikni emas; B) 'Outdated' eskirganlikni bildiradi; D) 'Imprecise' aniqsizlikni bildiradi va bu yerga mos kelmaydi.", "why": {"A": "'Expensive' narxni bildiradi, murakkablikni emas.", "B": "'Outdated' eskirganlikni bildiradi.", "C": "'Convoluted' chigal va murakkab degani, 'complicated' shu ma'noni beradi.", "D": "'Imprecise' aniqsizlikni bildiradi va bu yerga mos kelmaydi."}}, {"no": 16, "pts": "1.5", "head": "Choose the correct answer.", "text": "The study was criticised for the ____ of its sample.", "opts": ["narrow", "narrowly", "narrowing", "narrowness"], "ans": "D", "expl": "To'g'ri javob - D) 'The ... of' qurilishida ot kerak, 'narrowness' esa ot shaklidir. Qolgan variantlar: A) 'Narrow' sifat bo'lib, 'the ... of' qurilishida ot talab qilinadi; B) 'Narrowly' ravish bo'lib, fe'lni izohlaydi; C) 'Narrowing' ravishdosh bo'lib, boshqa ma'no beradi.", "why": {"A": "'Narrow' sifat bo'lib, 'the ... of' qurilishida ot talab qilinadi.", "B": "'Narrowly' ravish bo'lib, fe'lni izohlaydi.", "C": "'Narrowing' ravishdosh bo'lib, boshqa ma'no beradi.", "D": "'The ... of' qurilishida ot kerak, 'narrowness' esa ot shaklidir."}}, {"no": 17, "pts": "1.5", "head": "Choose the correct answer.", "text": "The findings were consistent ____ those of the earlier trial.", "opts": ["to", "of", "with", "for"], "ans": "C", "expl": "To'g'ri javob - C) 'Consistent with' barqaror birikma bo'lib, mos kelishni bildiradi. Qolgan variantlar: A) 'Consistent' sifati 'to' predlogi bilan ishlatilmaydi; B) 'Of' bu sifat bilan kelmaydi; D) 'For' maqsadni bildiradi va bu sifatga mos emas.", "why": {"A": "'Consistent' sifati 'to' predlogi bilan ishlatilmaydi.", "B": "'Of' bu sifat bilan kelmaydi.", "C": "'Consistent with' barqaror birikma bo'lib, mos kelishni bildiradi.", "D": "'For' maqsadni bildiradi va bu sifatga mos emas."}}, {"no": 18, "pts": "1.5", "head": "Find the definition of the underlined word.", "text": "The witness was described in court as entirely ~impartial~.", "opts": ["unwilling to answer questions", "unable to recall the details", "not favouring either side", "appearing without a lawyer"], "ans": "C", "expl": "To'g'ri javob - C) 'Impartial' hech bir tomonni qo'llamaydigan, xolis degani. Qolgan variantlar: A) Javob bermaslik bu so'zning ma'nosi emas; B) Eslay olmaslik haqidagi ta'rif mos kelmaydi; D) Advokat haqidagi ta'rif bu so'zga aloqador emas.", "why": {"A": "Javob bermaslik bu so'zning ma'nosi emas.", "B": "Eslay olmaslik haqidagi ta'rif mos kelmaydi.", "C": "'Impartial' hech bir tomonni qo'llamaydigan, xolis degani.", "D": "Advokat haqidagi ta'rif bu so'zga aloqador emas."}}, {"no": 19, "pts": "1.5", "head": "Choose the correct answer.", "text": "A mediator is:", "opts": ["a person who records what is said at a hearing", "a person who helps two sides reach agreement", "a person who represents one side in a dispute", "a person who decides who is at fault"], "ans": "B", "expl": "To'g'ri javob - B) 'Mediator' ikki tomonni kelishuvga olib keluvchi vositachi degani. Qolgan variantlar: A) Yozib boruvchi 'clerk' deb ataladi; C) Bir tomonni ifodalovchi 'representative' yoki 'advocate' deyiladi; D) Aybni belgilovchi 'judge' yoki 'arbitrator' deb ataladi.", "why": {"A": "Yozib boruvchi 'clerk' deb ataladi.", "B": "'Mediator' ikki tomonni kelishuvga olib keluvchi vositachi degani.", "C": "Bir tomonni ifodalovchi 'representative' yoki 'advocate' deyiladi.", "D": "Aybni belgilovchi 'judge' yoki 'arbitrator' deb ataladi."}}, {"no": 20, "pts": "1.5", "head": "Which word has a negative meaning?", "text": "", "opts": ["ambitious", "grasping", "driven", "enterprising"], "ans": "B", "expl": "To'g'ri javob - B) 'Grasping' ochko'z degani bo'lib, salbiy ma'noga ega. Qolgan variantlar: A) 'Ambitious' intiluvchan degani va ijobiy baho beradi; C) 'Driven' maqsadga intiluvchan degani, bu ham ijobiy so'z; D) 'Enterprising' tashabbuskor degani va maqtov ma'nosini beradi.", "why": {"A": "'Ambitious' intiluvchan degani va ijobiy baho beradi.", "B": "'Grasping' ochko'z degani bo'lib, salbiy ma'noga ega.", "C": "'Driven' maqsadga intiluvchan degani, bu ham ijobiy so'z.", "D": "'Enterprising' tashabbuskor degani va maqtov ma'nosini beradi."}}, {"no": 21, "pts": "2.6", "head": "What is the purpose of this notice?", "text": "", "opts": ["To explain how the reading room may be used", "To announce that the reading room has closed", "To invite readers to donate to the collection", "To report the theft of several volumes"], "ans": "A", "expl": "To'g'ri javob - A) E'londa ruxsatnoma, buyurtma, jihoz va nusxa olish tartibi berilgan. Qolgan variantlar: B) Yopilish haqida e'londa hech narsa aytilmagan; C) Xayriya haqida e'londa gap yo'q; D) O'g'irlik haqida e'londa ma'lumot berilmagan.", "why": {"A": "E'londa ruxsatnoma, buyurtma, jihoz va nusxa olish tartibi berilgan.", "B": "Yopilish haqida e'londa hech narsa aytilmagan.", "C": "Xayriya haqida e'londa gap yo'q.", "D": "O'g'irlik haqida e'londa ma'lumot berilmagan."}, "block": ["Read the text and answer questions 21-22.", "RARE BOOKS READING ROOM", "Readers are admitted on production of a current ticket and a letter stating the purpose of the research. Volumes are ordered at the desk and may not be reserved for a later day. Pencils only; no pens, bags or outdoor coats are permitted beyond the barrier. Photography without flash is allowed for private study, and a request form must be completed for any image intended for publication."]}, {"no": 22, "pts": "2.6", "head": "What does the notice say about ordered volumes?", "text": "", "opts": ["They may be kept for a week", "They must be collected before midday", "They are delivered to the reader's desk", "They may not be reserved for a later day"], "ans": "D", "expl": "To'g'ri javob - D) E'londa buyurtma qilingan kitoblarni keyingi kunga saqlab qo'yib bo'lmasligi aytilgan. Qolgan variantlar: A) Bir hafta saqlash haqida e'londa hech narsa aytilmagan; B) Tushgacha olish haqida e'londa gap yo'q; C) Stolga yetkazish haqida e'londa ma'lumot berilmagan.", "why": {"A": "Bir hafta saqlash haqida e'londa hech narsa aytilmagan.", "B": "Tushgacha olish haqida e'londa gap yo'q.", "C": "Stolga yetkazish haqida e'londa ma'lumot berilmagan.", "D": "E'londa buyurtma qilingan kitoblarni keyingi kunga saqlab qo'yib bo'lmasligi aytilgan."}}, {"no": 23, "pts": "2.6", "head": "You see this sign in an archive: \"Documents may not be removed from the reading room under any circumstances.\" What is the main message?", "text": "", "opts": ["Nothing may be taken out of this room", "Documents may be borrowed with permission", "Only staff may move the documents", "Documents must be returned the same day"], "ans": "A", "expl": "To'g'ri javob - A) Belgida hujjatlarni xonadan olib chiqish hech qanday holatda mumkin emasligi aytilgan. Qolgan variantlar: B) Ruxsat bilan olish imkoni belgida inkor qilingan; C) Xodimlar haqida belgida gap yo'q; D) Qaytarish muddati haqida belgida hech narsa yozilmagan.", "why": {"A": "Belgida hujjatlarni xonadan olib chiqish hech qanday holatda mumkin emasligi aytilgan.", "B": "Ruxsat bilan olish imkoni belgida inkor qilingan.", "C": "Xodimlar haqida belgida gap yo'q.", "D": "Qaytarish muddati haqida belgida hech narsa yozilmagan."}}, {"no": 24, "pts": "2.6", "head": "You hear a committee chair say: \"I think we are getting ahead of ourselves here.\" What does this mean?", "text": "", "opts": ["They are falling behind the agreed timetable", "They have already made the decision", "They are discussing a later stage too soon", "They are repeating an earlier discussion"], "ans": "C", "expl": "To'g'ri javob - C) Bu ibora hali vaqti kelmagan bosqich haqida gapirilayotganini bildiradi. Qolgan variantlar: A) Ortda qolish iboraning ma'nosiga zid; B) Qaror qabul qilingani haqida gapda hech narsa aytilmagan; D) Takrorlash iboraning ma'nosi emas.", "why": {"A": "Ortda qolish iboraning ma'nosiga zid.", "B": "Qaror qabul qilingani haqida gapda hech narsa aytilmagan.", "C": "Bu ibora hali vaqti kelmagan bosqich haqida gapirilayotganini bildiradi.", "D": "Takrorlash iboraning ma'nosi emas."}}, {"no": 25, "pts": "2.6", "head": "What does the text say about the first measurements of tree height?", "text": "", "opts": ["They relied on photographs taken from the ground", "They were carried out from aircraft", "They were made by climbing with a measuring tape", "They used instruments borrowed from surveyors"], "ans": "C", "expl": "To'g'ri javob - C) Birinchi xatboshida dastlabki o'lchovlar daraxtga chiqib, lenta bilan bajarilgani aytilgan. Qolgan variantlar: A) Fotosurat haqida matnda hech narsa yozilmagan; B) Samolyot haqida matnda gap yo'q; D) Geodezik asboblar haqida matnda ma'lumot berilmagan.", "why": {"A": "Fotosurat haqida matnda hech narsa yozilmagan.", "B": "Samolyot haqida matnda gap yo'q.", "C": "Birinchi xatboshida dastlabki o'lchovlar daraxtga chiqib, lenta bilan bajarilgani aytilgan.", "D": "Geodezik asboblar haqida matnda ma'lumot berilmagan."}, "block": ["Read the text and answer questions 25-27.", "The height of the tallest trees was once established by climbing them with a measuring tape, a method both dangerous and surprisingly accurate. Estimates made from the ground were consistently too generous, and several celebrated records collapsed when somebody finally climbed the tree in question.", "There is a physical limit, and it is set by water. A tree lifts water from its roots through narrow columns held together by the attraction between molecules. Above a certain height the column breaks, and the leaves at the top receive too little to function. Measurements near the limit show those upper leaves under permanent strain.", "The limit is not fixed everywhere. It depends on humidity, on the diameter of the conducting vessels, and on how much the tree can close its pores during the day. That is why the tallest individuals of a species are found in a narrow band of conditions rather than wherever the species grows."]}, {"no": 26, "pts": "2.6", "head": "What sets the physical limit on a tree's height?", "text": "", "opts": ["The strength of the trunk in high wind", "The weight of the branches at the top", "The height at which the water column breaks", "The depth that the roots can reach"], "ans": "C", "expl": "To'g'ri javob - C) Ikkinchi xatboshida ma'lum balandlikdan keyin suv ustuni uzilishi aytilgan. Qolgan variantlar: A) Shamol va tanaga kuch haqida matnda hech narsa yozilmagan; B) Shox og'irligi haqida matnda gap yo'q; D) Ildiz chuqurligi haqida matnda ma'lumot berilmagan.", "why": {"A": "Shamol va tanaga kuch haqida matnda hech narsa yozilmagan.", "B": "Shox og'irligi haqida matnda gap yo'q.", "C": "Ikkinchi xatboshida ma'lum balandlikdan keyin suv ustuni uzilishi aytilgan.", "D": "Ildiz chuqurligi haqida matnda ma'lumot berilmagan."}}, {"no": 27, "pts": "2.6", "head": "Why are the tallest individuals found in a narrow band of conditions?", "text": "", "opts": ["The limit depends on humidity and vessel diameter", "Seeds only germinate in those places", "Such places are the least disturbed by people", "The soil there is unusually deep"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida chegara namlik va o'tkazuvchi naychalar diametriga bog'liqligi aytilgan. Qolgan variantlar: B) Urug' unishi haqida matnda hech narsa yozilmagan; C) Odamlar haqida matnda gap yo'q; D) Tuproq chuqurligi haqida matnda ma'lumot berilmagan.", "why": {"A": "Uchinchi xatboshida chegara namlik va o'tkazuvchi naychalar diametriga bog'liqligi aytilgan.", "B": "Urug' unishi haqida matnda hech narsa yozilmagan.", "C": "Odamlar haqida matnda gap yo'q.", "D": "Tuproq chuqurligi haqida matnda ma'lumot berilmagan."}}, {"no": 28, "pts": "2.6", "head": "What does the text say about the shortage of donor organs?", "text": "", "opts": ["It has been solved in countries with presumed consent", "It is caused mainly by a lack of surgeons", "It affects only the wealthiest health systems", "Consent systems affect the supply less than is assumed"], "ans": "D", "expl": "To'g'ri javob - D) Birinchi xatboshida rozilik tizimi ta'minotga taxmin qilinganidan kamroq ta'sir qilishi aytilgan. Qolgan variantlar: A) Matnda muammo hal bo'lgani aytilmagan; B) Jarrohlar haqida matnda gap yo'q; C) Boylik haqida matnda ma'lumot berilmagan.", "why": {"A": "Matnda muammo hal bo'lgani aytilmagan.", "B": "Jarrohlar haqida matnda gap yo'q.", "C": "Boylik haqida matnda ma'lumot berilmagan.", "D": "Birinchi xatboshida rozilik tizimi ta'minotga taxmin qilinganidan kamroq ta'sir qilishi aytilgan."}, "block": ["Read the text and answer questions 28-30.", "Countries that presume consent for organ donation are often held up as the solution to shortage. The comparison is less decisive than it appears. Rates in such countries are indeed higher on average. The gap narrows considerably, however, once the number of intensive care beds and the pattern of road deaths are taken into account.", "What distinguishes the successful systems is organisation rather than law. A trained coordinator in every large hospital, a protocol that identifies potential donors early, and a conversation with the family conducted by somebody other than the treating doctor all appear repeatedly in the data.", "The family conversation is decisive in practice. Even where consent is presumed, relatives are rarely overruled, and a refusal at that moment ends the process. Improving how that conversation is held has produced larger gains in several countries than changing the legal framework did."]}, {"no": 29, "pts": "2.6", "head": "What distinguishes the successful systems?", "text": "", "opts": ["A larger number of transplant surgeons", "Stricter penalties for refusing consent", "More intensive care beds than elsewhere", "Organisation rather than the law itself"], "ans": "D", "expl": "To'g'ri javob - D) Ikkinchi xatboshida muvaffaqiyatni qonun emas, tashkiliy tuzilma belgilashi aytilgan. Qolgan variantlar: A) Jarrohlar soni haqida matnda gap yo'q; B) Jazo haqida matnda hech narsa yozilmagan; C) Reanimatsiya o'rinlari taqqoslashda hisobga olingan omil, farqlovchi belgi emas.", "why": {"A": "Jarrohlar soni haqida matnda gap yo'q.", "B": "Jazo haqida matnda hech narsa yozilmagan.", "C": "Reanimatsiya o'rinlari taqqoslashda hisobga olingan omil, farqlovchi belgi emas.", "D": "Ikkinchi xatboshida muvaffaqiyatni qonun emas, tashkiliy tuzilma belgilashi aytilgan."}}, {"no": 30, "pts": "2.6", "head": "Why is the family conversation described as decisive?", "text": "", "opts": ["Families are the legal owners of the decision", "Doctors are not permitted to ask directly", "The law requires written family consent", "Relatives are rarely overruled in practice"], "ans": "D", "expl": "To'g'ri javob - D) Uchinchi xatboshida rozilik taxmin qilinganda ham qarindoshlarning qarori kamdan-kam bekor qilinishi aytilgan. Qolgan variantlar: A) Qonuniy egalik haqida matnda hech narsa yozilmagan; B) Shifokorlarga taqiq haqida matnda gap yo'q; C) Yozma rozilik talabi haqida matnda ma'lumot berilmagan.", "why": {"A": "Qonuniy egalik haqida matnda hech narsa yozilmagan.", "B": "Shifokorlarga taqiq haqida matnda gap yo'q.", "C": "Yozma rozilik talabi haqida matnda ma'lumot berilmagan.", "D": "Uchinchi xatboshida rozilik taxmin qilinganda ham qarindoshlarning qarori kamdan-kam bekor qilinishi aytilgan."}}]}, {"variant": 12, "label": "11-sinf", "sub": "4-mock", "items": [{"no": 1, "pts": "0.9", "head": "Fill in the gaps with correct answer.", "text": "Little ____ the organisers ____ how much the scheme would cost.", "opts": ["did / suspected", "did / suspect", "had / suspecting", "were / suspect"], "ans": "B", "expl": "To'g'ri javob - B) Gap boshidagi inkor 'Little' dan keyin 'did' egadan oldinga chiqadi va fe'l birinchi shaklda qoladi. Qolgan variantlar: A) 'Did' dan keyin o'tgan zamon shakli ishlatilmaydi; C) 'Had' bilan '-ing' shakli mos kelmaydi; D) 'Were' bilan birinchi shakl birikmaydi va bu qurilishga to'g'ri kelmaydi.", "why": {"A": "'Did' dan keyin o'tgan zamon shakli ishlatilmaydi.", "B": "Gap boshidagi inkor 'Little' dan keyin 'did' egadan oldinga chiqadi va fe'l birinchi shaklda qoladi.", "C": "'Had' bilan '-ing' shakli mos kelmaydi.", "D": "'Were' bilan birinchi shakl birikmaydi va bu qurilishga to'g'ri kelmaydi."}}, {"no": 2, "pts": "0.9", "head": "Choose the correct answer.", "text": "The inscription ____ for decades before anyone ____ that it was a forgery.", "opts": ["was displayed / suggested", "has been displayed / suggested", "was being displayed / had suggested", "had been displayed / suggested"], "ans": "D", "expl": "To'g'ri javob - D) Avvalgi uzoq holat past perfect majhul 'had been displayed', keyingisi past simple 'suggested' bo'ladi. Qolgan variantlar: A) Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi; B) Present perfect o'tgan zamon hikoyasida ishlatilmaydi; C) Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan.", "why": {"A": "Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.", "B": "Present perfect o'tgan zamon hikoyasida ishlatilmaydi.", "C": "Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan.", "D": "Avvalgi uzoq holat past perfect majhul 'had been displayed', keyingisi past simple 'suggested' bo'ladi."}}, {"no": 3, "pts": "0.9", "head": "Choose the correct answer.", "text": "____ the evidence had been available for years, nobody had examined it closely.", "opts": ["Although", "Despite", "Because of", "Thereby"], "ans": "A", "expl": "To'g'ri javob - A) 'Although' to'liq gap bilan keladi va qarama-qarshilikni bildiradi. Qolgan variantlar: B) 'Despite' dan keyin ot birikmasi keladi, bu yerda esa to'liq gap turibdi; C) 'Because of' sababni bildiradi va gapning mantiqini teskari qiladi; D) 'Thereby' natijani bildiruvchi ravish bo'lib, gapni bunday bog'lamaydi.", "why": {"A": "'Although' to'liq gap bilan keladi va qarama-qarshilikni bildiradi.", "B": "'Despite' dan keyin ot birikmasi keladi, bu yerda esa to'liq gap turibdi.", "C": "'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.", "D": "'Thereby' natijani bildiruvchi ravish bo'lib, gapni bunday bog'lamaydi."}}, {"no": 4, "pts": "0.9", "head": "Choose the correct answer.", "text": "It was the dating of the timber ____ settled the dispute, not the style of the carving.", "opts": ["that", "what", "whom", "where"], "ans": "A", "expl": "To'g'ri javob - A) Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi. Qolgan variantlar: B) 'What' ta'kidlovchi gapni boshlay olmaydi; C) 'Whom' odamga ishora qiladi, bu yerda esa usul ta'kidlanmoqda; D) 'Where' joyga ishora qiladi va bu qurilishga mos emas.", "why": {"A": "Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi.", "B": "'What' ta'kidlovchi gapni boshlay olmaydi.", "C": "'Whom' odamga ishora qiladi, bu yerda esa usul ta'kidlanmoqda.", "D": "'Where' joyga ishora qiladi va bu qurilishga mos emas."}}, {"no": 5, "pts": "0.9", "head": "Choose the correct answer.", "text": "If the roof ____ inspected in the spring, the damage ____ before the winter.", "opts": ["were / would be repaired", "had been / would be repaired", "had been / would have been repaired", "is / will be repaired"], "ans": "C", "expl": "To'g'ri javob - C) O'tmishdagi amalga oshmagan ish uchinchi shart gapda majhul nisbat bilan beriladi. Qolgan variantlar: A) Ikkinchi shart gap hozirgi vaziyatni bildiradi, bu yerda esa o'tmish nazarda tutilgan; B) 'Would be repaired' natijani hozirgi paytga olib chiqadi va zamonlar aralashib ketadi; D) Birinchi shart gap real kelajakni bildiradi, afsusni emas.", "why": {"A": "Ikkinchi shart gap hozirgi vaziyatni bildiradi, bu yerda esa o'tmish nazarda tutilgan.", "B": "'Would be repaired' natijani hozirgi paytga olib chiqadi va zamonlar aralashib ketadi.", "C": "O'tmishdagi amalga oshmagan ish uchinchi shart gapda majhul nisbat bilan beriladi.", "D": "Birinchi shart gap real kelajakni bildiradi, afsusni emas."}}, {"no": 6, "pts": "0.9", "head": "Which option states that something is forbidden?", "text": "", "opts": ["Staff don't have to sign the visitors' book.", "Staff needn't sign the visitors' book.", "Staff didn't need to sign the visitors' book.", "Staff mustn't sign the visitors' book."], "ans": "D", "expl": "To'g'ri javob - D) 'Mustn't' taqiqni, ya'ni mutlaqo mumkin emasligini bildiradi. Qolgan variantlar: A) 'Don't have to' majburiyat yo'qligini bildiradi, taqiqni emas; B) 'Needn't' ham shart emasligini bildiradi; C) 'Didn't need to' o'tmishda zarurat bo'lmaganini bildiradi.", "why": {"A": "'Don't have to' majburiyat yo'qligini bildiradi, taqiqni emas.", "B": "'Needn't' ham shart emasligini bildiradi.", "C": "'Didn't need to' o'tmishda zarurat bo'lmaganini bildiradi.", "D": "'Mustn't' taqiqni, ya'ni mutlaqo mumkin emasligini bildiradi."}}, {"no": 7, "pts": "0.9", "head": "Choose the correct answer.", "text": "It is vital that every reading ____ before the instrument is recalibrated.", "opts": ["is recorded", "was recorded", "be recorded", "recording"], "ans": "C", "expl": "To'g'ri javob - C) 'It is vital that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be recorded' bo'ladi. Qolgan variantlar: A) 'Is recorded' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi; B) 'Was recorded' oddiy o'tgan zamon bo'lib, talab ma'nosini bermaydi; D) 'Recording' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi.", "why": {"A": "'Is recorded' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi.", "B": "'Was recorded' oddiy o'tgan zamon bo'lib, talab ma'nosini bermaydi.", "C": "'It is vital that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be recorded' bo'ladi.", "D": "'Recording' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi."}}, {"no": 8, "pts": "0.9", "head": "Choose the word that fits best.", "text": "The revised estimate is ____ lower than the figure first published.", "opts": ["very", "so", "too", "appreciably"], "ans": "D", "expl": "To'g'ri javob - D) Qiyosiy daraja 'appreciably', 'far' yoki 'considerably' bilan kuchaytiriladi. Qolgan variantlar: A) 'Very' qiyosiy daraja oldidan kelmaydi; B) 'So' ham qiyosiy darajani kuchaytira olmaydi; C) 'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.", "why": {"A": "'Very' qiyosiy daraja oldidan kelmaydi.", "B": "'So' ham qiyosiy darajani kuchaytira olmaydi.", "C": "'Too' ortiqchalikni bildiradi va bu yerda ma'noni buzadi.", "D": "Qiyosiy daraja 'appreciably', 'far' yoki 'considerably' bilan kuchaytiriladi."}}, {"no": 9, "pts": "0.9", "head": "Choose the correct sentence.", "text": "", "opts": ["The examiner's comments was returned with the scripts.", "The examiners' comments were returned with the scripts.", "The examiners comments' were returned with the scripts.", "The examiners's comments were returned with the scripts."], "ans": "B", "expl": "To'g'ri javob - B) Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: examiners'. Qolgan variantlar: A) Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak; C) Apostrof noto'g'ri so'zga qo'yilgan; D) Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q.", "why": {"A": "Ega ko'plikda, kesim esa birlikda berilgan, 'were' bo'lishi kerak.", "B": "Ko'plik 's' bilan tugaganda apostrof 's' dan keyin qo'yiladi: examiners'.", "C": "Apostrof noto'g'ri so'zga qo'yilgan.", "D": "Ko'plikdan keyin yana 's' qo'shilmaydi, bunday shakl yo'q."}}, {"no": 10, "pts": "0.9", "head": "Choose the correct indirect question.", "text": "", "opts": ["I should like to know was the sample independently verified.", "Could you explain how long does the process take?", "I should like to know whether the sample was independently verified.", "Do you know when will the findings be released?"], "ans": "C", "expl": "To'g'ri javob - C) Bilvosita savolda so'z tartibi darak gapdagidek va gap nuqta bilan tugaydi. Qolgan variantlar: A) Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan; B) 'Does' bilvosita savolda tushib qolishi kerak edi; D) 'Will' egadan oldin kelgan, to'g'ri shakli 'when the findings will be released' bo'ladi.", "why": {"A": "Bu yerda yordamchi fe'l egadan oldinga chiqib, savol tartibi saqlangan.", "B": "'Does' bilvosita savolda tushib qolishi kerak edi.", "C": "Bilvosita savolda so'z tartibi darak gapdagidek va gap nuqta bilan tugaydi.", "D": "'Will' egadan oldin kelgan, to'g'ri shakli 'when the findings will be released' bo'ladi."}}, {"no": 11, "pts": "1.5", "head": "Choose the word that fits best.", "text": "The institute has ____ a programme of independent replication.", "opts": ["embarked to", "embarked on", "embarked with", "embarked for"], "ans": "B", "expl": "To'g'ri javob - B) 'Embark on' biror katta ishni boshlashni bildiradi. Qolgan variantlar: A) Bu fe'l 'to' predlogi bilan kelmaydi; C) 'With' bu fe'l bilan ishlatilmaydi; D) 'Embark for' kemaga chiqib, biror joyga yo'l olishni bildiradi.", "why": {"A": "Bu fe'l 'to' predlogi bilan kelmaydi.", "B": "'Embark on' biror katta ishni boshlashni bildiradi.", "C": "'With' bu fe'l bilan ishlatilmaydi.", "D": "'Embark for' kemaga chiqib, biror joyga yo'l olishni bildiradi."}}, {"no": 12, "pts": "1.5", "head": "Which option shows the best correct collocation match?", "text": "", "opts": ["give weight on", "lend weight to", "put weight at loudly and flat", "hold weight for"], "ans": "B", "expl": "To'g'ri javob - B) Ingliz tilida dalilni kuchaytirish 'lend weight to' deyiladi. Qolgan variantlar: A) Bu birikma 'on' predlogi bilan ishlatilmaydi; C) Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan; D) 'Hold weight for' birikmasi bu ma'noda kelmaydi.", "why": {"A": "Bu birikma 'on' predlogi bilan ishlatilmaydi.", "B": "Ingliz tilida dalilni kuchaytirish 'lend weight to' deyiladi.", "C": "Bu yerga keraksiz so'zlar qo'shilgan va barqaror birikma buzilgan.", "D": "'Hold weight for' birikmasi bu ma'noda kelmaydi."}}, {"no": 13, "pts": "1.5", "head": "Which word is opposite in meaning to the underlined word?", "text": "The report's account of the incident is remarkably ~detailed~.", "opts": ["thorough", "cursory", "critical", "official"], "ans": "B", "expl": "To'g'ri javob - B) 'Detailed' batafsil degani, uning teskarisi 'cursory' ya'ni yuzaki. Qolgan variantlar: A) 'Thorough' ma'no jihatidan sinonim, teskarisi emas; C) 'Critical' tanqidiylikni bildiradi, batafsillikni emas; D) 'Official' manbani bildiradi va teskari ma'no bermaydi.", "why": {"A": "'Thorough' ma'no jihatidan sinonim, teskarisi emas.", "B": "'Detailed' batafsil degani, uning teskarisi 'cursory' ya'ni yuzaki.", "C": "'Critical' tanqidiylikni bildiradi, batafsillikni emas.", "D": "'Official' manbani bildiradi va teskari ma'no bermaydi."}}, {"no": 14, "pts": "1.5", "head": "Which word does NOT describe a witness?", "text": "", "opts": ["credible", "hostile", "reluctant", "soluble"], "ans": "D", "expl": "To'g'ri javob - D) 'Soluble' eriydigan degani bo'lib, faqat modda haqida ishlatiladi. Qolgan variantlar: A) 'Credible' ishonchli degani va guvohni tasvirlaydi; B) 'Hostile' dushmanona kayfiyatdagi degani, bu ham guvohga tegishli; C) 'Reluctant' istamayotgan degani va guvoh haqida aytiladi.", "why": {"A": "'Credible' ishonchli degani va guvohni tasvirlaydi.", "B": "'Hostile' dushmanona kayfiyatdagi degani, bu ham guvohga tegishli.", "C": "'Reluctant' istamayotgan degani va guvoh haqida aytiladi.", "D": "'Soluble' eriydigan degani bo'lib, faqat modda haqida ishlatiladi."}}, {"no": 15, "pts": "1.5", "head": "Which word is closest in meaning to the underlined word?", "text": "The committee's reasoning on this point is ~sound~.", "opts": ["widely shared", "openly stated", "recently revised", "well founded"], "ans": "D", "expl": "To'g'ri javob - D) 'Sound' bu yerda puxta asoslangan degani, 'well founded' shu ma'noni beradi. Qolgan variantlar: A) Keng tarqalganlik bu so'zning ma'nosi emas; B) Ochiq bayon qilish haqidagi ta'rif mos kelmaydi; C) Qayta ko'rib chiqish bu so'zga aloqador emas.", "why": {"A": "Keng tarqalganlik bu so'zning ma'nosi emas.", "B": "Ochiq bayon qilish haqidagi ta'rif mos kelmaydi.", "C": "Qayta ko'rib chiqish bu so'zga aloqador emas.", "D": "'Sound' bu yerda puxta asoslangan degani, 'well founded' shu ma'noni beradi."}}, {"no": 16, "pts": "1.5", "head": "Choose the correct answer.", "text": "The scheme was defended on grounds of its ____ to rural households.", "opts": ["beneficial", "beneficially", "beneficence", "benefit"], "ans": "D", "expl": "To'g'ri javob - D) 'Its ... to' qurilishida ot kerak, 'benefit' esa shu ma'noni beradi. Qolgan variantlar: A) 'Beneficial' sifat bo'lib, 'its' dan keyin ot talab qilinadi; B) 'Beneficially' ravish bo'lib, fe'lni izohlaydi; C) 'Beneficence' saxovat degani bo'lib, bu kontekstga mos kelmaydi.", "why": {"A": "'Beneficial' sifat bo'lib, 'its' dan keyin ot talab qilinadi.", "B": "'Beneficially' ravish bo'lib, fe'lni izohlaydi.", "C": "'Beneficence' saxovat degani bo'lib, bu kontekstga mos kelmaydi.", "D": "'Its ... to' qurilishida ot kerak, 'benefit' esa shu ma'noni beradi."}}, {"no": 17, "pts": "1.5", "head": "Choose the correct answer.", "text": "The delay was attributed ____ a fault in the cooling system.", "opts": ["on", "to", "for", "with"], "ans": "B", "expl": "To'g'ri javob - B) 'Attribute something to something' barqaror qurilish bo'lib, sababni ko'rsatadi. Qolgan variantlar: A) 'Attribute' fe'li 'on' predlogi bilan ishlatilmaydi; C) 'For' maqsadni bildiradi va bu fe'lga mos emas; D) 'With' bu fe'l bilan birikmaydi.", "why": {"A": "'Attribute' fe'li 'on' predlogi bilan ishlatilmaydi.", "B": "'Attribute something to something' barqaror qurilish bo'lib, sababni ko'rsatadi.", "C": "'For' maqsadni bildiradi va bu fe'lga mos emas.", "D": "'With' bu fe'l bilan birikmaydi."}}, {"no": 18, "pts": "1.5", "head": "Find the definition of the underlined word.", "text": "The minister's statement was widely regarded as ~disingenuous~.", "opts": ["not as honest as it appears", "far longer than it needed to be", "written by somebody else entirely", "delivered without any preparation"], "ans": "A", "expl": "To'g'ri javob - A) 'Disingenuous' ko'rinishidan samimiy, aslida esa unday emas degani. Qolgan variantlar: B) Uzunlik haqidagi ta'rif bu so'zning ma'nosi emas; C) Muallif haqidagi ta'rif mos kelmaydi; D) Tayyorgarlik haqidagi ta'rif bu so'zga aloqador emas.", "why": {"A": "'Disingenuous' ko'rinishidan samimiy, aslida esa unday emas degani.", "B": "Uzunlik haqidagi ta'rif bu so'zning ma'nosi emas.", "C": "Muallif haqidagi ta'rif mos kelmaydi.", "D": "Tayyorgarlik haqidagi ta'rif bu so'zga aloqador emas."}}, {"no": 19, "pts": "1.5", "head": "Choose the correct answer.", "text": "A whistleblower is:", "opts": ["a person who supervises a sporting contest", "a person who reports wrongdoing inside an organisation", "a person who announces decisions to the press", "a person who inspects factories for the state"], "ans": "B", "expl": "To'g'ri javob - B) 'Whistleblower' tashkilot ichidagi qoidabuzarlik haqida xabar beruvchi odam degani. Qolgan variantlar: A) Musobaqani boshqaruvchi 'referee' deb ataladi; C) Matbuotga xabar beruvchi 'spokesperson' deyiladi; D) Zavodlarni tekshiruvchi 'inspector' deb ataladi.", "why": {"A": "Musobaqani boshqaruvchi 'referee' deb ataladi.", "B": "'Whistleblower' tashkilot ichidagi qoidabuzarlik haqida xabar beruvchi odam degani.", "C": "Matbuotga xabar beruvchi 'spokesperson' deyiladi.", "D": "Zavodlarni tekshiruvchi 'inspector' deb ataladi."}}, {"no": 20, "pts": "1.5", "head": "Which word has a negative meaning?", "text": "", "opts": ["decisive", "prompt", "impulsive", "resolute"], "ans": "C", "expl": "To'g'ri javob - C) 'Impulsive' o'ylamay harakat qiladigan degani bo'lib, salbiy ma'noga ega. Qolgan variantlar: A) 'Decisive' qat'iy qaror qabul qiladigan degani va ijobiy baho beradi; B) 'Prompt' tezkor degani, bu ham ijobiy so'z; D) 'Resolute' sobitqadam degani va maqtov ma'nosini beradi.", "why": {"A": "'Decisive' qat'iy qaror qabul qiladigan degani va ijobiy baho beradi.", "B": "'Prompt' tezkor degani, bu ham ijobiy so'z.", "C": "'Impulsive' o'ylamay harakat qiladigan degani bo'lib, salbiy ma'noga ega.", "D": "'Resolute' sobitqadam degani va maqtov ma'nosini beradi."}}, {"no": 21, "pts": "2.6", "head": "What is the purpose of this notice?", "text": "", "opts": ["To announce that the rooms have been refurbished", "To set out the conditions for using the seminar rooms", "To invite departments to propose new seminars", "To report how often the rooms are used"], "ans": "B", "expl": "To'g'ri javob - B) E'londa band qilish, bekor qilish, jihoz va tozalik tartibi berilgan. Qolgan variantlar: A) Ta'mir haqida e'londa hech narsa aytilmagan; C) Taklif so'rash haqida e'londa gap yo'q; D) Foydalanish statistikasi haqida e'londa ma'lumot berilmagan.", "why": {"A": "Ta'mir haqida e'londa hech narsa aytilmagan.", "B": "E'londa band qilish, bekor qilish, jihoz va tozalik tartibi berilgan.", "C": "Taklif so'rash haqida e'londa gap yo'q.", "D": "Foydalanish statistikasi haqida e'londa ma'lumot berilmagan."}, "block": ["Read the text and answer questions 21-22.", "SEMINAR ROOMS: CONDITIONS OF USE", "Rooms are booked through the departmental office and released automatically if nobody has arrived fifteen minutes after the start. The projector remote is signed out and returned to the same office, not left in the room. Furniture may be rearranged but must be restored before the end of the session. Catering is permitted in room 4 only, and the organiser is responsible for clearing it."]}, {"no": 22, "pts": "2.6", "head": "What happens if nobody arrives in the first fifteen minutes?", "text": "", "opts": ["The organiser is charged for the room", "The room is locked for the rest of the day", "The booking is released automatically", "The booking moves to the following week"], "ans": "C", "expl": "To'g'ri javob - C) E'londa o'n besh daqiqa ichida kelinmasa, band qilish avtomatik bekor bo'lishi aytilgan. Qolgan variantlar: A) To'lov haqida e'londa hech narsa yozilmagan; B) Qulflash haqida e'londa gap yo'q; D) Keyingi haftaga ko'chirish haqida ma'lumot berilmagan.", "why": {"A": "To'lov haqida e'londa hech narsa yozilmagan.", "B": "Qulflash haqida e'londa gap yo'q.", "C": "E'londa o'n besh daqiqa ichida kelinmasa, band qilish avtomatik bekor bo'lishi aytilgan.", "D": "Keyingi haftaga ko'chirish haqida ma'lumot berilmagan."}}, {"no": 23, "pts": "2.6", "head": "You see this sign in a laboratory: \"Eye protection must be worn beyond this point at all times.\" What is the main message?", "text": "", "opts": ["Eye protection is available on request here", "Only trained staff may pass this point", "Wear eye protection everywhere past this door", "Eye protection is needed during experiments only"], "ans": "C", "expl": "To'g'ri javob - C) Belgida bu nuqtadan nariga o'tganda doimo ko'zoynak taqish talab qilinmoqda. Qolgan variantlar: A) Ko'zoynak berilishi haqida belgida hech narsa yozilmagan; B) Xodimlar haqida belgida gap yo'q; D) Belgida 'at all times' deyilgan, ya'ni faqat tajriba paytida emas.", "why": {"A": "Ko'zoynak berilishi haqida belgida hech narsa yozilmagan.", "B": "Xodimlar haqida belgida gap yo'q.", "C": "Belgida bu nuqtadan nariga o'tganda doimo ko'zoynak taqish talab qilinmoqda.", "D": "Belgida 'at all times' deyilgan, ya'ni faqat tajriba paytida emas."}}, {"no": 24, "pts": "2.6", "head": "You hear a supervisor say: \"Let us not read too much into a single result.\" What does this mean?", "text": "", "opts": ["One result should not be treated as conclusive", "The result should be checked by another team", "The result contradicts what was expected", "The reading was taken incorrectly"], "ans": "A", "expl": "To'g'ri javob - A) Bu ibora bitta natijadan ortiqcha xulosa chiqarmaslik kerakligini bildiradi. Qolgan variantlar: B) Qayta tekshirish haqida gapda hech narsa aytilmagan; C) Ziddiyat haqida ibora gapirmaydi; D) O'lchovdagi xato haqida ibora hech narsa demaydi.", "why": {"A": "Bu ibora bitta natijadan ortiqcha xulosa chiqarmaslik kerakligini bildiradi.", "B": "Qayta tekshirish haqida gapda hech narsa aytilmagan.", "C": "Ziddiyat haqida ibora gapirmaydi.", "D": "O'lchovdagi xato haqida ibora hech narsa demaydi."}}, {"no": 25, "pts": "2.6", "head": "What does the text say about the first vertical surveys of the ocean?", "text": "", "opts": ["They found life at depths where none was expected", "They were carried out entirely by satellite", "They were abandoned because of the cost", "They covered only the waters near the coast"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida hayot kutilmagan chuqurlikda topilgani aytilgan. Qolgan variantlar: B) Sun'iy yo'ldosh haqida matnda hech narsa yozilmagan; C) To'xtatish haqida matnda gap yo'q; D) Hudud chegarasi haqida matnda ma'lumot berilmagan.", "why": {"A": "Birinchi xatboshida hayot kutilmagan chuqurlikda topilgani aytilgan.", "B": "Sun'iy yo'ldosh haqida matnda hech narsa yozilmagan.", "C": "To'xtatish haqida matnda gap yo'q.", "D": "Hudud chegarasi haqida matnda ma'lumot berilmagan."}, "block": ["Read the text and answer questions 25-27.", "The first vertical surveys lowered nets through the open ocean. They recovered animals from depths at which nothing was expected to live. The prevailing assumption had been that life thinned progressively towards the bottom and ceased well above it. What the nets revealed instead was a dense layer several hundred metres thick. The instruments of the day could not explain it.", "Sonar subsequently identified the same layer as a false sea floor that ascended at dusk and descended at dawn. The explanation is a daily migration. Billions of small animals ascend to feed in darkness and descend before light makes them visible to predators. It is the largest movement of biomass on the planet.", "The migration matters far beyond the animals performing it. Carbon absorbed at the surface is carried downwards in their bodies and in what they excrete at depth. That removes it from the atmosphere for considerably longer than surface processes do. Models of the carbon cycle that omit this transfer underestimate it substantially."]}, {"no": 26, "pts": "2.6", "head": "What did sonar reveal about the layer?", "text": "", "opts": ["It was thicker than the nets had suggested", "It lay directly on the sea floor", "It disappeared during the winter", "It rose at dusk and sank at dawn"], "ans": "D", "expl": "To'g'ri javob - D) Ikkinchi xatboshida sonar qatlam oqshomda ko'tarilib, tongda cho'kishini aniqlagani aytilgan. Qolgan variantlar: A) Qalinlik haqida matnda bunday taqqoslash keltirilmagan; B) Matnda u soxta tub ekani, ya'ni haqiqiy tubda emasligi aytilgan; C) Fasl haqida matnda hech narsa yozilmagan.", "why": {"A": "Qalinlik haqida matnda bunday taqqoslash keltirilmagan.", "B": "Matnda u soxta tub ekani, ya'ni haqiqiy tubda emasligi aytilgan.", "C": "Fasl haqida matnda hech narsa yozilmagan.", "D": "Ikkinchi xatboshida sonar qatlam oqshomda ko'tarilib, tongda cho'kishini aniqlagani aytilgan."}}, {"no": 27, "pts": "2.6", "head": "Why does the migration matter for the carbon cycle?", "text": "", "opts": ["It carries carbon downwards and keeps it there longer", "It releases carbon at the surface each night", "It slows the absorption of carbon by the ocean", "It makes carbon measurements impossible at depth"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida uglerod pastga tashilib, atmosferadan uzoqroq muddatga chiqarilishi aytilgan. Qolgan variantlar: B) Yuzada chiqarish haqida matnda hech narsa yozilmagan; C) Sekinlashtirish haqida matnda gap yo'q; D) O'lchash imkonsizligi haqida matnda ma'lumot berilmagan.", "why": {"A": "Uchinchi xatboshida uglerod pastga tashilib, atmosferadan uzoqroq muddatga chiqarilishi aytilgan.", "B": "Yuzada chiqarish haqida matnda hech narsa yozilmagan.", "C": "Sekinlashtirish haqida matnda gap yo'q.", "D": "O'lchash imkonsizligi haqida matnda ma'lumot berilmagan."}}, {"no": 28, "pts": "2.6", "head": "What does the text say about reporting of negative results?", "text": "", "opts": ["Studies finding no effect are published less often", "They are published faster than positive results", "They are rejected by law in several countries", "They are of interest only to statisticians"], "ans": "A", "expl": "To'g'ri javob - A) Birinchi xatboshida ta'sir topmagan tadqiqotlar kamroq chop etilishi aytilgan. Qolgan variantlar: B) Tezlik haqida matnda aksincha aytilgan; C) Qonun haqida matnda hech narsa yozilmagan; D) Statistiklar haqida matnda gap yo'q.", "why": {"A": "Birinchi xatboshida ta'sir topmagan tadqiqotlar kamroq chop etilishi aytilgan.", "B": "Tezlik haqida matnda aksincha aytilgan.", "C": "Qonun haqida matnda hech narsa yozilmagan.", "D": "Statistiklar haqida matnda gap yo'q."}, "block": ["Read the text and answer questions 28-30.", "A study that finds an effect is published more readily than one that does not. The bias operates at every stage: researchers are slower to write up a negative result, reviewers find it less interesting, and journals have limited space. The effect on the published record is cumulative rather than dramatic at any single point.", "The consequence is that the literature overstates how well treatments work. A reader who collects every published trial of a drug is not seeing every trial. The ones that are missing are disproportionately the disappointing ones. Several well-known treatments looked considerably better in print than they did in the full record.", "The remedy adopted in medicine is registration. A trial is recorded with its design and its intended outcome before it begins, so a result that never appears can at least be identified as absent. Compliance is imperfect, but the direction of travel is clear, and other disciplines are beginning to follow."]}, {"no": 29, "pts": "2.6", "head": "What is the consequence described in the second paragraph?", "text": "", "opts": ["Researchers repeat the same trials unnecessarily", "Journals have become much larger", "The literature overstates how well treatments work", "Negative results are rewritten as positive ones"], "ans": "C", "expl": "To'g'ri javob - C) Ikkinchi xatboshida adabiyot davolash samarasini oshirib ko'rsatishi aytilgan. Qolgan variantlar: A) Takroriy sinovlar haqida matnda gap yo'q; B) Jurnal hajmi haqida matnda hech narsa yozilmagan; D) Natijani qayta yozish haqida matnda ma'lumot berilmagan.", "why": {"A": "Takroriy sinovlar haqida matnda gap yo'q.", "B": "Jurnal hajmi haqida matnda hech narsa yozilmagan.", "C": "Ikkinchi xatboshida adabiyot davolash samarasini oshirib ko'rsatishi aytilgan.", "D": "Natijani qayta yozish haqida matnda ma'lumot berilmagan."}}, {"no": 30, "pts": "2.6", "head": "How does registration help?", "text": "", "opts": ["A result that never appears can be identified as absent", "It forces journals to publish every trial", "It shortens the time a trial takes", "It removes the need for peer review"], "ans": "A", "expl": "To'g'ri javob - A) Uchinchi xatboshida ro'yxatga olish tufayli chop etilmagan natijani yo'qligini aniqlash mumkinligi aytilgan. Qolgan variantlar: B) Jurnallarni majburlash haqida matnda hech narsa yozilmagan; C) Muddat haqida matnda gap yo'q; D) Taqriz haqida matnda ma'lumot berilmagan.", "why": {"A": "Uchinchi xatboshida ro'yxatga olish tufayli chop etilmagan natijani yo'qligini aniqlash mumkinligi aytilgan.", "B": "Jurnallarni majburlash haqida matnda hech narsa yozilmagan.", "C": "Muddat haqida matnda gap yo'q.", "D": "Taqriz haqida matnda ma'lumot berilmagan."}}]}, {"variant": 13, "label": "11-sinf", "sub": "5-mock", "items": [{"no": 1, "pts": "0.9", "head": "Fill in the gaps with correct answer.", "text": "Not until the second audit ____ the discrepancy ____ to the board.", "opts": ["did / report", "had / reporting", "was / reported", "were / report"], "ans": "C", "expl": "To'g'ri javob - C) 'Not until' bilan boshlangan gapdan keyin yordamchi fe'l egadan oldinga chiqadi va majhul nisbat 'was reported' bo'ladi. Qolgan variantlar: A) 'Did report' aktiv shakl bo'lib, nomuvofiqlikning o'zi xabar bergan degan ma'no chiqadi; B) 'Had' bilan '-ing' shakli mos kelmaydi; D) 'Were' birlikdagi ega bilan moslashmaydi.", "why": {"A": "'Did report' aktiv shakl bo'lib, nomuvofiqlikning o'zi xabar bergan degan ma'no chiqadi.", "B": "'Had' bilan '-ing' shakli mos kelmaydi.", "C": "'Not until' bilan boshlangan gapdan keyin yordamchi fe'l egadan oldinga chiqadi va majhul nisbat 'was reported' bo'ladi.", "D": "'Were' birlikdagi ega bilan moslashmaydi."}}, {"no": 2, "pts": "0.9", "head": "Choose the correct answer.", "text": "The bridge ____ for public use long before engineers ____ the original drawings.", "opts": ["had been opened / recovered", "was opened / recovered", "has been opened / recovered", "was being opened / had recovered"], "ans": "A", "expl": "To'g'ri javob - A) Avvalgi ish past perfect majhul 'had been opened', keyingisi past simple 'recovered' bo'ladi. Qolgan variantlar: B) Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi; C) Present perfect o'tgan zamon hikoyasida ishlatilmaydi; D) Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan.", "why": {"A": "Avvalgi ish past perfect majhul 'had been opened', keyingisi past simple 'recovered' bo'ladi.", "B": "Ikkala fe'l oddiy o'tgan zamonda bo'lsa, ketma-ketlik ko'rinmay qoladi.", "C": "Present perfect o'tgan zamon hikoyasida ishlatilmaydi.", "D": "Bu yerda zamonlar o'rni almashib, voqealar tartibi buzilgan."}}, {"no": 3, "pts": "0.9", "head": "Choose the correct answer.", "text": "____ repeated assurances, the deadline was extended for a third time.", "opts": ["Notwithstanding", "Although", "Because of", "Hence"], "ans": "A", "expl": "To'g'ri javob - A) 'Notwithstanding' ot birikmasi bilan keladi va qarama-qarshilikni bildiradi. Qolgan variantlar: B) 'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi; C) 'Because of' sababni bildiradi va gapning mantiqini teskari qiladi; D) 'Hence' natijani bildiruvchi ravish bo'lib, gapni bunday bog'lamaydi.", "why": {"A": "'Notwithstanding' ot birikmasi bilan keladi va qarama-qarshilikni bildiradi.", "B": "'Although' to'liq gapni talab qiladi, bu yerda esa ot birikmasi turibdi.", "C": "'Because of' sababni bildiradi va gapning mantiqini teskari qiladi.", "D": "'Hence' natijani bildiruvchi ravish bo'lib, gapni bunday bog'lamaydi."}}, {"no": 4, "pts": "0.9", "head": "Choose the correct answer.", "text": "It was the absence of a control group ____ invalidated the whole study.", "opts": ["what", "which it", "wherein", "that"], "ans": "D", "expl": "To'g'ri javob - D) Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi. Qolgan variantlar: A) 'What' ta'kidlovchi gapni boshlay olmaydi; B) 'Which it' ortiqcha olmosh qo'shadi va gapni buzadi; C) 'Wherein' rasmiy uslubga xos bo'lib, bu qurilishda ishlatilmaydi.", "why": {"A": "'What' ta'kidlovchi gapni boshlay olmaydi.", "B": "'Which it' ortiqcha olmosh qo'shadi va gapni buzadi.", "C": "'Wherein' rasmiy uslubga xos bo'lib, bu qurilishda ishlatilmaydi.", "D": "Bunday ta'kidlovchi gap 'that' bilan to'ldiriladi."}}, {"no": 5, "pts": "0.9", "head": "Choose the correct answer.", "text": "Had the warning signs ____ earlier, the closure ____ in good time.", "opts": ["been heeded / would be announced", "been heeded / would have been announced", "heeded / would have announced", "be heeded / will be announced"], "ans": "B", "expl": "To'g'ri javob - B) Bu teskari tartibli uchinchi shart gap: majhul nisbatda 'would have been announced' to'g'ri. Qolgan variantlar: A) 'Would be announced' natijani hozirgi paytga olib chiqadi, gapda esa o'tmish nazarda tutilgan; C) 'Heeded' aktiv shakl bo'lib, belgilarning o'zi e'tibor bergan degan ma'no chiqadi; D) Noreal shartdan keyin 'will' kelmaydi.", "why": {"A": "'Would be announced' natijani hozirgi paytga olib chiqadi, gapda esa o'tmish nazarda tutilgan.", "B": "Bu teskari tartibli uchinchi shart gap: majhul nisbatda 'would have been announced' to'g'ri.", "C": "'Heeded' aktiv shakl bo'lib, belgilarning o'zi e'tibor bergan degan ma'no chiqadi.", "D": "Noreal shartdan keyin 'will' kelmaydi."}}, {"no": 6, "pts": "0.9", "head": "Which option states an absence of obligation in the past?", "text": "", "opts": ["We mustn't have filed the second copy.", "We shouldn't have filed the second copy.", "We didn't have to file the second copy.", "We can't have filed the second copy."], "ans": "C", "expl": "To'g'ri javob - C) 'Didn't have to' o'tmishda majburiyat bo'lmaganini bildiradi. Qolgan variantlar: A) Bunday qurilish taqiq ma'nosida ishlatilmaydi va grammatik jihatdan ham noto'g'ri; B) 'Shouldn't have filed' bajarilgan ish uchun tanbeh bildiradi; D) 'Can't have filed' ishonchli inkor xulosani bildiradi.", "why": {"A": "Bunday qurilish taqiq ma'nosida ishlatilmaydi va grammatik jihatdan ham noto'g'ri.", "B": "'Shouldn't have filed' bajarilgan ish uchun tanbeh bildiradi.", "C": "'Didn't have to' o'tmishda majburiyat bo'lmaganini bildiradi.", "D": "'Can't have filed' ishonchli inkor xulosani bildiradi."}}, {"no": 7, "pts": "0.9", "head": "Choose the correct answer.", "text": "The regulations demand that each container ____ before it leaves the site.", "opts": ["is sealed", "was sealed", "sealing", "be sealed"], "ans": "D", "expl": "To'g'ri javob - D) 'Demand that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be sealed' bo'ladi. Qolgan variantlar: A) 'Is sealed' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi; B) 'Was sealed' oddiy o'tgan zamon bo'lib, talab ma'nosini bermaydi; C) 'Sealing' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi.", "why": {"A": "'Is sealed' oddiy hozirgi zamon bo'lib, bunday talabda ishlatilmaydi.", "B": "'Was sealed' oddiy o'tgan zamon bo'lib, talab ma'nosini bermaydi.", "C": "'Sealing' ravishdosh bo'lib, bu o'rinda kesim bo'la olmaydi.", "D": "'Demand that' dan keyin o'zgarmas shakl kerak, majhul nisbatda 'be sealed' bo'lad
